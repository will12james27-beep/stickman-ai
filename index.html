<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v9.5.0 – Full IK Body</title>
<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
canvas{background:#fff;}
button{
  position:fixed;
  bottom:20px;
  padding:6px 14px;
}
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>
<button id="play">▶ Play</button>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const playBtn=document.getElementById("play");

let playing=false;
let t=0;

/* =====================
   STICKMAN DATA
===================== */
const stickman={
  x:300,
  y:260,
  leg:{ upper:45, lower:45 },
  arm:{ upper:40, lower:35 }
};

/* =====================
   GENERIC 2-BONE IK
===================== */
function solveIK(base, target, l1, l2, flip){
  const dx=target.x-base.x;
  const dy=target.y-base.y;
  let d=Math.hypot(dx,dy);
  d=Math.min(d,l1+l2-0.001);

  const a=Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d));
  const b=Math.atan2(dy,dx);
  const angle1=b+(flip?-a:a);

  return {
    joint:{
      x:base.x+Math.cos(angle1)*l1,
      y:base.y+Math.sin(angle1)*l1
    },
    end:target
  };
}

/* =====================
   DEMO MOTION
===================== */
function update(dt){
  t+=dt*0.005;
}

/* =====================
   DRAW HELPERS
===================== */
function line(x1,y1,x2,y2){
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

/* =====================
   DRAW
===================== */
function draw(){
  ctx.clearRect(0,0,600,600);
  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.strokeStyle="#000";

  const hip={x:stickman.x,y:stickman.y};
  const shoulder={x:stickman.x,y:stickman.y-40};

  const s=Math.sin(t);

  /* ===== FOOT TARGETS ===== */
  const Lfoot={x:hip.x-20+s*20, y:hip.y+140+Math.max(0,s)*-30};
  const Rfoot={x:hip.x+20-s*20, y:hip.y+140+Math.max(0,-s)*-30};

  /* ===== HAND TARGETS ===== */
  const Lhand={x:shoulder.x-60-s*25, y:shoulder.y+20+Math.abs(s)*10};
  const Rhand={x:shoulder.x+60+s*25, y:shoulder.y+20+Math.abs(s)*10};

  /* ===== IK SOLVE ===== */
  const Lleg=solveIK(hip,Lfoot,stickman.leg.upper,stickman.leg.lower,false);
  const Rleg=solveIK(hip,Rfoot,stickman.leg.upper,stickman.leg.lower,true);

  const Larm=solveIK(shoulder,Lhand,stickman.arm.upper,stickman.arm.lower,false);
  const Rarm=solveIK(shoulder,Rhand,stickman.arm.upper,stickman.arm.lower,true);

  /* ===== BODY ===== */
  line(shoulder.x,shoulder.y-50,shoulder.x,hip.y);
  ctx.beginPath();
  ctx.arc(shoulder.x,shoulder.y-80,22,0,Math.PI*2);
  ctx.stroke();

  /* ===== ARMS ===== */
  line(shoulder.x,shoulder.y,Larm.joint.x,Larm.joint.y);
  line(Larm.joint.x,Larm.joint.y,Larm.end.x,Larm.end.y);

  line(shoulder.x,shoulder.y,Rarm.joint.x,Rarm.joint.y);
  line(Rarm.joint.x,Rarm.joint.y,Rarm.end.x,Rarm.end.y);

  /* ===== LEGS ===== */
  line(hip.x,hip.y,Lleg.joint.x,Lleg.joint.y);
  line(Lleg.joint.x,Lleg.joint.y,Lleg.end.x,Lleg.end.y);

  line(hip.x,hip.y,Rleg.joint.x,Rleg.joint.y);
  line(Rleg.joint.x,Rleg.joint.y,Rleg.end.x,Rleg.end.y);
}

/* =====================
   LOOP
===================== */
let last=0;
function loop(ts){
  const dt=ts-last; last=ts;
  if(playing) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

playBtn.onclick=()=>playing=!playing;
</script>

</body>
</html>
