<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v7.9.0 – Run Cycle</title>
<style>
  body{
    margin:0;
    background:#111;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:#fff;
    font-family:sans-serif;
  }
  canvas{background:#fff;}
  input{width:600px;margin-top:10px;}
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>
<input id="slider" type="range" min="0" max="1000" value="0">

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const slider = document.getElementById("slider");

/* =====================
   STATE
===================== */
const stickman = {
  x: 300,
  baseY: 320,
  y: 320,
  basePose: {
    leftArm: -20,
    rightArm: 20,
    leftLeg: 15,
    rightLeg: -15
  },
  pose: {
    leftArm: 0,
    rightArm: 0,
    leftLeg: 0,
    rightLeg: 0
  }
};

const DURATION = 1000;

/* =====================
   EASING
===================== */
function easeInOut(t){
  return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
}

/* =====================
   DRAW
===================== */
function drawStickman(s){
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.strokeStyle="#000";

  // body
  ctx.beginPath();
  ctx.moveTo(0,-40);
  ctx.lineTo(0,60);
  ctx.stroke();

  // head
  ctx.beginPath();
  ctx.arc(0,-70,22,0,Math.PI*2);
  ctx.stroke();

  // arms
  drawLimb(0,-20,55,s.pose.leftArm);
  drawLimb(0,-20,55,s.pose.rightArm);

  // legs
  drawLimb(0,60,65,s.pose.leftLeg);
  drawLimb(0,60,65,s.pose.rightLeg);

  ctx.restore();
}

function drawLimb(x,y,len,ang){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(ang*Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,len);
  ctx.stroke();
  ctx.restore();
}

/* =====================
   RUN LOGIC
===================== */
function applyRun(time){
  let phase=(time/DURATION)*Math.PI*2;
  let raw=Math.sin(phase);
  let eased=easeInOut((raw+1)/2)*2-1;

  // legs – kattaroq amplituda
  stickman.pose.leftLeg  = stickman.basePose.leftLeg  + eased*45;
  stickman.pose.rightLeg = stickman.basePose.rightLeg - eased*45;

  // arms – kuchliroq
  stickman.pose.leftArm  = stickman.basePose.leftArm  - eased*35;
  stickman.pose.rightArm = stickman.basePose.rightArm + eased*35;

  // body bounce (run)
  stickman.y = stickman.baseY - Math.abs(eased)*14;
}

/* =====================
   RENDER
===================== */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  applyRun(Number(slider.value));
  drawStickman(stickman);

  requestAnimationFrame(render);
}
render();
</script>

</body>
</html>
