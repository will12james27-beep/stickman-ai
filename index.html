<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v37.1 (Crowd Blending)</title>
<style>
body{
 margin:0;
 background:#0b0f14;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:Arial;
 color:white;
}
#studio{
 display:flex;
 flex-direction:column;
 gap:10px;
 align-items:center;
}
canvas{
 background:#fff;
 border-radius:16px;
}
.panel{
 display:flex;
 gap:10px;
 align-items:center;
}
input[type=range]{
 width:260px;
}
button{
 padding:6px 12px;
 border:none;
 border-radius:6px;
 cursor:pointer;
}
.small{
 font-size:12px;
 opacity:.7;
}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="playing=!playing">Play</button>
    <span>Blend</span>
    <input id="blend" type="range" min="0" max="100" value="0">
  </div>

  <div class="small">v37.1 — Multi-character animation blending</div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const blendSlider=document.getElementById("blend");

const W=420,H=640,ground=520;

// ===== JOINT =====
class Joint{
 constructor(x,y){this.x=x;this.y=y;}
 clone(){return {x:this.x,y:this.y};}
}

// ===== STICKMAN FACTORY =====
function createMan(x){
 const base={
  hip:new Joint(x,ground-85),
  neck:new Joint(x,ground-155),
  head:new Joint(x,ground-195),

  kneeL:new Joint(x-20,ground-45),
  kneeR:new Joint(x+20,ground-45),
  footL:new Joint(x-20,ground),
  footR:new Joint(x+20,ground),

  elbowL:new Joint(x-40,ground-135),
  elbowR:new Joint(x+40,ground-135),
  handL:new Joint(x-60,ground-115),
  handR:new Joint(x+60,ground-115),
 };
 return{
  joints:base,
  idlePose:clonePose(base),
  phase:Math.random(),
  speed:0.8+Math.random()*0.4
 };
}

function clonePose(joints){
 const p={};
 for(let k in joints) p[k]=joints[k].clone();
 return p;
}

// ===== CROWD =====
const crowd=[];
for(let i=0;i<5;i++){
 crowd.push(createMan(140+i*60));
}

// ===== RUN POSE (procedural) =====
function sampleRun(base,phase){
 const s=Math.sin(phase);
 const p=clonePose(base);

 p.footL.y=ground-Math.max(0,s)*30;
 p.footR.y=ground-Math.max(0,-s)*30;

 p.handL.x-=s*25;
 p.handR.x+=s*25;

 p.hip.y=ground-85-Math.abs(s)*8;
 p.neck.y=p.hip.y-70;
 p.head.y=p.neck.y-40;

 return p;
}

// ===== BLEND =====
function lerp(a,b,t){return a+(b-a)*t;}

function blendPose(a,b,w){
 const p={};
 for(let k in a){
  p[k]={
   x:lerp(a[k].x,b[k].x,w),
   y:lerp(a[k].y,b[k].y,w)
  };
 }
 return p;
}

// ===== IK =====
function stick(a,b,l){
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
 const diff=(d-l)/d*0.5;
 a.x+=dx*diff; a.y+=dy*diff;
 b.x-=dx*diff; b.y-=dy*diff;
}

function solve(j){
 for(let i=0;i<6;i++){
  stick(j.neck,j.hip,70);
  stick(j.head,j.neck,40);

  stick(j.hip,j.kneeL,40);
  stick(j.kneeL,j.footL,40);

  stick(j.hip,j.kneeR,40);
  stick(j.kneeR,j.footR,40);

  stick(j.neck,j.elbowL,35);
  stick(j.elbowL,j.handL,35);

  stick(j.neck,j.elbowR,35);
  stick(j.elbowR,j.handR,35);
 }
}

// ===== DRAW =====
function line(a,b){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
}

function drawMan(j){
 ctx.beginPath();
 ctx.arc(j.head.x,j.head.y,14,0,Math.PI*2);
 ctx.stroke();

 line(j.head,j.neck);
 line(j.neck,j.hip);

 line(j.hip,j.kneeL);
 line(j.kneeL,j.footL);

 line(j.hip,j.kneeR);
 line(j.kneeR,j.footR);

 line(j.neck,j.elbowL);
 line(j.elbowL,j.handL);

 line(j.neck,j.elbowR);
 line(j.elbowR,j.handR);
}

// ===== LOOP =====
let playing=true;

function loop(){
 ctx.clearRect(0,0,W,H);

 ctx.strokeStyle="#ccc";
 ctx.beginPath();
 ctx.moveTo(0,ground);
 ctx.lineTo(W,ground);
 ctx.stroke();

 ctx.strokeStyle="#000";

 const w=blendSlider.value/100;

 crowd.forEach(m=>{
  if(playing) m.phase+=0.08*m.speed;

  const runPose=sampleRun(m.joints,m.phase);
  const finalPose=blendPose(m.idlePose,runPose,w);

  for(let k in finalPose){
   m.joints[k].x=finalPose[k].x;
   m.joints[k].y=finalPose[k].y;
  }

  solve(m.joints);
  drawMan(m.joints);
 });

 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
