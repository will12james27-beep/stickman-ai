<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v7.7.1 – Walk Cycle</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    background: #fff;
  }
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* =======================
   GLOBAL STICKMAN STATE
======================= */
const stickman = {
  x: 300,
  y: 320,
  scale: 1,
  pose: {
    leftArm: 20,
    rightArm: -20,
    leftLeg: -20,
    rightLeg: 20
  }
};

/* =======================
   WALK CYCLE SETTINGS
======================= */
let walkTime = 0;
const walkSpeed = 0.06; // tezlik

/* =======================
   DRAW FUNCTIONS
======================= */
function drawStickman(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(s.scale, s.scale);
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#000";

  // BODY
  ctx.beginPath();
  ctx.moveTo(0, -40);
  ctx.lineTo(0, 60);
  ctx.stroke();

  // HEAD
  ctx.beginPath();
  ctx.arc(0, -70, 22, 0, Math.PI * 2);
  ctx.stroke();

  // ARMS (oyoqka teskari)
  drawLimb(0, -20, 55, s.pose.leftArm);
  drawLimb(0, -20, 55, s.pose.rightArm);

  // LEGS
  drawLimb(0, 60, 65, s.pose.leftLeg);
  drawLimb(0, 60, 65, s.pose.rightLeg);

  ctx.restore();
}

function drawLimb(x, y, length, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, length);
  ctx.stroke();
  ctx.restore();
}

/* =======================
   WALK ANIMATION
======================= */
function updateWalk() {
  walkTime += walkSpeed;

  const swing = Math.sin(walkTime) * 30;

  stickman.pose.leftLeg  =  swing;
  stickman.pose.rightLeg = -swing;

  stickman.pose.leftArm  = -swing * 0.8;
  stickman.pose.rightArm =  swing * 0.8;
}

/* =======================
   RENDER LOOP (SAFE)
======================= */
function render() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  updateWalk();
  drawStickman(stickman);

  requestAnimationFrame(render);
}
render();
</script>

</body>
</html>
