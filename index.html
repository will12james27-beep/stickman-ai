<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>21 B.1 Character Psychology Core</title>
<style>
body{margin:0;background:#111;}
canvas{display:block;margin:auto;background:#fff;}
</style>
</head>
<body>

<canvas id="c" width="720" height="480"></canvas>

<script>
/* =========================
   PERSONALITY ENGINE
========================= */

const Personality = {
  CALM: "calm",
  HOT: "hot",
  CHAOTIC: "chaotic",
  LOGICAL: "logical"
};

/* =========================
   CHARACTER PROFILE
========================= */

function CharacterProfile(cfg){
  return {
    id: cfg.id,
    name: cfg.name,
    personality: cfg.personality,

    // emotional bias (0..1)
    bias: {
      anger: cfg.bias.anger,
      panic: cfg.bias.panic,
      humor: cfg.bias.humor
    },

    // scene behavior
    interruptChance: cfg.interruptChance,
    silenceTolerance: cfg.silenceTolerance,
    cameraPriority: cfg.cameraPriority,

    // runtime state
    mood: "neutral",
    tension: 0
  };
}

/* =========================
   MAIN CHARACTERS (4 ta)
========================= */

const characters = [
  CharacterProfile({
    id:0,
    name:"Red",
    personality:Personality.HOT,
    bias:{ anger:0.8, panic:0.2, humor:0.3 },
    interruptChance:0.7,
    silenceTolerance:0.2,
    cameraPriority:1.2
  }),

  CharacterProfile({
    id:1,
    name:"Blue",
    personality:Personality.LOGICAL,
    bias:{ anger:0.3, panic:0.1, humor:0.1 },
    interruptChance:0.2,
    silenceTolerance:0.8,
    cameraPriority:1.0
  }),

  CharacterProfile({
    id:2,
    name:"Green",
    personality:Personality.CALM,
    bias:{ anger:0.2, panic:0.1, humor:0.4 },
    interruptChance:0.1,
    silenceTolerance:0.9,
    cameraPriority:0.9
  }),

  CharacterProfile({
    id:3,
    name:"Yellow",
    personality:Personality.CHAOTIC,
    bias:{ anger:0.4, panic:0.6, humor:0.8 },
    interruptChance:0.9,
    silenceTolerance:0.05,
    cameraPriority:1.1
  })
];

/* =========================
   PSYCHOLOGY LOGIC
========================= */

function reactToEvent(char, eventPower){
  char.tension += eventPower;

  if(char.tension > 1){
    if(char.bias.anger > 0.6) char.mood="angry";
    else if(char.bias.panic > 0.5) char.mood="shocked";
    else char.mood="confused";
    char.tension = 0;
  }
}

/* =========================
   DEMO SCENE
========================= */

let t=0;
const demoEvents=[
  {t:60, power:0.6},
  {t:140, power:0.8},
  {t:220, power:1.0}
];

/* =========================
   DRAW
========================= */

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font="16px Arial";
  ctx.textAlign="center";

  characters.forEach((c,i)=>{
    ctx.fillStyle="#000";
    ctx.fillText(c.name,150+i*130,120);
    ctx.fillText("Mood: "+c.mood,150+i*130,150);
    ctx.fillText("Tension: "+c.tension.toFixed(2),150+i*130,180);
  });
}

/* =========================
   LOOP
========================= */

function loop(){
  t++;

  demoEvents.forEach(e=>{
    if(e.t===t){
      characters.forEach(c=>reactToEvent(c,e.power));
    }
  });

  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
