<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v35.0 (Crowd)</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  color:white;
}
#studio{display:flex;flex-direction:column;gap:10px;align-items:center}
canvas{background:#fff;border-radius:16px}
.panel{display:flex;gap:6px;flex-wrap:wrap}
button{padding:6px 12px;border:none;border-radius:6px;cursor:pointer}
.small{font-size:12px;opacity:.7}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="state='run'">Run</button>
    <button onclick="state='idle'">Idle</button>
    <button onclick="jumpAll()">Jump</button>
  </div>
  <div class="small">v35.0 — multi character engine</div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const W=420,H=640,ground=520;
let time=0,state="run",camX=0;

// ===== JOINT =====
class Joint{constructor(x,y){this.x=x;this.y=y;}}

// ===== CREATE MAN =====
function createMan(x,phase){
 return{
  hip:new Joint(x,ground-85),
  neck:new Joint(x,ground-155),
  head:new Joint(x,ground-195),

  kneeL:new Joint(x-18,ground-45),
  kneeR:new Joint(x+18,ground-45),
  footL:new Joint(x-18,ground),
  footR:new Joint(x+18,ground),

  elbowL:new Joint(x-40,ground-135),
  elbowR:new Joint(x+40,ground-135),
  handL:new Joint(x-55,ground-115),
  handR:new Joint(x+55,ground-115),

  phase:phase,
  vy:0,
  onGround:true,
  speed:1+Math.random()*0.3
 };
}

// ===== CROWD =====
const men=[];
for(let i=0;i<5;i++){
 men.push(createMan(200+i*80,i*0.6));
}

// ===== IK =====
function stick(a,b,l){
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
 const diff=(d-l)/d*0.5;
 a.x+=dx*diff; a.y+=dy*diff;
 b.x-=dx*diff; b.y-=dy*diff;
}

// ===== ACTIONS =====
function jumpAll(){
 men.forEach(m=>{
  if(m.onGround){
   m.vy=-14;
   m.onGround=false;
  }
 });
 state="jump";
}

function run(m){
 m.phase+=0.1*m.speed;
 const s=Math.sin(m.phase);
 const stride=26;

 m.footL.x=m.hip.x-stride;
 m.footR.x=m.hip.x+stride;
 m.footL.y=ground-Math.max(0,s)*28;
 m.footR.y=ground-Math.max(0,-s)*28;

 m.hip.x+=m.speed;
 m.hip.y=ground-85-Math.abs(s)*8;

 m.neck.x=m.hip.x;
 m.neck.y=m.hip.y-70;
 m.head.x=m.neck.x;
 m.head.y=m.neck.y-40;

 m.handL.x=m.neck.x-45-s*22;
 m.handR.x=m.neck.x+45+s*22;
 m.handL.y=m.neck.y+20;
 m.handR.y=m.neck.y+20;
}

function jump(m){
 m.vy+=0.8;
 m.hip.y+=m.vy;
 if(m.hip.y>=ground-85){
  m.hip.y=ground-85;
  m.vy=0;
  m.onGround=true;
  state="run";
 }
 m.neck.y=m.hip.y-70;
 m.head.y=m.neck.y-40;
}

function idle(m){
 const b=Math.sin(time*0.05+m.phase);
 m.hip.y=ground-85+b*4;
 m.neck.y=m.hip.y-70;
 m.head.y=m.neck.y-40;
}

// ===== SOLVE =====
function solve(m){
 for(let i=0;i<6;i++){
  stick(m.neck,m.hip,70);
  stick(m.head,m.neck,40);

  stick(m.hip,m.kneeL,40);
  stick(m.kneeL,m.footL,40);

  stick(m.hip,m.kneeR,40);
  stick(m.kneeR,m.footR,40);

  stick(m.neck,m.elbowL,35);
  stick(m.elbowL,m.handL,35);

  stick(m.neck,m.elbowR,35);
  stick(m.elbowR,m.handR,35);
 }
}

// ===== DRAW =====
function line(a,b){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
}

function drawMan(m){
 ctx.beginPath();
 ctx.arc(m.head.x,m.head.y,16,0,Math.PI*2);
 ctx.stroke();

 line(m.head,m.neck);
 line(m.neck,m.hip);

 line(m.hip,m.kneeL);
 line(m.kneeL,m.footL);

 line(m.hip,m.kneeR);
 line(m.kneeR,m.footR);

 line(m.neck,m.elbowL);
 line(m.elbowL,m.handL);

 line(m.neck,m.elbowR);
 line(m.elbowR,m.handR);
}

// ===== LOOP =====
function loop(){
 time++;

 men.forEach(m=>{
  if(state==="run") run(m);
  if(state==="jump") jump(m);
  if(state==="idle") idle(m);
  solve(m);
 });

 camX+=(men[0].hip.x-W/2-camX)*0.08;

 ctx.clearRect(0,0,W,H);
 ctx.save();
 ctx.translate(-camX,0);

 ctx.strokeStyle="#ccc";
 ctx.beginPath();
 ctx.moveTo(-2000,ground);
 ctx.lineTo(2000,ground);
 ctx.stroke();

 ctx.strokeStyle="#000";
 men.forEach(drawMan);

 ctx.restore();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
