<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

let x = c.width / 2;
let y = c.height - 80;
let velocityY = 0;
let gravity = 0.6;

let action = 'stand';
let actions = [];
let actionIndex = 0;
let frame = 0;

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle='white';
  ctx.lineWidth=3;

  // swing OLDIN
  let swing = action === 'run' ? Math.sin(frame * 0.15) * 12 : 0;

  // head
  ctx.beginPath();
  ctx.arc(x, y-35, 10, 0, Math.PI*2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.moveTo(x, y-25);
  ctx.lineTo(x, y);
  ctx.stroke();

  // arms (teskari)
  ctx.beginPath();
  ctx.moveTo(x + swing, y - 15);
  ctx.lineTo(x - swing, y - 15);
  ctx.stroke();

  // legs
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - swing, y + 18);
  ctx.moveTo(x, y);
  ctx.lineTo(x + swing, y + 18);
  ctx.stroke();
}

function animate(){
  frame++;

  if(actions.length > 1 && frame % 120 === 0){
    actionIndex++;
    if(actionIndex < actions.length){
      action = actions[actionIndex];
    }
  }

  if (action === 'run') x += 1.5;

  if (action === 'jump') {
    velocityY = -10;
    action = 'fall';
  }

  if (action === 'fall') {
    velocityY += gravity;
    y += velocityY;
  }

  if (x > c.width + 20) x = -20;

  if (y > c.height - 80) {
    y = c.height - 80;
    velocityY = 0;
    if (action === 'fall') action = 'stand';
  }

  draw();
  requestAnimationFrame(animate);
}

function run(){
  const t = document.getElementById('text').value.toLowerCase();
  document.getElementById('status').innerText = 'AI is thinking...';

  actions = [];
  actionIndex = 0;
  frame = 0;

  if (t.match(/run|running|runs/)) actions.push('run');
  if (t.match(/jump|jumps|jumping/)) actions.push('jump');
  if (t.match(/fall|falls|falling/)) actions.push('fall');

  if (actions.length === 0) actions.push('stand');
  action = actions[0];

  setTimeout(()=>{
    document.getElementById('status').innerText = 'Done ✅';
  },500);
}

animate();
</script>
