<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v9 FIXED</title>
<style>
body{margin:0;background:#06161b;color:#fff;font-family:Arial;display:flex;justify-content:center;padding:10px}
.box{width:520px;background:#0b1f26;padding:14px;border-radius:18px;box-shadow:0 0 30px #00ffff55}
h3{text-align:center}
input,select,button{width:100%;padding:8px;margin-top:6px;border-radius:8px;border:none}
button{background:cyan;cursor:pointer}
canvas{background:#fff;width:100%;border-radius:10px;margin-top:10px}
.row{display:flex;gap:6px}
.row>*{flex:1}
.panel{background:#072028;padding:8px;border-radius:10px;margin-top:8px}
.hidden{display:none}
small{text-align:center;opacity:.7;display:block;margin-top:6px}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v9 (FIXED)</h3>

<div id="loginBox">
<input id="username" placeholder="Username">
<button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">

<div class="panel">👤 <b id="userLabel"></b> <button onclick="logout()">Logout</button></div>

<div class="panel">
<b>🎞 Scene Timeline</b>
<select id="sceneSelect" onchange="loadScene(this.value)"></select>
<button onclick="addScene()">➕ Add Scene</button>
</div>

<input id="aiText" placeholder="girl run 2 jump 1 | boy stand 3 | background sky">

<div class="row">
<button onclick="parseAI()">🧠 Generate</button>
<button onclick="saveProject()">💾 Save</button>
<button onclick="loadProject()">📂 Load</button>
</div>

<div class="panel">
<b>🧍 Character Editor</b>
<div class="row">
<label>Speed <input type="range" min="0.5" max="3" step="0.1" value="1" oninput="girl.speed=this.value"></label>
<label>Height <input type="range" min="0.8" max="1.3" step="0.1" value="1" oninput="girl.scale=this.value"></label>
</div>
<select onchange="girl.hair=this.value">
<option value="right">Hair Right</option>
<option value="left">Hair Left</option>
</select>
</div>

<div class="row">
<select onchange="setBG(this.value)">
<option value="street">Street</option>
<option value="room">Room</option>
<option value="sky">Sky</option>
</select>
<button onclick="togglePlay()">⏯ Pause</button>
</div>

<canvas id="c" width="360" height="560"></canvas>
<small>Stable Core • Scene Safe • No Vanish</small>

</div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
ctx.lineCap="round";ctx.lineJoin="round";
const ground=c.height-90;

let user=null,playing=true,background="street",camX=0;

// ===== LOGIN =====
function login(){
  user=username.value.trim();
  if(!user) return;
  localStorage.setItem('user',user);
  start();
}
function logout(){localStorage.removeItem('user');location.reload();}
function start(){
  user=localStorage.getItem('user');
  if(!user) return;
  loginBox.classList.add('hidden');
  app.classList.remove('hidden');
  userLabel.innerText=user;
  initScenes();
}
start();

// ===== CHARACTER =====
class Stickman{
  constructor(x,type){
    this.baseX=x;this.x=x;this.y=ground;this.vy=0;
    this.type=type;this.color="#000";
    this.timeline=[];this.ti=0;this.tf=0;
    this.action='stand';this.speed=1;this.scale=1;this.hair='right';
  }
}
const girl=new Stickman(120,'girl');
const boy=new Stickman(220,'boy');
const chars=[girl,boy];

// ===== RESET SAFE =====
function resetCharacters(){
  chars.forEach(ch=>{
    ch.x=ch.baseX;
    ch.y=ground;
    ch.vy=0;
    ch.ti=0;
    ch.tf=0;
    if(!ch.timeline.length){
      ch.timeline=[{action:'stand',frames:9999}];
    }
  });
  camX=0;
}

// ===== SCENES =====
let scenes=[],currentScene=0;
function initScenes(){
  scenes=[{ai:"girl stand 2 | boy stand 2 | background street",bg:"street"}];
  updateSceneUI();
  loadScene(0);
}
function addScene(){
  scenes.push({ai:"girl stand 2 | boy stand 2",bg:background});
  updateSceneUI();
}
function updateSceneUI(){
  sceneSelect.innerHTML="";
  scenes.forEach((_,i)=>{
    let o=document.createElement("option");
    o.value=i;o.text="Scene "+(i+1);
    sceneSelect.appendChild(o);
  });
}
function loadScene(i){
  currentScene=i;
  aiText.value=scenes[i].ai;
  background=scenes[i].bg;
  parseAI();
  resetCharacters();
}

// ===== SAVE / LOAD =====
function saveProject(){
  scenes[currentScene].ai=aiText.value;
  scenes[currentScene].bg=background;
  localStorage.setItem("project_"+user,JSON.stringify(scenes));
  alert("Saved ☁️");
}
function loadProject(){
  let p=JSON.parse(localStorage.getItem("project_"+user));
  if(!p) return;
  scenes=p;updateSceneUI();loadScene(0);
}

// ===== BG =====
function setBG(v){background=v;}
function drawBG(){
  ctx.fillStyle=background==='sky'?'#bde7ff':background==='room'?'#fff4e6':'#eaeaea';
  ctx.fillRect(0,0,c.width,c.height);
}

// ===== DRAW =====
function draw(ch){
  ctx.strokeStyle=ch.color;
  let p=Math.sin(Date.now()*0.01);
  let x=ch.x-camX;
  let s=ch.scale;
  ctx.beginPath();ctx.arc(x,ch.y-40*s,12*s,0,Math.PI*2);ctx.stroke();
  if(ch.type==='girl'){
    let d=ch.hair==='right'?1:-1;
    ctx.beginPath();
    ctx.moveTo(x+6*d,ch.y-52*s);
    ctx.quadraticCurveTo(x+26*d,ch.y-44*s,x+18*d,ch.y-26*s);
    ctx.stroke();
  }
  ctx.beginPath();ctx.moveTo(x,ch.y-28*s);ctx.lineTo(x,ch.y+20*s);ctx.stroke();
  limb(x,ch.y-24*s,p,s); limb(x,ch.y-24*s,p+Math.PI,s);
  leg(x-6*s,ch.y+20*s,p,s); leg(x+6*s,ch.y+20*s,p+Math.PI,s);
}
function limb(x,y,p,s){
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(p)*16*s,y+Math.cos(p)*16*s);ctx.stroke();
}
function leg(x,y,p,s){
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(p)*14*s,y+28*s);ctx.stroke();
}

// ===== ENGINE =====
function animate(){
  if(playing){
    chars.forEach(ch=>{
      let cur=ch.timeline[ch.ti];
      ch.action=cur.action;
      ch.tf++;
      if(ch.tf>cur.frames){ch.tf=0;ch.ti=(ch.ti+1)%ch.timeline.length;}
      if(ch.action==='run') ch.x+=ch.speed;
      if(ch.action==='jump'&&ch.y===ground) ch.vy=-11;
      ch.vy+=0.6; ch.y+=ch.vy;
      if(ch.y>ground){ch.y=ground;ch.vy=0;}
      ch.x=Math.max(20,Math.min(ch.x,10000));
    });
  }
  camX+=((girl.x+boy.x)/2-camX-c.width/2)*0.05;
  drawBG(); chars.forEach(draw);
  requestAnimationFrame(animate);
}
animate();

// ===== AI =====
function parseAI(){
  chars.forEach(c=>{c.timeline=[];c.ti=0;c.tf=0;});
  aiText.value.toLowerCase().split('|').forEach(b=>{
    let p=b.trim().split(' ');
    if(p[0]==='background') setBG(p[1]);
    else{
      let ch=p[0]==='girl'?girl:boy;
      for(let i=1;i<p.length;i+=2){
        let act=p[i];
        let sec=parseFloat(p[i+1])||1;
        ch.timeline.push({action:act,frames:sec*60});
      }
    }
  });
  resetCharacters();
}

function togglePlay(){playing=!playing;}
</script>
</body>
</html>
