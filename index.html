<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v8.5.0 – Pose Editor</title>
<style>
  body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
  }
  canvas{background:#fff;cursor:crosshair;}
  .hint{margin-top:8px;font-size:13px;opacity:.8}
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>
<div class="hint">Qo‘l yoki oyoqqa bos → aylantir (pose editor)</div>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

/* =====================
   STATE
===================== */
const stickman={
  x:300,y:340,
  joints:{
    la:{x:0,y:-20,ang:-15,len:55},
    ra:{x:0,y:-20,ang:15,len:55},
    ll:{x:0,y:60, ang:10,len:65},
    rl:{x:0,y:60, ang:-10,len:65}
  }
};

let active=null;

/* =====================
   HELPERS
===================== */
function dist(x1,y1,x2,y2){
  return Math.hypot(x1-x2,y1-y2);
}
function angle(cx,cy,px,py){
  return Math.atan2(py-cy,px-cx)*180/Math.PI+90;
}

/* =====================
   DRAW
===================== */
function drawLimb(j){
  ctx.save();
  ctx.translate(j.x,j.y);
  ctx.rotate(j.ang*Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,j.len);
  ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,600,600);
  ctx.save();
  ctx.translate(stickman.x,stickman.y);
  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.strokeStyle="#000";

  // body
  ctx.beginPath();ctx.moveTo(0,-40);ctx.lineTo(0,60);ctx.stroke();
  ctx.beginPath();ctx.arc(0,-70,22,0,Math.PI*2);ctx.stroke();

  for(let k in stickman.joints){
    drawLimb(stickman.joints[k]);
  }

  ctx.restore();
}

/* =====================
   HIT TEST
===================== */
function hitTest(mx,my){
  for(let k in stickman.joints){
    const j=stickman.joints[k];
    const bx=stickman.x+j.x;
    const by=stickman.y+j.y;
    if(dist(mx,my,bx,by)<15) return j;
  }
  return null;
}

/* =====================
   MOUSE
===================== */
canvas.onmousedown=e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left;
  const my=e.clientY-r.top;
  active=hitTest(mx,my);
};
canvas.onmousemove=e=>{
  if(!active)return;
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left;
  const my=e.clientY-r.top;
  const cx=stickman.x+active.x;
  const cy=stickman.y+active.y;
  active.ang=angle(cx,cy,mx,my);
};
window.onmouseup=()=>active=null;

/* =====================
   LOOP
===================== */
function loop(){
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
