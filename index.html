<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman v21-A.15 — Real Audio Beat</title>
<style>
body{
  margin:0;
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
}
canvas{background:#e6f4ff}
button{
  margin:8px;
  padding:10px 16px;
  font-size:14px;
  cursor:pointer;
}
</style>
</head>
<body>

<button id="play">▶ PLAY AUDIO</button>
<canvas id="c" width="360" height="640"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

/* ================= CAMERA ================= */
const Camera={
  x:0,y:0,shake:0,target:null,
  update(){
    if(this.target){
      this.x+=((this.target.x-180)-this.x)*0.12;
      this.y+=((this.target.y-320)-this.y)*0.12;
    }
    this.shake*=0.85;
  },
  apply(){
    const sx=(Math.random()-0.5)*this.shake;
    const sy=(Math.random()-0.5)*this.shake;
    ctx.setTransform(1,0,0,1,-this.x+sx,-this.y+sy);
  },
  hit(v){this.shake=v;}
};

/* ================= SUBS ================= */
const Subs={
  lines:[
    "That was CRAZY 😱",
    "Bu juda TELBA edi 😂"
  ],
  i:0,active:false,t:0,
  hit(){
    this.active=true;
    this.t=0;
  },
  update(){
    if(!this.active) return;
    this.t++;
    if(this.t>50){
      this.active=false;
      this.i=(this.i+1)%this.lines.length;
    }
  },
  draw(){
    if(!this.active) return;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.font="bold 24px sans-serif";
    ctx.textAlign="center";
    ctx.fillStyle="#000";
    ctx.fillText(this.lines[this.i],180,600);
    ctx.fillStyle="#fff";
    ctx.fillText(this.lines[this.i],180,596);
  }
};

/* ================= CHARACTER ================= */
class Character{
  constructor(x,color){
    this.x=x;this.y=440;
    this.color=color;
    this.walk=0;
    this.jump=0;
  }
  update(){
    this.walk+=0.1;
    this.jump*=0.82;
  }
  beat(){this.jump=14;}
  draw(){
    ctx.strokeStyle=this.color;
    ctx.lineWidth=3;
    const step=Math.sin(this.walk)*6;
    const j=this.jump;

    // body
    ctx.beginPath();
    ctx.moveTo(this.x,this.y-j);
    ctx.lineTo(this.x,this.y+36-j);
    ctx.stroke();

    // legs
    ctx.beginPath();
    ctx.moveTo(this.x,this.y+36-j);
    ctx.lineTo(this.x-8,this.y+70-step-j);
    ctx.moveTo(this.x,this.y+36-j);
    ctx.lineTo(this.x+8,this.y+70+step-j);
    ctx.stroke();

    // arms
    ctx.beginPath();
    ctx.moveTo(this.x,this.y+10-j);
    ctx.lineTo(this.x-14,this.y+26+j);
    ctx.moveTo(this.x,this.y+10-j);
    ctx.lineTo(this.x+14,this.y+26-j);
    ctx.stroke();

    // head
    ctx.beginPath();
    ctx.arc(this.x,this.y-14-j,14,0,Math.PI*2);
    ctx.stroke();
  }
}

/* ================= AUDIO ================= */
let audioCtx, analyser, data, source;
let lastEnergy=0;

async function initAudio(){
  audioCtx=new AudioContext();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=256;
  data=new Uint8Array(analyser.frequencyBinCount);

  const audio=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_87c7c6c77f.mp3");
  audio.crossOrigin="anonymous";
  source=audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  audio.play();

  return audio;
}

/* ================= SETUP ================= */
const hero=new Character(160,"#ff4444");
const npc=new Character(200,"#44ff88");
Camera.target=hero;

let started=false;

/* ================= LOOP ================= */
function loop(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,360,640);

  if(started){
    analyser.getByteFrequencyData(data);
    let energy=0;
    for(let i=0;i<data.length;i++) energy+=data[i];
    energy/=data.length;

    if(energy-lastEnergy>18){
      Camera.hit(10);
      hero.beat();
      npc.beat();
      Subs.hit();
    }
    lastEnergy=energy;
  }

  Camera.update();
  ctx.save();
  Camera.apply();

  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,470);
  ctx.lineTo(360,470);
  ctx.stroke();

  hero.update();npc.update();
  hero.draw();npc.draw();

  ctx.restore();
  Subs.update();Subs.draw();

  requestAnimationFrame(loop);
}
loop();

/* ================= UI ================= */
document.getElementById("play").onclick=async()=>{
  if(started) return;
  await initAudio();
  started=true;
};
</script>
</body>
</html>
