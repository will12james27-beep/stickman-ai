<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v30.0 (Real Motion Core)</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
}
#studio{display:flex;flex-direction:column;gap:10px;align-items:center}
canvas{background:#fff;border-radius:16px}
.panel{display:flex;gap:6px}
button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="mode='walk'">Walk</button>
    <button onclick="mode='idle'">Idle</button>
    <button onclick="mode='wave'">Wave</button>
  </div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const W=420,H=640,ground=520;
let time=0,mode="walk",camX=0;

// ===== JOINT =====
class Joint{
  constructor(x,y){this.x=x;this.y=y;}
}

// ===== STICKMAN =====
function createMan(x){
  return{
    hip:new Joint(x,ground-85),
    neck:new Joint(x,ground-155),
    head:new Joint(x,ground-195),

    kneeL:new Joint(x-18,ground-45),
    kneeR:new Joint(x+18,ground-45),
    footL:new Joint(x-18,ground),
    footR:new Joint(x+18,ground),

    elbowL:new Joint(x-40,ground-135),
    elbowR:new Joint(x+40,ground-135),
    handL:new Joint(x-55,ground-115),
    handR:new Joint(x+55,ground-115),

    phase:0,
    speed:1.2,
    pelvisRot:0,
    headLag:0
  };
}

const men=[createMan(200)];

// ===== IK =====
function stick(a,b,len){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||1;
  const diff=(d-len)/d*0.5;
  a.x+=dx*diff; a.y+=dy*diff;
  b.x-=dx*diff; b.y-=dy*diff;
}

// ===== WALK v30 (REAL) =====
function walk(m){
  m.phase+=0.04;
  const s=Math.sin(m.phase);
  const c=Math.cos(m.phase);
  const stride=28;

  const leftPlant=s>0;

  // --- FOOT PLANT ---
  if(leftPlant){
    m.footL.x=m.hip.x-stride;
    m.footL.y=ground;

    m.footR.x=m.hip.x+stride+s*26;
    m.footR.y=ground-Math.max(0,-s)*32;
  }else{
    m.footR.x=m.hip.x+stride;
    m.footR.y=ground;

    m.footL.x=m.hip.x-stride+s*26;
    m.footL.y=ground-Math.max(0,s)*32;
  }

  // --- PELVIS ---
  m.pelvisRot=s*6;
  m.hip.x+=m.speed;
  m.hip.y=ground-85-Math.abs(s)*10;

  // --- SPINE ---
  m.neck.x=m.hip.x+m.pelvisRot*0.2;
  m.neck.y=m.hip.y-70;

  // --- HEAD LAG ---
  m.headLag+=(s*4-m.headLag)*0.1;
  m.head.x=m.neck.x+m.headLag;
  m.head.y=m.neck.y-40;

  // --- ARMS ---
  m.handL.x=m.neck.x-45-s*26;
  m.handR.x=m.neck.x+45+s*26;
  m.handL.y=m.neck.y+18+c*4;
  m.handR.y=m.neck.y+18-c*4;

  camX+=((m.hip.x-W/2)-camX)*0.06;
}

// ===== IDLE =====
function idle(m){
  const b=Math.sin(time*0.05);
  m.hip.y=ground-85+b*4;
  m.neck.y=m.hip.y-70;
  m.head.y=m.neck.y-40;
}

// ===== WAVE =====
function wave(m){
  idle(m);
  m.handR.y=m.neck.y-55-Math.sin(time*0.3)*30;
  m.handR.x=m.neck.x+55;
}

// ===== SOLVE =====
function solve(){
  men.forEach(m=>{
    for(let i=0;i<7;i++){
      stick(m.neck,m.hip,70);
      stick(m.head,m.neck,40);

      stick(m.hip,m.kneeL,40);
      stick(m.kneeL,m.footL,40);

      stick(m.hip,m.kneeR,40);
      stick(m.kneeR,m.footR,40);

      stick(m.neck,m.elbowL,35);
      stick(m.elbowL,m.handL,35);

      stick(m.neck,m.elbowR,35);
      stick(m.elbowR,m.handR,35);
    }
  });
}

// ===== DRAW =====
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function drawMan(m){
  ctx.beginPath();
  ctx.arc(m.head.x,m.head.y,16,0,Math.PI*2);
  ctx.stroke();

  line(m.head,m.neck);
  line(m.neck,m.hip);

  line(m.hip,m.kneeL);
  line(m.kneeL,m.footL);

  line(m.hip,m.kneeR);
  line(m.kneeR,m.footR);

  line(m.neck,m.elbowL);
  line(m.elbowL,m.handL);

  line(m.neck,m.elbowR);
  line(m.elbowR,m.handR);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  ctx.strokeStyle="#ccc";
  ctx.beginPath();
  ctx.moveTo(-camX,ground);
  ctx.lineTo(W-camX,ground);
  ctx.stroke();

  ctx.strokeStyle="#000";
  ctx.save();
  ctx.translate(-camX,0);
  men.forEach(drawMan);
  ctx.restore();
}

// ===== LOOP =====
function loop(){
  time++;
  men.forEach(m=>{
    if(mode==="walk")walk(m);
    if(mode==="idle")idle(m);
    if(mode==="wave")wave(m);
  });
  solve();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
