<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman AI v10.8.0 — Timeline Core</title>
<style>
  body { margin:0; background:#0e0e0e; color:#aaa; font-family:monospace; }
  #ui {
    position:fixed; bottom:0; left:0; right:0;
    background:#111; padding:6px;
    display:flex; gap:12px; flex-wrap:wrap;
  }
  canvas { display:block; margin:auto; background:#1a1a1a; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="ui">
  <span id="mode">MODE: LIVE</span>
  <span id="state">STATE: IDLE</span>
  <span id="info">Frames: 0</span>
</div>

<script>
// ================= SETUP =================
const c=document.getElementById("c");
const ctx=c.getContext("2d");
c.width=700; c.height=450;
const GROUND_Y=330;

// ================= INPUT =================
const keys={};
window.addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.key==="r"||e.key==="R") toggleRecord();
  if(e.key==="p"||e.key==="P") startPlay();
  if(e.key==="o"||e.key==="O") stopAll();
});
window.addEventListener("keyup",e=>keys[e.key]=false);

// ================= MODES =================
const MODE={LIVE:"LIVE",RECORD:"RECORD",PLAY:"PLAY"};
let mode=MODE.LIVE;

// ================= STATE =================
const STATE={IDLE:"IDLE",WALK:"WALK",RUN:"RUN"};
let currentState=STATE.IDLE;

// ================= TIMELINE =================
let timeline=[];
let frame=0;

// ================= SKELETON =================
const sk={
  hip:{x:350,y:240},
  spine:{x:350,y:190},
  head:{x:350,y:155,scaleY:1},
  arms:{L:{a:0},R:{a:0}},
  legs:{
    L:{foot:{x:330,y:GROUND_Y,lock:true}},
    R:{foot:{x:370,y:GROUND_Y,lock:true}}
  }
};

let time=0;
let direction=1, targetDir=1;

// ================= UTILS =================
const lerp=(a,b,t)=>a+(b-a)*t;

// ================= MODE CONTROL =================
function toggleRecord(){
  if(mode===MODE.RECORD){
    mode=MODE.LIVE;
  }else{
    timeline=[];
    frame=0;
    mode=MODE.RECORD;
  }
  updateUI();
}
function startPlay(){
  if(timeline.length===0) return;
  frame=0;
  mode=MODE.PLAY;
  updateUI();
}
function stopAll(){
  mode=MODE.LIVE;
  updateUI();
}
function updateUI(){
  document.getElementById("mode").textContent="MODE: "+mode;
  document.getElementById("info").textContent="Frames: "+timeline.length;
}

// ================= STATE =================
function updateState(){
  if(mode!==MODE.LIVE && mode!==MODE.RECORD) return;

  if(keys["a"]||keys["A"]){
    currentState = keys["Shift"] ? STATE.RUN : STATE.WALK;
  }else{
    currentState = STATE.IDLE;
  }
  document.getElementById("state").textContent="STATE: "+currentState;
}

// ================= WALK LOGIC =================
function liveMotion(){
  if(keys["ArrowLeft"])  targetDir=-1;
  if(keys["ArrowRight"]) targetDir= 1;
  direction=lerp(direction,targetDir,0.08);

  if(currentState===STATE.IDLE){
    time*=0.9;
    return;
  }

  const speed=currentState===STATE.RUN?0.09:0.05;
  time+=speed;
  const phase=Math.sin(time);

  const stride=currentState===STATE.RUN?42:30;
  const lift=currentState===STATE.RUN?28:20;
  const up=Math.max(0,Math.sin(time+Math.PI/2))*lift;

  const L=sk.legs.L, R=sk.legs.R;
  if(phase>0){L.foot.lock=true;R.foot.lock=false;}
  else{L.foot.lock=false;R.foot.lock=true;}

  if(!L.foot.lock){
    L.foot.x=sk.hip.x-22*direction+phase*stride*direction;
    L.foot.y=GROUND_Y-up;
  }
  if(!R.foot.lock){
    R.foot.x=sk.hip.x+22*direction-phase*stride*direction;
    R.foot.y=GROUND_Y-up;
  }

  sk.hip.x+= (currentState===STATE.RUN?0.9:0.45)*direction;
  sk.hip.y=lerp(sk.hip.y,(L.foot.y+R.foot.y)/2-65,0.15);
}

// ================= RECORD =================
function recordFrame(){
  timeline.push({
    hip:{x:sk.hip.x,y:sk.hip.y},
    direction,
    state:currentState
  });
}

// ================= PLAY =================
function playFrame(){
  if(frame>=timeline.length){
    mode=MODE.LIVE;
    return;
  }
  const f=timeline[frame];
  sk.hip.x=f.hip.x;
  sk.hip.y=f.hip.y;
  direction=f.direction;
  currentState=f.state;
  frame++;
}

// ================= DRAW =================
function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  ctx.strokeStyle="#444";
  ctx.beginPath();
  ctx.moveTo(0,GROUND_Y); ctx.lineTo(c.width,GROUND_Y);
  ctx.stroke();

  ctx.strokeStyle="#fff"; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(sk.hip.x,sk.hip.y);
  ctx.lineTo(sk.hip.x,sk.hip.y-50);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(sk.hip.x,sk.hip.y-80,12,0,Math.PI*2);
  ctx.stroke();
}

// ================= LOOP =================
function loop(){
  if(mode===MODE.PLAY){
    playFrame();
  }else{
    updateState();
    liveMotion();
    if(mode===MODE.RECORD) recordFrame();
  }
  draw();
  requestAnimationFrame(loop);
}
updateUI();
loop();
</script>

</body>
</html>
