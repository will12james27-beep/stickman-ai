<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(#0f2b33, #07161b);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
  }

  .box {
    width: 320px;
    padding: 20px;
    border-radius: 20px;
    background: #0b1f26;
    box-shadow: 0 0 30px #00ffff55;
    text-align: center;
  }

  input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
    font-size: 16px;
  }

  button {
    width: 100%;
    padding: 10px;
    background: cyan;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  canvas {
    background: #000;
    margin-top: 15px;
    border-radius: 10px;
  }
</style>
</head>
<body>

<div class="box">
  <h2>🤖 Stickman AI</h2>
  <p>Type text → animation plays</p>

  <input id="text" placeholder="run jump">
  <button onclick="run()">Generate</button>
  <p id="status"></p>

  <canvas id="c" width="280" height="400"></canvas>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

let x = c.width / 2;
let y = c.height - 80;
let ground = c.height - 80;

let velocityY = 0;
let gravity = 0.6;

let action = 'stand';
let actions = [];
let actionIndex = 0;
let frame = 0;

function draw() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 3;


let swing;

if (action === 'run') {
  swing = Math.sin(frame * 0.15) * 12;
} else if (action === 'jump') {
  swing = 6; // ❗ statik, lekin ko‘rinadi
} else {
  swing = 4;
}



  // head
  ctx.beginPath();
  ctx.arc(x, y - 35, 10, 0, Math.PI * 2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.moveTo(x, y - 25);
  ctx.lineTo(x, y);
  ctx.stroke();

// arms
ctx.beginPath();

if (action === 'jump') {
  // qo'llar yuqoriga
  ctx.moveTo(x, y - 20);
  ctx.lineTo(x - 12, y - 40);

  ctx.moveTo(x, y - 20);
  ctx.lineTo(x + 12, y - 40);
} else {
  // run / stand
  ctx.moveTo(x - swing, y - 15);
  ctx.lineTo(x + swing, y - 15);
}

ctx.stroke();


// legs
let legY = action === 'jump' ? 4 : 20;
let legSwing = action === 'jump' ? 3 : swing;

ctx.beginPath();
ctx.moveTo(x, y);
ctx.lineTo(x - legSwing, y + legY);
ctx.moveTo(x, y);
ctx.lineTo(x + legSwing, y + legY);
ctx.stroke();

}

function animate() {
  frame++;

  // action switch (har 2 sekund)
  if (actions.length > 1 && frame % 120 === 0) {
    actionIndex++;
    if (actionIndex < actions.length) {
      action = actions[actionIndex];
    }
  }

  if (action === 'run') {
    x += 1.5;
  }

  if (action === 'jump' && y === ground) {
    velocityY = -11;
  }

  velocityY += gravity;
  y += velocityY;

  if (y > ground) {
    y = ground;
    velocityY = 0;
  }

  if (x > c.width + 20) x = -20;

  draw();
  requestAnimationFrame(animate);
}

function run() {
  const t = document.getElementById('text').value.toLowerCase();
  document.getElementById('status').innerText = 'AI is thinking...';

  actions = [];
  actionIndex = 0;
  frame = 0;

  if (t.includes('run')) actions.push('run');
  if (t.includes('jump')) actions.push('jump');

  if (actions.length === 0) actions.push('stand');
  action = actions[0];

  setTimeout(() => {
    document.getElementById('status').innerText = 'Done ✅';
  }, 400);
}

animate();
</script>

</body>
</html>
