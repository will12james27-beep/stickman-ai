<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman IK Walk 7.7</title>
<style>
  body { margin:0; background:#111; overflow:hidden; }
  canvas { display:block; margin:auto; background:#222; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = 600;
canvas.height = 400;

const groundY = 300;
let t = 0;

// ====== BONES ======
const hip = { x: 300, y: 200 };
const spine = { x: 300, y: 160 };
const head = { x: 300, y: 130 };

const legLen1 = 40;
const legLen2 = 40;

// foot lock
const footL = { x: 0, y: groundY, lock: true };
const footR = { x: 0, y: groundY, lock: false };

// ====== IK SOLVER ======
function solveLeg(hipX, hipY, footX, footY) {
  let dx = footX - hipX;
  let dy = footY - hipY;
  let d = Math.hypot(dx, dy);
  d = Math.min(d, legLen1 + legLen2 - 0.001);

  let a1 = Math.acos(
    (legLen1**2 + d**2 - legLen2**2) / (2 * legLen1 * d)
  );
  let a2 = Math.atan2(dy, dx);
  let kneeX = hipX + Math.cos(a2 + a1) * legLen1;
  let kneeY = hipY + Math.sin(a2 + a1) * legLen1;

  return { kneeX, kneeY };
}

// ====== LOOP ======
function update() {
  t += 0.05;

  // step positions
  let step = Math.sin(t);
  let lift = Math.max(0, Math.sin(t + Math.PI / 2)) * 20;

  // switch foot lock
  if (step > 0) {
    footL.lock = true;
    footR.lock = false;
  } else {
    footL.lock = false;
    footR.lock = true;
  }

  if (!footL.lock) {
    footL.x = hip.x - 20 + step * 30;
    footL.y = groundY - lift;
  }
  if (!footR.lock) {
    footR.x = hip.x + 20 - step * 30;
    footR.y = groundY - lift;
  }

  // ===== HIP TARGET (AVERAGE FOOT HEIGHT) =====
  let targetHipY =
    (footL.y + footR.y) / 2 - 60;

  // damping
  hip.y += (targetHipY - hip.y) * 0.15;

  // small forward move
  hip.x += 0.3;

  // spine smoothing
  spine.x += (hip.x - spine.x) * 0.2;
  spine.y += (hip.y - 40 - spine.y) * 0.2;

  head.x = spine.x;
  head.y = spine.y - 30;
}

function drawLeg(foot, side) {
  const hipOffsetX = side * 10;
  const hipX = hip.x + hipOffsetX;
  const hipY = hip.y;

  const k = solveLeg(hipX, hipY, foot.x, foot.y);

  ctx.beginPath();
  ctx.moveTo(hipX, hipY);
  ctx.lineTo(k.kneeX, k.kneeY);
  ctx.lineTo(foot.x, foot.y);
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;

  // ground
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(canvas.width, groundY);
  ctx.strokeStyle = "#555";
  ctx.stroke();

  ctx.strokeStyle = "#fff";

  // spine
  ctx.beginPath();
  ctx.moveTo(hip.x, hip.y);
  ctx.lineTo(spine.x, spine.y);
  ctx.stroke();

  // head
  ctx.beginPath();
  ctx.arc(head.x, head.y, 10, 0, Math.PI * 2);
  ctx.stroke();

  // legs
  drawLeg(footL, -1);
  drawLeg(footR, 1);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
