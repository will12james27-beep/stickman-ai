<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v24.0</title>
<style>
body{
  margin:0;
  background:#02080c;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
}
canvas{
  background:#fff;
  border-radius:12px;
}
.panel{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
input[type=range]{width:120px}
button,input{
  padding:6px 10px;
  border-radius:6px;
  border:none;
}
</style>
</head>
<body>

<div class="panel">
  <button onclick="mode='walk'">Walk</button>
  <button onclick="mode='idle'">Idle</button>
  <button onclick="mode='wave'">Wave</button>
  <button onclick="autoGenerate()">🤖 AutoAnim</button>
  <button onclick="record()">● Rec</button>
  <button onclick="play()">▶ Play</button>
  <input type="range" min="0" max="0" value="0" id="scrub" oninput="scrubFrame(this.value)">
  <button onclick="exportSprite()">🧩 Sprite</button>
  <button onclick="exportJSON()">⤓ JSON</button>
  <button onclick="importJSON()">⤒ Load</button>
</div>

<canvas id="c" width="360" height="640"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round"; ctx.lineWidth=4;

const ground=520;
let time=0, mode="idle";

// ===== TIMELINE =====
let recording=false, playing=false;
let timeline=[], playIndex=0;

// ===== JOINT =====
class Joint{constructor(x,y){this.x=x;this.y=y;}}

// ===== STICKMAN =====
function createMan(x){
  return{
    hip:new Joint(x,ground-70),
    neck:new Joint(x,ground-135),
    head:new Joint(x,ground-170),
    kneeL:new Joint(x-15,ground-35),
    kneeR:new Joint(x+15,ground-35),
    footL:new Joint(x-15,ground),
    footR:new Joint(x+15,ground),
    elbowL:new Joint(x-35,ground-120),
    elbowR:new Joint(x+35,ground-120),
    handL:new Joint(x-45,ground-105),
    handR:new Joint(x+45,ground-105)
  };
}
const men=[createMan(180)];

// ===== IK =====
function stick(a,b,l){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
  const diff=(d-l)/d*0.5;
  a.x+=dx*diff; a.y+=dy*diff;
  b.x-=dx*diff; b.y-=dy*diff;
}

// ===== AI =====
function walk(m){
  const s=Math.sin(time*0.12);
  m.hip.x+=0.8;
  m.footL.x=m.hip.x-15+s*20;
  m.footR.x=m.hip.x+15-s*20;
  m.footL.y=ground-Math.max(0,s*15);
  m.footR.y=ground-Math.max(0,-s*15);
  m.handL.x=m.neck.x-40-s*10;
  m.handR.x=m.neck.x+40+s*10;
}
function idle(m){m.neck.y+=Math.sin(time*0.05)*0.05;}
function wave(m){m.handR.y=m.neck.y-40-Math.sin(time*0.2)*20;}

// ===== AUTO AI GENERATOR =====
function autoGenerate(){
  timeline=[]; recording=false;
  for(let i=0;i<40;i++){
    time++;
    men.forEach(walk);
    solve();
    capture();
  }
  document.getElementById("scrub").max=timeline.length-1;
  alert("Auto animation created");
}

// ===== TIMELINE =====
function record(){
  recording=!recording;
  if(recording) timeline=[];
}
function play(){playing=true; playIndex=0;}
function capture(){
  timeline.push(JSON.parse(JSON.stringify(men)));
  document.getElementById("scrub").max=timeline.length-1;
}
function scrubFrame(i){
  if(timeline[i]) applyFrame(timeline[i]);
}
function applyFrame(f){
  f.forEach((fm,i)=>{
    for(let k in fm){
      men[i][k].x=fm[k].x;
      men[i][k].y=fm[k].y;
    }
  });
}

// ===== EXPORT =====
function exportJSON(){
  const a=document.createElement("a");
  a.download="animation.json";
  a.href=URL.createObjectURL(new Blob([JSON.stringify(timeline)],{type:"application/json"}));
  a.click();
}
function importJSON(){
  const i=document.createElement("input");
  i.type="file";
  i.onchange=e=>{
    const r=new FileReader();
    r.onload=()=>{timeline=JSON.parse(r.result);};
    r.readAsText(e.target.files[0]);
  };
  i.click();
}
function exportSprite(){
  const off=document.createElement("canvas");
  off.width=360*timeline.length;
  off.height=640;
  const octx=off.getContext("2d");

  timeline.forEach((f,i)=>{
    applyFrame(f);
    octx.save();
    octx.translate(i*360,0);
    draw();
    octx.restore();
  });

  const a=document.createElement("a");
  a.download="sprite.png";
  a.href=off.toDataURL();
  a.click();
}

// ===== DRAW =====
function line(a,b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
function drawMan(m){
  line(m.head,m.neck); line(m.neck,m.hip);
  line(m.hip,m.kneeL); line(m.kneeL,m.footL);
  line(m.hip,m.kneeR); line(m.kneeR,m.footR);
  line(m.neck,m.elbowL); line(m.elbowL,m.handL);
  line(m.neck,m.elbowR); line(m.elbowR,m.handR);
  ctx.beginPath(); ctx.arc(m.head.x,m.head.y,14,0,Math.PI*2); ctx.stroke();
}
function draw(){
  ctx.clearRect(0,0,360,640);
  ctx.strokeStyle="#ccc"; line({x:0,y:ground},{x:360,y:ground});
  ctx.strokeStyle="#000";
  men.forEach(drawMan);
}

// ===== SOLVE =====
function solve(){
  men.forEach(m=>{
    for(let i=0;i<6;i++){
      stick(m.head,m.neck,35);
      stick(m.neck,m.hip,65);
      stick(m.hip,m.kneeL,35); stick(m.kneeL,m.footL,35);
      stick(m.hip,m.kneeR,35); stick(m.kneeR,m.footR,35);
      stick(m.neck,m.elbowL,30); stick(m.elbowL,m.handL,30);
      stick(m.neck,m.elbowR,30); stick(m.elbowR,m.handR,30);
    }
  });
}

// ===== LOOP =====
function loop(){
  time++;
  if(playing){
    applyFrame(timeline[playIndex++]);
    if(playIndex>=timeline.length)playing=false;
  }else{
    men.forEach(m=>{
      if(mode==="walk")walk(m);
      if(mode==="idle")idle(m);
      if(mode==="wave")wave(m);
    });
  }
  solve();
  if(recording)capture();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
