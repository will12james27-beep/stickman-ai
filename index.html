<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>21 C.23 Facial Emotion Mapping</title>
<style>
  body {
    margin: 0;
    background: #111;
  }
  canvas {
    display: block;
    margin: auto;
    background: #fff;
  }
</style>
</head>
<body>

<canvas id="c" width="480" height="640"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* =========================
   EMOTION SYSTEM
========================= */

const Emotion = {
  NEUTRAL: "neutral",
  ANGRY: "angry",
  CONFUSED: "confused",
  SHOCKED: "shocked"
};

let currentEmotion = Emotion.NEUTRAL;

/* =========================
   FACE MAP
========================= */

const faceMap = {
  neutral: { eye: 1, brow: 0, mouth: "line" },
  angry: { eye: 0.7, brow: -18, mouth: "flat" },
  confused: { eye: 0.85, brow: 12, mouth: "tilt" },
  shocked: { eye: 1.3, brow: 0, mouth: "open" }
};

/* =========================
   DRAW FUNCTIONS
========================= */

function drawEye(x, y, open) {
  ctx.beginPath();
  ctx.ellipse(x, y, 3, 5 * open, 0, 0, Math.PI * 2);
  ctx.stroke();
}

function drawBrow(x, y, tilt) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(-6, 0);
  ctx.lineTo(6, 0);
  ctx.stroke();
  ctx.restore();
}

function drawMouth(x, y, type) {
  ctx.beginPath();

  if (type === "line") {
    ctx.moveTo(x - 6, y);
    ctx.lineTo(x + 6, y);
  }

  if (type === "flat") {
    ctx.moveTo(x - 6, y + 2);
    ctx.lineTo(x + 6, y + 2);
  }

  if (type === "tilt") {
    ctx.moveTo(x - 6, y);
    ctx.lineTo(x + 4, y - 3);
  }

  if (type === "open") {
    ctx.arc(x, y, 4, 0, Math.PI * 2);
  }

  ctx.stroke();
}

function drawFace(x, y, emotion) {
  const f = faceMap[emotion];

  drawEye(x - 10, y, f.eye);
  drawEye(x + 10, y, f.eye);

  drawBrow(x - 10, y - 10, f.brow);
  drawBrow(x + 10, y - 10, f.brow);

  drawMouth(x, y + 12, f.mouth);
}

/* =========================
   CHARACTER
========================= */

function drawCharacter() {
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#000";

  // head
  ctx.beginPath();
  ctx.arc(240, 200, 40, 0, Math.PI * 2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.moveTo(240, 240);
  ctx.lineTo(240, 360);
  ctx.stroke();

  // arms
  ctx.beginPath();
  ctx.moveTo(240, 280);
  ctx.lineTo(190, 320);
  ctx.moveTo(240, 280);
  ctx.lineTo(290, 320);
  ctx.stroke();

  // legs
  ctx.beginPath();
  ctx.moveTo(240, 360);
  ctx.lineTo(210, 440);
  ctx.moveTo(240, 360);
  ctx.lineTo(270, 440);
  ctx.stroke();

  drawFace(240, 200, currentEmotion);
}

/* =========================
   BEAT SYSTEM
========================= */

function beat(delay, fn) {
  setTimeout(fn, delay);
}

/* =========================
   EMOTION SEQUENCE
========================= */

beat(1000, () => currentEmotion = Emotion.CONFUSED);
beat(2500, () => currentEmotion = Emotion.SHOCKED);
beat(4000, () => currentEmotion = Emotion.ANGRY);
beat(6000, () => currentEmotion = Emotion.NEUTRAL);

/* =========================
   LOOP
========================= */

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCharacter();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
