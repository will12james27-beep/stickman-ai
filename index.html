<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO</title>
<style>
body{
  margin:0;background:#06161b;color:#fff;
  display:flex;justify-content:center;
  font-family:Arial;padding:10px;
}
.box{
  width:500px;background:#0b1f26;
  padding:14px;border-radius:18px;
  box-shadow:0 0 30px #00ffff55;
}
h3{text-align:center;margin:6px}
input,select,button{
  width:100%;padding:8px;margin-top:6px;
  border-radius:8px;border:none;
}
button{background:cyan;cursor:pointer}
canvas{background:#fff;width:100%;border-radius:10px;margin-top:10px}
.row{display:flex;gap:6px}
.row>*{flex:1}
.hidden{display:none}
small{text-align:center;opacity:.7;display:block;margin-top:6px}
.panel{
  background:#072028;
  padding:8px;border-radius:10px;margin-top:8px;
}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO</h3>

<!-- LOGIN -->
<div id="loginBox">
<input id="username" placeholder="Username">
<button onclick="login()">🔐 Login</button>
</div>

<div id="app" class="hidden">

<!-- USER BAR -->
<div class="panel">
👤 <span id="userLabel"></span>
<button onclick="logout()">Logout</button>
</div>

<input id="aiText" placeholder="girl run 2 jump 1 | boy stand 3 | background sky">

<div class="row">
<button onclick="parseAI()">🧠 AI Generate</button>
<button onclick="saveProject()">💾 Save</button>
<button onclick="loadProject()">📂 Load</button>
</div>

<!-- MARKETPLACE -->
<div class="panel">
<b>🛒 Marketplace (Demo)</b>
<div class="row">
<button onclick="buyAsset('pinkGirl')">Pink Girl</button>
<button onclick="buyAsset('greenBoy')">Green Boy</button>
</div>
</div>

<!-- TEAM -->
<div class="panel">
<b>👥 Team Work (Demo)</b>
<input id="shareUser" placeholder="Share with user">
<button onclick="shareProject()">📤 Share Project</button>
</div>

<div class="row">
<select onchange="setBG(this.value)">
<option value="street">Street</option>
<option value="room">Room</option>
<option value="sky">Sky</option>
</select>
<button onclick="togglePlay()">⏯ Pause</button>
</div>

<canvas id="c" width="360" height="560"></canvas>
<small>User → Project → Team → Video</small>

</div>
</div>

<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
ctx.lineCap="round";ctx.lineJoin="round";
const ground=c.height-90;

let user=null,playing=true,background="street",camX=0;

// ===== LOGIN SYSTEM =====
function login(){
  user=username.value.trim();
  if(!user) return alert("Username kiriting");
  localStorage.setItem('user',user);
  startApp();
}
function logout(){
  localStorage.removeItem('user');
  location.reload();
}
function startApp(){
  user=localStorage.getItem('user');
  if(!user) return;
  loginBox.classList.add('hidden');
  app.classList.remove('hidden');
  userLabel.innerText=user;
}
startApp();

// ===== CHARACTER =====
class Stickman{
  constructor(x,type){
    this.baseX=x;this.x=x;this.y=ground;
    this.vy=0;this.type=type;this.color="#000";
    this.timeline=[];this.ti=0;this.tf=0;this.action='stand';
  }
}
const girl=new Stickman(120,'girl');
const boy=new Stickman(220,'boy');
const chars=[girl,boy];

// ===== MARKETPLACE =====
function buyAsset(item){
  if(item==='pinkGirl') girl.color='#e91e63';
  if(item==='greenBoy') boy.color='#4caf50';
  alert("Asset added!");
}

// ===== TEAM SHARE =====
function shareProject(){
  let to=shareUser.value.trim();
  if(!to) return;
  let p=loadRawProject();
  localStorage.setItem('shared_'+to,JSON.stringify(p));
  alert("Shared with "+to);
}

// ===== SAVE / LOAD (CLOUD SIM) =====
function saveProject(){
  localStorage.setItem('project_'+user,JSON.stringify({
    bg:background,girl:girl.timeline,boy:boy.timeline
  }));
  alert("Saved to cloud ☁️");
}
function loadProject(){
  let p=JSON.parse(localStorage.getItem('project_'+user) || localStorage.getItem('shared_'+user));
  if(!p) return alert("No project");
  background=p.bg;girl.timeline=p.girl;boy.timeline=p.boy;
}
function loadRawProject(){
  return {bg:background,girl:girl.timeline,boy:boy.timeline};
}

// ===== BACKGROUND =====
function setBG(v){background=v;}
function drawBG(){
  ctx.fillStyle=background==='sky'?'#bde7ff':
                background==='room'?'#fff4e6':'#eaeaea';
  ctx.fillRect(0,0,c.width,c.height);
}

// ===== DRAW =====
function draw(ch){
  ctx.strokeStyle=ch.color;
  let p=Math.sin(Date.now()*0.01);
  let x=ch.x-camX;
  ctx.beginPath();ctx.arc(x,ch.y-40,12,0,Math.PI*2);ctx.stroke();
  if(ch.type==='girl'){
    ctx.beginPath();
    ctx.moveTo(x+6,ch.y-52);
    ctx.quadraticCurveTo(x+26,ch.y-44,x+18,ch.y-26);
    ctx.stroke();
  }
  ctx.beginPath();ctx.moveTo(x,ch.y-28);ctx.lineTo(x,ch.y+20);ctx.stroke();
  limb(x,ch.y-24,p);limb(x,ch.y-24,p+Math.PI);
  leg(x-6,ch.y+20,p);leg(x+6,ch.y+20,p+Math.PI);
}
function limb(x,y,p){
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(p)*16,y+Math.cos(p)*16);ctx.stroke();
}
function leg(x,y,p){
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(p)*14,y+28);ctx.stroke();
}

// ===== ENGINE =====
function animate(){
  if(playing){
    chars.forEach(ch=>{
      if(ch.timeline.length){
        let cur=ch.timeline[ch.ti];
        ch.action=cur.action;ch.tf++;
        if(ch.tf>cur.frames){ch.tf=0;ch.ti=(ch.ti+1)%ch.timeline.length;}
      }
      if(ch.action==='run') ch.x+=1;
      if(ch.action==='jump'&&ch.y===ground) ch.vy=-11;
      ch.vy+=0.6;ch.y+=ch.vy;
      if(ch.y>ground){ch.y=ground;ch.vy=0;}
    });
  }
  camX+=((girl.x+boy.x)/2-camX-c.width/2)*0.05;
  drawBG();chars.forEach(draw);
  requestAnimationFrame(animate);
}
animate();

// ===== AI =====
function parseAI(){
  chars.forEach(c=>{c.timeline=[];c.ti=0;c.tf=0;});
  aiText.value.toLowerCase().split('|').forEach(b=>{
    let p=b.trim().split(' ');
    if(p[0]==='background') setBG(p[1]);
    else{
      let ch=p[0]==='girl'?girl:boy;
      for(let i=1;i<p.length;i+=2)
        ch.timeline.push({action:p[i],frames:(p[i+1]||1)*60});
    }
  });
}
function togglePlay(){playing=!playing;}
</script>
</body>
</html>
