<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v37.0 (Animation Blending)</title>
<style>
body{
 margin:0;
 background:#0b0f14;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:Arial;
 color:white;
}
#studio{
 display:flex;
 flex-direction:column;
 gap:10px;
 align-items:center;
}
canvas{
 background:#fff;
 border-radius:16px;
}
.panel{
 display:flex;
 gap:8px;
 align-items:center;
}
input[type=range]{
 width:260px;
}
button{
 padding:6px 12px;
 border:none;
 border-radius:6px;
 cursor:pointer;
}
.small{
 font-size:12px;
 opacity:.7;
}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="playing=!playing">Play</button>
    <span>Blend</span>
    <input id="blend" type="range" min="0" max="100" value="0">
  </div>

  <input id="slider" type="range" min="0" max="1000" value="0">

  <div class="small">v37.0 — Idle ↔ Run blending</div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const slider=document.getElementById("slider");
const blendSlider=document.getElementById("blend");

const W=420,H=640,ground=520;

// ===== JOINT =====
class Joint{
 constructor(x,y){this.x=x;this.y=y;}
 clone(){return {x:this.x,y:this.y};}
}

// ===== STICKMAN =====
function createMan(){
 return{
  hip:new Joint(210,ground-85),
  neck:new Joint(210,ground-155),
  head:new Joint(210,ground-195),

  kneeL:new Joint(190,ground-45),
  kneeR:new Joint(230,ground-45),
  footL:new Joint(190,ground),
  footR:new Joint(230,ground),

  elbowL:new Joint(170,ground-135),
  elbowR:new Joint(250,ground-135),
  handL:new Joint(150,ground-115),
  handR:new Joint(270,ground-115),
 };
}

const man=createMan();

// ===== IDLE POSE =====
const idlePose={};
for(let k in man) idlePose[k]=man[k].clone();

// ===== RUN ANIMATION (POSES) =====
const runTimeline={
 duration:1,
 poses:[
  {t:0, pose:null},
  {t:0.5, pose:null},
  {t:1, pose:null}
 ]
};

// generate run poses
function buildRun(){
 const phases=[-1,1,-1];
 runTimeline.poses.forEach((p,i)=>{
  const m=createMan();
  const s=phases[i];

  m.footL.y=ground-Math.max(0,s)*30;
  m.footR.y=ground-Math.max(0,-s)*30;

  m.handL.x-=s*25;
  m.handR.x+=s*25;

  m.hip.y=ground-85-Math.abs(s)*8;
  m.neck.y=m.hip.y-70;
  m.head.y=m.neck.y-40;

  const pose={};
  for(let k in m) pose[k]=m[k].clone();
  p.pose=pose;
 });
}
buildRun();

// ===== INTERPOLATION =====
function lerp(a,b,t){return a+(b-a)*t;}

function interpPose(a,b,t){
 const p={};
 for(let k in a){
  p[k]={
   x:lerp(a[k].x,b[k].x,t),
   y:lerp(a[k].y,b[k].y,t)
  };
 }
 return p;
}

function sampleRun(time){
 let a=runTimeline.poses[0],b=runTimeline.poses.at(-1);
 for(let i=0;i<runTimeline.poses.length-1;i++){
  if(time>=runTimeline.poses[i].t && time<=runTimeline.poses[i+1].t){
   a=runTimeline.poses[i];
   b=runTimeline.poses[i+1];
   break;
  }
 }
 const t=(time-a.t)/(b.t-a.t||1);
 return interpPose(a.pose,b.pose,t);
}

// ===== BLEND =====
function blendPose(a,b,w){
 const p={};
 for(let k in a){
  p[k]={
   x:lerp(a[k].x,b[k].x,w),
   y:lerp(a[k].y,b[k].y,w)
  };
 }
 return p;
}

// ===== IK =====
function stick(a,b,l){
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
 const diff=(d-l)/d*0.5;
 a.x+=dx*diff; a.y+=dy*diff;
 b.x-=dx*diff; b.y-=dy*diff;
}

function solve(){
 for(let i=0;i<6;i++){
  stick(man.neck,man.hip,70);
  stick(man.head,man.neck,40);

  stick(man.hip,man.kneeL,40);
  stick(man.kneeL,man.footL,40);

  stick(man.hip,man.kneeR,40);
  stick(man.kneeR,man.footR,40);

  stick(man.neck,man.elbowL,35);
  stick(man.elbowL,man.handL,35);

  stick(man.neck,man.elbowR,35);
  stick(man.elbowR,man.handR,35);
 }
}

// ===== APPLY =====
function applyPose(p){
 for(let k in p){
  man[k].x=p[k].x;
  man[k].y=p[k].y;
 }
}

// ===== DRAW =====
function line(a,b){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 ctx.strokeStyle="#ccc";
 ctx.beginPath();
 ctx.moveTo(0,ground);
 ctx.lineTo(W,ground);
 ctx.stroke();

 ctx.strokeStyle="#000";
 ctx.beginPath();
 ctx.arc(man.head.x,man.head.y,16,0,Math.PI*2);
 ctx.stroke();

 line(man.head,man.neck);
 line(man.neck,man.hip);

 line(man.hip,man.kneeL);
 line(man.kneeL,man.footL);

 line(man.hip,man.kneeR);
 line(man.kneeR,man.footR);

 line(man.neck,man.elbowL);
 line(man.elbowL,man.handL);

 line(man.neck,man.elbowR);
 line(man.elbowR,man.handR);
}

// ===== LOOP =====
let time=0;
let playing=true;

function loop(){
 if(playing){
  time+=1/60;
  if(time>runTimeline.duration) time=0;
  slider.value=(time/runTimeline.duration)*1000;
 }

 const runPose=sampleRun(time);
 const w=blendSlider.value/100;

 const finalPose=blendPose(idlePose,runPose,w);
 applyPose(finalPose);
 solve();
 draw();

 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
