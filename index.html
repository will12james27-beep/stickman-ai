<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v23.0</title>
<style>
body{
  margin:0;
  background:#02080c;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
}
canvas{
  background:#fff;
  border-radius:12px;
}
.panel{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
button,input{
  padding:6px 10px;
  border-radius:6px;
  border:none;
}
</style>
</head>
<body>

<div class="panel">
  <button onclick="mode='walk'">AI Walk</button>
  <button onclick="mode='idle'">Idle</button>
  <button onclick="mode='wave'">Wave</button>
  <button onclick="record()">● Rec</button>
  <button onclick="play()">▶ Play</button>
  <button onclick="save()">💾 Save</button>
  <button onclick="load()">⤒ Load</button>
  <input id="cmd" placeholder="text → anim" onkeydown="if(event.key==='Enter')command(this.value)">
</div>

<canvas id="c" width="360" height="640"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round"; ctx.lineWidth=4;

const ground=520;
let time=0, mode="idle";

// ===== TIMELINE =====
let recording=false, playing=false;
let timeline=[], playIndex=0;

// ===== JOINT =====
class Joint{
  constructor(x,y){this.x=x;this.y=y;}
  clone(){return {x:this.x,y:this.y}}
}

// ===== STICKMAN =====
function createMan(x){
  return{
    hip:new Joint(x,ground-70),
    neck:new Joint(x,ground-135),
    head:new Joint(x,ground-170),
    kneeL:new Joint(x-15,ground-35),
    kneeR:new Joint(x+15,ground-35),
    footL:new Joint(x-15,ground),
    footR:new Joint(x+15,ground),
    elbowL:new Joint(x-35,ground-120),
    elbowR:new Joint(x+35,ground-120),
    handL:new Joint(x-45,ground-105),
    handR:new Joint(x+45,ground-105)
  };
}
const men=[createMan(180)];

// ===== IK STICK =====
function stick(a,b,l){
  const dx=b.x-a.x,dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||1;
  const diff=(d-l)/d*0.5;
  a.x+=dx*diff; a.y+=dy*diff;
  b.x-=dx*diff; b.y-=dy*diff;
}

// ===== AI =====
function walk(m){
  const s=Math.sin(time*0.12);
  m.hip.x+=0.8;
  m.footL.x=m.hip.x-15+s*20;
  m.footR.x=m.hip.x+15-s*20;
  m.footL.y=ground-Math.max(0,s*15);
  m.footR.y=ground-Math.max(0,-s*15);
  m.handL.x=m.neck.x-40-s*10;
  m.handR.x=m.neck.x+40+s*10;
}
function idle(m){
  m.neck.y+=Math.sin(time*0.05)*0.05;
}
function wave(m){
  m.handR.y=m.neck.y-40-Math.sin(time*0.2)*20;
}

// ===== TEXT AI =====
function command(t){
  if(t.includes("walk"))mode="walk";
  if(t.includes("idle"))mode="idle";
  if(t.includes("wave"))mode="wave";
}

// ===== RECORD =====
function record(){recording=!recording; if(recording)timeline=[];}
function play(){playing=true; playIndex=0;}
function capture(){timeline.push(JSON.parse(JSON.stringify(men)));}
function applyFrame(f){
  f.forEach((fm,i)=>{
    for(let k in fm){men[i][k].x=fm[k].x; men[i][k].y=fm[k].y;}
  });
}

// ===== SAVE / LOAD =====
function save(){localStorage.setItem("stickAnim",JSON.stringify(timeline)); alert("Saved");}
function load(){timeline=JSON.parse(localStorage.getItem("stickAnim")||"[]"); alert("Loaded");}

// ===== DRAW =====
function line(a,b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
function drawMan(m){
  line(m.head,m.neck);
  line(m.neck,m.hip);
  line(m.hip,m.kneeL); line(m.kneeL,m.footL);
  line(m.hip,m.kneeR); line(m.kneeR,m.footR);
  line(m.neck,m.elbowL); line(m.elbowL,m.handL);
  line(m.neck,m.elbowR); line(m.elbowR,m.handR);
  ctx.beginPath(); ctx.arc(m.head.x,m.head.y,14,0,Math.PI*2); ctx.stroke();
}

// ===== LOOP =====
function loop(){
  time++;
  if(playing){
    applyFrame(timeline[playIndex++]);
    if(playIndex>=timeline.length)playing=false;
  }else{
    men.forEach(m=>{
      if(mode==="walk")walk(m);
      if(mode==="idle")idle(m);
      if(mode==="wave")wave(m);
    });
  }

  men.forEach(m=>{
    for(let i=0;i<6;i++){
      stick(m.head,m.neck,35);
      stick(m.neck,m.hip,65);
      stick(m.hip,m.kneeL,35);
      stick(m.kneeL,m.footL,35);
      stick(m.hip,m.kneeR,35);
      stick(m.kneeR,m.footR,35);
      stick(m.neck,m.elbowL,30);
      stick(m.elbowL,m.handL,30);
      stick(m.neck,m.elbowR,30);
      stick(m.elbowR,m.handR,30);
    }
  });

  if(recording)capture();

  ctx.clearRect(0,0,360,640);
  ctx.strokeStyle="#ccc";
  line({x:0,y:ground},{x:360,y:ground});
  ctx.strokeStyle="#000";
  men.forEach(drawMan);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
