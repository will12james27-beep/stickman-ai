<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman v12-A – Mouse Pose</title>
<style>
 html,body{margin:0;background:#111;color:#fff;font-family:sans-serif}
 canvas{display:block;margin:auto;background:#1a1a1a}
 #ui{
  position:fixed;bottom:10px;left:50%;
  transform:translateX(-50%);
  display:flex;gap:6px;align-items:center
 }
 button,label{
  background:#222;color:#fff;
  border:1px solid #444;
  padding:6px 10px;cursor:pointer
 }
</style>
</head>
<body>

<canvas id="c" width="800" height="400"></canvas>

<div id="ui">
 <button onclick="startRecord()">⏺ REC</button>
 <button onclick="stopRecord()">■ STOP</button>
 <button onclick="startPlay()">▶ PLAY</button>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

const MODE={LIVE:0,RECORD:1,PLAY:2};
let mode=MODE.LIVE;

const groundY=300;

let stick={
 x:400,
 y:groundY-90,
 legL:0,
 legR:0,
 armL:0,
 armR:0
};

let timeline=[];
let playI=0;

// -------- DRAW --------
function line(x1,y1,x2,y2){
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}

function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 // ground
 ctx.strokeStyle="#444";
 line(0,groundY,c.width,groundY);

 ctx.strokeStyle="#fff";
 ctx.lineWidth=3;

 // head
 ctx.beginPath();
 ctx.arc(stick.x,stick.y-35,12,0,Math.PI*2);
 ctx.stroke();

 // body
 line(stick.x,stick.y-20,stick.x,stick.y+30);

 // legs
 drawLimb(stick.legL,25,stick.y+30,true);
 drawLimb(stick.legR,25,stick.y+30,false);

 // arms
 drawLimb(stick.armL,15,stick.y,true,true);
 drawLimb(stick.armR,15,stick.y,false,true);
}

function drawLimb(angle,offsetY,yBase,left,isArm=false){
 const dir=left?-1:1;
 const len=isArm?35:45;
 const x1=stick.x;
 const y1=yBase;
 const x2=x1+Math.sin(angle)*len*dir;
 const y2=y1+Math.cos(angle)*len;
 line(x1,y1,x2,y2);

 // joint handle
 ctx.fillStyle="#f55";
 ctx.beginPath();
 ctx.arc(x2,y2,5,0,Math.PI*2);
 ctx.fill();
}

// -------- ANIMATION --------
let t=0;
function update(){
 if(mode===MODE.LIVE){
  t+=0.05;
  stick.legL=Math.sin(t);
  stick.legR=-Math.sin(t);
  stick.armL=-Math.sin(t);
  stick.armR=Math.sin(t);
 }

 if(mode===MODE.RECORD){
  timeline.push(JSON.parse(JSON.stringify(stick)));
 }

 if(mode===MODE.PLAY){
  stick=JSON.parse(JSON.stringify(timeline[playI]));
  playI++;
  if(playI>=timeline.length) mode=MODE.LIVE;
 }

 draw();
 requestAnimationFrame(update);
}

// -------- RECORD / PLAY --------
function startRecord(){
 timeline=[];
 mode=MODE.RECORD;
}
function stopRecord(){
 mode=MODE.LIVE;
}
function startPlay(){
 playI=0;
 mode=MODE.PLAY;
}

// -------- MOUSE POSE --------
let drag=null;

c.addEventListener("mousedown",e=>{
 const r=c.getBoundingClientRect();
 const mx=e.clientX-r.left;
 const my=e.clientY-r.top;

 const joints=getJoints();
 for(const j of joints){
  const dx=mx-j.x, dy=my-j.y;
  if(Math.hypot(dx,dy)<8){
   drag=j;
   mode=MODE.LIVE;
   break;
  }
 }
});

c.addEventListener("mousemove",e=>{
 if(!drag) return;
 const r=c.getBoundingClientRect();
 const mx=e.clientX-r.left;
 const my=e.clientY-r.top;

 const dx=mx-stick.x;
 const dy=my-drag.yBase;

 drag.set(Math.atan2(dx,dy));
});

c.addEventListener("mouseup",()=>drag=null);
c.addEventListener("mouseleave",()=>drag=null);

function getJoints(){
 return [
  joint("legL",stick.y+30),
  joint("legR",stick.y+30),
  joint("armL",stick.y),
  joint("armR",stick.y)
 ];
}

function joint(name,yBase){
 return{
  x:stick.x+Math.sin(stick[name])*(name.includes("arm")?35:45),
  y:yBase+Math.cos(stick[name])*(name.includes("arm")?35:45),
  yBase,
  set:v=>stick[name]=v
 };
}

update();
</script>
</body>
</html>
