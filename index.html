<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.3</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
canvas {
  display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// =========================
// CANVAS SETUP
// =========================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// =========================
// SCENE
// =========================
const scene = {
  width: 5000,
  height: 2000,
  groundY: 900
};

// =========================
// STICKMAN
// =========================
const stickman = {
  x: 600,
  y: scene.groundY - 120,
  vx: 1.5,
  head: 18,
  body: 50,
  arm: 40,
  leg: 45
};

// =========================
// CAMERA (FOLLOW + ZOOM)
// =========================
const camera = {
  x: 0,
  y: 0,
  zoom: 1,
  targetZoom: 1,
  smooth: 0.08,
  zoomSmooth: 0.06
};

// =========================
// CAMERA UPDATE
// =========================
function updateCamera() {
  // FOLLOW
  const targetX = stickman.x - canvas.width / (2 * camera.zoom);
  const targetY = stickman.y - canvas.height / (2 * camera.zoom);

  camera.x += (targetX - camera.x) * camera.smooth;
  camera.y += (targetY - camera.y) * camera.smooth;

  // ZOOM SMOOTH
  camera.zoom += (camera.targetZoom - camera.zoom) * camera.zoomSmooth;
}

function camX(x) {
  return (x - camera.x) * camera.zoom;
}
function camY(y) {
  return (y - camera.y) * camera.zoom;
}

// =========================
// ZOOM LOGIC (PUNCH)
// =========================
let zoomTimer = 0;

function updateZoom() {
  zoomTimer++;

  // har 240 frame’da punch-in
  if (zoomTimer % 240 === 0) {
    camera.targetZoom = 1.4;
  }

  // 30 frame keyin qaytadi
  if (zoomTimer % 240 === 30) {
    camera.targetZoom = 1;
  }
}

// =========================
// DRAW FUNCTIONS
// =========================
function drawBackground() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawGround() {
  ctx.strokeStyle = "#999";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(camX(0), camY(scene.groundY));
  ctx.lineTo(camX(scene.width), camY(scene.groundY));
  ctx.stroke();
}

function drawStickman(p) {
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";

  const hx = p.x;
  const hy = p.y;

  // Head
  ctx.beginPath();
  ctx.arc(camX(hx), camY(hy), p.head * camera.zoom, 0, Math.PI * 2);
  ctx.stroke();

  // Body
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy + p.head));
  ctx.lineTo(camX(hx), camY(hy + p.head + p.body));
  ctx.stroke();

  const by = hy + p.head + p.body;

  // Arms
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy + 25));
  ctx.lineTo(camX(hx - p.arm), camY(hy + 40));
  ctx.moveTo(camX(hx), camY(hy + 25));
  ctx.lineTo(camX(hx + p.arm), camY(hy + 40));
  ctx.stroke();

  // Legs
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx - p.leg), camY(by + p.leg));
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx + p.leg), camY(by + p.leg));
  ctx.stroke();
}

// =========================
// UPDATE LOGIC
// =========================
function update() {
  stickman.x += stickman.vx;

  if (stickman.x > scene.width - 300 || stickman.x < 300) {
    stickman.vx *= -1;
  }

  updateZoom();
}

// =========================
// MAIN LOOP
// =========================
function loop() {
  update();
  updateCamera();
  drawBackground();
  drawGround();
  drawStickman(stickman);
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
