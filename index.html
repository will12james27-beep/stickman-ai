<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v20.0</title>
<style>
body{
  margin:0;
  background:#02080c;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:840px;
  background:#0b1f26;
  padding:14px;
  border-radius:18px;
  box-shadow:0 0 50px #00ffff55;
}
h3{text-align:center}
.panel{
  background:#072028;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row>*{flex:1}
button,input{
  padding:8px;
  border:none;
  border-radius:8px;
}
button{
  background:cyan;
  font-weight:bold;
  cursor:pointer;
}
input{width:100%}
canvas{
  display:block;
  margin:10px auto;
  background:#fff;
  width:360px;height:640px;
  border-radius:12px;
}
small{text-align:center;display:block;opacity:.6}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v20.0</h3>

<div class="panel">
<b>🎮 Controls</b>
<div class="row">
<button onclick="toggleRagdoll()">💥 Ragdoll</button>
<button onclick="aiCommand('walk')">🚶 Walk</button>
<button onclick="aiCommand('stop')">⏹ Stop</button>
<button onclick="aiCommand('jump')">⬆ Jump</button>
<button onclick="aiCommand('sit')">⬇ Sit</button>
<button onclick="toggleRecord()">⏺ Record</button>
<button onclick="playTimeline()">▶ Play</button>
<button onclick="toggleDebug()">🦴 Debug</button>
</div>
</div>

<div class="panel">
<b>🤖 AI Command</b>
<input id="cmd" placeholder="walk, stop, jump, sit"
 onkeydown="if(event.key==='Enter') aiCommand(this.value)">
</div>

<canvas id="c"></canvas>
<small>v20.0 • Walk Engine • Balance AI • Timeline Core • AI Commands</small>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
c.width=360; c.height=640;
ctx.lineCap="round"; ctx.lineWidth=4;

const ground=520;
const GRAVITY=0.9;

let ragdoll=false, debug=false, walking=false;
let time=0;

// ===== TIMELINE =====
let recording=false;
let timeline=[];
let playing=false;
let playIndex=0;

// ===== JOINT =====
class Joint{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=0; this.vy=0;
  }
}

// ===== MAN =====
class Man{
  constructor(x){
    this.hip=new Joint(x,ground-70);
    this.neck=new Joint(x,ground-135);
    this.head=new Joint(x,ground-170);
    this.legL=new Joint(x-14,ground);
    this.legR=new Joint(x+14,ground);
    this.armL=new Joint(x-36,ground-135);
    this.armR=new Joint(x+36,ground-135);
  }
}
const man=new Man(180);

// ===== CONSTRAINT =====
function stick(a,b,len){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||0.001;
  const diff=(d-len)/d;
  const ox=dx*0.5*diff, oy=dy*0.5*diff;
  a.x+=ox; a.y+=oy;
  b.x-=ox; b.y-=oy;
}

// ===== PHYSICS =====
function physics(j){
  j.vy+=GRAVITY;
  j.x+=j.vx;
  j.y+=j.vy;
  if(j.y>ground){ j.y=ground; j.vy=0; }
}

// ===== BALANCE AI =====
function balanceAI(){
  man.hip.y += ((ground-70)-man.hip.y)*0.25;
  man.neck.x += (man.hip.x-man.neck.x)*0.2;
}

// ===== WALK ENGINE =====
function walkEngine(){
  time++;
  const step=Math.sin(time*0.12);

  man.hip.x += 1.2;

  man.legL.x = man.hip.x - 14 + step*20;
  man.legR.x = man.hip.x + 14 - step*20;

  man.legL.y = ground - Math.max(0, step*12);
  man.legR.y = ground - Math.max(0,-step*12);
}

// ===== AI COMMANDS =====
function aiCommand(cmd){
  cmd=cmd.trim();
  if(cmd==="walk") walking=true;
  if(cmd==="stop") walking=false;
  if(cmd==="jump") man.hip.vy=-15;
  if(cmd==="sit") man.hip.y=ground-40;
  document.getElementById("cmd").value="";
}

// ===== TIMELINE =====
function toggleRecord(){
  recording=!recording;
  if(recording){ timeline=[]; }
}
function playTimeline(){
  if(timeline.length===0) return;
  playing=true;
  playIndex=0;
}

// ===== DRAW =====
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(360,ground);
  ctx.stroke();

  ctx.strokeStyle="#000";
  line(man.head,man.neck);
  line(man.neck,man.hip);
  line(man.hip,man.legL);
  line(man.hip,man.legR);
  line(man.neck,man.armL);
  line(man.neck,man.armR);

  ctx.beginPath();
  ctx.arc(man.head.x,man.head.y,14,0,6.28);
  ctx.stroke();

  if(debug){
    ctx.fillStyle="red";
    Object.values(man).forEach(j=>{
      if(j instanceof Joint){
        ctx.beginPath();
        ctx.arc(j.x,j.y,2,0,6.28);
        ctx.fill();
      }
    });
  }
}

// ===== LOOP =====
function loop(){
  if(playing){
    const f=timeline[playIndex++];
    if(!f){ playing=false; }
    else Object.keys(f).forEach(k=>{
      man[k].x=f[k].x;
      man[k].y=f[k].y;
    });
  }
  else if(ragdoll){
    Object.values(man).forEach(j=>j instanceof Joint && physics(j));
  }else{
    balanceAI();
    if(walking) walkEngine();
  }

  for(let i=0;i<10;i++){
    stick(man.head,man.neck,35);
    stick(man.neck,man.hip,65);
    stick(man.hip,man.legL,65);
    stick(man.hip,man.legR,65);
    stick(man.neck,man.armL,45);
    stick(man.neck,man.armR,45);
  }

  if(recording){
    timeline.push(JSON.parse(JSON.stringify(man)));
  }

  draw();
  requestAnimationFrame(loop);
}
loop();

// ===== UI =====
function toggleRagdoll(){ragdoll=!ragdoll;}
function toggleDebug(){debug=!debug;}
</script>
</body>
</html>
