<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.13</title>
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
canvas{display:block;}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// =========================
// CANVAS
// =========================
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// =========================
// SCENE
// =========================
const scene={width:6000,height:2000,groundY:900};

// =========================
// CHARACTERS
// =========================
function createChar(x,name){
  return{
    name,x,
    y:scene.groundY-120,
    head:18,body:50,arm:40,leg:45,
    speaking:false,emoji:null
  };
}

const chars=[
  createChar(800,"A"),
  createChar(1200,"B"),
  createChar(1600,"C")
];
let focusChar=chars[0];

// =========================
// CAMERA
// =========================
const camera={
  x:0,y:0,
  zoom:1,targetZoom:1,
  follow:0.12,zoomSmooth:0.18,
  shake:0,shakeX:0,shakeY:0
};

function camX(x){return(x-camera.x)*camera.zoom+camera.shakeX;}
function camY(y){return(y-camera.y)*camera.zoom+camera.shakeY;}

function updateCamera(){
  const tx=focusChar.x-canvas.width/(2*camera.zoom);
  const ty=focusChar.y-canvas.height/(2*camera.zoom);
  camera.x+=(tx-camera.x)*camera.follow;
  camera.y+=(ty-camera.y)*camera.follow;
  camera.zoom+=(camera.targetZoom-camera.zoom)*camera.zoomSmooth;

  if(camera.shake>0){
    camera.shakeX=(Math.random()-0.5)*camera.shake;
    camera.shakeY=(Math.random()-0.5)*camera.shake;
    camera.shake*=0.85;
  }else{
    camera.shakeX=0;camera.shakeY=0;
  }
}

// =========================
// EMOJI
// =========================
function emoji(c,s){
  c.emoji={s,life:35,scale:0.2,y:0};
}

function updateEmoji(c){
  if(!c.emoji)return;
  c.emoji.life--;
  c.emoji.scale+=0.08;
  c.emoji.y+=1.5;
  if(c.emoji.life<=0)c.emoji=null;
}

// =========================
// KARAOKE SUBTITLE
// =========================
const subtitle={
  words:[],
  index:0,
  timer:0,
  visible:false
};

function startSubtitle(text,wordFrames=10){
  subtitle.words=text.split(" ");
  subtitle.index=0;
  subtitle.timer=wordFrames;
  subtitle.visible=true;
}

function updateSubtitle(){
  if(!subtitle.visible)return;
  subtitle.timer--;
  if(subtitle.timer<=0){
    subtitle.index++;
    subtitle.timer=10;
    if(subtitle.index>=subtitle.words.length){
      subtitle.visible=false;
    }
  }
}

function drawSubtitle(){
  if(!subtitle.visible)return;

  ctx.fillStyle="#000";
  ctx.fillRect(0,canvas.height-140,canvas.width,140);

  let x=canvas.width/2;
  let y=canvas.height-60;

  ctx.textAlign="center";
  ctx.font="bold 36px Arial";

  let full="";
  subtitle.words.forEach((w,i)=>{
    full+= (i<=subtitle.index ? w+" " : "");
  });

  // already spoken
  ctx.fillStyle="#bbb";
  ctx.fillText(full,x,y);

  // active word
  if(subtitle.index<subtitle.words.length){
    ctx.fillStyle="#ffeb3b";
    ctx.fillText(subtitle.words[subtitle.index],x,y);
  }
}

// =========================
// DIALOG
// =========================
const dialog=[
 {c:0,t:"WHY DID YOU DO THAT",e:"😡"},
 {c:1,t:"WAIT WHAT IS HAPPENING",e:"😱"},
 {c:1,t:"THIS IS ACTUALLY CRAZY",e:"😂"},
 {c:2,t:"RELAX I HAVE A PLAN",e:"😎"},
 {c:0,t:"MY BRAIN IS MELTING",e:"🤯"}
];

let step=0;
let delay=0;

function nextDialog(){
  chars.forEach(c=>c.speaking=false);
  const d=dialog[step];
  const c=chars[d.c];
  c.speaking=true;
  focusChar=c;
  camera.targetZoom=1.8;
  camera.shake=6;
  emoji(c,d.e);
  startSubtitle(d.t);
  delay=d.t.split(" ").length*10+20;
}

nextDialog();

function updateDialog(){
  if(delay>0)delay--;
  else{
    step=(step+1)%dialog.length;
    nextDialog();
  }
}

// =========================
// DRAW
// =========================
function drawBG(){
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}
function drawGround(){
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(camX(0),camY(scene.groundY));
  ctx.lineTo(camX(scene.width),camY(scene.groundY));
  ctx.stroke();
}
function drawChar(p){
  ctx.strokeStyle=p.speaking?"#e91e63":"#000";
  ctx.lineWidth=4;
  const hx=p.x,hy=p.y;
  ctx.beginPath();
  ctx.arc(camX(hx),camY(hy),p.head*camera.zoom,0,Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(camX(hx),camY(hy+p.head));
  ctx.lineTo(camX(hx),camY(hy+p.head+p.body));
  ctx.stroke();
  const by=hy+p.head+p.body;
  ctx.beginPath();
  ctx.moveTo(camX(hx),camY(by));
  ctx.lineTo(camX(hx-p.leg),camY(by+p.leg));
  ctx.moveTo(camX(hx),camY(by));
  ctx.lineTo(camX(hx+p.leg),camY(by+p.leg));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(camX(hx),camY(hy+25));
  ctx.lineTo(camX(hx-p.arm),camY(hy+40));
  ctx.moveTo(camX(hx),camY(hy+25));
  ctx.lineTo(camX(hx+p.arm),camY(hy+40));
  ctx.stroke();

  if(p.emoji){
    ctx.font=`${40*p.emoji.scale}px serif`;
    ctx.textAlign="center";
    ctx.fillText(p.emoji.s,camX(hx),camY(hy-40-p.emoji.y));
    updateEmoji(p);
  }
}

// =========================
// LOOP
// =========================
function loop(){
  updateDialog();
  updateCamera();
  updateSubtitle();

  drawBG();
  drawGround();
  chars.forEach(drawChar);
  drawSubtitle();

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
