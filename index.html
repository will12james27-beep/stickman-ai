<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman Studio v36.1</title>
<style>
body{
 margin:0;
 background:#0b0f14;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:Arial;
 color:white;
}
#studio{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:10px;
}
canvas{
 background:#fff;
 border-radius:16px;
}
button{
 padding:6px 12px;
 border:none;
 border-radius:6px;
 cursor:pointer;
}
.small{font-size:12px;opacity:.7}
</style>
</head>
<body>

<div id="studio">
 <div>
  <button onclick="exportMP4()">Export MP4</button>
 </div>
 <div class="small">v36.1 — MP4 export (safe)</div>
 <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const W=420,H=640,ground=520;

class Joint{
 constructor(x,y){this.x=x;this.y=y;}
 clone(){return new Joint(this.x,this.y);}
}

function stick(a,b,l){
 const dx=b.x-a.x,dy=b.y-a.y;
 const d=Math.hypot(dx,dy)||1;
 const diff=(d-l)/d*0.5;
 a.x+=dx*diff; a.y+=dy*diff;
 b.x-=dx*diff; b.y-=dy*diff;
}

function createMan(x){
 return{
  hip:new Joint(x,ground-85),
  neck:new Joint(x,ground-155),
  head:new Joint(x,ground-195),

  kneeL:new Joint(x-18,ground-45),
  kneeR:new Joint(x+18,ground-45),
  footL:new Joint(x-18,ground),
  footR:new Joint(x+18,ground),

  elbowL:new Joint(x-40,ground-135),
  elbowR:new Joint(x+40,ground-135),
  handL:new Joint(x-60,ground-115),
  handR:new Joint(x+60,ground-115),

  phase:Math.random()
 };
}

const men=[];
for(let i=0;i<3;i++) men.push(createMan(140+i*70));

function solve(m){
 for(let i=0;i<6;i++){
  stick(m.neck,m.hip,70);
  stick(m.head,m.neck,40);
  stick(m.hip,m.kneeL,40);
  stick(m.kneeL,m.footL,40);
  stick(m.hip,m.kneeR,40);
  stick(m.kneeR,m.footR,40);
  stick(m.neck,m.elbowL,35);
  stick(m.elbowL,m.handL,35);
  stick(m.neck,m.elbowR,35);
  stick(m.elbowR,m.handR,35);
 }
}

function line(a,b){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
}

function drawMan(m){
 ctx.beginPath();
 ctx.arc(m.head.x,m.head.y,14,0,Math.PI*2);
 ctx.stroke();

 line(m.head,m.neck);
 line(m.neck,m.hip);
 line(m.hip,m.kneeL);
 line(m.kneeL,m.footL);
 line(m.hip,m.kneeR);
 line(m.kneeR,m.footR);
 line(m.neck,m.elbowL);
 line(m.elbowL,m.handL);
 line(m.neck,m.elbowR);
 line(m.elbowR,m.handR);
}

function step(){
 men.forEach(m=>{
  m.phase+=0.08;
  const s=Math.sin(m.phase);

  m.footL.y=ground-Math.max(0,s)*28;
  m.footR.y=ground-Math.max(0,-s)*28;

  m.hip.y=ground-85-Math.abs(s)*8;
  m.neck.y=m.hip.y-70;
  m.head.y=m.neck.y-40;

  m.handL.x=m.neck.x-s*22;
  m.handR.x=m.neck.x+s*22;

  solve(m);
 });
}

function draw(){
 ctx.clearRect(0,0,W,H);

 ctx.strokeStyle="#ccc";
 ctx.beginPath();
 ctx.moveTo(0,ground);
 ctx.lineTo(W,ground);
 ctx.stroke();

 ctx.strokeStyle="#000";
 men.forEach(drawMan);
}

function loop(){
 step();
 draw();
 requestAnimationFrame(loop);
}
loop();

// ===== MP4 EXPORT =====
async function exportMP4(){
 alert("MP4 tayyorlanmoqda, kuting...");

 const { createFFmpeg, fetchFile } =
  await import("https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js");

 const ffmpeg=createFFmpeg({log:true});
 await ffmpeg.load();

 const frames=96, fps=24;

 for(let i=0;i<frames;i++){
  step();
  draw();
  const png=c.toDataURL("image/png");
  ffmpeg.FS("writeFile",`f${i}.png`,await fetchFile(png));
 }

 await ffmpeg.run(
  "-framerate",String(fps),
  "-i","f%d.png",
  "-pix_fmt","yuv420p",
  "out.mp4"
 );

 const video=ffmpeg.FS("readFile","out.mp4");
 const url=URL.createObjectURL(
  new Blob([video.buffer],{type:"video/mp4"})
 );

 const a=document.createElement("a");
 a.href=url;
 a.download="stickman.mp4";
 a.click();
}
</script>

</body>
</html>
