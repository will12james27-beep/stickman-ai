<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>21 C.28 Subtitle + Bubble Priority</title>
<style>
  body{margin:0;background:#111;}
  canvas{display:block;margin:auto;background:#fff;}
</style>
</head>
<body>

<canvas id="c" width="720" height="480"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* =========================
   EMOTIONS
========================= */

const Emotion={
  NEUTRAL:"neutral",
  CONFUSED:"confused",
  SHOCKED:"shocked",
  ANGRY:"angry"
};

const faceMap={
  neutral:{eye:1,brow:0,mouth:0},
  confused:{eye:0.85,brow:14,mouth:3},
  shocked:{eye:1.4,brow:0,mouth:10},
  angry:{eye:0.6,brow:-20,mouth:-4}
};

const bubbleStyle={
  neutral:{bg:"#fff",border:"#000",shake:0},
  confused:{bg:"#e3f2fd",border:"#2196f3",shake:0.6},
  shocked:{bg:"#fff9c4",border:"#fbc02d",shake:1.2},
  angry:{bg:"#ffebee",border:"#e53935",shake:1.5}
};

/* =========================
   CHARACTER
========================= */

function createChar(x){
  return{
    x,y:260,
    face:{eye:1,brow:0,mouth:0},
    target:{eye:1,brow:0,mouth:0},
    emotion:Emotion.NEUTRAL,
    bubble:null
  };
}

const chars=[
  createChar(180),
  createChar(360),
  createChar(540)
];

let focusChar=chars[1];

/* =========================
   CAMERA
========================= */

const camera={
  x:0,zoom:1,targetZoom:1,
  shake:0,targetShake:0
};

/* =========================
   SUBTITLE SYSTEM (NEW)
========================= */

const subtitle={
  text:"",
  life:0
};

function showSubtitle(text,duration=120){
  subtitle.text=text;
  subtitle.life=duration;
}

function drawSubtitle(){
  if(subtitle.life<=0) return;
  subtitle.life--;

  ctx.fillStyle="rgba(0,0,0,0.7)";
  ctx.fillRect(0,canvas.height-90,canvas.width,90);

  ctx.fillStyle="#fff";
  ctx.font="bold 24px Arial";
  ctx.textAlign="center";
  ctx.fillText(subtitle.text,canvas.width/2,canvas.height-40);
}

/* =========================
   HELPERS
========================= */

function lerp(a,b,t){return a+(b-a)*t;}

function setEmotion(c,e){
  c.emotion=e;
  c.target={...faceMap[e]};
}

function speak(c,text,duration=120){
  c.bubble={text,life:duration};
}

/* =========================
   DRAW FACE
========================= */

function drawEye(x,y,o){
  ctx.beginPath();
  ctx.ellipse(x,y,3,5*o,0,0,Math.PI*2);
  ctx.stroke();
}
function drawBrow(x,y,t){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(t*Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(-6,0);
  ctx.lineTo(6,0);
  ctx.stroke();
  ctx.restore();
}
function drawMouth(x,y,o){
  ctx.beginPath();
  if(o<2){
    ctx.moveTo(x-6,y);
    ctx.lineTo(x+6,y+o);
  }else{
    ctx.arc(x,y,4+o/2,0,Math.PI*2);
  }
  ctx.stroke();
}
function drawFace(x,y,f){
  drawEye(x-10,y,f.eye);
  drawEye(x+10,y,f.eye);
  drawBrow(x-10,y-10,f.brow);
  drawBrow(x+10,y-10,f.brow);
  drawMouth(x,y+12,f.mouth);
}

/* =========================
   DRAW BUBBLE
========================= */

function drawBubble(c){
  if(!c.bubble) return;

  const style=bubbleStyle[c.emotion];
  const pad=10;
  ctx.font="16px Arial";
  const w=ctx.measureText(c.bubble.text).width+pad*2;
  const h=32;

  const ox=(Math.random()-0.5)*style.shake;
  const oy=(Math.random()-0.5)*style.shake;

  const x=c.x-w/2+ox;
  const y=c.y-110+oy;

  ctx.fillStyle=style.bg;
  ctx.strokeStyle=style.border;
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.roundRect(x,y,w,h,10);
  ctx.fill(); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(c.x-5,y+h);
  ctx.lineTo(c.x,y+h+8);
  ctx.lineTo(c.x+5,y+h);
  ctx.stroke();

  ctx.fillStyle="#000";
  ctx.textAlign="center";
  ctx.fillText(c.bubble.text,c.x,y+22);

  c.bubble.life--;
  if(c.bubble.life<=0) c.bubble=null;
}

/* =========================
   DRAW CHARACTER
========================= */

function drawChar(c){
  ctx.strokeStyle="#000";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.arc(c.x,c.y-40,30,0,Math.PI*2);
  ctx.stroke();

  drawFace(c.x,c.y-40,c.face);

  ctx.beginPath();
  ctx.moveTo(c.x,c.y-10);
  ctx.lineTo(c.x,c.y+80);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(c.x,c.y+20);
  ctx.lineTo(c.x-40,c.y+50);
  ctx.moveTo(c.x,c.y+20);
  ctx.lineTo(c.x+40,c.y+50);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(c.x,c.y+80);
  ctx.lineTo(c.x-25,c.y+140);
  ctx.moveTo(c.x,c.y+80);
  ctx.lineTo(c.x+25,c.y+140);
  ctx.stroke();

  drawBubble(c);
}

/* =========================
   TIMELINE
========================= */

setTimeout(()=>{
  showSubtitle("Something feels wrong...");
},500);

setTimeout(()=>{
  setEmotion(chars[0],Emotion.CONFUSED);
  speak(chars[0],"Huh?");
},1400);

setTimeout(()=>{
  setEmotion(chars[1],Emotion.SHOCKED);
  speak(chars[1],"WHAT IS THAT?!");
  camera.targetZoom=1.25;
  camera.targetShake=1.2;
},2600);

setTimeout(()=>{
  setEmotion(chars[2],Emotion.ANGRY);
  speak(chars[2],"STOP!!!");
},3800);

setTimeout(()=>{
  chars.forEach(c=>setEmotion(c,Emotion.NEUTRAL));
  camera.targetZoom=1;
  camera.targetShake=0;
  showSubtitle("Everyone freezes...");
},5200);

/* =========================
   LOOP
========================= */

function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  camera.zoom=lerp(camera.zoom,camera.targetZoom,0.06);
  camera.shake=lerp(camera.shake,camera.targetShake,0.1);
  camera.x=lerp(camera.x,focusChar.x-canvas.width/2,0.08);

  chars.forEach(c=>{
    c.face.eye=lerp(c.face.eye,c.target.eye,0.08);
    c.face.brow=lerp(c.face.brow,c.target.brow,0.08);
    c.face.mouth=lerp(c.face.mouth,c.target.mouth,0.08);
  });

  ctx.save();
  const sx=(Math.random()-0.5)*camera.shake*10;
  const sy=(Math.random()-0.5)*camera.shake*10;
  ctx.translate(-camera.x+sx,sy);
  ctx.scale(camera.zoom,camera.zoom);

  chars.forEach(drawChar);
  ctx.restore();

  // PRIORITY RULE:
  // subtitle faqat HECH QAYSIDA bubble bo‘lmasa
  const anyBubble = chars.some(c=>c.bubble);
  if(!anyBubble) drawSubtitle();

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
