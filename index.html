<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stickman Scene System 21A</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      background: #000;
    }
  </style>
</head>
<body>

<canvas id="scene"></canvas>

<script>
/* =========================
   CANVAS SETUP
========================= */
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

canvas.width = 1080;
canvas.height = 1920;

/* =========================
   SCENE SYSTEM (21 A)
========================= */
function createScene(config){
  return {
    id: config.id,
    width: config.width,
    height: config.height,
    groundY: config.groundY,
    background: config.background,
    objects: [],
    characters: [],
    camera: {
      x: 0,
      y: 0,
      zoom: 1
    }
  };
}

/* =========================
   DRAW SCENE
========================= */
function drawScene(scene){
  ctx.save();

  // Background
  ctx.fillStyle = scene.background;
  ctx.fillRect(0, 0, scene.width, scene.height);

  // Ground line
  ctx.strokeStyle = "#888";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, scene.groundY);
  ctx.lineTo(scene.width, scene.groundY);
  ctx.stroke();

  ctx.restore();
}

/* =========================
   MAIN SCENE
========================= */
const mainScene = createScene({
  id: "street_scene",
  width: 1080,
  height: 1920,
  groundY: 1450,
  background: "#e6f4ff"
});

/* =========================
   LOOP
========================= */
function loop(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawScene(mainScene);
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
