<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v36.3 (Pose Snapshot)</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  color:white;
}
#studio{
 display:flex;
 flex-direction:column;
 gap:10px;
 align-items:center;
}
canvas{
 background:#fff;
 border-radius:16px;
 cursor:pointer;
}
.panel{
 display:flex;
 gap:6px;
 align-items:center;
}
input[type=range]{
 width:300px;
}
button{
 padding:6px 12px;
 border:none;
 border-radius:6px;
 cursor:pointer;
}
.small{
 font-size:12px;
 opacity:.7;
}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="togglePlay()">Play / Pause</button>
    <button onclick="resetTime()">Reset</button>
    <button onclick="clearKeys()">Clear Poses</button>
  </div>

  <input id="slider" type="range" min="0" max="1000" value="0">

  <div class="small">v36.3 — Pose Snapshot (click canvas)</div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const slider=document.getElementById("slider");

const W=420,H=640,ground=520;

// ===== JOINT =====
class Joint{
 constructor(x,y){
  this.x=x;
  this.y=y;
 }
 clone(){
  return {x:this.x,y:this.y};
 }
}

// ===== STICKMAN =====
const man={
 hip:new Joint(210,ground-85),
 neck:new Joint(210,ground-155),
 head:new Joint(210,ground-195),

 kneeL:new Joint(190,ground-45),
 kneeR:new Joint(230,ground-45),
 footL:new Joint(190,ground),
 footR:new Joint(230,ground),

 elbowL:new Joint(170,ground-135),
 elbowR:new Joint(250,ground-135),
 handL:new Joint(150,ground-115),
 handR:new Joint(270,ground-115),
};

// ===== TIMELINE =====
const timeline={
 fps:24,
 duration:2,
 time:0,
 poses:[]
};

let playing=false;

// ===== INTERPOLATION =====
function lerp(a,b,t){return a+(b-a)*t;}

function interpPose(a,b,t){
 const p={};
 for(let k in a){
  p[k]={
   x:lerp(a[k].x,b[k].x,t),
   y:lerp(a[k].y,b[k].y,t)
  };
 }
 return p;
}

function samplePose(time){
 if(timeline.poses.length===0) return null;
 if(timeline.poses.length===1) return timeline.poses[0].pose;

 let a=timeline.poses[0],b=timeline.poses[timeline.poses.length-1];
 for(let i=0;i<timeline.poses.length-1;i++){
  if(time>=timeline.poses[i].t && time<=timeline.poses[i+1].t){
   a=timeline.poses[i]; b=timeline.poses[i+1]; break;
  }
 }
 const t=(time-a.t)/(b.t-a.t||1);
 return interpPose(a.pose,b.pose,t);
}

// ===== IK =====
function stick(a,b,l){
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
 const diff=(d-l)/d*0.5;
 a.x+=dx*diff; a.y+=dy*diff;
 b.x-=dx*diff; b.y-=dy*diff;
}

// ===== APPLY POSE =====
function applyPose(p){
 if(!p) return;
 for(let k in p){
  man[k].x=p[k].x;
  man[k].y=p[k].y;
 }
}

// ===== SOLVE =====
function solve(){
 for(let i=0;i<6;i++){
  stick(man.neck,man.hip,70);
  stick(man.head,man.neck,40);

  stick(man.hip,man.kneeL,40);
  stick(man.kneeL,man.footL,40);

  stick(man.hip,man.kneeR,40);
  stick(man.kneeR,man.footR,40);

  stick(man.neck,man.elbowL,35);
  stick(man.elbowL,man.handL,35);

  stick(man.neck,man.elbowR,35);
  stick(man.elbowR,man.handR,35);
 }
}

// ===== POSE SNAPSHOT =====
function addPose(){
 const pose={};
 for(let k in man){
  pose[k]=man[k].clone();
 }
 timeline.poses.push({t:timeline.time,pose});
 timeline.poses.sort((a,b)=>a.t-b.t);
}

function clearKeys(){
 timeline.poses=[];
}

// ===== UI =====
function togglePlay(){playing=!playing;}
function resetTime(){timeline.time=0;slider.value=0;}

slider.oninput=()=>{
 playing=false;
 timeline.time=(slider.value/1000)*timeline.duration;
};

// ===== DRAW =====
function line(a,b){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 ctx.strokeStyle="#ccc";
 ctx.beginPath();
 ctx.moveTo(0,ground);
 ctx.lineTo(W,ground);
 ctx.stroke();

 ctx.strokeStyle="#000";
 ctx.beginPath();
 ctx.arc(man.head.x,man.head.y,16,0,Math.PI*2);
 ctx.stroke();

 line(man.head,man.neck);
 line(man.neck,man.hip);

 line(man.hip,man.kneeL);
 line(man.kneeL,man.footL);

 line(man.hip,man.kneeR);
 line(man.kneeR,man.footR);

 line(man.neck,man.elbowL);
 line(man.elbowL,man.handL);

 line(man.neck,man.elbowR);
 line(man.elbowR,man.handR);
}

// ===== EVENTS =====
c.addEventListener("click",addPose);

// ===== LOOP =====
function loop(){
 if(playing){
  timeline.time+=1/timeline.fps;
  if(timeline.time>timeline.duration) timeline.time=0;
  slider.value=(timeline.time/timeline.duration)*1000;
 }

 const pose=samplePose(timeline.time);
 applyPose(pose);
 solve();
 draw();

 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
