<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v8.0.0 – Jump & Landing</title>
<style>
  body{
    margin:0;
    background:#111;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:#fff;
    font-family:sans-serif;
  }
  canvas{background:#fff;}
  input{width:600px;margin-top:10px;}
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>
<input id="slider" type="range" min="0" max="1000" value="0">

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const slider = document.getElementById("slider");

/* =====================
   STATE
===================== */
const stickman = {
  x: 300,
  groundY: 340,
  y: 340,
  basePose: {
    leftArm: -15,
    rightArm: 15,
    leftLeg: 10,
    rightLeg: -10
  },
  pose: {
    leftArm: 0,
    rightArm: 0,
    leftLeg: 0,
    rightLeg: 0
  }
};

const DURATION = 1000;

/* =====================
   EASING
===================== */
function easeInOut(t){
  return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* =====================
   DRAW
===================== */
function drawStickman(s){
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.strokeStyle="#000";

  // body
  ctx.beginPath();
  ctx.moveTo(0,-40);
  ctx.lineTo(0,60);
  ctx.stroke();

  // head
  ctx.beginPath();
  ctx.arc(0,-70,22,0,Math.PI*2);
  ctx.stroke();

  // arms
  drawLimb(0,-20,55,s.pose.leftArm);
  drawLimb(0,-20,55,s.pose.rightArm);

  // legs
  drawLimb(0,60,65,s.pose.leftLeg);
  drawLimb(0,60,65,s.pose.rightLeg);

  ctx.restore();
}

function drawLimb(x,y,len,ang){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(ang*Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,len);
  ctx.stroke();
  ctx.restore();
}

/* =====================
   JUMP LOGIC
===================== */
function applyJump(time){
  // normalize 0..1
  let t = clamp(time / DURATION, 0, 1);

  // phases
  let crouchEnd = 0.2;
  let takeoffEnd = 0.35;
  let apex = 0.6;
  let landEnd = 1.0;

  // defaults
  let y = stickman.groundY;
  let arm = 0, leg = 0;

  if (t < crouchEnd){
    // crouch
    let k = easeInOut(t / crouchEnd);
    y = stickman.groundY + k * 12;
    arm = -20 * k;
    leg =  20 * k;
  } else if (t < takeoffEnd){
    // takeoff
    let k = easeInOut((t - crouchEnd)/(takeoffEnd - crouchEnd));
    y = stickman.groundY - k * 40;
    arm = 30 * k;
    leg = -25 * k;
  } else if (t < apex){
    // up
    let k = easeInOut((t - takeoffEnd)/(apex - takeoffEnd));
    y = stickman.groundY - 40 - k * 60;
    arm = 30;
    leg = -25;
  } else {
    // fall + landing
    let k = easeInOut((t - apex)/(landEnd - apex));
    y = stickman.groundY - (1 - k) * 60;
    arm = 30 * (1 - k);
    leg = -25 * (1 - k);
  }

  stickman.y = y;

  // apply pose (symmetric)
  stickman.pose.leftArm  = stickman.basePose.leftArm  + arm;
  stickman.pose.rightArm = stickman.basePose.rightArm - arm;
  stickman.pose.leftLeg  = stickman.basePose.leftLeg  + leg;
  stickman.pose.rightLeg = stickman.basePose.rightLeg - leg;
}

/* =====================
   RENDER
===================== */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  applyJump(Number(slider.value));
  drawStickman(stickman);

  requestAnimationFrame(render);
}
render();
</script>

</body>
</html>
