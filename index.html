<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v36.0 (Timeline)</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  color:white;
}
#studio{display:flex;flex-direction:column;gap:10px;align-items:center}
canvas{background:#fff;border-radius:16px}
.panel{display:flex;gap:6px}
button{padding:6px 12px;border:none;border-radius:6px;cursor:pointer}
.small{font-size:12px;opacity:.7}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="playing=!playing">Play / Pause</button>
    <button onclick="timeline.time=0">Reset</button>
  </div>
  <div class="small">v36.0 — Timeline engine (J bosqich)</div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const W=420,H=640,ground=520;

// ===== JOINT =====
class Joint{constructor(x,y){this.x=x;this.y=y;}}

// ===== STICKMAN =====
const man={
 hip:new Joint(210,ground-85),
 neck:new Joint(210,ground-155),
 head:new Joint(210,ground-195),

 kneeL:new Joint(190,ground-45),
 kneeR:new Joint(230,ground-45),
 footL:new Joint(190,ground),
 footR:new Joint(230,ground),

 elbowL:new Joint(170,ground-135),
 elbowR:new Joint(250,ground-135),
 handL:new Joint(150,ground-115),
 handR:new Joint(270,ground-115),
};

// ===== TIMELINE =====
const timeline={
 fps:24,
 duration:2,
 time:0,
 tracks:{
  hipY:[
   {t:0,v:ground-85},
   {t:1,v:ground-95},
   {t:2,v:ground-85}
  ],
  legSwing:[
   {t:0,v:-1},
   {t:1,v:1},
   {t:2,v:-1}
  ],
  armSwing:[
   {t:0,v:1},
   {t:1,v:-1},
   {t:2,v:1}
  ]
 }
};

let playing=true;

// ===== INTERPOLATION =====
function lerp(a,b,t){return a+(b-a)*t;}

function sample(track,time){
 let a=track[0],b=track[track.length-1];
 for(let i=0;i<track.length-1;i++){
  if(time>=track[i].t && time<=track[i+1].t){
   a=track[i]; b=track[i+1]; break;
  }
 }
 const t=(time-a.t)/(b.t-a.t||1);
 return lerp(a.v,b.v,t);
}

// ===== IK =====
function stick(a,b,l){
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
 const diff=(d-l)/d*0.5;
 a.x+=dx*diff; a.y+=dy*diff;
 b.x-=dx*diff; b.y-=dy*diff;
}

// ===== APPLY TIMELINE =====
function applyTimeline(){
 const hipY=sample(timeline.tracks.hipY,timeline.time);
 const leg=sample(timeline.tracks.legSwing,timeline.time);
 const arm=sample(timeline.tracks.armSwing,timeline.time);

 man.hip.y=hipY;
 man.hip.x=210;

 man.neck.x=man.hip.x;
 man.neck.y=man.hip.y-70;
 man.head.x=man.neck.x;
 man.head.y=man.neck.y-40;

 man.footL.x=man.hip.x-22;
 man.footR.x=man.hip.x+22;
 man.footL.y=ground-Math.max(0,leg)*30;
 man.footR.y=ground-Math.max(0,-leg)*30;

 man.handL.x=man.neck.x-45+arm*25;
 man.handR.x=man.neck.x+45-arm*25;
 man.handL.y=man.neck.y+20;
 man.handR.y=man.neck.y+20;
}

// ===== SOLVE =====
function solve(){
 for(let i=0;i<6;i++){
  stick(man.neck,man.hip,70);
  stick(man.head,man.neck,40);

  stick(man.hip,man.kneeL,40);
  stick(man.kneeL,man.footL,40);

  stick(man.hip,man.kneeR,40);
  stick(man.kneeR,man.footR,40);

  stick(man.neck,man.elbowL,35);
  stick(man.elbowL,man.handL,35);

  stick(man.neck,man.elbowR,35);
  stick(man.elbowR,man.handR,35);
 }
}

// ===== DRAW =====
function line(a,b){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 ctx.strokeStyle="#ccc";
 ctx.beginPath();
 ctx.moveTo(0,ground);
 ctx.lineTo(W,ground);
 ctx.stroke();

 ctx.strokeStyle="#000";
 ctx.beginPath();
 ctx.arc(man.head.x,man.head.y,16,0,Math.PI*2);
 ctx.stroke();

 line(man.head,man.neck);
 line(man.neck,man.hip);

 line(man.hip,man.kneeL);
 line(man.kneeL,man.footL);

 line(man.hip,man.kneeR);
 line(man.kneeR,man.footR);

 line(man.neck,man.elbowL);
 line(man.elbowL,man.handL);

 line(man.neck,man.elbowR);
 line(man.elbowR,man.handR);
}

// ===== LOOP =====
function loop(){
 if(playing){
  timeline.time+=1/timeline.fps;
  if(timeline.time>timeline.duration) timeline.time=0;
 }

 applyTimeline();
 solve();
 draw();

 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
