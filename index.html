<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v7.7.2 – Advanced Walk</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    background: #fff;
  }
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* =======================
   GLOBAL STATE
======================= */
const stickman = {
  x: 300,
  baseY: 320,
  y: 320,
  scale: 1,
  pose: {
    leftArm: 0,
    rightArm: 0,
    leftLeg: 0,
    rightLeg: 0
  }
};

/* =======================
   WALK SETTINGS
======================= */
let t = 0;
const speed = 0.06;

/* =======================
   DRAW
======================= */
function drawStickman(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(s.scale, s.scale);
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#000";

  // BODY
  ctx.beginPath();
  ctx.moveTo(0, -40);
  ctx.lineTo(0, 60);
  ctx.stroke();

  // HEAD
  ctx.beginPath();
  ctx.arc(0, -70, 22, 0, Math.PI * 2);
  ctx.stroke();

  // ARMS
  drawLimb(0, -20, 55, s.pose.leftArm);
  drawLimb(0, -20, 55, s.pose.rightArm);

  // LEGS
  drawLeg(0, 60, 65, s.pose.leftLeg);
  drawLeg(0, 60, 65, s.pose.rightLeg);

  ctx.restore();
}

function drawLimb(x, y, length, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, length);
  ctx.stroke();
  ctx.restore();
}

/* ---- Knee leg ---- */
function drawLeg(x, y, length, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle * Math.PI / 180);

  const upper = length * 0.55;
  const lower = length * 0.45;
  const kneeBend = Math.max(0, Math.sin(t + angle * 0.05)) * 25;

  // upper leg
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, upper);
  ctx.stroke();

  // lower leg
  ctx.translate(0, upper);
  ctx.rotate(kneeBend * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, lower);
  ctx.stroke();

  ctx.restore();
}

/* =======================
   WALK UPDATE
======================= */
function updateWalk() {
  t += speed;

  const swing = Math.sin(t) * 30;
  const bounce = Math.abs(Math.sin(t)) * 8;

  // legs
  stickman.pose.leftLeg  =  swing;
  stickman.pose.rightLeg = -swing;

  // arms (opposite)
  stickman.pose.leftArm  = -swing * 0.8;
  stickman.pose.rightArm =  swing * 0.8;

  // body bounce
  stickman.y = stickman.baseY - bounce;
}

/* =======================
   RENDER LOOP
======================= */
function render() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  updateWalk();
  drawStickman(stickman);

  requestAnimationFrame(render);
}
render();
</script>

</body>
</html>
