<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI</title>
<style>
body {
  margin: 0;
  background: radial-gradient(#0f2b33, #07161b);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
}
.box {
  width: 340px;
  padding: 20px;
  border-radius: 20px;
  background: #0b1f26;
  box-shadow: 0 0 30px #00ffff55;
  text-align: center;
}
input, button {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
  margin-top: 6px;
}
button {
  background: cyan;
  cursor: pointer;
}
canvas {
  background: #fff;
  margin-top: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>
<div class="box">
  <h2>🤖 Stickman AI</h2>
  <input id="text" placeholder="run jump">
  <button onclick="run()">Generate</button>
  <button onclick="startRecord()">🎥 Start Video</button>
  <button onclick="stopRecord()">⏹ Stop & Save</button>
  <p id="status"></p>
  <canvas id="c" width="280" height="400"></canvas>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.lineCap = "round";
ctx.lineJoin = "round";

let x = c.width / 2;
let y = c.height - 90;
const ground = c.height - 90;

let velocityY = 0;
const gravity = 0.6;

let action = 'stand';
let actions = [];
let actionIndex = 0;
let frame = 0;

let facing = 1; // 1 = o‘ngga, -1 = chapga

// ===== VIDEO RECORD =====
let recorder;
let chunks = [];

function startRecord() {
  const stream = c.captureStream(60);
  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'stickgirl.webm';
    a.click();
  };
  recorder.start();
}

function stopRecord() {
  if (recorder) recorder.stop();
}

// ===== EASING =====
function easeInOut(t) {
  return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
}

function draw() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 4;

  let t = (Math.sin(frame * 0.08) + 1) / 2;
  let smooth = easeInOut(t);

  let lean = action === 'run' ? (smooth - 0.5) * 16 * facing : 0;

  // ===== HEAD =====
  ctx.beginPath();
  ctx.arc(x + lean * 0.4, y - 50, 14, 0, Math.PI * 2);
  ctx.stroke();

  // ===== HAIR (YO‘NALISHGA MOS) =====
  ctx.beginPath();
  ctx.moveTo(x + lean * 0.4 + facing * 6, y - 64);
  ctx.quadraticCurveTo(
    x + lean * 0.4 + facing * 40,
    y - 55,
    x + lean * 0.4 + facing * 28,
    y - 30
  );
  ctx.stroke();

  // ===== BODY / DRESS =====
  ctx.beginPath();
  ctx.moveTo(x + lean, y - 35);
  ctx.lineTo(x - 20 + lean * 0.6, y + 25);
  ctx.lineTo(x + 20 + lean * 0.6, y + 25);
  ctx.closePath();
  ctx.fillStyle = "#ffb6c1";
  ctx.fill();
  ctx.stroke();

  // ===== SHOULDER =====
  let shoulderX = x + lean;
  let shoulderY = y - 35;

  // ===== ARMS =====
  if (action === 'run') {
    drawArm(shoulderX, shoulderY, frame * 0.15);
    drawArm(shoulderX, shoulderY, frame * 0.15 + Math.PI);
  } else {
    drawArm(shoulderX, shoulderY, 0.6);
    drawArm(shoulderX, shoulderY, -0.6);
  }

  // ===== LEGS =====
  if (action === 'jump') {
    drawLeg(x - 8, y + 25, 0);
    drawLeg(x + 8, y + 25, 0);
  } else {
    drawLeg(x - 8, y + 25, 0);
    drawLeg(x + 8, y + 25, Math.PI);
  }
}

function drawArm(sx, sy, phase) {
  const upper = 18;
  const lower = 16;

  const a1 = Math.sin(phase) * 0.8;
  const a2 = Math.sin(phase + 0.6) * 0.6;

  const ex = sx + Math.sin(a1) * upper;
  const ey = sy + Math.cos(a1) * upper;

  const hx = ex + Math.sin(a2) * lower;
  const hy = ey + Math.cos(a2) * lower;

  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(ex, ey);
  ctx.lineTo(hx, hy);
  ctx.stroke();
}

function drawLeg(hx, hy, dir) {
  const thigh = 22;
  const calf = 20;

  let phase = frame * 0.15 + dir;
  let lift = Math.max(0, Math.sin(phase)) * 8;

  const a1 = Math.sin(phase) * 0.6;
  const a2 = Math.sin(phase + 0.8) * 0.6;

  const kx = hx + Math.sin(a1) * thigh;
  const ky = hy + Math.cos(a1) * thigh - lift;

  const fx = kx + Math.sin(a2) * calf;
  const fy = ky + Math.cos(a2) * calf;

  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(kx, ky);
  ctx.lineTo(fx, fy);
  ctx.stroke();
}

function animate() {
  frame++;

  if (actions.length > 1 && frame % 120 === 0) {
    actionIndex++;
    if (actionIndex < actions.length) action = actions[actionIndex];
  }

  if (action === 'run') x += 1.4 * facing;

  // devorga tegsa buriladi
  if (x > c.width - 30) facing = -1;
  if (x < 30) facing = 1;

  if (action === 'jump' && y === ground) velocityY = -12;

  velocityY += gravity;
  y += velocityY;

  if (y > ground) {
    y = ground;
    velocityY = 0;
  }

  draw();
  requestAnimationFrame(animate);
}

function run() {
  const t = document.getElementById('text').value.toLowerCase();
  actions = [];
  actionIndex = 0;
  frame = 0;

  if (t.includes('run')) actions.push('run');
  if (t.includes('jump')) actions.push('jump');
  if (actions.length === 0) actions.push('stand');

  action = actions[0];
}

animate();
</script>
</body>
</html>
