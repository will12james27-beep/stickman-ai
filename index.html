<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v7.8.0</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #fff;
    font-family: sans-serif;
  }
  canvas {
    background: #fff;
    margin-bottom: 10px;
  }
  input[type=range] {
    width: 600px;
  }
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>
<input id="slider" type="range" min="0" max="1000" value="0">

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const slider = document.getElementById("slider");

/* =======================
   STATE
======================= */
const stickman = {
  x: 300,
  baseY: 320,
  y: 320,
  pose: {
    leftArm: 0,
    rightArm: 0,
    leftLeg: 0,
    rightLeg: 0
  }
};

/* =======================
   TIMELINE
======================= */
const DURATION = 1000;

/* =======================
   EASING
======================= */
function easeInOut(t) {
  return t < 0.5
    ? 2 * t * t
    : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

/* =======================
   DRAW
======================= */
function drawStickman(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#000";

  // body
  ctx.beginPath();
  ctx.moveTo(0, -40);
  ctx.lineTo(0, 60);
  ctx.stroke();

  // head
  ctx.beginPath();
  ctx.arc(0, -70, 22, 0, Math.PI * 2);
  ctx.stroke();

  // arms
  drawLimb(0, -20, 55, s.pose.leftArm);
  drawLimb(0, -20, 55, s.pose.rightArm);

  // legs
  drawLeg(0, 60, 65, s.pose.leftLeg);
  drawLeg(0, 60, 65, s.pose.rightLeg);

  ctx.restore();
}

function drawLimb(x, y, length, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, length);
  ctx.stroke();
  ctx.restore();
}

function drawLeg(x, y, length, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle * Math.PI / 180);

  const upper = length * 0.55;
  const lower = length * 0.45;
  const knee = Math.max(0, angle) * 0.6;

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, upper);
  ctx.stroke();

  ctx.translate(0, upper);
  ctx.rotate(knee * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, lower);
  ctx.stroke();

  ctx.restore();
}

/* =======================
   WALK LOGIC (FOOT LOCK)
======================= */
function applyWalk(time) {
  let phase = (time / DURATION) * Math.PI * 2;
  let raw = Math.sin(phase);
  let eased = easeInOut((raw + 1) / 2) * 2 - 1;

  // legs
  stickman.pose.leftLeg  = eased * 30;
  stickman.pose.rightLeg = -eased * 30;

  // arms (opposite)
  stickman.pose.leftArm  = -eased * 24;
  stickman.pose.rightArm =  eased * 24;

  // body bounce (foot lock feel)
  stickman.y = stickman.baseY - Math.abs(eased) * 8;
}

/* =======================
   RENDER
======================= */
function render() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const t = Number(slider.value);
  applyWalk(t);
  drawStickman(stickman);

  requestAnimationFrame(render);
}
render();
</script>

</body>
</html>
