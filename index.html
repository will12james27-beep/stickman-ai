<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stickman v17-A — Face System</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: #181818;
    margin-top: 10px;
  }
  .ui {
    margin: 10px;
    display: flex;
    gap: 6px;
  }
  button {
    padding: 6px 10px;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    cursor: pointer;
  }
  button:hover { background:#333; }
</style>
</head>
<body>

<canvas id="c" width="360" height="540"></canvas>

<div class="ui">
  <button onclick="setEmotion('neutral')">😐</button>
  <button onclick="setEmotion('happy')">🙂</button>
  <button onclick="setEmotion('surprised')">😮</button>
  <button onclick="addKey()">ADD KEY</button>
  <button onclick="play()">▶ PLAY</button>
  <button onclick="stop()">■ STOP</button>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let frame = 0;
let playing = false;

// ===== TIMELINE =====
const timeline = [];

// ===== STICKMAN BASE =====
const stick = {
  x: 180,
  y: 260,
  headR: 16,
  body: 40,
  leg: 35,
};

// ===== FACE STATE =====
let face = {
  eyeOpen: 1,
  mouthOpen: 0
};

const emotions = {
  neutral: { eyeOpen:1, mouthOpen:0 },
  happy: { eyeOpen:0.8, mouthOpen:0.4 },
  surprised: { eyeOpen:1.2, mouthOpen:1 }
};

function setEmotion(name){
  face.eyeOpen = emotions[name].eyeOpen;
  face.mouthOpen = emotions[name].mouthOpen;
}

// ===== KEYFRAME =====
function addKey(){
  timeline.push({
    frame,
    face: {...face}
  });
}

// ===== PLAYBACK =====
function play(){
  if(timeline.length < 2) return;
  playing = true;
}

function stop(){
  playing = false;
}

// ===== INTERPOLATION =====
function lerp(a,b,t){ return a + (b-a)*t; }

function applyTimeline(){
  if(timeline.length < 2) return;

  let a = timeline[0];
  let b = timeline[timeline.length-1];

  const t = (frame % 60) / 60;

  face.eyeOpen = lerp(a.face.eyeOpen, b.face.eyeOpen, t);
  face.mouthOpen = lerp(a.face.mouthOpen, b.face.mouthOpen, t);
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // ground
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,320);
  ctx.lineTo(360,320);
  ctx.stroke();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;

  // body
  ctx.beginPath();
  ctx.moveTo(stick.x, stick.y);
  ctx.lineTo(stick.x, stick.y+stick.body);
  ctx.stroke();

  // legs
  ctx.beginPath();
  ctx.moveTo(stick.x, stick.y+stick.body);
  ctx.lineTo(stick.x-15, stick.y+stick.body+stick.leg);
  ctx.moveTo(stick.x, stick.y+stick.body);
  ctx.lineTo(stick.x+15, stick.y+stick.body+stick.leg);
  ctx.stroke();

  // head
  ctx.beginPath();
  ctx.arc(stick.x, stick.y-stick.headR, stick.headR,0,Math.PI*2);
  ctx.stroke();

  // ===== FACE =====
  const hx = stick.x;
  const hy = stick.y-stick.headR;

  // eyes
  ctx.beginPath();
  ctx.arc(hx-6, hy-3, 3*face.eyeOpen,0,Math.PI*2);
  ctx.arc(hx+6, hy-3, 3*face.eyeOpen,0,Math.PI*2);
  ctx.stroke();

  // mouth
  ctx.beginPath();
  ctx.arc(hx, hy+6, 5, 0, Math.PI*face.mouthOpen);
  ctx.stroke();
}

// ===== LOOP =====
function loop(){
  if(playing){
    frame++;
    applyTimeline();
  }
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
