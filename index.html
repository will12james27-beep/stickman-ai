<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v8.8.0 – Keyframe Easing</title>
<style>
  body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
  }
  canvas{background:#fff;cursor:crosshair;}
  #timeline{
    width:600px;height:50px;
    background:#222;border-radius:6px;
    margin-top:8px;position:relative;
  }
  .dot{
    position:absolute;top:18px;
    width:10px;height:10px;
    background:#ff5252;border-radius:50%;
    transform:translateX(-50%);
  }
  input{width:600px;margin-top:6px;}
  .ui{margin-top:6px;font-size:13px;opacity:.85}
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>

<div id="timeline"></div>
<input id="time" type="range" min="0" max="2000" value="0">
<div class="ui">
  Qo‘l-oyoqni bur → <b>K</b> bos = keyframe  
  <br>Har keyframe: <b>easeInOut</b>
</div>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const slider=document.getElementById("time");
const timelineEl=document.getElementById("timeline");

/* =====================
   STATE
===================== */
const stickman={
  x:300,y:340,
  joints:{
    la:{x:0,y:-20,ang:-15,len:55},
    ra:{x:0,y:-20,ang:15,len:55},
    ll:{x:0,y:60, ang:10,len:65},
    rl:{x:0,y:60, ang:-10,len:65}
  }
};
let active=null;

/* =====================
   KEYFRAMES
===================== */
// t, pose, easing
const keyframes=[];

/* =====================
   EASING
===================== */
function easeInOut(t){
  return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
}

/* =====================
   HELPERS
===================== */
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x1-x2,y1-y2);
const angle=(cx,cy,px,py)=>Math.atan2(py-cy,px-cx)*180/Math.PI+90;

function copyPose(){
  return {
    la:stickman.joints.la.ang,
    ra:stickman.joints.ra.ang,
    ll:stickman.joints.ll.ang,
    rl:stickman.joints.rl.ang
  };
}
function applyPose(p){
  if(!p)return;
  stickman.joints.la.ang=p.la;
  stickman.joints.ra.ang=p.ra;
  stickman.joints.ll.ang=p.ll;
  stickman.joints.rl.ang=p.rl;
}

/* =====================
   TIMELINE DOTS
===================== */
function rebuildDots(){
  timelineEl.innerHTML="";
  keyframes.forEach(k=>{
    const d=document.createElement("div");
    d.className="dot";
    d.style.left=(k.t/2000)*600+"px";
    timelineEl.appendChild(d);
  });
}

/* =====================
   INTERPOLATION (WITH EASING)
===================== */
function applyTimeline(t){
  if(keyframes.length===0) return;

  keyframes.sort((a,b)=>a.t-b.t);

  let a=keyframes[0], b=keyframes[keyframes.length-1];
  for(let i=0;i<keyframes.length-1;i++){
    if(t>=keyframes[i].t && t<=keyframes[i+1].t){
      a=keyframes[i];
      b=keyframes[i+1];
      break;
    }
  }
  if(t<=a.t) return applyPose(a.pose);
  if(t>=b.t) return applyPose(b.pose);

  let k=(t-a.t)/(b.t-a.t);
  k=a.easing(k); // 🔥 easing applied

  applyPose({
    la:lerp(a.pose.la,b.pose.la,k),
    ra:lerp(a.pose.ra,b.pose.ra,k),
    ll:lerp(a.pose.ll,b.pose.ll,k),
    rl:lerp(a.pose.rl,b.pose.rl,k)
  });
}

/* =====================
   DRAW
===================== */
function limb(j){
  ctx.save();
  ctx.translate(j.x,j.y);
  ctx.rotate(j.ang*Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,j.len);
  ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,600,600);
  ctx.save();
  ctx.translate(stickman.x,stickman.y);
  ctx.lineWidth=6;ctx.lineCap="round";ctx.strokeStyle="#000";
  ctx.beginPath();ctx.moveTo(0,-40);ctx.lineTo(0,60);ctx.stroke();
  ctx.beginPath();ctx.arc(0,-70,22,0,Math.PI*2);ctx.stroke();
  for(let k in stickman.joints) limb(stickman.joints[k]);
  ctx.restore();
}

/* =====================
   MOUSE
===================== */
canvas.onmousedown=e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  for(let k in stickman.joints){
    const j=stickman.joints[k];
    if(dist(mx,my,stickman.x+j.x,stickman.y+j.y)<15){
      active=j; break;
    }
  }
};
canvas.onmousemove=e=>{
  if(!active)return;
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  active.ang=angle(stickman.x+active.x,stickman.y+active.y,mx,my);
};
window.onmouseup=()=>active=null;

/* =====================
   KEYFRAME INPUT
===================== */
window.onkeydown=e=>{
  if(e.key.toLowerCase()==="k"){
    keyframes.push({
      t:+slider.value,
      pose:copyPose(),
      easing:easeInOut
    });
    rebuildDots();
  }
};

/* =====================
   LOOP
===================== */
function loop(){
  applyTimeline(+slider.value);
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
