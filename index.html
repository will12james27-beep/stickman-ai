<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

let x = c.width / 2;
let y = c.height - 80;
let velocityY = 0;
let gravity = 0.6;

let timeline = [];
let currentAction = null;
let actionEndTime = 0;
let frame = 0;

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle='white';
  ctx.lineWidth=3;

  let swing =
    currentAction === 'run'
      ? Math.sin(frame * 0.15) * 12
      : Math.sin(frame * 0.05) * 2;

  // head
  ctx.beginPath();
  ctx.arc(x, y-35, 10, 0, Math.PI*2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.moveTo(x, y-25);
  ctx.lineTo(x, y);
  ctx.stroke();

  // arms
  ctx.beginPath();
  ctx.moveTo(x + swing, y - 15);
  ctx.lineTo(x - swing, y - 15);
  ctx.stroke();

  // legs
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - swing, y + 18);
  ctx.moveTo(x, y);
  ctx.lineTo(x + swing, y + 18);
  ctx.stroke();
}

function updateAction(){
  if (!currentAction && timeline.length > 0){
    const next = timeline.shift();
    currentAction = next.action;
    actionEndTime = Date.now() + next.duration;

    if (currentAction === 'jump'){
      velocityY = -10;
    }
  }

  if (currentAction && Date.now() > actionEndTime){
    currentAction = null;
  }
}

function animate(){
  frame++;
  updateAction();

  if (currentAction === 'run'){
    x += 1.5;
  }

  if (currentAction === 'jump' || currentAction === 'fall'){
    velocityY += gravity;
    y += velocityY;
  }

  if (y > c.height - 80){
    y = c.height - 80;
    velocityY = 0;
  }

  if (x > c.width + 20) x = -20;

  draw();
  requestAnimationFrame(animate);
}

function parseText(text){
  timeline = [];
  const parts = text.split(' ');

  for (let i = 0; i < parts.length; i++){
    const word = parts[i];

    if (word === 'run'){
      let duration = 2000;
      if (parts[i+1]?.includes('s')){
        duration = parseInt(parts[i+1]) * 1000;
        i++;
      }
      timeline.push({ action:'run', duration });
    }

    if (word === 'jump'){
      timeline.push({ action:'jump', duration:800 });
    }
  }
}

function run(){
  const t = document.getElementById('text').value.toLowerCase();
  document.getElementById('status').innerText = 'AI is thinking...';

  parseText(t);

  setTimeout(()=>{
    document.getElementById('status').innerText = 'Done ✅';
  },300);
}

animate();
</script>
