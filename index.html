<body>

<canvas id="c" width="720" height="480"></canvas>

<script>
/* =========================
   PERSONALITY ENGINE
========================= */

const Personality = {
  CALM: "calm",
  HOT: "hot",
  CHAOTIC: "chaotic",
  LOGICAL: "logical"
};

/* =========================
   CHARACTER PROFILE
========================= */

function CharacterProfile(cfg){
  return {
    id: cfg.id,
    name: cfg.name,
    personality: cfg.personality,

    // emotional bias (0..1)
    bias: {
      anger: cfg.bias.anger,
      panic: cfg.bias.panic,
      humor: cfg.bias.humor
    },

    // scene behavior
    interruptChance: cfg.interruptChance,
    silenceTolerance: cfg.silenceTolerance,
    cameraPriority: cfg.cameraPriority,

    // runtime state
    mood: "neutral",
    tension: 0
  };
}

/* =========================
   MAIN CHARACTERS (4 ta)
========================= */

const characters = [
  CharacterProfile({
    id:0,
    name:"Red",
    personality:Personality.HOT,
    bias:{ anger:0.8, panic:0.2, humor:0.3 },
    interruptChance:0.7,
    silenceTolerance:0.2,
    cameraPriority:1.2
  }),

  CharacterProfile({
    id:1,
    name:"Blue",
    personality:Personality.LOGICAL,
    bias:{ anger:0.3, panic:0.1, humor:0.1 },
    interruptChance:0.2,
    silenceTolerance:0.8,
    cameraPriority:1.0
  }),

  CharacterProfile({
    id:2,
    name:"Green",
    personality:Personality.CALM,
    bias:{ anger:0.2, panic:0.1, humor:0.4 },
    interruptChance:0.1,
    silenceTolerance:0.9,
    cameraPriority:0.9
  }),

  CharacterProfile({
    id:3,
    name:"Yellow",
    personality:Personality.CHAOTIC,
    bias:{ anger:0.4, panic:0.6, humor:0.8 },
    interruptChance:0.9,
    silenceTolerance:0.05,
    cameraPriority:1.1
  })
];

/* =========================
   PSYCHOLOGY LOGIC
========================= */

function reactToEvent(char, eventPower){
  char.tension += eventPower;

  if(char.tension > 1){
    if(char.bias.anger > 0.6) char.mood="angry";
    else if(char.bias.panic > 0.5) char.mood="shocked";
    else char.mood="confused";
    char.tension = 0;
  }
}

/* =========================
   DEMO SCENE
========================= */

let t=0;
const demoEvents=[
  {t:60, power:0.6},
  {t:140, power:0.8},
  {t:220, power:1.0}
];

/* =========================
   DRAW
========================= */

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font="16px Arial";
  ctx.textAlign="center";

  characters.forEach((c,i)=>{
    ctx.fillStyle="#000";
    ctx.fillText(c.name,150+i*130,120);
    ctx.fillText("Mood: "+c.mood,150+i*130,150);
    ctx.fillText("Tension: "+c.tension.toFixed(2),150+i*130,180);
  });
}

/* =========================
   LOOP
========================= */

function loop(){
  t++;

  demoEvents.forEach(e=>{
    if(e.t===t){
      characters.forEach(c=>reactToEvent(c,e.power));
    }
  });

  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
<script>
// ================= 21 B.2 — CHARACTER INTERACTION RULES =================

// Interaction matrix: kim kimga qanday ta'sir qiladi
const interactionRules = {
  angry: {
    angry:   { tension:+0.1, mood:"angry" },
    confused:{ tension:+0.2, mood:"confused" },
    shocked: { tension:+0.3, mood:"shocked" }
  },
  confused: {
    angry:   { tension:+0.05 },
    confused:{ tension:+0.1 },
    shocked: { tension:+0.15 }
  },
  shocked: {
    angry:   { tension:+0.15 },
    confused:{ tension:+0.2 },
    shocked: { tension:+0.25 }
  }
};

// Default psychology init (agar yo‘q bo‘lsa)
chars.forEach(c=>{
  if(!c.psych){
    c.psych={
      mood:"confused",
      tension:0.5
    };
  }
});

// Asosiy interaction funksiyasi
function applyInteraction(speaker){
  chars.forEach(target=>{
    if(target===speaker) return;

    const sMood = speaker.psych?.mood;
    const tMood = target.psych?.mood;

    if(interactionRules[sMood] && interactionRules[sMood][tMood]){
      const rule = interactionRules[sMood][tMood];

      // Tension oshishi
      if(rule.tension){
        target.psych.tension = Math.min(
          1,
          target.psych.tension + rule.tension
        );
      }

      // Mood o‘zgarishi (agar belgilangan bo‘lsa)
      if(rule.mood){
        target.psych.mood = rule.mood;
      }
    }
  });
}

// HOOK: kimdir gapirganda avtomatik ishlaydi
const _oldShowSubtitle = showSubtitle;
showSubtitle = function(text,shake,color){
  _oldShowSubtitle(text,shake,color);

  if(focusChar && focusChar.psych){
    applyInteraction(focusChar);
  }
};

console.log("✅ 21 B.2 Character Interaction Rules loaded");
</script>
<script>
// ================= 21 B.3 — DOMINANCE & HIERARCHY =================

// Dominance hisoblash:
// anger + tension = kuch
function calcDominance(c){
  let base = c.psych?.tension || 0;

  if(c.psych?.mood==="angry")   base += 0.4;
  if(c.psych?.mood==="shocked") base += 0.2;
  if(c.psych?.mood==="confused")base += 0.1;

  return Math.min(1,base);
}

// Hamma personajlar uchun dominance yangilash
function updateDominance(){
  chars.forEach(c=>{
    if(!c.psych) return;
    c.psych.dominance = calcDominance(c);
  });
}

// Kim gapni oladi?
function chooseDominantSpeaker(){
  let best=null;
  let max=0;

  chars.forEach(c=>{
    if(!c.psych) return;
    if(c.psych.dominance>max){
      max=c.psych.dominance;
      best=c;
    }
  });

  return best;
}

// Gapirganda ierarxiya ishlaydi
const _oldShowSubtitle2 = showSubtitle;
showSubtitle = function(text,shake,color){
  updateDominance();

  const dominant = chooseDominantSpeaker();

  if(dominant){
    focusChar = dominant;
    dominant.talk = 1;

    // boshqalar pasayadi
    chars.forEach(c=>{
      if(c!==dominant){
        c.talk *= 0.3;
        if(c.psych) c.psych.tension *= 0.95;
      }
    });
  }

  _oldShowSubtitle2(text,shake,color);
};

console.log("✅ 21 B.3 Dominance & Hierarchy loaded");
</script>
<script>
// ================= 21 B.4 — CONFLICT ESCALATION RULES =================

// Konflikt holati
const conflictState = {
  active: false,
  level: 0 // 0..1
};

// Escalation hisoblash
function updateConflict(){
  let maxDominance = 0;
  let avgTension = 0;

  chars.forEach(c=>{
    if(!c.psych) return;
    maxDominance = Math.max(maxDominance, c.psych.dominance || 0);
    avgTension += c.psych.tension || 0;
  });

  avgTension /= chars.length;

  // Asosiy formula
  conflictState.level = Math.min(
    1,
    maxDominance * 0.6 + avgTension * 0.4
  );

  conflictState.active = conflictState.level > 0.6;
}

// Kamera reaksiyasi
function applyConflictCamera(){
  if(!conflictState.active) return;

  camera.shake = Math.max(
    camera.shake,
    conflictState.level * 10
  );

  camera.targetZoom = Math.max(
    camera.targetZoom,
    1.4 + conflictState.level * 0.4
  );
}

// Vizual signal (emoji)
function showConflictEmoji(){
  if(!conflictState.active) return;

  chars.forEach(c=>{
    if(c.psych && c.psych.tension > 0.8 && !c.emoji){
      spawnEmoji(c,"💥");
    }
  });
}

// LOOP ga ulanamiz (xavfsiz hook)
const _oldLoop = loop;
loop = function(){
  updateConflict();
  applyConflictCamera();
  showConflictEmoji();
  _oldLoop();
};

console.log("🔥 21 B.4 Conflict Escalation Rules loaded");
</script>
<script>
// ================= 21 B.5 — DE-ESCALATION & COOLDOWN =================

// Sovish tezliklari
const cooldownConfig = {
  tensionDrop: 0.01,   // har frame
  dominanceDrop: 0.01,
  calmThreshold: 0.2
};

function applyCooldown(){
  if(conflictState.active) return;

  chars.forEach(c=>{
    if(!c.psych) return;

    // Tension sekin tushadi
    c.psych.tension = Math.max(
      0,
      c.psych.tension - cooldownConfig.tensionDrop
    );

    // Dominance pasayadi
    if(c.psych.dominance){
      c.psych.dominance = Math.max(
        0,
        c.psych.dominance - cooldownConfig.dominanceDrop
      );
    }

    // Mood tiklanishi
    if(c.psych.tension < cooldownConfig.calmThreshold){
      c.psych.mood = "neutral";
    }
  });

  // Kamera tinchlanadi
  camera.shake *= 0.9;
  camera.targetZoom += (1 - camera.targetZoom) * 0.05;
}

// LOOP ga xavfsiz ulanish
const _loopAfterConflict = loop;
loop = function(){
  applyCooldown();
  _loopAfterConflict();
};

console.log("🧊 21 B.5 De-escalation & Cooldown loaded");
</script>
<script>

<script>
// ================= 21 B.7 — TEXT LAYERING & PRIORITY =================

// Text layer aniqlash
function getTextLayer(c){
  if(c.talk && c.talk > 0) return 3;          // gapiryapti
  if(c.mood && c.mood !== "neutral") return 2; // reaction
  return 1;                                   // idle
}

// Scene-relative psychology text (layer bilan)
function drawLayeredPsychText(c){
  const layer = getTextLayer(c);

  const worldX = c.pos.x;
  const worldY = c.pos.y - 40;

  const screenX = (worldX - camera.x) * camera.zoom;
  const screenY = (worldY - camera.y) * camera.zoom;

  // Vizual farq
  if(layer === 3){
    ctx.font = "bold 15px Arial";
  }else if(layer === 2){
    ctx.font = "14px Arial";
  }else{
    ctx.font = "13px Arial";
  }

  ctx.fillStyle = "#000";

  ctx.fillText(
    `Mood: ${c.mood}`,
    screenX,
    screenY
  );

  ctx.fillText(
    `Tension: ${c.tension.toFixed(2)}`,
    screenX,
    screenY + 16
  );
}

// draw() ni yana xavfsiz kengaytiramiz
const _draw21B7 = draw;
draw = function(){
  _draw21B7();

  ctx.textAlign = "center";

  // layer bo‘yicha sort qilib chizamiz
  characters
    .slice()
    .sort((a,b)=>getTextLayer(a)-getTextLayer(b))
    .forEach(c=>{
      drawLayeredPsychText(c);
    });
};

console.log("🧩 21 B.7 Text Layering & Priority loaded");
</script>
<script>
// ================= 21 B.8 — TEXT FADE / POP / SHAKE =================
// SAFE MODE: faqat oxiriga qo‘shiladi

// Per-text visual state (lazy init)
function ensureTextFX(c){
  if(!c._textFX){
    c._textFX = {
      alpha: 1,
      scale: 1,
      shake: 0,
      timer: 0
    };
  }
  return c._textFX;
}

// Triggerlar: gapirganda / mood o‘zgarganda
function triggerTextFX(c, type){
  const fx = ensureTextFX(c);
  fx.timer = 0;

  if(type === "talk"){
    fx.alpha = 1;
    fx.scale = 1.15;
    fx.shake = 6;
  }else if(type === "react"){
    fx.alpha = 1;
    fx.scale = 1.08;
    fx.shake = 3;
  }
}

// Yumshoq easing (har frame)
function updateTextFX(c){
  const fx = ensureTextFX(c);
  fx.timer++;

  // decay
  fx.scale += (1 - fx.scale) * 0.15;
  fx.shake *= 0.75;
  fx.alpha += (1 - fx.alpha) * 0.08;
}

// Layerga qarab avtomatik trigger
function autoTriggerByLayer(c){
  const layer = (typeof getTextLayer === "function") ? getTextLayer(c) : 1;
  if(layer === 3) triggerTextFX(c, "talk");
  else if(layer === 2) triggerTextFX(c, "react");
}

// Layered draw’ni FX bilan o‘rab olamiz (safe override)
const _drawLayered21B8 = (typeof draw === "function") ? draw : null;
draw = function(){
  if(_drawLayered21B8) _drawLayered21B8();

  ctx.save();
  ctx.textAlign = "center";

  characters
    .slice()
    .sort((a,b)=>{
      if(typeof getTextLayer === "function"){
        return getTextLayer(a) - getTextLayer(b);
      }
      return 0;
    })
    .forEach(c=>{
      // FX update
      autoTriggerByLayer(c);
      updateTextFX(c);

      const fx = ensureTextFX(c);

      const worldX = c.pos.x;
      const worldY = c.pos.y - 40;

      const shakeX = (Math.random()-0.5) * fx.shake;
      const shakeY = (Math.random()-0.5) * fx.shake;

      const screenX = (worldX - camera.x) * camera.zoom + shakeX;
      const screenY = (worldY - camera.y) * camera.zoom + shakeY;

      ctx.globalAlpha = fx.alpha;
      ctx.translate(screenX, screenY);
      ctx.scale(fx.scale, fx.scale);

      // font layer-aware
      const layer = (typeof getTextLayer === "function") ? getTextLayer(c) : 1;
      if(layer === 3){
        ctx.font = "bold 15px Arial";
      }else if(layer === 2){
        ctx.font = "14px Arial";
      }else{
        ctx.font = "13px Arial";
      }
      ctx.fillStyle = "#000";

      ctx.fillText(`Mood: ${c.mood}`, 0, 0);
      ctx.fillText(`Tension: ${c.tension.toFixed(2)}`, 0, 16);

      ctx.setTransform(1,0,0,1,0,0);
      ctx.globalAlpha = 1;
    });

  ctx.restore();
};

console.log("✨ 21 B.8 Text Fade/Pop/Shake loaded (SAFE MODE)");
</script>
<script>
// ================= 21 B.9 — TEXT TIMING & DECAY =================
// SAFE MODE: append-only

const TEXT_LIFETIME = 120; // frame (~2 soniya 60fps da)

// Har character uchun text time
function ensureTextTime(c){
  if(c._textTime === undefined){
    c._textTime = 0;
  }
  return c._textTime;
}

// Layer o‘zgarsa timer reset bo‘ladi
function updateTextTiming(c){
  const layer = (typeof getTextLayer === "function") ? getTextLayer(c) : 1;

  if(c._lastTextLayer === undefined){
    c._lastTextLayer = layer;
  }

  if(layer !== c._lastTextLayer){
    c._textTime = 0;
    c._lastTextLayer = layer;
  }else{
    c._textTime++;
  }
}

// Fade-out hisoblash
function getTextAlphaByTime(c){
  const t = ensureTextTime(c);
  if(t < TEXT_LIFETIME * 0.6) return 1;

  const fade = (t - TEXT_LIFETIME * 0.6) / (TEXT_LIFETIME * 0.4);
  return Math.max(0, 1 - fade);
}

// draw() ga yana SAFE ulanamiz
const _draw21B9 = draw;
draw = function(){
  _draw21B9();

  ctx.save();
  ctx.textAlign = "center";

  characters.forEach(c=>{
    updateTextTiming(c);

    const alpha = getTextAlphaByTime(c);
    if(alpha <= 0) return;

    const worldX = c.pos.x;
    const worldY = c.pos.y - 40;

    const screenX = (worldX - camera.x) * camera.zoom;
    const screenY = (worldY - camera.y) * camera.zoom;

    ctx.globalAlpha = alpha;
    ctx.font = "12px Arial";
    ctx.fillStyle = "#000";

    ctx.fillText(`Mood: ${c.mood}`, screenX, screenY);
    ctx.fillText(`Tension: ${c.tension.toFixed(2)}`, screenX, screenY + 14);
  });

  ctx.restore();
};

console.log("⏱️ 21 B.9 Text Timing & Decay loaded (SAFE MODE)");
</script>
<script>
// ================= 21 B.10 — EMOTION → CAMERA MICRO-SYNC =================
// SAFE MODE: append-only

// Camera mavjud bo‘lmasa — minimal init (safe)
if(typeof camera === "undefined"){
  window.camera = {
    x: 0,
    y: 0,
    zoom: 1,
    shake: 0,
    targetZoom: 1
  };
}

// Emotion → camera impulse mapping
function getCameraImpulse(c){
  if(!c.mood) return null;

  switch(c.mood){
    case "angry":
      return { shake: 2.5, zoom: 0.03 };
    case "shocked":
      return { shake: 3.5, zoom: 0.05 };
    case "confused":
      return { shake: 1.5, zoom: 0.02 };
    case "neutral":
    default:
      return null;
  }
}

// Impulse qo‘llash (bir martalik)
function applyCameraImpulse(imp){
  if(!imp) return;

  camera.shake = Math.max(camera.shake, imp.shake);
  camera.targetZoom = Math.max(camera.targetZoom, 1 + imp.zoom);
}

// Emotion o‘zgarishini kuzatish
function detectEmotionChange(c){
  if(c._lastMood === undefined){
    c._lastMood = c.mood;
    return;
  }

  if(c.mood !== c._lastMood){
    const imp = getCameraImpulse(c);
    applyCameraImpulse(imp);
    c._lastMood = c.mood;
  }
}

// Camera easing (har frame)
function updateCameraMicro(){
  // shake decay
  camera.shake *= 0.85;

  // zoom easing
  camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;
  camera.targetZoom += (1 - camera.targetZoom) * 0.05;
}

// LOOP ga SAFE ulanish
const _loop21B10 = loop;
loop = function(){
  characters.forEach(c=>{
    detectEmotionChange(c);
  });

  updateCameraMicro();

  _loop21B10();
};

console.log("🎥 21 B.10 Emotion → Camera Micro-sync loaded (SAFE MODE)");
</script>
<script>
// ================= 21 B.11 — EMOTION → CHARACTER MICRO-MOTION =================
// SAFE MODE: append-only

// Per-character micro motion state
function ensureMicro(c){
  if(!c._micro){
    c._micro = {
      bob: 0,
      tilt: 0,
      jitter: 0,
      phase: Math.random()*Math.PI*2
    };
  }
  return c._micro;
}

// Emotion → micro params
function getMicroParams(c){
  switch(c.mood){
    case "angry":
      return { bob: 1.8, tilt: 0.06, jitter: 1.2 };
    case "shocked":
      return { bob: 2.2, tilt: 0.08, jitter: 1.8 };
    case "confused":
      return { bob: 1.2, tilt: 0.04, jitter: 0.8 };
    case "neutral":
    default:
      return { bob: 0.6, tilt: 0.02, jitter: 0.3 };
  }
}

// Update micro motion each frame
function updateMicro(c){
  const m = ensureMicro(c);
  const p = getMicroParams(c);

  m.phase += 0.08; // idle speed
  m.bob += (Math.sin(m.phase)*p.bob - m.bob) * 0.2;
  m.tilt += (p.tilt - m.tilt) * 0.15;
  m.jitter += (p.jitter - m.jitter) * 0.2;
}

// Apply micro transform (for text/overlay now; body later in 21 D)
function applyMicroTransform(c){
  const m = ensureMicro(c);
  const jx = (Math.random()-0.5) * m.jitter;
  const jy = (Math.random()-0.5) * m.jitter;

  ctx.translate(jx, m.bob + jy);
  ctx.rotate(m.tilt * (Math.random() > 0.5 ? 1 : -1));
}

// LOOP ga SAFE ulanish (faqat state update)
const _loop21B11 = loop;
loop = function(){
  characters.forEach(c=>updateMicro(c));
  _loop21B11();
};

// DRAW ga SAFE ulanish (overlay/text uchun micro qo‘llaymiz)
const _draw21B11 = draw;
draw = function(){
  _draw21B11();

  ctx.save();
  ctx.textAlign = "center";

  characters.forEach(c=>{
    if(!c.pos) return;

    const worldX = c.pos.x;
    const worldY = c.pos.y - 40;

    const screenX = (worldX - camera.x) * camera.zoom;
    const screenY = (worldY - camera.y) * camera.zoom;

    ctx.save();
    ctx.translate(screenX, screenY);
    applyMicroTransform(c);

    // Yengil vizual belgi (text o‘rnida mikro-harakat ko‘rinsin)
    ctx.font = "12px Arial";
    ctx.fillStyle = "#000";
    ctx.fillText("•", 0, 0);

    ctx.restore();
  });

  ctx.restore();
};

console.log("🧍‍♂️ 21 B.11 Emotion → Character Micro-Motion loaded (SAFE MODE)");
</script>
<script>
// ================= 21 B.12 — EMOTION → SOUND / BEAT MICRO-SYNC =================
// SAFE MODE: append-only

// WebAudio safe init
let _audioCtx = null;
function getAudioCtx(){
  try{
    if(!_audioCtx){
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return _audioCtx;
  }catch(e){
    return null;
  }
}

// Simple click / pop generator
function playClick(freq, duration, gain){
  const ctx = getAudioCtx();
  if(!ctx) return;

  const osc = ctx.createOscillator();
  const g = ctx.createGain();

  osc.type = "sine";
  osc.frequency.value = freq;

  g.gain.value = gain;

  osc.connect(g);
  g.connect(ctx.destination);

  const now = ctx.currentTime;
  g.gain.setValueAtTime(gain, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  osc.start(now);
  osc.stop(now + duration);
}

// Emotion → sound mapping
function playEmotionSound(c){
  if(!c.mood) return;

  switch(c.mood){
    case "angry":
      playClick(220, 0.08, 0.06); // past, qattiqroq
      break;
    case "shocked":
      playClick(880, 0.05, 0.05); // yuqori, tez
      break;
    case "confused":
      playClick(440, 0.06, 0.04); // o‘rtacha
      break;
    default:
      // neutral — ovoz yo‘q
      break;
  }
}

// Emotion o‘zgarishini kuzatish (sound uchun)
function detectEmotionSound(c){
  if(c._lastSoundMood === undefined){
    c._lastSoundMood = c.mood;
    return;
  }

  if(c.mood !== c._lastSoundMood){
    playEmotionSound(c);
    c._lastSoundMood = c.mood;
  }
}

// LOOP ga SAFE ulanish
const _loop21B12 = loop;
loop = function(){
  characters.forEach(c=>{
    detectEmotionSound(c);
  });
  _loop21B12();
};

console.log("🔊 21 B.12 Emotion → Sound Micro-sync loaded (SAFE MODE)");
</script>
<script>
// ================= 21 B.13 — EMOTION → COLOR / LINE-WEIGHT MICRO-SYNC =================
// SAFE MODE: append-only

// Emotion visual presets
const EMO_VIS = {
  angry:   { color:"#ff4d4d", boost:2 },
  shocked: { color:"#ffd966", boost:2 },
  confused:{ color:"#8fd3ff", boost:1 }
};

// Init defaults per character (safe)
characters.forEach(c=>{
  if(!c._baseColor) c._baseColor = c.color || "#000";
  if(!c._baseLine)  c._baseLine  = c.lineWidth || 2;
  if(!c._flashT)    c._flashT = 0;
});

// Apply visual pulse
function applyEmotionVisual(c){
  if(!c.mood) return;

  const p = EMO_VIS[c.mood];
  if(!p) return;

  c.color = p.color;
  c.lineWidth = c._baseLine + p.boost;
  c._flashT = 3; // frames
}

// Restore smoothly
function restoreVisual(c){
  if(c._flashT > 0){
    c._flashT--;
    if(c._flashT === 0){
      c.color = c._baseColor;
      c.lineWidth = c._baseLine;
    }
  }
}

// Detect emotion change (visual)
function detectEmotionVisual(c){
  if(c._lastVisMood === undefined){
    c._lastVisMood = c.mood;
    return;
  }

  if(c.mood !== c._lastVisMood){
    applyEmotionVisual(c);
    c._lastVisMood = c.mood;
  }
}

// LOOP hook (SAFE)
const _loop21B13 = loop;
loop = function(){
  characters.forEach(c=>{
    detectEmotionVisual(c);
    restoreVisual(c);
  });
  _loop21B13();
};

console.log("🎨 21 B.13 Emotion → Color & Line-weight micro-sync loaded (SAFE MODE)");
</script>
<script>
// ================= 21 B.14 — MULTI-CHARACTER EMOTION PRIORITY =================
// SAFE MODE: append-only

// Emotion weight (ustuvorlik ballari)
const EMO_WEIGHT = {
  angry: 3,
  shocked: 4,
  confused: 2,
  neutral: 0
};

// Per-character priority init
characters.forEach(c=>{
  if(c._emoPriority === undefined) c._emoPriority = 0;
});

// Priority hisoblash
function calcEmotionPriority(c){
  const w = EMO_WEIGHT[c.mood] || 0;

  // Dominance bo‘lsa — qo‘shimcha ball
  const dom = (c.psych && c.psych.dominance) ? c.psych.dominance : 0;

  // Gapiryapti bo‘lsa — yana ustun
  const talkBoost = (c.talk && c.talk > 0) ? 1.5 : 0;

  return w + dom + talkBoost;
}

// Global dominant emotion character
function chooseEmotionLeader(){
  let best = null;
  let max = -1;

  characters.forEach(c=>{
    const p = calcEmotionPriority(c);
    c._emoPriority = p;
    if(p > max){
      max = p;
      best = c;
    }
  });

  return best;
}

// LOOP ga SAFE ulanish
const _loop21B14 = loop;
loop = function(){
  const leader = chooseEmotionLeader();

  // Flag: kim ustun
  characters.forEach(c=>{
    c.isEmotionLeader = (c === leader);
  });

  _loop21B14();
};

console.log("⚖️ 21 B.14 Multi-character Emotion Priority loaded (SAFE MODE)");
</script>
<script>
// ================= 21 B.15 — EMOTION LEADER HARD FOCUS =================
// SAFE MODE: append-only

// Leader focus config (subtle but visible)
const LEADER_FOCUS = {
  zoomBoost: 0.08,   // qo‘shimcha zoom
  shakeBoost: 2.0,  // qo‘shimcha shake
  textScale: 1.12   // text kattalashuvi
};

// Camera mavjud bo‘lmasa — safe init
if(typeof camera === "undefined"){
  window.camera = { x:0, y:0, zoom:1, targetZoom:1, shake:0 };
}

// Leaderga qarab kamera impuls
function applyLeaderCameraFocus(){
  const leader = characters.find(c=>c.isEmotionLeader);
  if(!leader) return;

  camera.targetZoom = Math.max(
    camera.targetZoom || 1,
    1 + LEADER_FOCUS.zoomBoost
  );

  camera.shake = Math.max(
    camera.shake || 0,
    LEADER_FOCUS.shakeBoost
  );
}

// Text focus uchun scale flag
function getLeaderTextScale(c){
  return c.isEmotionLeader ? LEADER_FOCUS.textScale : 1;
}

// DRAW ga SAFE ulanish — faqat leader textini urg‘ulaymiz
const _draw21B15 = draw;
draw = function(){
  _draw21B15();

  ctx.save();
  ctx.textAlign = "center";

  characters.forEach(c=>{
    if(!c.pos) return;

    const worldX = c.pos.x;
    const worldY = c.pos.y - 56; // leader text biroz yuqoriroq

    const screenX = (worldX - camera.x) * camera.zoom;
    const screenY = (worldY - camera.y) * camera.zoom;

    ctx.save();
    ctx.translate(screenX, screenY);

    const s = getLeaderTextScale(c);
    ctx.scale(s, s);

    ctx.font = c.isEmotionLeader ? "bold 14px Arial" : "12px Arial";
    ctx.fillStyle = "#000";

    // Faqat leader uchun belgi (demo uchun)
    if(c.isEmotionLeader){
      ctx.fillText("★ FOCUS ★", 0, 0);
    }

    ctx.restore();
  });

  ctx.restore();
};

// LOOP ga SAFE ulanish — kamera fokusini qo‘llaymiz
const _loop21B15 = loop;
loop = function(){
  applyLeaderCameraFocus();
  _loop21B15();
};

console.log("🎯 21 B.15 Emotion Leader Hard Focus loaded (SAFE MODE)");
</script>
<script>
// ================= 21 B.16 — EMOTION COOLDOWN & PRIORITY RESET =================
// SAFE MODE: append-only

// Cooldown sozlamalari
const EMO_COOLDOWN = {
  leaderHold: 90,    // frame: leader qancha ushlanadi (~1.5s)
  priorityDecay: 0.98,
  shakeDecay: 0.85,
  zoomReturn: 0.08
};

// Leader timer init
characters.forEach(c=>{
  if(c._leaderTimer === undefined) c._leaderTimer = 0;
});

// Cooldown logikasi
function applyEmotionCooldown(){
  const leader = characters.find(c=>c.isEmotionLeader);

  if(leader){
    leader._leaderTimer++;
    // Ma'lum vaqtdan keyin leaderlik pasayadi
    if(leader._leaderTimer > EMO_COOLDOWN.leaderHold){
      characters.forEach(c=>{
        c.isEmotionLeader = false;
        c._emoPriority *= EMO_COOLDOWN.priorityDecay;
      });
    }
  }else{
    // Hech kim leader bo‘lmasa — hammasi tiklanadi
    characters.forEach(c=>{
      c._leaderTimer = 0;
      if(c._emoPriority) c._emoPriority *= EMO_COOLDOWN.priorityDecay;
    });
  }

  // Kamera sokinlashuvi
  if(typeof camera !== "undefined"){
    camera.shake *= EMO_COOLDOWN.shakeDecay;
    camera.targetZoom += (1 - camera.targetZoom) * EMO_COOLDOWN.zoomReturn;
  }
}

// LOOP ga SAFE ulanish
const _loop21B16 = loop;
loop = function(){
  applyEmotionCooldown();
  _loop21B16();
};

console.log("🧊 21 B.16 Emotion Cooldown & Priority Reset loaded (SAFE MODE)");
</script>
<script>
// ================= 21 B.17 — UNIVERSAL ENTITY EMOTION INTERFACE =================
// SAFE MODE: append-only

// Global entity registry (characters, animals, vehicles, objects...)
if(!window.entities){
  window.entities = [];
}

// Characters avtomatik entity sifatida qo‘shiladi
if(typeof characters !== "undefined"){
  characters.forEach(c=>{
    if(!c._isEntity){
      c._isEntity = true;
      c.entityType = "human";
      entities.push(c);
    }
  });
}

// Universal emotion init
function initEntityEmotion(e){
  if(!e.emotion){
    e.emotion = {
      state: "neutral",
      intensity: 0,    // 0..1
      priority: 0
    };
  }
}

// Barcha entity’lar uchun init
entities.forEach(initEntityEmotion);

// Universal emotion setter
function setEntityEmotion(e, state, intensity=1){
  initEntityEmotion(e);
  e.emotion.state = state;
  e.emotion.intensity = Math.max(0, Math.min(1, intensity));
  e.emotion.priority = intensity * 5;
}

// Universal emotion reader (21 B bilan mos)
function readEntityEmotion(e){
  if(!e.emotion) return "neutral";
  return e.emotion.state;
}

// Emotion leader tanlash (entity-level)
function chooseGlobalEmotionLeader(){
  let leader = null;
  let max = -1;

  entities.forEach(e=>{
    if(!e.emotion) return;
    const p = e.emotion.priority || 0;
    if(p > max){
      max = p;
      leader = e;
    }
  });

  // Reset
  entities.forEach(e=>{
    e.isEmotionLeader = false;
  });

  if(leader){
    leader.isEmotionLeader = true;
  }

  return leader;
}

// LOOP ga SAFE ulanish
const _loop21B17 = loop;
loop = function(){
  chooseGlobalEmotionLeader();
  _loop21B17();
};

console.log("🌍 21 B.17 Universal Entity Emotion Interface loaded (SAFE MODE)");
</script>
