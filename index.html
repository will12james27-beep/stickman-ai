<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman RESET — Base Render</title>
<style>
body{
 margin:0;
 background:#0b0f14;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
}
canvas{
 background:#fff;
 border-radius:16px;
}
</style>
</head>
<body>

<canvas id="c" width="420" height="640"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

ctx.lineWidth = 4;
ctx.lineCap = "round";
ctx.strokeStyle = "#000";

const ground = 520;

// ===== JOINT =====
class Joint{
 constructor(x,y){
  this.x=x;
  this.y=y;
 }
}

// ===== SIMPLE MAN =====
const man = {
 head: new Joint(210, 300),
 neck: new Joint(210, 340),
 hip:  new Joint(210, 400),

 kneeL: new Joint(190, 460),
 footL: new Joint(190, ground),

 kneeR: new Joint(230, 460),
 footR: new Joint(230, ground),

 elbowL: new Joint(180, 360),
 handL:  new Joint(160, 380),

 elbowR: new Joint(240, 360),
 handR:  new Joint(260, 380),
};

// ===== DRAW =====
function line(a,b){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
}

function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 // ground
 ctx.strokeStyle="#ccc";
 ctx.beginPath();
 ctx.moveTo(0,ground);
 ctx.lineTo(420,ground);
 ctx.stroke();

 ctx.strokeStyle="#000";

 // head
 ctx.beginPath();
 ctx.arc(man.head.x, man.head.y, 14, 0, Math.PI*2);
 ctx.stroke();

 line(man.head, man.neck);
 line(man.neck, man.hip);

 line(man.hip, man.kneeL);
 line(man.kneeL, man.footL);

 line(man.hip, man.kneeR);
 line(man.kneeR, man.footR);

 line(man.neck, man.elbowL);
 line(man.elbowL, man.handL);

 line(man.neck, man.elbowR);
 line(man.elbowR, man.handR);

 requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
