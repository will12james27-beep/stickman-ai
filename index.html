<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v9.4.1 – IK Legs + Arms</title>
<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
canvas{background:#fff;}
button{
  position:fixed;
  bottom:20px;
  padding:6px 14px;
}
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>
<button id="play">▶ Play</button>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const playBtn=document.getElementById("play");

let playing=false;
let t=0;

/* =====================
   STICKMAN
===================== */
const stickman={
  x:300,
  y:260,
  leg:{ upper:45, lower:45 },
  arm:{ len:55 }
};

/* =====================
   IK SOLVER (2 BONE)
===================== */
function solveIK(base, target, l1, l2, flip){
  const dx=target.x-base.x;
  const dy=target.y-base.y;
  let d=Math.hypot(dx,dy);
  d=Math.min(d,l1+l2-0.001);

  const a=Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d));
  const b=Math.atan2(dy,dx);
  const angle1=b+(flip?-a:a);

  return {
    knee:{
      x:base.x+Math.cos(angle1)*l1,
      y:base.y+Math.sin(angle1)*l1
    },
    foot:target
  };
}

/* =====================
   DEMO WALK
===================== */
function update(dt){
  t+=dt*0.005;
}

/* =====================
   DRAW HELPERS
===================== */
function line(x1,y1,x2,y2){
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

/* =====================
   DRAW
===================== */
function draw(){
  ctx.clearRect(0,0,600,600);
  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.strokeStyle="#000";

  const hip={x:stickman.x,y:stickman.y};

  // FOOT TARGETS
  const s=Math.sin(t);
  const Lfoot={x:hip.x-20+s*20, y:hip.y+140+Math.max(0,s)*-30};
  const Rfoot={x:hip.x+20-s*20, y:hip.y+140+Math.max(0,-s)*-30};

  // IK
  const L=solveIK(hip,Lfoot,stickman.leg.upper,stickman.leg.lower,false);
  const R=solveIK(hip,Rfoot,stickman.leg.upper,stickman.leg.lower,true);

  // BODY
  line(hip.x,hip.y-60,hip.x,hip.y);
  ctx.beginPath();
  ctx.arc(hip.x,hip.y-90,22,0,Math.PI*2);
  ctx.stroke();

  // ARMS (simple)
  line(hip.x,hip.y-40,hip.x-35,hip.y-10);
  line(hip.x,hip.y-40,hip.x+35,hip.y-10);

  // LEGS
  line(hip.x,hip.y,L.knee.x,L.knee.y);
  line(L.knee.x,L.knee.y,L.foot.x,L.foot.y);

  line(hip.x,hip.y,R.knee.x,R.knee.y);
  line(R.knee.x,R.knee.y,R.foot.x,R.foot.y);
}

/* =====================
   LOOP
===================== */
let last=0;
function loop(ts){
  const dt=ts-last; last=ts;
  if(playing) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

playBtn.onclick=()=>playing=!playing;
</script>

</body>
</html>
