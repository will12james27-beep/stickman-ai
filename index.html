<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman v21-A.14 — Beat Sync</title>
<style>
body{margin:0;background:#111;display:flex;justify-content:center}
canvas{background:#e6f4ff}
</style>
</head>
<body>

<canvas id="c" width="360" height="640"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

/* ================= CAMERA ================= */
const Camera={
  x:0,y:0,zoom:1,shake:0,target:null,
  update(){
    if(this.target){
      this.x+=((this.target.x-180)-this.x)*0.15;
      this.y+=((this.target.y-320)-this.y)*0.15;
    }
    this.shake*=0.85;
  },
  apply(){
    const sx=(Math.random()-0.5)*this.shake;
    const sy=(Math.random()-0.5)*this.shake;
    ctx.setTransform(1,0,0,1,-this.x+sx,-this.y+sy);
  },
  hit(intensity){
    this.shake=intensity;
  }
};

/* ================= BEAT ================= */
const Beat={
  frames:[60,120,180], // viral timing
  i:0,
  update(frame){
    if(frame===this.frames[this.i]){
      this.i++;
      return true;
    }
    return false;
  }
};

/* ================= SUBTITLES ================= */
const Subs={
  lines:[
    "That was CRAZY 😱",
    "Bu juda TELBA edi 😂"
  ],
  i:0,active:false,t:0,
  hit(){
    this.active=true;
    this.t=0;
  },
  update(){
    if(!this.active) return;
    this.t++;
    if(this.t>60){this.active=false;this.i=(this.i+1)%this.lines.length;}
  },
  draw(){
    if(!this.active) return;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.font="bold 24px sans-serif";
    ctx.textAlign="center";
    ctx.fillStyle="#000";
    ctx.fillText(this.lines[this.i],180,600);
    ctx.fillStyle="#fff";
    ctx.fillText(this.lines[this.i],180,596);
  }
};

/* ================= CHARACTER ================= */
class Character{
  constructor(x,color){
    this.x=x;this.y=440;
    this.color=color;
    this.walk=0;
    this.jump=0;
  }
  update(){
    this.walk+=0.1;
    this.jump*=0.8;
  }
  beatHit(){
    this.jump=12;
  }
  draw(){
    ctx.strokeStyle=this.color;
    ctx.lineWidth=3;
    const step=Math.sin(this.walk)*6;
    const j=this.jump;

    // body
    ctx.beginPath();
    ctx.moveTo(this.x,this.y-j);
    ctx.lineTo(this.x,this.y+36-j);
    ctx.stroke();

    // legs
    ctx.beginPath();
    ctx.moveTo(this.x,this.y+36-j);
    ctx.lineTo(this.x-8,this.y+70-step-j);
    ctx.moveTo(this.x,this.y+36-j);
    ctx.lineTo(this.x+8,this.y+70+step-j);
    ctx.stroke();

    // arms
    ctx.beginPath();
    ctx.moveTo(this.x,this.y+10-j);
    ctx.lineTo(this.x-14,this.y+26+j);
    ctx.moveTo(this.x,this.y+10-j);
    ctx.lineTo(this.x+14,this.y+26-j);
    ctx.stroke();

    // head
    ctx.beginPath();
    ctx.arc(this.x,this.y-14-j,14,0,Math.PI*2);
    ctx.stroke();
  }
}

/* ================= SETUP ================= */
const hero=new Character(160,"#ff4444");
const npc=new Character(200,"#44ff88");
Camera.target=hero;

let frame=0;

/* ================= LOOP ================= */
function loop(){
  frame++;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,360,640);

  if(Beat.update(frame)){
    Camera.hit(10);
    hero.beatHit();
    npc.beatHit();
    Subs.hit();
  }

  Camera.update();
  ctx.save();
  Camera.apply();

  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,470);
  ctx.lineTo(360,470);
  ctx.stroke();

  hero.update();npc.update();
  hero.draw();npc.draw();

  ctx.restore();
  Subs.update();
  Subs.draw();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
