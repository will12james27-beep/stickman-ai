<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman v11 – Timeline Import</title>
<style>
 html,body{margin:0;background:#111;color:#fff;font-family:sans-serif}
 canvas{display:block;margin:auto;background:#1a1a1a}
 #ui{
  position:fixed;bottom:10px;left:50%;
  transform:translateX(-50%);
  display:flex;gap:6px;align-items:center
 }
 button,label{
  background:#222;color:#fff;
  border:1px solid #444;
  padding:6px 10px;cursor:pointer
 }
 input[type=range]{width:200px}
</style>
</head>
<body>

<canvas id="c" width="800" height="400"></canvas>

<div id="ui">
 <button onclick="startRecord()">⏺ REC</button>
 <button onclick="stopRecord()">■ STOP</button>
 <button onclick="startPlay()">▶ PLAY</button>
 <button onclick="exportJSON()">⬇ EXPORT</button>

 <label>
  ⬆ IMPORT
  <input type="file" accept=".json" hidden onchange="importJSON(this)">
 </label>

 <input id="slider" type="range" min="0" max="0" value="0">
</div>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const slider = document.getElementById("slider");

const MODE = { LIVE:0, RECORD:1, PLAY:2 };
let mode = MODE.LIVE;

let timeline = [];
let playI = 0;

const groundY = 300;

let stick = {
 x:400,
 y:groundY-80,
 leg:0,
 arm:0
};

function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 // ground
 ctx.strokeStyle="#444";
 ctx.beginPath();
 ctx.moveTo(0,groundY);
 ctx.lineTo(c.width,groundY);
 ctx.stroke();

 ctx.strokeStyle="#fff";
 ctx.lineWidth=3;

 // head
 ctx.beginPath();
 ctx.arc(stick.x,stick.y-30,12,0,Math.PI*2);
 ctx.stroke();

 // body
 line(stick.x,stick.y-18, stick.x,stick.y+25);

 // legs
 line(stick.x,stick.y+25,
      stick.x+Math.sin(stick.leg)*20,
      stick.y+70);

 line(stick.x,stick.y+25,
      stick.x-Math.sin(stick.leg)*20,
      stick.y+70);

 // arms
 line(stick.x,stick.y,
      stick.x+Math.sin(stick.arm)*18,
      stick.y+25);

 line(stick.x,stick.y,
      stick.x-Math.sin(stick.arm)*18,
      stick.y+25);
}

function line(x1,y1,x2,y2){
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.lineTo(x2,y2);
 ctx.stroke();
}

let t = 0;
function update(){
 if(mode===MODE.LIVE || mode===MODE.RECORD){
  t += 0.05;
  stick.leg = Math.sin(t);
  stick.arm = -Math.sin(t);

  if(mode===MODE.RECORD){
   timeline.push(JSON.parse(JSON.stringify(stick)));
   slider.max = timeline.length-1;
   slider.value = slider.max;
  }
 }

 if(mode===MODE.PLAY){
  if(timeline.length){
   stick = JSON.parse(JSON.stringify(timeline[playI]));
   slider.value = playI;
   playI++;
   if(playI>=timeline.length) mode=MODE.LIVE;
  }
 }

 draw();
 requestAnimationFrame(update);
}

function startRecord(){
 timeline=[];
 mode=MODE.RECORD;
}

function stopRecord(){
 mode=MODE.LIVE;
}

function startPlay(){
 playI=0;
 mode=MODE.PLAY;
}

function exportJSON(){
 const blob=new Blob(
  [JSON.stringify(timeline)],
  {type:"application/json"}
 );
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="stickman_timeline.json";
 a.click();
}

function importJSON(input){
 const file=input.files[0];
 if(!file)return;
 const r=new FileReader();
 r.onload=e=>{
  try{
   const data=JSON.parse(e.target.result);
   if(!Array.isArray(data)) throw 0;
   timeline=data;
   slider.max=timeline.length-1;
   slider.value=0;
   playI=0;
   alert("IMPORT OK ✔");
  }catch{
   alert("XATO JSON ❌");
  }
 };
 r.readAsText(file);
}

update();
</script>

</body>
</html>
