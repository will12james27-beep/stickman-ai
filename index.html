<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v20.1</title>
<style>
body{
  margin:0;
  background:#02080c;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
canvas{
  background:#fff;
  border-radius:12px;
}
</style>
</head>
<body>

<!-- 🔴 SHU BO‘LISHI SHART -->
<canvas id="c" width="360" height="640"></canvas>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const c=document.getElementById("c");
if(!c){
  alert("Canvas topilmadi!");
  return;
}
const ctx=c.getContext("2d");

ctx.lineCap="round";
ctx.lineWidth=4;

const ground=520;
const GRAVITY=0.9;

let debug=false;
let time=0;
let state="idle";

// ===== TIMELINE =====
let recording=false;
let timeline=[];
let playIndex=0;

// ===== JOINT =====
class Joint{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=0; this.vy=0;
  }
}

// ===== MAN =====
const man={
  hip:new Joint(180,ground-70),
  neck:new Joint(180,ground-135),
  head:new Joint(180,ground-170),
  legL:new Joint(166,ground),
  legR:new Joint(194,ground),
  armL:new Joint(140,ground-135),
  armR:new Joint(220,ground-135)
};

// ===== UTILS =====
function stick(a,b,l){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||1;
  const diff=(d-l)/d*0.5;
  a.x+=dx*diff; a.y+=dy*diff;
  b.x-=dx*diff; b.y-=dy*diff;
}

// ===== CONTROLLERS =====
function balance(){
  man.hip.y += ((ground-70)-man.hip.y)*0.25;
  man.neck.x += (man.hip.x-man.neck.x)*0.2;
}

function walk(){
  time++;
  const s=Math.sin(time*0.12);
  man.hip.x+=1.2;
  man.legL.x=man.hip.x-14+s*20;
  man.legR.x=man.hip.x+14-s*20;
  man.legL.y=ground-Math.max(0,s*12);
  man.legR.y=ground-Math.max(0,-s*12);
}

// ===== DRAW =====
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,360,640);

  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(360,ground);
  ctx.stroke();

  ctx.strokeStyle="#000";
  line(man.head,man.neck);
  line(man.neck,man.hip);
  line(man.hip,man.legL);
  line(man.hip,man.legR);
  line(man.neck,man.armL);
  line(man.neck,man.armR);

  ctx.beginPath();
  ctx.arc(man.head.x,man.head.y,14,0,Math.PI*2);
  ctx.stroke();
}

// ===== LOOP =====
function loop(){
  if(state==="walk") walk();
  balance();

  for(let i=0;i<8;i++){
    stick(man.head,man.neck,35);
    stick(man.neck,man.hip,65);
    stick(man.hip,man.legL,65);
    stick(man.hip,man.legR,65);
    stick(man.neck,man.armL,45);
    stick(man.neck,man.armR,45);
  }

  draw();
  requestAnimationFrame(loop);
}
loop();

});
</script>
</body>
</html>
