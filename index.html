<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v13.0</title>
<style>
body{
  margin:0;
  background:#050d12;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:640px;
  background:#0b1f26;
  padding:14px;
  border-radius:18px;
  box-shadow:0 0 40px #00ffff55;
}
h3{text-align:center}
.panel{
  background:#072028;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
}
.row{display:flex;gap:6px}
.row>*{flex:1}
button,select{padding:8px;border:none;border-radius:8px}
button{background:cyan;font-weight:bold;cursor:pointer}
canvas{
  display:block;
  margin:10px auto;
  background:#fff;
  width:360px;height:560px;
  border-radius:12px;
}
small{text-align:center;display:block;opacity:.6}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v13.0</h3>

<div class="panel">
<b>🎞 Scene Control</b>
<div class="row">
<button onclick="togglePlay()">⏯ Play</button>
<button onclick="togglePose()">🖐 Pose Edit</button>
<button onclick="enableMic()">🎤 Voice</button>
</div>
</div>

<div class="panel">
<b>🧱 Assets</b>
<div class="row">
<button onclick="addProp('chair')">🪑 Chair</button>
<button onclick="addProp('ball')">⚽ Ball</button>
<button onclick="addProp('car')">🚗 Car</button>
</div>
</div>

<canvas id="c"></canvas>

<small>v13.0 • Pose Editor • Face Rig • Voice • Scenes • Assets</small>
</div>

<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=360;c.height=560;
ctx.lineCap="round";ctx.lineWidth=4;

const ground=460;
let playing=true,poseEdit=false;
let micLevel=0;

class Stickman{
  constructor(x){
    this.x=x;this.y=ground;
    this.vy=0;
    this.armL={x:-18,y:-34};
    this.armR={x:18,y:-34};
    this.mouth=2;
    this.blink=0;
  }
}
const man=new Stickman(180);

const props=[];

// ===== FACE =====
function face(x,y){
  // eyes
  ctx.beginPath();
  ctx.arc(x-5,y-55,2,0,Math.PI*2);
  ctx.arc(x+5,y-55,2,0,Math.PI*2);
  ctx.fill();

  // nose
  ctx.beginPath();
  ctx.moveTo(x,y-52);
  ctx.lineTo(x,y-48);
  ctx.stroke();

  // mouth (voice)
  ctx.beginPath();
  ctx.arc(x,y-44,man.mouth,0,Math.PI);
  ctx.stroke();
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,360,560);

  // ground
  ctx.strokeStyle="#999";
  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(360,ground);
  ctx.stroke();

  // head
  ctx.strokeStyle="#000";
  ctx.beginPath();
  ctx.arc(man.x,man.y-52,14,0,Math.PI*2);
  ctx.stroke();
  face(man.x,man.y);

  // body
  ctx.beginPath();
  ctx.moveTo(man.x,man.y-38);
  ctx.lineTo(man.x,man.y-10);
  ctx.stroke();

  // arms (POSE)
  limb(man.x,man.y-34,man.armL);
  limb(man.x,man.y-34,man.armR);

  // legs
  leg(man.x-6,man.y-10);
  leg(man.x+6,man.y-10);

  // props
  props.forEach(p=>{
    if(p.type==="chair"){
      ctx.strokeRect(p.x,p.y-20,20,20);
    }
    if(p.type==="ball"){
      ctx.beginPath();
      ctx.arc(p.x,p.y,6,0,Math.PI*2);
      ctx.stroke();
    }
    if(p.type==="car"){
      ctx.strokeRect(p.x,p.y-15,40,15);
    }
  });
}

// ===== LIMBS =====
function limb(x,y,p){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+p.x,y+p.y);
  ctx.stroke();
}
function leg(x,y){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x,y+16);
  ctx.lineTo(x,y+32);
  ctx.stroke();
}

// ===== POSE EDIT =====
let drag=null;
c.onmousedown=e=>{
  if(!poseEdit) return;
  const r=c.getBoundingClientRect();
  const mx=e.clientX-r.left;
  const my=e.clientY-r.top;
  ["armL","armR"].forEach(k=>{
    const p=man[k];
    if(Math.hypot(man.x+p.x-mx,man.y+p.y-my)<10) drag=p;
  });
};
c.onmousemove=e=>{
  if(drag){
    const r=c.getBoundingClientRect();
    drag.x=e.clientX-r.left-man.x;
    drag.y=e.clientY-r.top-man.y;
  }
};
c.onmouseup=()=>drag=null;

// ===== VOICE =====
async function enableMic(){
  const s=await navigator.mediaDevices.getUserMedia({audio:true});
  const a=new AudioContext();
  const src=a.createMediaStreamSource(s);
  const an=a.createAnalyser();
  src.connect(an);
  const d=new Uint8Array(an.frequencyBinCount);
  function listen(){
    an.getByteFrequencyData(d);
    micLevel=d[2]/30;
    man.mouth=2+micLevel;
    requestAnimationFrame(listen);
  }
  listen();
}

// ===== ASSETS =====
function addProp(type){
  props.push({type,x:180,y:ground});
}

// ===== LOOP =====
function loop(){
  if(playing){
    man.blink=(man.blink+1)%200;
  }
  draw();
  requestAnimationFrame(loop);
}
loop();

function togglePlay(){playing=!playing;}
function togglePose(){poseEdit=!poseEdit;}
</script>
</body>
</html>
