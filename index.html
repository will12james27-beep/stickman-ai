<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI</title>
<style>
body {
  margin: 0;
  background: radial-gradient(#0f2b33, #07161b);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
}
.box {
  width: 320px;
  padding: 20px;
  border-radius: 20px;
  background: #0b1f26;
  box-shadow: 0 0 30px #00ffff55;
  text-align: center;
}
input, button {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}
button {
  background: cyan;
  cursor: pointer;
}
canvas {
  background: #000;
  margin-top: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>
<div class="box">
  <h2>🤖 Stickman AI</h2>
  <input id="text" placeholder="run jump">
  <button onclick="run()">Generate</button>
  <p id="status"></p>
  <canvas id="c" width="280" height="400"></canvas>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

let x = c.width / 2;
let y = c.height - 80;
const ground = c.height - 80;

let velocityY = 0;
const gravity = 0.6;

let action = 'stand';
let actions = [];
let actionIndex = 0;
let frame = 0;

function draw() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 3;

  // ===== BODY LEAN =====
  let lean = 0;
  if (action === 'run') {
    lean = Math.sin(frame * 0.15) * 6;
  }

  // ===== HEAD =====
  ctx.beginPath();
  ctx.arc(x + lean * 0.5, y - 35, 10, 0, Math.PI * 2);
  ctx.stroke();

  // ===== BODY =====
  ctx.beginPath();
  ctx.moveTo(x, y - 25);
  ctx.lineTo(x + lean, y);
  ctx.stroke();

  // ===== SHOULDER =====
  let shoulderX = x + lean;
  let shoulderY = y - 22 + Math.sin(frame * 0.15) * 2;

  // ===== ARMS =====
  const phase = frame * 0.15;

  if (action === 'jump') {
    drawArm(shoulderX, shoulderY, -1.5);
    drawArm(shoulderX, shoulderY,  1.5);
  }
  else if (action === 'run') {
    drawArm(shoulderX, shoulderY, phase + Math.PI);
    drawArm(shoulderX, shoulderY, phase);
  }
  else {
    drawArm(shoulderX, shoulderY, 0.3);
    drawArm(shoulderX, shoulderY, -0.3);
  }

  // ===== LEGS =====
  if (action === 'jump') {
    drawLeg(x - 6, y, 0);
    drawLeg(x + 6, y, 0);
  } else {
    drawLeg(x - 6, y, 0);
    drawLeg(x + 6, y, Math.PI);
  }
}

function drawArm(sx, sy, phase) {
  const upper = 14;
  const lower = 14;

  const a1 = Math.sin(phase) * 0.9;
  const a2 = Math.sin(phase + 0.6) * 0.7;

  const ex = sx + Math.sin(a1) * upper;
  const ey = sy + Math.cos(a1) * upper;

  const hx = ex + Math.sin(a2) * lower;
  const hy = ey + Math.cos(a2) * lower;

  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(ex, ey);
  ctx.lineTo(hx, hy);
  ctx.stroke();
}

// ===== NEXT STEP INCLUDED: FOOT IMPACT / WEIGHT =====
function drawLeg(hx, hy, dir) {
  const thigh = 18;
  const calf = 18;

  let phase = frame * 0.15 + dir;

  let lift = Math.max(0, Math.sin(phase)) * 4;

  const a1 = Math.sin(phase) * 0.6;
  const a2 = Math.sin(phase + 0.8) * 0.6;

  const kx = hx + Math.sin(a1) * thigh;
  const ky = hy + Math.cos(a1) * thigh - lift;

  const fx = kx + Math.sin(a2) * calf;
  const fy = ky + Math.cos(a2) * calf;

  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(kx, ky);
  ctx.lineTo(fx, fy);
  ctx.stroke();
}

function animate() {
  frame++;

  if (actions.length > 1 && frame % 120 === 0) {
    actionIndex++;
    if (actionIndex < actions.length) {
      action = actions[actionIndex];
    }
  }

  if (action === 'run') x += 1.5;

  if (action === 'jump' && y === ground) {
    velocityY = -11;
  }

  velocityY += gravity;
  y += velocityY;

  if (y > ground) {
    y = ground;
    velocityY = 0;
  }

  if (x > c.width + 20) x = -20;

  draw();
  requestAnimationFrame(animate);
}

function run() {
  const t = document.getElementById('text').value.toLowerCase();
  document.getElementById('status').innerText = 'AI is thinking...';

  actions = [];
  actionIndex = 0;
  frame = 0;

  if (t.includes('run')) actions.push('run');
  if (t.includes('jump')) actions.push('jump');
  if (actions.length === 0) actions.push('stand');

  action = actions[0];

  setTimeout(() => {
    document.getElementById('status').innerText = 'Done ✅';
  }, 400);
}

animate();
</script>
</body>
</html>
