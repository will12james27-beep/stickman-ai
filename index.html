<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v10.0.0 – Walk + Foot Lock</title>
<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
canvas{background:#fff;}
button{
  position:fixed;
  bottom:20px;
  padding:6px 16px;
}
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>
<button id="play">▶ Play</button>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const playBtn=document.getElementById("play");

let playing=false;
let t=0;

/* =====================
   STICKMAN
===================== */
const man={
  x:300,
  y:260,
  leg:{u:50,l:50},
  arm:{u:40,l:35},
  footL:{x:280,y:400,lock:true},
  footR:{x:320,y:400,lock:false}
};

/* =====================
   IK SOLVER
===================== */
function solveIK(base,target,l1,l2,flip){
  const dx=target.x-base.x;
  const dy=target.y-base.y;
  let d=Math.hypot(dx,dy);
  d=Math.min(d,l1+l2-0.001);

  const a=Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d));
  const b=Math.atan2(dy,dx);
  const ang=b+(flip?-a:a);

  return {
    j:{x:base.x+Math.cos(ang)*l1,y:base.y+Math.sin(ang)*l1},
    e:target
  };
}

/* =====================
   UPDATE (WALK LOGIC)
===================== */
function update(dt){
  t+=dt*0.005;
  const s=Math.sin(t);

  // switch foot lock
  if(s>0.99){ man.footL.lock=true; man.footR.lock=false; }
  if(s<-0.99){ man.footL.lock=false; man.footR.lock=true; }

  // move free foot
  if(!man.footL.lock){
    man.footL.x=man.x-30+s*40;
    man.footL.y=400-Math.max(0,s)*40;
  }
  if(!man.footR.lock){
    man.footR.x=man.x+30-s*40;
    man.footR.y=400-Math.max(0,-s)*40;
  }
}

/* =====================
   DRAW HELPERS
===================== */
function line(x1,y1,x2,y2){
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

/* =====================
   DRAW
===================== */
function draw(){
  ctx.clearRect(0,0,600,600);
  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.strokeStyle="#000";

  const hip={x:man.x,y:man.y};
  const sh={x:man.x,y:man.y-45};

  // arms swing
  const s=Math.sin(t);
  const Lh={x:sh.x-60-s*25,y:sh.y+20};
  const Rh={x:sh.x+60+s*25,y:sh.y+20};

  const Larm=solveIK(sh,Lh,man.arm.u,man.arm.l,false);
  const Rarm=solveIK(sh,Rh,man.arm.u,man.arm.l,true);

  const Lleg=solveIK(hip,man.footL,man.leg.u,man.leg.l,false);
  const Rleg=solveIK(hip,man.footR,man.leg.u,man.leg.l,true);

  /* BODY */
  line(sh.x,sh.y-50,sh.x,hip.y);
  ctx.beginPath();
  ctx.arc(sh.x,sh.y-80,22,0,Math.PI*2);
  ctx.stroke();

  /* ARMS */
  line(sh.x,sh.y,Larm.j.x,Larm.j.y);
  line(Larm.j.x,Larm.j.y,Larm.e.x,Larm.e.y);
  line(sh.x,sh.y,Rarm.j.x,Rarm.j.y);
  line(Rarm.j.x,Rarm.j.y,Rarm.e.x,Rarm.e.y);

  /* LEGS */
  line(hip.x,hip.y,Lleg.j.x,Lleg.j.y);
  line(Lleg.j.x,Lleg.j.y,Lleg.e.x,Lleg.e.y);
  line(hip.x,hip.y,Rleg.j.x,Rleg.j.y);
  line(Rleg.j.x,Rleg.j.y,Rleg.e.x,Rleg.e.y);
}

/* =====================
   LOOP
===================== */
let last=0;
function loop(ts){
  const dt=ts-last; last=ts;
  if(playing) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

playBtn.onclick=()=>playing=!playing;
</script>

</body>
</html>
