<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman v21-A.16 — Dialog System</title>
<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
}
canvas{background:#e6f4ff}
</style>
</head>
<body>

<canvas id="c" width="360" height="640"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

/* ================= CAMERA ================= */
const Camera={
  x:0,y:0,target:null,
  update(){
    if(this.target){
      this.x+=((this.target.x-180)-this.x)*0.1;
      this.y+=((this.target.y-320)-this.y)*0.1;
    }
  },
  apply(){
    ctx.setTransform(1,0,0,1,-this.x,-this.y);
  }
};

/* ================= SPEECH BUBBLE ================= */
function drawBubble(x,y,text){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.font="bold 16px sans-serif";
  const pad=8;
  const w=ctx.measureText(text).width+pad*2;
  const h=28;
  const bx=x-w/2;
  const by=y-h-12;

  ctx.fillStyle="#fff";
  ctx.strokeStyle="#000";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.roundRect(bx,by,w,h,10);
  ctx.fill();
  ctx.stroke();

  // tail
  ctx.beginPath();
  ctx.moveTo(x-6,by+h);
  ctx.lineTo(x,by+h+8);
  ctx.lineTo(x+6,by+h);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle="#000";
  ctx.textAlign="center";
  ctx.fillText(text,x,by+19);
}

/* ================= CHARACTER ================= */
class Character{
  constructor(name,x,color){
    this.name=name;
    this.x=x;this.y=440;
    this.color=color;
    this.walk=0;
    this.speak=null;
  }
  update(){
    this.walk+=0.1;
  }
  say(text,duration=90){
    this.speak={text,duration};
  }
  draw(){
    const step=Math.sin(this.walk)*4;

    ctx.strokeStyle=this.color;
    ctx.lineWidth=3;

    // body
    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    ctx.lineTo(this.x,this.y+36);
    ctx.stroke();

    // legs
    ctx.beginPath();
    ctx.moveTo(this.x,this.y+36);
    ctx.lineTo(this.x-8,this.y+70-step);
    ctx.moveTo(this.x,this.y+36);
    ctx.lineTo(this.x+8,this.y+70+step);
    ctx.stroke();

    // arms
    ctx.beginPath();
    ctx.moveTo(this.x,this.y+10);
    ctx.lineTo(this.x-14,this.y+26);
    ctx.moveTo(this.x,this.y+10);
    ctx.lineTo(this.x+14,this.y+26);
    ctx.stroke();

    // head
    ctx.beginPath();
    ctx.arc(this.x,this.y-14,14,0,Math.PI*2);
    ctx.stroke();

    // bubble
    if(this.speak){
      drawBubble(this.x,this.y-28,this.speak.text);
      this.speak.duration--;
      if(this.speak.duration<=0) this.speak=null;
    }
  }
}

/* ================= DIALOG QUEUE ================= */
const Dialog={
  lines:[
    {who:"A",text:"That was crazy 😳"},
    {who:"B",text:"Ha, juda telba edi 😂"},
    {who:"A",text:"Did you see that?!"}
  ],
  i:0,
  timer:0,
  next(){
    if(this.i>=this.lines.length) return;
    const l=this.lines[this.i++];
    const ch=l.who==="A"?hero:npc;
    ch.say(l.text,100);
    Camera.target=ch;
  },
  update(){
    this.timer++;
    if(this.timer===30) this.next();
    if(this.timer===150) this.next();
    if(this.timer===270) this.next();
  }
};

/* ================= SETUP ================= */
const hero=new Character("A",160,"#ff4444");
const npc =new Character("B",200,"#44ff88");
Camera.target=hero;

/* ================= LOOP ================= */
function loop(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,360,640);

  Dialog.update();
  Camera.update();

  ctx.save();
  Camera.apply();

  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,470);
  ctx.lineTo(360,470);
  ctx.stroke();

  hero.update(); npc.update();
  hero.draw(); npc.draw();

  ctx.restore();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
