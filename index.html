<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman AI v10.2.0</title>
<style>
  body { margin:0; background:#0e0e0e; overflow:hidden; }
  canvas { display:block; margin:auto; background:#1a1a1a; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
// =================== SETUP ===================
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = 700;
canvas.height = 450;

const GROUND_Y = 330;
let time = 0;

// =================== UTILS ===================
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));

// =================== SKELETON ===================
const skeleton = {
  hip:   { x: 350, y: 240 },
  spine: { x: 350, y: 190 },
  head:  { x: 350, y: 155 },

  arms: {
    L: { angle:0 },
    R: { angle:0 }
  },

  legs: {
    L: { foot:{x:330,y:GROUND_Y,lock:true} },
    R: { foot:{x:370,y:GROUND_Y,lock:false} }
  }
};

const LEG_A = 45;
const LEG_B = 45;
const ARM_LEN = 40;

// =================== IK SOLVER ===================
function solveIK(hx,hy,fx,fy){
  let dx = fx-hx, dy = fy-hy;
  let d = Math.hypot(dx,dy);
  d = clamp(d, 1, LEG_A+LEG_B-0.001);

  let a = Math.acos((LEG_A**2 + d**2 - LEG_B**2)/(2*LEG_A*d));
  let b = Math.atan2(dy,dx);

  return {
    x: hx + Math.cos(b+a)*LEG_A,
    y: hy + Math.sin(b+a)*LEG_A
  };
}

// =================== WALK CONTROLLER ===================
function updateWalk(){
  time += 0.045;

  const phase = Math.sin(time);
  const lift  = Math.max(0, Math.sin(time+Math.PI/2)) * 22;

  const L = skeleton.legs.L;
  const R = skeleton.legs.R;

  if(phase > 0){
    L.foot.lock = true;
    R.foot.lock = false;
  }else{
    L.foot.lock = false;
    R.foot.lock = true;
  }

  if(!L.foot.lock){
    L.foot.x = skeleton.hip.x - 22 + phase*32;
    L.foot.y = GROUND_Y - lift;
  }

  if(!R.foot.lock){
    R.foot.x = skeleton.hip.x + 22 - phase*32;
    R.foot.y = GROUND_Y - lift;
  }

  // HIP
  const targetHipY = (L.foot.y + R.foot.y)/2 - 65;
  skeleton.hip.y = lerp(skeleton.hip.y, targetHipY, 0.15);
  skeleton.hip.x += 0.35;

  // SPINE
  skeleton.spine.x = lerp(skeleton.spine.x, skeleton.hip.x, 0.25);
  skeleton.spine.y = lerp(skeleton.spine.y, skeleton.hip.y-50, 0.25);

  skeleton.head.x = skeleton.spine.x;
  skeleton.head.y = skeleton.spine.y - 35;

  // ===== ARMS COUNTER-SWING =====
  skeleton.arms.L.angle = -phase * 0.8;
  skeleton.arms.R.angle =  phase * 0.8;
}

// =================== RENDER ===================
function drawLeg(side,dir){
  const hipX = skeleton.hip.x + dir*10;
  const hipY = skeleton.hip.y;
  const foot = skeleton.legs[side].foot;
  const knee = solveIK(hipX,hipY,foot.x,foot.y);

  ctx.beginPath();
  ctx.moveTo(hipX,hipY);
  ctx.lineTo(knee.x,knee.y);
  ctx.lineTo(foot.x,foot.y);
  ctx.stroke();
}

function drawArm(side,dir){
  const shoulderX = skeleton.spine.x + dir*15;
  const shoulderY = skeleton.spine.y + 10;
  const a = skeleton.arms[side].angle;

  const handX = shoulderX + Math.cos(a+Math.PI/2) * ARM_LEN;
  const handY = shoulderY + Math.sin(a+Math.PI/2) * ARM_LEN;

  ctx.beginPath();
  ctx.moveTo(shoulderX, shoulderY);
  ctx.lineTo(handX, handY);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="#444";
  ctx.beginPath();
  ctx.moveTo(0,GROUND_Y);
  ctx.lineTo(canvas.width,GROUND_Y);
  ctx.stroke();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;

  // spine
  ctx.beginPath();
  ctx.moveTo(skeleton.hip.x,skeleton.hip.y);
  ctx.lineTo(skeleton.spine.x,skeleton.spine.y);
  ctx.stroke();

  // head
  ctx.beginPath();
  ctx.arc(skeleton.head.x,skeleton.head.y,12,0,Math.PI*2);
  ctx.stroke();

  // arms
  drawArm("L",-1);
  drawArm("R", 1);

  // legs
  drawLeg("L",-1);
  drawLeg("R", 1);
}

// =================== LOOP ===================
function loop(){
  updateWalk();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
