<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v9.3.0 – Foot Lock</title>
<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}
canvas{background:#fff;}
.controls{
  margin-top:6px;
  font-size:13px;
}
button{padding:4px 10px;}
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>

<div class="controls">
  <button id="play">▶ Play</button>
  <button id="pause">⏸ Pause</button>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const playBtn=document.getElementById("play");
const pauseBtn=document.getElementById("pause");

/* =====================
   STICKMAN
===================== */
const stickman={
  x:300,y:330,
  hipY:330,
  joints:{
    la:{x:0,y:-20,ang:0,len:55},
    ra:{x:0,y:-20,ang:0,len:55},
    ll:{x:0,y:60,ang:0,len:65},
    rl:{x:0,y:60,ang:0,len:65}
  }
};

let playing=false;
let t=0;

/* =====================
   FOOT LOCK STATE
===================== */
let leftFootY=null;
let rightFootY=null;

/* =====================
   DEMO WALK + FOOT LOCK
===================== */
function walk(dt){
  t+=dt*0.005;
  const s=Math.sin(t);
  const c=Math.cos(t);

  // swing angles
  stickman.joints.ll.ang=25*s;
  stickman.joints.rl.ang=-25*s;
  stickman.joints.la.ang=-20*s;
  stickman.joints.ra.ang=20*s;

  // FOOT LOCK LOGIC
  // left foot planted when sin < 0
  if(s<0){
    if(leftFootY===null) leftFootY=stickman.hipY+stickman.joints.ll.len;
    stickman.y=leftFootY-stickman.joints.ll.len;
  }else{
    leftFootY=null;
  }

  // right foot planted when sin > 0
  if(s>0){
    if(rightFootY===null) rightFootY=stickman.hipY+stickman.joints.rl.len;
    stickman.y=rightFootY-stickman.joints.rl.len;
  }else{
    rightFootY=null;
  }
}

/* =====================
   DRAW
===================== */
function limb(j){
  ctx.save();
  ctx.translate(j.x,j.y);
  ctx.rotate(j.ang*Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,j.len);
  ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,600,600);
  ctx.save();
  ctx.translate(stickman.x,stickman.y);
  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.strokeStyle="#000";

  // body
  ctx.beginPath();
  ctx.moveTo(0,-40);
  ctx.lineTo(0,60);
  ctx.stroke();

  // head
  ctx.beginPath();
  ctx.arc(0,-70,22,0,Math.PI*2);
  ctx.stroke();

  for(let k in stickman.joints) limb(stickman.joints[k]);
  ctx.restore();
}

/* =====================
   LOOP
===================== */
let last=0;
function loop(ts){
  const dt=ts-last; last=ts;
  if(playing) walk(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =====================
   CONTROLS
===================== */
playBtn.onclick=()=>playing=true;
pauseBtn.onclick=()=>playing=false;
</script>

</body>
</html>
