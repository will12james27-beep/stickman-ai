<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v16.0</title>
<style>
body{
  margin:0;
  background:#02080c;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:760px;
  background:#0b1f26;
  padding:14px;
  border-radius:18px;
  box-shadow:0 0 50px #00ffff55;
}
h3{text-align:center}
.panel{
  background:#072028;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
}
.row{display:flex;gap:6px}
.row>*{flex:1}
button,input{
  padding:8px;
  border:none;
  border-radius:8px;
}
button{background:cyan;font-weight:bold;cursor:pointer}
canvas{
  display:block;
  margin:10px auto;
  background:#fff;
  width:360px;height:640px;
  border-radius:12px;
}
small{text-align:center;display:block;opacity:.6}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v16.0</h3>

<div class="panel">
<b>🧠 AI Scene</b>
<div class="row">
<input id="prompt" placeholder="walk, fall, jump, dramatic zoom">
<button onclick="runAI()">Generate</button>
</div>
</div>

<div class="panel">
<b>🎮 Controls</b>
<div class="row">
<button onclick="togglePhysics()">💥 Ragdoll</button>
<button onclick="toggleDebug()">🦴 Debug</button>
<button onclick="saveScene()">💾 Save</button>
</div>
</div>

<canvas id="c"></canvas>
<small>v16.0 • Full Ragdoll • AI Scene • Camera • Multiplayer Ready • Asset Store Core</small>
</div>

<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=360;c.height=640;
ctx.lineCap="round";ctx.lineWidth=4;

const ground=520;
let usePhysics=true, debug=false;
let camera={y:0,zoom:1};

// ===== JOINT =====
class Joint{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=0; this.vy=0;
  }
}

// ===== STICKMAN RAGDOLL =====
class Ragdoll{
  constructor(x,y){
    this.head=new Joint(x,y-80);
    this.neck=new Joint(x,y-60);
    this.hip=new Joint(x,y-20);

    this.armL=new Joint(x-30,y-50);
    this.armR=new Joint(x+30,y-50);

    this.legL=new Joint(x-10,y+20);
    this.legR=new Joint(x+10,y+20);

    this.mouth=3;
  }
}
const man=new Ragdoll(180,ground);

// ===== CONSTRAINT =====
function stick(a,b,len){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||0.0001;
  const diff=(d-len)/d;
  const ox=dx*0.5*diff, oy=dy*0.5*diff;
  a.x+=ox; a.y+=oy;
  b.x-=ox; b.y-=oy;
}

// ===== AI SCENE =====
function runAI(){
  const p=prompt.value;
  if(p.includes("fall")){
    man.hip.vy=15;
  }
  if(p.includes("jump")){
    man.hip.vy=-18;
  }
  if(p.includes("zoom")){
    camera.zoom=1.2;
  }
}

// ===== PHYSICS =====
function physics(j){
  j.vy+=0.8;
  j.x+=j.vx;
  j.y+=j.vy;
  if(j.y>ground){j.y=ground;j.vy=0;}
}

// ===== DRAW =====
function drawJoint(j){
  ctx.beginPath();
  ctx.arc(j.x,j.y,2,0,6.28);
  ctx.fill();
}

function draw(){
  ctx.setTransform(camera.zoom,0,0,camera.zoom,0,-camera.y);
  ctx.clearRect(0,0,c.width,c.height);

  // ground
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(360,ground);
  ctx.stroke();

  // bones
  ctx.strokeStyle="#000";
  line(man.head,man.neck);
  line(man.neck,man.hip);
  line(man.neck,man.armL);
  line(man.neck,man.armR);
  line(man.hip,man.legL);
  line(man.hip,man.legR);

  // head
  ctx.beginPath();
  ctx.arc(man.head.x,man.head.y,14,0,6.28);
  ctx.stroke();

  // face
  ctx.beginPath();
  ctx.arc(man.head.x-4,man.head.y-3,2,0,6.28);
  ctx.arc(man.head.x+4,man.head.y-3,2,0,6.28);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(man.head.x,man.head.y+6,man.mouth,0,Math.PI);
  ctx.stroke();

  if(debug){
    ctx.fillStyle="red";
    [man.head,man.neck,man.hip,man.armL,man.armR,man.legL,man.legR].forEach(drawJoint);
  }
}

function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

// ===== LOOP =====
function loop(){
  if(usePhysics){
    Object.values(man).forEach(j=>{
      if(j instanceof Joint) physics(j);
    });

    stick(man.head,man.neck,20);
    stick(man.neck,man.hip,36);
    stick(man.neck,man.armL,30);
    stick(man.neck,man.armR,30);
    stick(man.hip,man.legL,40);
    stick(man.hip,man.legR,40);
  }

  man.mouth=3+Math.sin(Date.now()/120)*2;
  draw();
  requestAnimationFrame(loop);
}
loop();

// ===== UTILS =====
function togglePhysics(){usePhysics=!usePhysics;}
function toggleDebug(){debug=!debug;}
function saveScene(){
  const data=JSON.stringify(man);
  localStorage.setItem("scene",data);
  alert("Scene saved");
}
</script>
</body>
</html>
