<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v32.0 (Recorder)</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  color:white;
}
#studio{display:flex;flex-direction:column;gap:10px;align-items:center}
canvas{background:#fff;border-radius:16px}
.panel{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{padding:6px 12px;border:none;border-radius:6px;cursor:pointer}
.small{font-size:12px;opacity:.75}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="setState('run')">Run</button>
    <button onclick="queueJump()">Jump</button>
    <button onclick="setState('idle')">Idle</button>
    <button onclick="startRec()">● Rec</button>
    <button onclick="stopRec()">■ Stop</button>
  </div>
  <div class="small">Canvas → Video (WebM)</div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const W=420,H=640,ground=520;
let time=0;

// ===== CAMERA =====
const cam={x:0,tx:0,zoom:1,tz:1,shake:0};

// ===== STATE =====
let state="run", jumpQueued=false, freeze=0;

// ===== RECORDER =====
let mediaRecorder;
let recordedChunks=[];

function startRec(){
  recordedChunks=[];
  const stream=c.captureStream(60);
  mediaRecorder=new MediaRecorder(stream,{mimeType:"video/webm"});
  mediaRecorder.ondataavailable=e=>recordedChunks.push(e.data);
  mediaRecorder.onstop=saveVideo;
  mediaRecorder.start();
}

function stopRec(){
  if(mediaRecorder && mediaRecorder.state!=="inactive"){
    mediaRecorder.stop();
  }
}

function saveVideo(){
  const blob=new Blob(recordedChunks,{type:"video/webm"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="stickman_v32.webm";
  a.click();
  URL.revokeObjectURL(url);
}

// ===== INPUT =====
function setState(s){ state=s; }
function queueJump(){ jumpQueued=true; }

// ===== JOINT =====
class Joint{constructor(x,y){this.x=x;this.y=y;}}

// ===== STICKMAN =====
function createMan(x){
  return{
    hip:new Joint(x,ground-85),
    neck:new Joint(x,ground-155),
    head:new Joint(x,ground-195),
    kneeL:new Joint(x-18,ground-45),
    kneeR:new Joint(x+18,ground-45),
    footL:new Joint(x-18,ground),
    footR:new Joint(x+18,ground),
    elbowL:new Joint(x-40,ground-135),
    elbowR:new Joint(x+40,ground-135),
    handL:new Joint(x-55,ground-115),
    handR:new Joint(x+55,ground-115),
    phase:0, vel:0, vy:0, onGround:true, prev:false
  };
}
const man=createMan(200);

// ===== IK =====
function stick(a,b,l){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
  const diff=(d-l)/d*0.5;
  a.x+=dx*diff; a.y+=dy*diff;
  b.x-=dx*diff; b.y-=dy*diff;
}

// ===== RUN =====
function run(m){
  m.vel+=(2.4-m.vel)*0.08;
  m.phase+=m.vel*0.04;
  const s=Math.sin(m.phase);
  const stride=34;
  const left=s>0;

  if(left){
    m.footL.x=m.hip.x-stride; m.footL.y=ground;
    m.footR.x=m.hip.x+stride+s*24;
    m.footR.y=ground-Math.max(0,-s)*34;
  }else{
    m.footR.x=m.hip.x+stride; m.footR.y=ground;
    m.footL.x=m.hip.x-stride+s*24;
    m.footL.y=ground-Math.max(0,s)*34;
  }

  if(left!==m.prev){ cam.shake=4; freeze=2; }
  m.prev=left;

  m.hip.x+=m.vel;
  m.hip.y=ground-85-Math.abs(s)*10;

  m.neck.x=m.hip.x;
  m.neck.y=m.hip.y-70;
  m.head.x=m.neck.x;
  m.head.y=m.neck.y-40;

  m.handL.x=m.neck.x-55-s*28;
  m.handR.x=m.neck.x+55+s*28;
  m.handL.y=m.neck.y+20;
  m.handR.y=m.neck.y+20;

  cam.tx=m.hip.x-W/2;
  cam.tz=1+Math.abs(s)*0.05;

  if(jumpQueued && m.onGround){
    jumpQueued=false;
    state="jump";
    m.vy=-15;
    m.onGround=false;
    freeze=3;
  }
}

// ===== JUMP =====
function jump(m){
  m.vy+=0.8;
  m.hip.y+=m.vy;
  m.hip.x+=m.vel;

  if(m.hip.y>=ground-85){
    m.hip.y=ground-85;
    m.vy=0;
    m.onGround=true;
    cam.shake=8;
    freeze=3;
    state="run";
  }

  m.neck.y=m.hip.y-70;
  m.head.y=m.neck.y-40;
}

// ===== IDLE =====
function idle(m){
  m.vel*=0.9;
  const b=Math.sin(time*0.05);
  m.hip.y=ground-85+b*3;
  m.neck.y=m.hip.y-70;
  m.head.y=m.neck.y-40;
}

// ===== SOLVE =====
function solve(m){
  for(let i=0;i<6;i++){
    stick(m.neck,m.hip,70);
    stick(m.head,m.neck,40);
    stick(m.hip,m.kneeL,40); stick(m.kneeL,m.footL,40);
    stick(m.hip,m.kneeR,40); stick(m.kneeR,m.footR,40);
    stick(m.neck,m.elbowL,35); stick(m.elbowL,m.handL,35);
    stick(m.neck,m.elbowR,35); stick(m.elbowR,m.handR,35);
  }
}

// ===== DRAW =====
function line(a,b){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
function drawMan(m){
  ctx.beginPath(); ctx.arc(m.head.x,m.head.y,16,0,Math.PI*2); ctx.stroke();
  line(m.head,m.neck); line(m.neck,m.hip);
  line(m.hip,m.kneeL); line(m.kneeL,m.footL);
  line(m.hip,m.kneeR); line(m.kneeR,m.footR);
  line(m.neck,m.elbowL); line(m.elbowL,m.handL);
  line(m.neck,m.elbowR); line(m.elbowR,m.handR);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  cam.x+=(cam.tx-cam.x)*0.08;
  cam.zoom+=(cam.tz-cam.zoom)*0.05;
  cam.shake*=0.6;

  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.scale(cam.zoom,cam.zoom);
  ctx.translate(-W/2-cam.x+(Math.random()-0.5)*cam.shake,
                -H/2+(Math.random()-0.5)*cam.shake);

  ctx.strokeStyle="#ccc";
  ctx.beginPath(); ctx.moveTo(-2000,ground); ctx.lineTo(2000,ground); ctx.stroke();
  ctx.strokeStyle="#000";
  drawMan(man);
  ctx.restore();
}

// ===== LOOP =====
function loop(){
  if(freeze>0){ freeze--; draw(); requestAnimationFrame(loop); return; }
  time++;
  if(state==="run")run(man);
  if(state==="jump")jump(man);
  if(state==="idle")idle(man);
  solve(man);
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
