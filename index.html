<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v28.1</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
}
#studio{display:flex;flex-direction:column;gap:10px;align-items:center}
canvas{background:#fff;border-radius:16px}
.panel{display:flex;gap:6px}
button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="mode='walk'">Walk</button>
    <button onclick="mode='idle'">Idle</button>
    <button onclick="mode='wave'">Wave</button>
  </div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const W=420, H=640, ground=520;
let time=0, mode="walk", camX=0;

// ===== JOINT =====
class Joint{
  constructor(x,y){this.x=x;this.y=y;}
}

// ===== STICKMAN =====
function createMan(x){
  return{
    hip:new Joint(x,ground-80),
    neck:new Joint(x,ground-150),
    head:new Joint(x,ground-190),
    kneeL:new Joint(x-20,ground-40),
    kneeR:new Joint(x+20,ground-40),
    footL:new Joint(x-20,ground),
    footR:new Joint(x+20,ground),
    elbowL:new Joint(x-45,ground-130),
    elbowR:new Joint(x+45,ground-130),
    handL:new Joint(x-60,ground-105),
    handR:new Joint(x+60,ground-105),
    step:0
  };
}

const men=[createMan(200)];

// ===== IK =====
function stick(a,b,len){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||1;
  const diff=(d-len)/d*0.5;
  a.x+=dx*diff; a.y+=dy*diff;
  b.x-=dx*diff; b.y-=dy*diff;
}

// ===== WALK (STABLE) =====
function walk(m){
  m.step+=0.06;
  const s=Math.sin(m.step);
  const stride=28;

  const leftDown=s>0;

  if(leftDown){
    m.footL.x=m.hip.x-stride;
    m.footL.y=ground;
    m.footR.x=m.hip.x+stride+s*24;
    m.footR.y=ground-Math.max(0,-s)*30;
  }else{
    m.footR.x=m.hip.x+stride;
    m.footR.y=ground;
    m.footL.x=m.hip.x-stride+s*24;
    m.footL.y=ground-Math.max(0,s)*30;
  }

  m.hip.x+=1.2;
  m.hip.y=ground-80-Math.abs(s)*10;

  m.handL.x=m.neck.x-45-s*22;
  m.handR.x=m.neck.x+45+s*22;

  camX=m.hip.x-W/2;
}

// ===== IDLE =====
function idle(m){
  m.hip.y+=Math.sin(time*0.05)*0.4;
  m.neck.y+=Math.sin(time*0.07)*0.4;
}

// ===== WAVE =====
function wave(m){
  m.handR.y=m.neck.y-60-Math.sin(time*0.3)*30;
  m.handR.x=m.neck.x+55;
}

// ===== SOLVE =====
function solve(){
  men.forEach(m=>{
    for(let i=0;i<8;i++){
      stick(m.head,m.neck,40);
      stick(m.neck,m.hip,75);
      stick(m.hip,m.kneeL,40); stick(m.kneeL,m.footL,40);
      stick(m.hip,m.kneeR,40); stick(m.kneeR,m.footR,40);
      stick(m.neck,m.elbowL,35); stick(m.elbowL,m.handL,35);
      stick(m.neck,m.elbowR,35); stick(m.elbowR,m.handR,35);
    }
  });
}

// ===== DRAW =====
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function drawMan(m){
  ctx.beginPath();
  ctx.arc(m.head.x,m.head.y,16,0,Math.PI*2);
  ctx.stroke();

  line(m.head,m.neck);
  line(m.neck,m.hip);

  line(m.hip,m.kneeL);
  line(m.kneeL,m.footL);

  line(m.hip,m.kneeR);
  line(m.kneeR,m.footR);

  line(m.neck,m.elbowL);
  line(m.elbowL,m.handL);

  line(m.neck,m.elbowR);
  line(m.elbowR,m.handR);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  ctx.strokeStyle="#ccc";
  ctx.beginPath();
  ctx.moveTo(-camX,ground);
  ctx.lineTo(W-camX,ground);
  ctx.stroke();

  ctx.strokeStyle="#000";
  ctx.save();
  ctx.translate(-camX,0);
  men.forEach(drawMan);
  ctx.restore();
}

// ===== LOOP =====
function loop(){
  time++;
  men.forEach(m=>{
    if(mode==="walk") walk(m);
    if(mode==="idle") idle(m);
    if(mode==="wave") wave(m);
  });
  solve();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
