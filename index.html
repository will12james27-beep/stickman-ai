<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
c.width=360; c.height=640;
ctx.lineCap="round"; ctx.lineWidth=4;

const ground=520;
const GRAVITY=0.9;

let debug=false;
let time=0;
let state="idle"; // idle | walk | jump | sit | ragdoll | play

// ===== TIMELINE =====
let recording=false;
let timeline=[];
let playing=false;
let playIndex=0;

// ===== JOINT =====
class Joint{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=0; this.vy=0;
  }
}

// ===== MAN =====
class Man{
  constructor(x){
    this.hip=new Joint(x,ground-70);
    this.neck=new Joint(x,ground-135);
    this.head=new Joint(x,ground-170);
    this.legL=new Joint(x-14,ground);
    this.legR=new Joint(x+14,ground);
    this.armL=new Joint(x-36,ground-135);
    this.armR=new Joint(x+36,ground-135);
  }
}
const man=new Man(180);

// ===== CONSTRAINT =====
function stick(a,b,len){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||0.001;
  const diff=(d-len)/d;
  const ox=dx*0.5*diff, oy=dy*0.5*diff;
  a.x+=ox; a.y+=oy;
  b.x-=ox; b.y-=oy;
}

// ===== PHYSICS =====
function physics(j){
  j.vy+=GRAVITY;
  j.x+=j.vx;
  j.y+=j.vy;
  if(j.y>ground){ j.y=ground; j.vy=0; }
}

// ===== BALANCE =====
function balance(){
  man.hip.y += ((ground-70)-man.hip.y)*0.2;
  man.neck.x += (man.hip.x-man.neck.x)*0.2;
}

// ===== WALK =====
function walk(){
  time++;
  const step=Math.sin(time*0.12);
  man.hip.x+=1.2;

  man.legL.x = man.hip.x-14 + step*20;
  man.legR.x = man.hip.x+14 - step*20;

  man.legL.y = ground - Math.max(0, step*12);
  man.legR.y = ground - Math.max(0,-step*12);
}

// ===== AI COMMANDS =====
function aiCommand(cmd){
  cmd=cmd.trim();
  if(cmd==="walk") state="walk";
  if(cmd==="stop") state="idle";
  if(cmd==="jump"){
    man.hip.vy=-16;
    state="jump";
  }
  if(cmd==="sit") state="sit";
  document.getElementById("cmd").value="";
}

// ===== UI =====
function toggleRagdoll(){
  state = state==="ragdoll" ? "idle" : "ragdoll";
}
function toggleDebug(){debug=!debug;}

// ===== TIMELINE =====
function toggleRecord(){
  recording=!recording;
  if(recording) timeline=[];
}
function playTimeline(){
  if(!timeline.length) return;
  playing=true;
  state="play";
  playIndex=0;
}

// ===== DRAW =====
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(360,ground);
  ctx.stroke();

  ctx.strokeStyle="#000";
  line(man.head,man.neck);
  line(man.neck,man.hip);
  line(man.hip,man.legL);
  line(man.hip,man.legR);
  line(man.neck,man.armL);
  line(man.neck,man.armR);

  ctx.beginPath();
  ctx.arc(man.head.x,man.head.y,14,0,6.28);
  ctx.stroke();

  if(debug){
    ctx.fillStyle="red";
    Object.values(man).forEach(j=>{
      ctx.beginPath();
      ctx.arc(j.x,j.y,2,0,6.28);
      ctx.fill();
    });
  }
}

// ===== LOOP =====
function loop(){
  if(state==="play"){
    const f=timeline[playIndex++];
    if(!f){ state="idle"; }
    else Object.keys(f).forEach(k=>{
      man[k].x=f[k].x;
      man[k].y=f[k].y;
    });
  }
  else if(state==="ragdoll"){
    Object.values(man).forEach(j=>physics(j));
  }
  else{
    Object.values(man).forEach(j=>physics(j));
    if(state==="walk") walk();
    if(state==="sit") man.hip.y=ground-40;
    balance();
  }

  for(let i=0;i<8;i++){
    stick(man.head,man.neck,35);
    stick(man.neck,man.hip,65);
    stick(man.hip,man.legL,65);
    stick(man.hip,man.legR,65);
    stick(man.neck,man.armL,45);
    stick(man.neck,man.armR,45);
  }

  if(recording) timeline.push(JSON.parse(JSON.stringify(man)));

  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
