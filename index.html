<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI v7.6.4</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    background: #fff;
  }
</style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* =======================
   GLOBAL STICKMAN STATE
======================= */
const stickman = {
  x: 300,
  y: 320,
  scale: 1,
  pose: {
    head: 0,
    leftArm: -15,
    rightArm: 15,
    leftLeg: 15,
    rightLeg: -15
  }
};

/* =======================
   TIMELINE (SAFE)
======================= */
const timeline = [
  { time: 400, pose: { leftArm: -45, rightArm: 45 } },
  { time: 800, pose: { leftArm: -15, rightArm: 15 } }
];

/* =======================
   APPLY KEYFRAME
======================= */
function applyKeyframe(frame) {
  if (!frame.pose) return;
  for (let k in frame.pose) {
    if (stickman.pose[k] !== undefined) {
      stickman.pose[k] = frame.pose[k];
    }
  }
}

/* =======================
   DRAW STICKMAN
======================= */
function drawStickman(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(s.scale, s.scale);
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#000";

  // BODY
  ctx.beginPath();
  ctx.moveTo(0, -40);
  ctx.lineTo(0, 60);
  ctx.stroke();

  // HEAD
  ctx.beginPath();
  ctx.arc(0, -70, 22, 0, Math.PI * 2);
  ctx.stroke();

  // ARMS
  drawLimb(0, -20, 55, s.pose.leftArm);
  drawLimb(0, -20, 55, s.pose.rightArm);

  // LEGS
  drawLimb(0, 60, 65, s.pose.leftLeg);
  drawLimb(0, 60, 65, s.pose.rightLeg);

  ctx.restore();
}

function drawLimb(x, y, length, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, length);
  ctx.stroke();
  ctx.restore();
}

/* =======================
   RENDER LOOP (SAFE)
======================= */
function render() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStickman(stickman);
  requestAnimationFrame(render);
}
render();

/* =======================
   TIMELINE PLAYER
======================= */
let startTime = performance.now();

function playTimeline() {
  const t = performance.now() - startTime;
  timeline.forEach(f => {
    if (!f.done && t >= f.time) {
      applyKeyframe(f);
      f.done = true;
    }
  });
}
setInterval(playTimeline, 16);
</script>

</body>
</html>
