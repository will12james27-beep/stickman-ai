<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman Studio v37.0 — Timeline Core</title>
<style>
body{
 margin:0;
 background:#0b0f14;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:Arial;
 color:white;
}
#studio{
 display:flex;
 flex-direction:column;
 gap:8px;
 align-items:center;
}
canvas{
 background:#fff;
 border-radius:16px;
}
.small{font-size:12px;opacity:.7}
</style>
</head>
<body>

<div id="studio">
 <div class="small">v37.0 — Timeline core (no UI)</div>
 <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const W=420,H=640,ground=520;

// ===== JOINT =====
class Joint{
 constructor(x,y){this.x=x;this.y=y;}
 clone(){return new Joint(this.x,this.y);}
}

// ===== ENGINE =====
function stick(a,b,l){
 const dx=b.x-a.x,dy=b.y-a.y;
 const d=Math.hypot(dx,dy)||1;
 const diff=(d-l)/d*0.5;
 a.x+=dx*diff; a.y+=dy*diff;
 b.x-=dx*diff; b.y-=dy*diff;
}

function createMan(x){
 return{
  hip:new Joint(x,ground-85),
  neck:new Joint(x,ground-155),
  head:new Joint(x,ground-195),

  kneeL:new Joint(x-18,ground-45),
  kneeR:new Joint(x+18,ground-45),
  footL:new Joint(x-18,ground),
  footR:new Joint(x+18,ground),

  elbowL:new Joint(x-40,ground-135),
  elbowR:new Joint(x+40,ground-135),
  handL:new Joint(x-60,ground-115),
  handR:new Joint(x+60,ground-115),
 };
}

// ===== POSE UTILS =====
function clonePose(m){
 const p={};
 for(let k in m) p[k]=m[k].clone();
 return p;
}

function applyPose(m,p){
 for(let k in p){
  m[k].x=p[k].x;
  m[k].y=p[k].y;
 }
}

// ===== TIMELINE =====
const timeline={
 duration:120,
 tracks:{
  man0:[]
 }
};

function addKeyframe(frame,pose){
 timeline.tracks.man0.push({frame,pose});
 timeline.tracks.man0.sort((a,b)=>a.frame-b.frame);
}

// ===== INITIAL KEYFRAMES =====
const man=createMan(210);

addKeyframe(0,clonePose(man));

// ikkinchi pose (qo‘llar ochiq)
man.handL.x-=40;
man.handR.x+=40;
addKeyframe(60,clonePose(man));

// ===== SOLVE =====
function solve(m){
 for(let i=0;i<6;i++){
  stick(m.neck,m.hip,70);
  stick(m.head,m.neck,40);
  stick(m.hip,m.kneeL,40);
  stick(m.kneeL,m.footL,40);
  stick(m.hip,m.kneeR,40);
  stick(m.kneeR,m.footR,40);
  stick(m.neck,m.elbowL,35);
  stick(m.elbowL,m.handL,35);
  stick(m.neck,m.elbowR,35);
  stick(m.elbowR,m.handR,35);
 }
}

// ===== DRAW =====
function line(a,b){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
}

function drawMan(m){
 ctx.beginPath();
 ctx.arc(m.head.x,m.head.y,14,0,Math.PI*2);
 ctx.stroke();

 line(m.head,m.neck);
 line(m.neck,m.hip);
 line(m.hip,m.kneeL);
 line(m.kneeL,m.footL);
 line(m.hip,m.kneeR);
 line(m.kneeR,m.footR);
 line(m.neck,m.elbowL);
 line(m.elbowL,m.handL);
 line(m.neck,m.elbowR);
 line(m.elbowR,m.handR);
}

// ===== PLAYBACK =====
let frame=0;

function loop(){
 frame=(frame+1)%timeline.duration;

 // hozircha: eng yaqin keyframe
 const keys=timeline.tracks.man0;
 let current=keys[0];
 for(let k of keys){
  if(k.frame<=frame) current=k;
 }

 applyPose(man,current.pose);
 solve(man);

 ctx.clearRect(0,0,W,H);
 ctx.strokeStyle="#ccc";
 ctx.beginPath();
 ctx.moveTo(0,ground);
 ctx.lineTo(W,ground);
 ctx.stroke();

 ctx.strokeStyle="#000";
 drawMan(man);

 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
