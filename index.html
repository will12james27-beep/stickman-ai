<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v15.0</title>
<style>
body{
  margin:0;
  background:#02080c;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:720px;
  background:#0b1f26;
  padding:14px;
  border-radius:18px;
  box-shadow:0 0 50px #00ffff55;
}
h3{text-align:center}
.panel{
  background:#072028;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
}
.row{display:flex;gap:6px}
.row>*{flex:1}
button,input{
  padding:8px;
  border:none;
  border-radius:8px;
}
button{background:cyan;font-weight:bold;cursor:pointer}
canvas{
  display:block;
  margin:10px auto;
  background:#fff;
  width:360px;height:640px;
  border-radius:12px;
}
small{text-align:center;display:block;opacity:.6}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v15.0</h3>

<div class="panel">
<b>🎮 Controls</b>
<div class="row">
<button onclick="togglePlay()">⏯ Play</button>
<button onclick="togglePhysics()">💥 Physics</button>
<button onclick="enableMic()">🎤 Voice</button>
</div>
</div>

<canvas id="c"></canvas>
<small>v15.0 • Ragdoll • Lip Sync • Face Rig FIX • Cloud Ready</small>
</div>

<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=360;c.height=640;
ctx.lineCap="round";ctx.lineWidth=4;

const ground=520;
let playing=true,usePhysics=true;
let micLevel=0;

// ===== CHARACTER =====
class Stickman{
  constructor(x){
    this.x=x; this.y=ground;
    this.vy=0;
    this.mouth=2;
  }
}
const man=new Stickman(180);

// ===== FACE (FIXED) =====
function drawFace(hx,hy){
  // eyes
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.arc(hx-5,hy-3,2,0,Math.PI*2);
  ctx.arc(hx+5,hy-3,2,0,Math.PI*2);
  ctx.fill();

  // nose
  ctx.beginPath();
  ctx.moveTo(hx,hy);
  ctx.lineTo(hx,hy+4);
  ctx.stroke();

  // mouth (lip sync)
  ctx.beginPath();
  ctx.arc(hx,hy+8,man.mouth,0,Math.PI);
  ctx.stroke();
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  // ground
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(360,ground);
  ctx.stroke();

  // HEAD
  const hx=man.x;
  const hy=man.y-72;
  ctx.strokeStyle="#000";
  ctx.beginPath();
  ctx.arc(hx,hy,16,0,Math.PI*2);
  ctx.stroke();
  drawFace(hx,hy);

  // BODY
  ctx.beginPath();
  ctx.moveTo(man.x,man.y-56);
  ctx.lineTo(man.x,man.y-20);
  ctx.stroke();

  // ARMS
  limb(man.x,man.y-48, -20, 20);
  limb(man.x,man.y-48,  20, 20);

  // LEGS
  leg(man.x-6,man.y-20);
  leg(man.x+6,man.y-20);
}

function limb(x,y,dx,dy){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+dx,y+dy);
  ctx.stroke();
}
function leg(x,y){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x,y+18);
  ctx.lineTo(x,y+36);
  ctx.stroke();
}

// ===== VOICE → LIP SYNC =====
async function enableMic(){
  const s=await navigator.mediaDevices.getUserMedia({audio:true});
  const a=new AudioContext();
  const src=a.createMediaStreamSource(s);
  const an=a.createAnalyser();
  src.connect(an);
  const d=new Uint8Array(an.frequencyBinCount);
  function listen(){
    an.getByteFrequencyData(d);
    micLevel=d[2]/20;
    man.mouth=2+micLevel;
    requestAnimationFrame(listen);
  }
  listen();
}

// ===== LOOP =====
function loop(){
  if(playing && usePhysics){
    man.vy+=0.8;
    man.y+=man.vy;
    if(man.y>ground){man.y=ground;man.vy=0;}
  }
  draw();
  requestAnimationFrame(loop);
}
loop();

function togglePlay(){playing=!playing;}
function togglePhysics(){usePhysics=!usePhysics;}
</script>
</body>
</html>
