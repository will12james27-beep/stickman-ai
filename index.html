<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v10.2</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#06161b;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:520px;
  max-width:95%;
  background:#0b1f26;
  padding:16px;
  border-radius:20px;
  box-shadow:0 0 40px #00ffff55;
}
h3{text-align:center}
input,button{
  width:100%;
  padding:9px;
  margin-top:6px;
  border-radius:8px;
  border:none;
}
button{background:cyan;cursor:pointer;font-weight:bold}
canvas{
  display:block;
  margin:12px auto;
  background:#fff;
  width:360px;
  height:560px;
  border-radius:12px;
}
.row{display:flex;gap:8px}
.row>*{flex:1}
.hidden{display:none}
small{text-align:center;opacity:.7;display:block}
</style>
</head>

<body>
<div class="box">

<h3>🎬 Stickman AI – STUDIO v10.2</h3>

<div id="loginBox">
<input id="username" placeholder="Username">
<button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">

<div style="display:flex;justify-content:space-between">
<b id="userLabel"></b>
<button onclick="logout()" style="width:auto">Logout</button>
</div>

<input id="aiText" placeholder="girl run 2 jump 1 | boy stand 3 | camera follow | background sky">

<div class="row">
<button onclick="parseAI()">🧠 Generate</button>
<button onclick="togglePlay()">⏯ Pause</button>
</div>

<canvas id="c"></canvas>

<small>v10.2 • Animation Fix • Jump • Scene • Camera</small>
</div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const dpr=window.devicePixelRatio||1;
c.width=360*dpr; c.height=560*dpr;
ctx.scale(dpr,dpr);
ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=3;

const ground=440;
let camX=0, playing=true;
let cameraMode="follow", background="street";

// ===== LOGIN =====
function login(){
  localStorage.setItem("user",username.value||"guest");
  start();
}
function logout(){localStorage.clear();location.reload();}
function start(){
  const u=localStorage.getItem("user");
  if(!u) return;
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");
  userLabel.innerText=u;
}
start();

// ===== STICKMAN =====
class Stickman{
  constructor(x,type){
    this.baseX=x; this.x=x; this.y=ground;
    this.vy=0;
    this.type=type;
    this.timeline=[];
    this.ti=0; this.tf=0;
    this.dir=1; this.speed=1;
    this.action="stand";
  }
}
const girl=new Stickman(140,"girl");
const boy=new Stickman(220,"boy");
const chars=[girl,boy];

// ===== DRAW =====
function drawBG(){
  ctx.fillStyle=background==="sky"?"#bde7ff":"#eaeaea";
  ctx.fillRect(0,0,360,560);
}

function draw(ch){
  const x=ch.x-camX;
  let swing=0;

  if(ch.action==="run") swing=Math.sin(ch.tf*0.25)*12;
  if(ch.action==="stand") swing=Math.sin(ch.tf*0.05)*2;

  // head
  ctx.beginPath();
  ctx.arc(x,ch.y-50,12,0,Math.PI*2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.moveTo(x,ch.y-38);
  ctx.lineTo(x,ch.y-10);
  ctx.stroke();

  // arms
  limb(x,ch.y-32,swing*0.03);
  limb(x,ch.y-32,-swing*0.03);

  // legs
  leg(x-5,ch.y-10,swing*0.04);
  leg(x+5,ch.y-10,-swing*0.04);
}

function limb(x,y,a){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*16,y+Math.cos(a)*16);
  ctx.stroke();
}
function leg(x,y,a){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*14,y+28);
  ctx.stroke();
}

// ===== ENGINE =====
function animate(){
  if(playing){
    chars.forEach(ch=>{
      const cur=ch.timeline[ch.ti]||{action:"stand",frames:9999};
      ch.action=cur.action;
      ch.tf++;

      if(ch.tf>cur.frames){
        ch.tf=0;
        ch.ti++;
      }

      if(ch.action==="run") ch.x+=ch.speed*ch.dir;
      if(ch.action==="jump" && ch.vy===0) ch.vy=-12;

      ch.vy+=0.6;
      ch.y+=ch.vy;
      if(ch.y>ground){ch.y=ground;ch.vy=0;}
    });
  }

  if(cameraMode==="follow"){
    const center=(girl.x+boy.x)/2-180;
    camX+=(center-camX)*0.1;
  }

  drawBG();
  chars.forEach(draw);
  requestAnimationFrame(animate);
}
animate();

// ===== AI PARSER =====
function parseAI(){
  chars.forEach(ch=>{
    ch.timeline=[];
    ch.ti=0; ch.tf=0;
    ch.x=ch.baseX;
    ch.y=ground;
    ch.vy=0;
  });

  aiText.value.toLowerCase().split("|").forEach(b=>{
    const p=b.trim().split(" ");
    if(p[0]==="background") background=p[1];
    else if(p[0]==="camera") cameraMode=p[1];
    else{
      const ch=p[0]==="girl"?girl:boy;
      for(let i=1;i<p.length;i+=2){
        ch.timeline.push({
          action:p[i],
          frames:(parseFloat(p[i+1])||1)*60
        });
      }
    }
  });
}

function togglePlay(){playing=!playing;}
</script>
</body>
</html>
