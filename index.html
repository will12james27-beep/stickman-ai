<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v17.4</title>
<style>
body{
  margin:0;
  background:#02080c;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:780px;
  background:#0b1f26;
  padding:14px;
  border-radius:18px;
  box-shadow:0 0 50px #00ffff55;
}
h3{text-align:center}
.panel{
  background:#072028;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
}
.row{display:flex;gap:6px}
.row>*{flex:1}
button{
  padding:8px;
  border:none;
  border-radius:8px;
  background:cyan;
  font-weight:bold;
  cursor:pointer;
}
canvas{
  display:block;
  margin:10px auto;
  background:#fff;
  width:360px;height:640px;
  border-radius:12px;
}
small{text-align:center;display:block;opacity:.6}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v17.4</h3>

<div class="panel">
<b>🎮 Controls</b>
<div class="row">
<button onclick="toggleRagdoll()">💥 Ragdoll</button>
<button onclick="toggleDebug()">🦴 Debug</button>
</div>
</div>

<canvas id="c"></canvas>
<small>v17.4 • Standing Controller • No Auto Fall • Clean Ragdoll Switch</small>
</div>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = 360;
c.height = 640;
ctx.lineCap = "round";
ctx.lineWidth = 4;

const ground = 520;
const GRAVITY = 0.8;

let ragdoll = false;
let debug = false;

// ===== JOINT =====
class Joint{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=0; this.vy=0;
  }
}

// ===== RAGDOLL =====
class Man{
  constructor(x,y){
    this.hip  = new Joint(x, y-60);
    this.neck = new Joint(x, y-120);
    this.head = new Joint(x, y-150);

    this.legL = new Joint(x-14, ground);
    this.legR = new Joint(x+14, ground);

    this.armL = new Joint(x-36, y-120);
    this.armR = new Joint(x+36, y-120);

    this.rootX = x;
  }
}
const man = new Man(180, ground);

// ===== CONSTRAINT =====
function stick(a,b,len){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||0.0001;
  const diff=(d-len)/d;
  const ox=dx*0.5*diff, oy=dy*0.5*diff;
  a.x+=ox; a.y+=oy;
  b.x-=ox; b.y-=oy;
}

// ===== PHYSICS =====
function physics(j){
  j.vy += GRAVITY;
  j.x += j.vx;
  j.y += j.vy;
}

// ===== STANDING CONTROLLER (KEY FIX) =====
function standingController(){
  // feet locked
  man.legL.y = ground;
  man.legR.y = ground;

  // hip vertical support
  man.hip.y += ((ground-60) - man.hip.y) * 0.25;
  man.hip.x += (man.rootX - man.hip.x) * 0.2;

  // neck upright
  man.neck.x += (man.hip.x - man.neck.x) * 0.15;
}

// ===== DRAW =====
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(360,ground);
  ctx.stroke();

  ctx.strokeStyle="#000";
  line(man.head,man.neck);
  line(man.neck,man.hip);
  line(man.hip,man.legL);
  line(man.hip,man.legR);
  line(man.neck,man.armL);
  line(man.neck,man.armR);

  ctx.beginPath();
  ctx.arc(man.head.x,man.head.y,14,0,6.28);
  ctx.stroke();

  if(debug){
    ctx.fillStyle="red";
    Object.values(man).forEach(j=>{
      if(j instanceof Joint){
        ctx.beginPath();
        ctx.arc(j.x,j.y,2,0,6.28);
        ctx.fill();
      }
    });
  }
}

// ===== LOOP =====
function loop(){
  if(ragdoll){
    Object.values(man).forEach(j=>{
      if(j instanceof Joint) physics(j);
    });
  } else {
    standingController();
  }

  for(let i=0;i<8;i++){
    stick(man.head,man.neck,30);
    stick(man.neck,man.hip,60);
    stick(man.hip,man.legL,60);
    stick(man.hip,man.legR,60);
    stick(man.neck,man.armL,40);
    stick(man.neck,man.armR,40);
  }

  draw();
  requestAnimationFrame(loop);
}
loop();

// ===== UI =====
function toggleRagdoll(){ragdoll=!ragdoll;}
function toggleDebug(){debug=!debug;}
</script>
</body>
</html>
