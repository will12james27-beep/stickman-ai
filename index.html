<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman v19-A — Hand Drawn Style</title>
<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}
canvas{background:#181818;margin-top:10px;}
.ui{margin:10px;display:flex;gap:6px;flex-wrap:wrap}
button{
  padding:6px 10px;
  background:#222;
  color:#fff;
  border:1px solid #444;
  cursor:pointer;
}
button:hover{background:#333}
</style>
</head>
<body>

<canvas id="c" width="360" height="540"></canvas>

<div class="ui">
  <button onclick="setPreset('neutral')">😐</button>
  <button onclick="setPreset('happy')">🙂</button>
  <button onclick="setPreset('surprised')">😮</button>
  <button onclick="setPreset('angry')">😠</button>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let t=0;

// ===== STICK =====
const stick={
  x:180,y:260,
  headR:16,
  body:40,
  leg:35,
  armU:22,
  armL:20
};

// ===== TARGET / STATE =====
let target={eyeOpen:1,eyeScale:1,mouthOpen:0,brow:0,armLift:0};
let state={...target};

// ===== PRESETS =====
const presets={
  neutral:{eyeOpen:1,eyeScale:1,mouthOpen:0,brow:0,armLift:0},
  happy:{eyeOpen:0.7,eyeScale:0.9,mouthOpen:0.4,brow:0.2,armLift:0.3},
  surprised:{eyeOpen:1.4,eyeScale:1.3,mouthOpen:1,brow:1,armLift:1},
  angry:{eyeOpen:0.5,eyeScale:0.8,mouthOpen:0.25,brow:-1,armLift:-0.5}
};

function setPreset(name){
  Object.assign(target,presets[name]);
}

// ===== JITTER =====
function jitter(v,amt){ return v+(Math.random()-0.5)*amt; }

// ===== SECONDARY =====
function follow(){
  for(let k in state){
    state[k]+= (target[k]-state[k])*0.2;
  }
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle="#fff";
  ctx.lineCap="round";

  const wob=Math.sin(t*0.1)*0.5;

  // dynamic line width
  ctx.lineWidth=2+jitter(0.5,0.6);

  // body
  line(stick.x,stick.y, stick.x+jitter(0,0.4), stick.y+stick.body);

  // legs
  line(stick.x,stick.y+stick.body,
       stick.x-15+jitter(0,0.6),
       stick.y+stick.body+stick.leg);
  line(stick.x,stick.y+stick.body,
       stick.x+15+jitter(0,0.6),
       stick.y+stick.body+stick.leg);

  // arms
  const shoulderY=stick.y+5;
  const lift=-state.armLift*25+wob;
  arm(stick.x-2,shoulderY,-1,lift);
  arm(stick.x+2,shoulderY,1,lift);

  // head
  circle(stick.x,stick.y-stick.headR,stick.headR+jitter(0,0.4));

  face();

  t++;
}

function line(x1,y1,x2,y2){
  ctx.beginPath();
  ctx.moveTo(jitter(x1,0.5),jitter(y1,0.5));
  ctx.lineTo(jitter(x2,0.5),jitter(y2,0.5));
  ctx.stroke();
}

function circle(x,y,r){
  ctx.beginPath();
  ctx.arc(jitter(x,0.4),jitter(y,0.4),r,0,Math.PI*2);
  ctx.stroke();
}

function arm(x,y,dir,lift){
  const ex=x+dir*stick.armU;
  const ey=y+lift;
  const hx=ex+dir*stick.armL;
  const hy=ey+lift*0.6;
  line(x,y,ex,ey);
  line(ex,ey,hx,hy);
}

function face(){
  const hx=stick.x;
  const hy=stick.y-stick.headR;

  // eyes
  ctx.beginPath();
  ctx.ellipse(jitter(hx-6,0.3),jitter(hy-3,0.3),
    3*state.eyeScale,3*state.eyeOpen,0,0,Math.PI*2);
  ctx.ellipse(jitter(hx+6,0.3),jitter(hy-3,0.3),
    3*state.eyeScale,3*state.eyeOpen,0,0,Math.PI*2);
  ctx.stroke();

  // brows
  line(hx-10,hy-8-state.brow*4, hx-2,hy-6-state.brow*4);
  line(hx+2,hy-6-state.brow*4, hx+10,hy-8-state.brow*4);

  // mouth
  ctx.beginPath();
  ctx.arc(hx,hy+7,5,0,Math.PI*state.mouthOpen);
  ctx.stroke();
}

// ===== LOOP =====
function loop(){
  follow();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
