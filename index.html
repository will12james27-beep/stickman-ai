<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman – Scene System 21 C.1</title>
<style>
  body {
    margin: 0;
    background: #111;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #fff;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
// =========================
// CANVAS SETUP
// =========================
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// =========================
// SCENE SYSTEM
// =========================
const scene = {
  width: 3000,
  height: 1500,
  groundY: 900
};

// =========================
// CAMERA (21 C.1)
// =========================
const camera = {
  x: 0,
  y: 0,
  zoom: 1
};

function camX(x) {
  return (x - camera.x) * camera.zoom;
}
function camY(y) {
  return (y - camera.y) * camera.zoom;
}

// =========================
// STICKMAN DATA
// =========================
const stickman = {
  x: 400,
  y: scene.groundY - 120,
  headR: 18,
  body: 50,
  arm: 40,
  leg: 45
};

// =========================
// DRAW STICKMAN
// =========================
function drawStickman(p) {
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#000";

  const headX = p.x;
  const headY = p.y;

  // Head
  ctx.beginPath();
  ctx.arc(camX(headX), camY(headY), p.headR * camera.zoom, 0, Math.PI * 2);
  ctx.stroke();

  // Body
  ctx.beginPath();
  ctx.moveTo(camX(headX), camY(headY + p.headR));
  ctx.lineTo(camX(headX), camY(headY + p.headR + p.body));
  ctx.stroke();

  const bodyEndY = headY + p.headR + p.body;

  // Arms
  ctx.beginPath();
  ctx.moveTo(camX(headX), camY(headY + p.headR + 10));
  ctx.lineTo(camX(headX - p.arm), camY(headY + p.headR + 25));
  ctx.moveTo(camX(headX), camY(headY + p.headR + 10));
  ctx.lineTo(camX(headX + p.arm), camY(headY + p.headR + 25));
  ctx.stroke();

  // Legs
  ctx.beginPath();
  ctx.moveTo(camX(headX), camY(bodyEndY));
  ctx.lineTo(camX(headX - p.leg), camY(bodyEndY + p.leg));
  ctx.moveTo(camX(headX), camY(bodyEndY));
  ctx.lineTo(camX(headX + p.leg), camY(bodyEndY + p.leg));
  ctx.stroke();
}

// =========================
// DRAW GROUND
// =========================
function drawGround() {
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#777";

  ctx.beginPath();
  ctx.moveTo(camX(0), camY(scene.groundY));
  ctx.lineTo(camX(scene.width), camY(scene.groundY));
  ctx.stroke();
}

// =========================
// UPDATE CAMERA (STATIC FOR 21 C.1)
// =========================
function updateCamera() {
  // 21 C.1 da kamera faqat mavjud
  // follow yo‘q (keyingi etapda)
}

// =========================
// MAIN LOOP
// =========================
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  updateCamera();
  drawGround();
  drawStickman(stickman);

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
