<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – Level 3 REAL</title>
<style>
body{
  margin:0;
  background:radial-gradient(#0f2b33,#07161b);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  font-family:Arial;
  color:#fff;
  padding:10px;
}
.box{
  width:420px;
  max-height:95vh;
  overflow:auto;
  padding:14px;
  border-radius:18px;
  background:#0b1f26;
  box-shadow:0 0 30px #00ffff55;
}
h3{text-align:center;margin:6px 0}
input,button{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:none;
  font-size:14px;
}
button{background:cyan;cursor:pointer}
canvas{
  display:block;
  background:#fff;
  margin-top:10px;
  border-radius:10px;
  width:100%;
  height:auto;
}
.timeline{
  margin-top:10px;
  background:#07161b;
  padding:8px;
  border-radius:10px;
  font-size:13px;
}
.timeline span{
  display:inline-block;
  background:#00ffff33;
  padding:4px 8px;
  border-radius:6px;
  margin:2px;
}
small{opacity:.7;display:block;text-align:center;margin-top:6px}
</style>
</head>

<body>
<div class="box">
  <h3>🎬 Stickman AI – REAL LEVEL</h3>

  <!-- AI TEXT INPUT -->
  <input id="text" placeholder="run 2 jump 1 stand 2">

  <button onclick="generate()">🧠 Generate Timeline</button>
  <button onclick="startRecord()">🎥 Start Recording</button>
  <button onclick="stopRecord()">⏹ Save Video</button>

  <div class="timeline" id="timelineUI"></div>

  <canvas id="c" width="360" height="600"></canvas>

  <small>Text → Timeline → Scene → Video</small>
</div>

<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
ctx.lineCap="round";ctx.lineJoin="round";
const ground=c.height-100;

// ===== STICKMAN CLASS =====
class Stickman{
  constructor(x,type){
    this.x=x;
    this.y=ground;
    this.vy=0;
    this.action='stand';
    this.type=type;
  }
}

const characters=[
  new Stickman(c.width*0.35,'girl'),
  new Stickman(c.width*0.65,'boy')
];

let frame=0;
let timeline=[];
let timeIndex=0;
let actionFrame=0;

// ===== VIDEO =====
let recorder,chunks=[];
function startRecord(){
  recorder=new MediaRecorder(c.captureStream(60));
  chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    a.download='stickman_real.webm';
    a.click();
  };
  recorder.start();
}
function stopRecord(){recorder&&recorder.stop();}

// ===== DRAW =====
function drawStickman(ch){
  let walk=Math.sin(frame*0.12);
  let lean=ch.action==='run'?walk*10:0;

  // HEAD
  ctx.beginPath();
  ctx.arc(ch.x+lean*.3,ch.y-45,12,0,Math.PI*2);
  ctx.stroke();

  // FACE
  ctx.beginPath();
  ctx.arc(ch.x+lean*.3,ch.y-42,4,0,Math.PI);
  ctx.stroke();

  // HAIR
  if(ch.type==='girl'){
    ctx.beginPath();
    ctx.moveTo(ch.x+6,ch.y-58);
    ctx.quadraticCurveTo(ch.x+30,ch.y-48,ch.x+20,ch.y-28);
    ctx.stroke();
  }

  // BODY
  ctx.beginPath();
  ctx.moveTo(ch.x,ch.y-30);
  ctx.lineTo(ch.x,ch.y+20);
  ctx.stroke();

  // ARMS
  limb(ch.x,ch.y-25,walk);
  limb(ch.x,ch.y-25,walk+Math.PI);

  // LEGS
  leg(ch.x-6,ch.y+20,walk);
  leg(ch.x+6,ch.y+20,walk+Math.PI);
}

function limb(x,y,p){
  let a=Math.sin(p)*.6;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*16,y+Math.cos(a)*16);
  ctx.stroke();
}
function leg(x,y,p){
  let s=Math.sin(p)*.6;
  let lift=Math.max(0,Math.sin(p))*6;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(s)*14,y+16-lift);
  ctx.lineTo(x+Math.sin(s)*14,y+30);
  ctx.stroke();
}

// ===== ENGINE =====
function animate(){
  frame++;

  // WHITE BG (video-safe)
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.strokeStyle="#000";
  ctx.lineWidth=3;

  if(timeline.length){
    let cur=timeline[timeIndex];
    characters.forEach(ch=>ch.action=cur.action);
    actionFrame++;
    if(actionFrame>cur.frames){
      actionFrame=0;
      timeIndex=(timeIndex+1)%timeline.length;
    }
  }

  characters.forEach(ch=>{
    if(ch.action==='run') ch.x+=1;
    if(ch.action==='jump'&&ch.y===ground) ch.vy=-11;
    ch.vy+=0.6;
    ch.y+=ch.vy;
    if(ch.y>ground){ch.y=ground;ch.vy=0;}
    drawStickman(ch);
  });

  requestAnimationFrame(animate);
}

// ===== TEXT → TIMELINE =====
function generate(){
  timeline=[];
  timeIndex=0;
  actionFrame=0;
  document.getElementById('timelineUI').innerHTML='';

  let parts=document.getElementById('text').value.toLowerCase().split(' ');
  for(let i=0;i<parts.length;i+=2){
    let act=parts[i];
    let sec=parseFloat(parts[i+1])||1;
    timeline.push({action:act,frames:sec*60});

    let span=document.createElement('span');
    span.textContent=`${act} (${sec}s)`;
    document.getElementById('timelineUI').appendChild(span);
  }
}

animate();
</script>
</body>
</html>
