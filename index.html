<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>21 C.33 Scene Entry Exit</title>
<style>
body{margin:0;background:#111;}
canvas{display:block;margin:auto;background:#fff;}
</style>
</head>
<body>

<canvas id="c" width="720" height="480"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
function lerp(a,b,t){return a+(b-a)*t}

/* ======================
   CHAR
====================== */
function Char(x){
 return{ x,y:260,active:false }
}
const chars=[
 new Char(180),
 new Char(360),
 new Char(540)
];

/* ======================
   CAMERA
====================== */
const cam={x:0,zoom:1};

/* ======================
   SCENE SCRIPT
====================== */
let t=0;
const script=[
 {t:20,type:"enter",c:0},
 {t:40,type:"enter",c:1},
 {t:60,type:"enter",c:2},
 {t:140,type:"exit", c:1}
];

/* ======================
   LOOP
====================== */
function loop(){
 ctx.clearRect(0,0,c.width,c.height);
 t++;

 script.forEach(s=>{
  if(s.t===t){
   if(s.type==="enter") chars[s.c].active=true;
   if(s.type==="exit")  chars[s.c].active=false;
  }
 });

 const active=chars.filter(c=>c.active);
 if(active.length){
  const min=Math.min(...active.map(c=>c.x));
  const max=Math.max(...active.map(c=>c.x));
  cam.x=lerp(cam.x,(min+max)/2-c.width/2,0.08);
  cam.zoom=lerp(cam.zoom,1-0.05*(active.length-1),0.05);
 }

 ctx.save();
 ctx.translate(-cam.x,0);
 ctx.scale(cam.zoom,cam.zoom);

 chars.forEach(c=>{
  if(!c.active) return;
  ctx.beginPath();
  ctx.arc(c.x,c.y-40,28,0,6.3);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(c.x,c.y-10);
  ctx.lineTo(c.x,c.y+90);ctx.stroke();
 });

 ctx.restore();
 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
