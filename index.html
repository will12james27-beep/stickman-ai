<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman v21-A.13 — Arms Fix + Shorts Captions</title>
<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
}
canvas{background:#e6f4ff;}
</style>
</head>
<body>

<canvas id="c" width="360" height="640"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

/* ================= CAMERA ================= */
const Camera={
  x:0,y:0,zoom:1,cutscene:false,target:null,
  update(){
    if(this.target){
      this.x+=((this.target.x-c.width/2)-this.x)*0.1;
      this.y+=((this.target.y-c.height/2)-this.y)*0.1;
    }
    this.zoom+=((this.cutscene?1.3:1)-this.zoom)*0.05;
  },
  apply(){
    ctx.setTransform(this.zoom,0,0,this.zoom,-this.x*this.zoom,-this.y*this.zoom);
  }
};

/* ================= MODEL ================= */
const model={head:14,body:36,leg:30,armU:18,armL:16};

/* ================= EMOTIONS ================= */
const emotions={
  neutral:{arm:0},
  happy:{arm:10},
  shock:{arm:-14}
};

/* ================= SUBTITLES ================= */
const Subtitles={
  lines:[],
  i:0,t:0,active:false,
  start(lines){
    this.lines=lines;this.i=0;this.t=0;this.active=true;
  },
  update(){
    if(!this.active) return;
    this.t++;
    if(this.t>90){this.t=0;this.i++;if(this.i>=this.lines.length)this.active=false;}
  },
  draw(){
    if(!this.active) return;
    const txt=this.lines[this.i];
    ctx.setTransform(1,0,0,1,0,0);
    ctx.font="bold 22px sans-serif";
    ctx.textAlign="center";
    ctx.fillStyle="#000";
    ctx.fillText(txt,180,600);
    ctx.fillStyle="#fff";
    ctx.fillText(txt,180,598);
  }
};

/* ================= CHARACTER ================= */
class Character{
  constructor(x,color){
    this.x=x;
    this.y=440;
    this.color=color;
    this.walk=0;
    this.emotion="neutral";
  }
  update(){
    if(!Camera.cutscene) this.walk+=0.12;
  }
  draw(){
    ctx.strokeStyle=this.color;
    ctx.lineWidth=3;
    const step=Math.sin(this.walk)*6;

    // body
    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    ctx.lineTo(this.x,this.y+model.body);
    ctx.stroke();

    // legs
    ctx.beginPath();
    ctx.moveTo(this.x,this.y+model.body);
    ctx.lineTo(this.x-8,this.y+model.body+model.leg-step);
    ctx.moveTo(this.x,this.y+model.body);
    ctx.lineTo(this.x+8,this.y+model.body+model.leg+step);
    ctx.stroke();

    // arms (FIXED)
    const a=emotions[this.emotion].arm;
    ctx.beginPath();
    ctx.moveTo(this.x,this.y+10);
    ctx.lineTo(this.x-12,this.y+22+a);
    ctx.moveTo(this.x,this.y+10);
    ctx.lineTo(this.x+12,this.y+22-a);
    ctx.stroke();

    // head
    ctx.beginPath();
    ctx.arc(this.x,this.y-14,14,0,Math.PI*2);
    ctx.stroke();
  }
}

/* ================= SETUP ================= */
const hero=new Character(160,"#ff4444");
const npc=new Character(200,"#44ff88");
Camera.target=hero;

/* ================= CUTSCENE ================= */
setTimeout(()=>{
  Camera.cutscene=true;
  hero.emotion="shock";
  Subtitles.start([
    "That was crazy 😱",
    "Bu juda telba edi 😂"
  ]);
},1000);

/* ================= LOOP ================= */
function loop(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,c.width,c.height);

  Camera.update();
  ctx.save();
  Camera.apply();

  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,470);
  ctx.lineTo(360,470);
  ctx.stroke();

  hero.update();npc.update();
  hero.draw();npc.draw();

  ctx.restore();
  Subtitles.update();
  Subtitles.draw();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
