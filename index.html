<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v31.6 (Action Layers)</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
}
#studio{display:flex;flex-direction:column;gap:10px;align-items:center}
canvas{background:#fff;border-radius:16px}
.panel{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{
  padding:6px 12px;border:none;border-radius:6px;cursor:pointer
}
.small{font-size:12px;opacity:.8}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="setMode('walk')">Walk</button>
    <button onclick="setMode('run')">Run</button>
    <button onclick="setMode('jump')">Jump</button>
    <button onclick="setMode('stop')">Stop</button>
    <button onclick="setMode('idle')">Idle</button>
    <button onclick="setMode('wave')">Wave</button>
  </div>
  <div class="small">Space = Slow-Mo</div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const W=420,H=640,ground=520;
let time=0, mode="walk";
let slowmo=false, freeze=0;

// ===== INPUT =====
window.addEventListener("keydown",e=>{
  if(e.code==="Space") slowmo=true;
});
window.addEventListener("keyup",e=>{
  if(e.code==="Space") slowmo=false;
});
function setMode(m){ mode=m; }

// ===== CAMERA =====
const cam={x:0,y:0,zoom:1, tx:0,ty:0,tz:1, shake:0};

// ===== JOINT =====
class Joint{constructor(x,y){this.x=x;this.y=y;}}

// ===== STICKMAN =====
function createMan(x){
  return{
    hip:new Joint(x,ground-85),
    neck:new Joint(x,ground-155),
    head:new Joint(x,ground-195),

    kneeL:new Joint(x-18,ground-45),
    kneeR:new Joint(x+18,ground-45),
    footL:new Joint(x-18,ground),
    footR:new Joint(x+18,ground),

    elbowL:new Joint(x-40,ground-135),
    elbowR:new Joint(x+40,ground-135),
    handL:new Joint(x-55,ground-115),
    handR:new Joint(x+55,ground-115),

    phase:0,
    vel:0,
    targetVel:0,

    vy:0,
    onGround:true,

    impact:0,
    impactVel:0,
    prevFoot:false,

    hipRot:0,
    shoulderRot:0,
    headRot:0
  };
}
const men=[createMan(200)];

// ===== IK =====
function stick(a,b,len){
  const dx=b.x-a.x,dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||1;
  const diff=(d-len)/d*0.5;
  a.x+=dx*diff; a.y+=dy*diff;
  b.x-=dx*diff; b.y-=dy*diff;
}

// ===== COMMON WALK CORE =====
function locomotion(m, speedMul){
  m.targetVel=1.6*speedMul;
  m.vel+=(m.targetVel-m.vel)*0.08;

  m.phase+=m.vel*0.04;
  const s=Math.sin(m.phase);
  const stride=26*speedMul;
  const left=s>0;

  if(left){
    m.footL.x=m.hip.x-stride; m.footL.y=ground;
    m.footR.x=m.hip.x+stride+s*22;
    m.footR.y=ground-Math.max(0,-s)*28;
  }else{
    m.footR.x=m.hip.x+stride; m.footR.y=ground;
    m.footL.x=m.hip.x-stride+s*22;
    m.footL.y=ground-Math.max(0,s)*28;
  }

  if(left!==m.prevFoot){
    m.impactVel=6*speedMul;
    freeze=2; // IMPACT FREEZE
  }
  m.prevFoot=left;
  m.impactVel*=0.6;
  m.impact+=m.impactVel;
  m.impact*=0.7;

  m.hip.x+=m.vel;
  m.hip.y=ground-85-Math.abs(s)*8+m.impact;

  m.hipRot+=((-s*10)-m.hipRot)*0.12;
  m.shoulderRot+=((s*14)-m.shoulderRot)*0.15;
  m.headRot+=((-m.shoulderRot*0.6)-m.headRot)*0.18;

  m.neck.x=m.hip.x+m.shoulderRot;
  m.neck.y=m.hip.y-70;
  m.head.x=m.neck.x+m.headRot;
  m.head.y=m.neck.y-40;

  m.handL.x=m.neck.x-45-s*22;
  m.handR.x=m.neck.x+45+s*22;
  m.handL.y=m.neck.y+20;
  m.handR.y=m.neck.y+20;

  cam.tx=m.hip.x-W/2;
  cam.ty=(m.hip.y-300)*0.15;
  cam.tz=1+Math.abs(s)*0.04;
  cam.shake=Math.abs(m.impact)*0.5;
}

// ===== ACTIONS =====
function walk(m){ locomotion(m,1); }
function run(m){ locomotion(m,1.8); }

function stop(m){
  m.targetVel=0;
  m.vel+=(m.targetVel-m.vel)*0.12;
  m.hip.x+=m.vel;
}

function jump(m){
  if(m.onGround){
    m.vy=-14;
    m.onGround=false;
    freeze=3;
  }
  m.vy+=0.7;
  m.hip.y+=m.vy;
  if(m.hip.y>=ground-85){
    m.hip.y=ground-85;
    m.vy=0;
    m.onGround=true;
    m.impactVel=10;
    freeze=3;
  }
  m.neck.y=m.hip.y-70;
  m.head.y=m.neck.y-40;
}

function idle(m){
  const b=Math.sin(time*0.05);
  m.hip.y=ground-85+b*4;
  m.neck.y=m.hip.y-70;
  m.head.y=m.neck.y-40;
  cam.tx=m.hip.x-W/2; cam.ty=0; cam.tz=1;
}

function wave(m){
  idle(m);
  m.handR.y=m.neck.y-50-Math.sin(time*0.25)*25;
  m.handR.x=m.neck.x+55;
}

// ===== SOLVE =====
function solve(){
  men.forEach(m=>{
    for(let i=0;i<6;i++){
      stick(m.neck,m.hip,70);
      stick(m.head,m.neck,40);
      stick(m.hip,m.kneeL,40); stick(m.kneeL,m.footL,40);
      stick(m.hip,m.kneeR,40); stick(m.kneeR,m.footR,40);
      stick(m.neck,m.elbowL,35); stick(m.elbowL,m.handL,35);
      stick(m.neck,m.elbowR,35); stick(m.elbowR,m.handR,35);
    }
  });
}

// ===== DRAW =====
function line(a,b){
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
}
function drawMan(m){
  ctx.beginPath();
  ctx.arc(m.head.x,m.head.y,16,0,Math.PI*2);
  ctx.stroke();
  line(m.head,m.neck); line(m.neck,m.hip);
  line(m.hip,m.kneeL); line(m.kneeL,m.footL);
  line(m.hip,m.kneeR); line(m.kneeR,m.footR);
  line(m.neck,m.elbowL); line(m.elbowL,m.handL);
  line(m.neck,m.elbowR); line(m.elbowR,m.handR);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  cam.x+=(cam.tx-cam.x)*0.08;
  cam.y+=(cam.ty-cam.y)*0.08;
  cam.zoom+=(cam.tz-cam.zoom)*0.05;

  const shakeX=(Math.random()-0.5)*cam.shake;
  const shakeY=(Math.random()-0.5)*cam.shake;

  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.scale(cam.zoom,cam.zoom);
  ctx.translate(-W/2-cam.x+shakeX,-H/2-cam.y+shakeY);

  ctx.strokeStyle="#ccc";
  ctx.beginPath(); ctx.moveTo(-1000,ground); ctx.lineTo(2000,ground); ctx.stroke();

  ctx.strokeStyle="#000";
  men.forEach(drawMan);
  ctx.restore();
}

// ===== LOOP =====
function loop(){
  if(freeze>0){ freeze--; draw(); requestAnimationFrame(loop); return; }

  const speed = slowmo ? 0.35 : 1;
  for(let i=0;i<speed;i++){
    time++;
    men.forEach(m=>{
      if(mode==="walk")walk(m);
      if(mode==="run")run(m);
      if(mode==="jump")jump(m);
      if(mode==="stop")stop(m);
      if(mode==="idle")idle(m);
      if(mode==="wave")wave(m);
    });
    solve();
  }
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
