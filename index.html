<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.8</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
canvas { display:block; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// =========================
// CANVAS
// =========================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// =========================
// SCENE
// =========================
const scene = {
  width: 6000,
  height: 2000,
  groundY: 900
};

// =========================
// TIME SYSTEM
// =========================
let timeScale = 1;
let targetTimeScale = 1;
let freezeFrames = 0;

// speed-ramp timeline
let rampTimer = 0;
let rampPhase = "none"; // fast | slow | recover

function startSpeedRamp(){
  rampPhase = "fast";
  rampTimer = 0;
}

// =========================
// STICKMAN
// =========================
const stickman = {
  x: 800,
  y: scene.groundY - 120,
  vx: 2,
  vy: 0,
  onGround: true,
  head: 18,
  body: 50,
  arm: 40,
  leg: 45
};

// =========================
// CAMERA
// =========================
const camera = {
  x: 0,
  y: 0,
  zoom: 1,
  targetZoom: 1,

  followSmooth: 0.08,
  zoomSmooth: 0.15,

  shakeX: 0,
  shakeY: 0,
  shakePower: 0,

  cutMode: false,
  cutCooldown: 0
};

function camX(x){ return (x - camera.x) * camera.zoom + camera.shakeX; }
function camY(y){ return (y - camera.y) * camera.zoom + camera.shakeY; }

// =========================
// CAMERA UPDATE
// =========================
function updateCamera(){
  const tx = stickman.x - canvas.width / (2 * camera.zoom);
  const ty = stickman.y - canvas.height / (2 * camera.zoom);

  if(camera.cutMode){
    camera.x = tx;
    camera.y = ty;
  } else {
    camera.x += (tx - camera.x) * camera.followSmooth;
    camera.y += (ty - camera.y) * camera.followSmooth;
  }

  camera.zoom += (camera.targetZoom - camera.zoom) * camera.zoomSmooth;

  updateShake();
  updateCutCooldown();
}

function cameraCut(){
  camera.cutMode = true;
  camera.cutCooldown = 6;
}
function updateCutCooldown(){
  if(camera.cutCooldown>0){
    camera.cutCooldown--;
    if(camera.cutCooldown===0) camera.cutMode=false;
  }
}

// =========================
// SHAKE
// =========================
function updateShake(){
  if(camera.shakePower>0){
    camera.shakeX = (Math.random()-0.5)*camera.shakePower;
    camera.shakeY = (Math.random()-0.5)*camera.shakePower;
    camera.shakePower *= 0.85;
  } else {
    camera.shakeX = 0;
    camera.shakeY = 0;
  }
}

// =========================
// BEAT / IMPACT
// =========================
function beatImpact(){
  freezeFrames = 2;
  camera.targetZoom = 2.0;
  camera.shakePower = 16;
  cameraCut();
  startSpeedRamp();

  setTimeout(()=>{
    camera.targetZoom = 1;
  },300);
}

// =========================
// SPEED RAMP UPDATE
// =========================
function updateSpeedRamp(){
  if(rampPhase==="none") return;

  rampTimer++;

  if(rampPhase==="fast"){
    targetTimeScale = 1.6;
    if(rampTimer>8){
      rampPhase="slow";
      rampTimer=0;
    }
  }
  else if(rampPhase==="slow"){
    targetTimeScale = 0.25;
    if(rampTimer>12){
      rampPhase="recover";
      rampTimer=0;
    }
  }
  else if(rampPhase==="recover"){
    targetTimeScale = 1;
    if(rampTimer>14){
      rampPhase="none";
      rampTimer=0;
    }
  }
}

// =========================
// INPUT
// =========================
document.addEventListener("keydown", e=>{
  if(e.code==="Space" && stickman.onGround){
    stickman.vy = -16;
    stickman.onGround = false;
    beatImpact();
  }
  if(e.code==="Digit1") beatImpact();
});
canvas.addEventListener("mousedown", beatImpact);

// =========================
// TIME UPDATE
// =========================
function updateTime(){
  timeScale += (targetTimeScale - timeScale) * 0.18;
}

// =========================
// PHYSICS
// =========================
function updateStickman(){
  stickman.x += stickman.vx * timeScale;

  stickman.vy += 0.8 * timeScale;
  stickman.y += stickman.vy * timeScale;

  if(stickman.y >= scene.groundY - 120){
    stickman.y = scene.groundY - 120;
    stickman.vy = 0;
    stickman.onGround = true;
  }

  if(stickman.x < 300 || stickman.x > scene.width-300){
    stickman.vx *= -1;
    beatImpact();
  }
}

// =========================
// DRAW
// =========================
function drawBackground(){
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}
function drawGround(){
  ctx.strokeStyle="#999";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(camX(0), camY(scene.groundY));
  ctx.lineTo(camX(scene.width), camY(scene.groundY));
  ctx.stroke();
}
function drawStickman(p){
  ctx.strokeStyle="#000";
  ctx.lineWidth=4;
  ctx.lineCap="round";

  const hx=p.x, hy=p.y;

  ctx.beginPath();
  ctx.arc(camX(hx), camY(hy), p.head*camera.zoom, 0, Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy+p.head));
  ctx.lineTo(camX(hx), camY(hy+p.head+p.body));
  ctx.stroke();

  const by=hy+p.head+p.body;

  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy+25));
  ctx.lineTo(camX(hx-p.arm), camY(hy+40));
  ctx.moveTo(camX(hx), camY(hy+25));
  ctx.lineTo(camX(hx+p.arm), camY(hy+40));
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx-p.leg), camY(by+p.leg));
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx+p.leg), camY(by+p.leg));
  ctx.stroke();
}

// =========================
// LOOP
// =========================
function loop(){
  if(freezeFrames>0){
    freezeFrames--;
  } else {
    updateSpeedRamp();
    updateTime();
    updateStickman();
    updateCamera();
  }

  drawBackground();
  drawGround();
  drawStickman(stickman);

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
