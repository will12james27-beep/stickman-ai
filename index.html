<script>
document.addEventListener("DOMContentLoaded",()=>{

const c=document.getElementById("c");
const ctx=c.getContext("2d");
c.width=360; c.height=640;
ctx.lineCap="round"; ctx.lineWidth=4;

const ground=520;
const GRAVITY=0.9;

let debug=false;
let time=0;
let state="idle"; // idle | walk | sit | jump | ragdoll | play

// ===== TIMELINE =====
let recording=false;
let timeline=[];
let playIndex=0;

// ===== JOINT =====
class Joint{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=0; this.vy=0;
  }
}

// ===== MAN =====
const man={
  hip:new Joint(180,ground-70),
  neck:new Joint(180,ground-135),
  head:new Joint(180,ground-170),
  legL:new Joint(166,ground),
  legR:new Joint(194,ground),
  armL:new Joint(140,ground-135),
  armR:new Joint(220,ground-135)
};

// ===== UTILS =====
function stick(a,b,l){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||1;
  const diff=(d-l)/d*0.5;
  a.x+=dx*diff; a.y+=dy*diff;
  b.x-=dx*diff; b.y-=dy*diff;
}

function physics(j){
  j.vy+=GRAVITY;
  j.x+=j.vx;
  j.y+=j.vy;
  if(j.y>ground){ j.y=ground; j.vy=0; }
}

// ===== CONTROLLERS =====
function balance(){
  man.hip.y += ((ground-70)-man.hip.y)*0.25;
  man.neck.x += (man.hip.x-man.neck.x)*0.2;
}

function walk(){
  time++;
  const s=Math.sin(time*0.12);
  man.hip.x+=1.2;
  man.legL.x=man.hip.x-14+s*20;
  man.legR.x=man.hip.x+14-s*20;
  man.legL.y=ground-Math.max(0,s*12);
  man.legR.y=ground-Math.max(0,-s*12);
}

// ===== AI COMMAND =====
window.aiCommand=function(cmd){
  cmd=cmd.trim();
  if(cmd==="walk") state="walk";
  if(cmd==="stop") state="idle";
  if(cmd==="sit") state="sit";
  if(cmd==="jump"){
    man.hip.vy=-15;
    state="jump";
  }
  const i=document.getElementById("cmd");
  if(i) i.value="";
};

// ===== UI =====
window.toggleRagdoll=()=> state = state==="ragdoll" ? "idle" : "ragdoll";
window.toggleDebug=()=> debug=!debug;
window.toggleRecord=()=>{
  recording=!recording;
  if(recording) timeline=[];
};
window.playTimeline=()=>{
  if(timeline.length){
    state="play";
    playIndex=0;
  }
};

// ===== DRAW =====
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,360,640);
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(360,ground);
  ctx.stroke();

  ctx.strokeStyle="#000";
  line(man.head,man.neck);
  line(man.neck,man.hip);
  line(man.hip,man.legL);
  line(man.hip,man.legR);
  line(man.neck,man.armL);
  line(man.neck,man.armR);

  ctx.beginPath();
  ctx.arc(man.head.x,man.head.y,14,0,6.28);
  ctx.stroke();

  if(debug){
    ctx.fillStyle="red";
    Object.values(man).forEach(j=>{
      ctx.beginPath();
      ctx.arc(j.x,j.y,2,0,6.28);
      ctx.fill();
    });
  }
}

// ===== LOOP =====
function loop(){

  if(state==="play"){
    const f=timeline[playIndex++];
    if(!f) state="idle";
    else Object.keys(man).forEach(k=>{
      man[k].x=f[k].x;
      man[k].y=f[k].y;
    });
  }
  else if(state==="ragdoll" || state==="jump"){
    Object.values(man).forEach(j=>physics(j));
  }
  else{
    if(state==="walk") walk();
    if(state==="sit") man.hip.y=ground-40;
    balance();
  }

  for(let i=0;i<8;i++){
    stick(man.head,man.neck,35);
    stick(man.neck,man.hip,65);
    stick(man.hip,man.legL,65);
    stick(man.hip,man.legR,65);
    stick(man.neck,man.armL,45);
    stick(man.neck,man.armR,45);
  }

  if(recording){
    const frame={};
    Object.keys(man).forEach(k=>{
      frame[k]={x:man[k].x,y:man[k].y};
    });
    timeline.push(frame);
  }

  draw();
  requestAnimationFrame(loop);
}
loop();

});
</script>
