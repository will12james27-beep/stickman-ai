<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.6</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
canvas {
  display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// =========================
// CANVAS
// =========================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// =========================
// SCENE
// =========================
const scene = {
  width: 6000,
  height: 2000,
  groundY: 900
};

// =========================
// STICKMAN
// =========================
const stickman = {
  x: 800,
  y: scene.groundY - 120,
  vx: 2,
  vy: 0,
  onGround: true,
  head: 18,
  body: 50,
  arm: 40,
  leg: 45
};

// =========================
// CAMERA
// =========================
const camera = {
  x: 0,
  y: 0,
  zoom: 1,
  targetZoom: 1,

  followSmooth: 0.08,
  zoomSmooth: 0.15,

  shakeX: 0,
  shakeY: 0,
  shakePower: 0,

  cutMode: false,
  cutCooldown: 0
};

// =========================
// CAMERA HELPERS
// =========================
function camX(x) {
  return (x - camera.x) * camera.zoom + camera.shakeX;
}
function camY(y) {
  return (y - camera.y) * camera.zoom + camera.shakeY;
}

// =========================
// CAMERA UPDATE
// =========================
function updateCamera() {
  const tx = stickman.x - canvas.width / (2 * camera.zoom);
  const ty = stickman.y - canvas.height / (2 * camera.zoom);

  if (camera.cutMode) {
    camera.x = tx;
    camera.y = ty;
  } else {
    camera.x += (tx - camera.x) * camera.followSmooth;
    camera.y += (ty - camera.y) * camera.followSmooth;
  }

  camera.zoom += (camera.targetZoom - camera.zoom) * camera.zoomSmooth;

  updateShake();
  updateCutCooldown();
}

// =========================
// CUT SYSTEM
// =========================
function cameraCut() {
  camera.cutMode = true;
  camera.cutCooldown = 6; // frames (qisqa cut)
}

function updateCutCooldown() {
  if (camera.cutCooldown > 0) {
    camera.cutCooldown--;
    if (camera.cutCooldown === 0) {
      camera.cutMode = false;
    }
  }
}

// =========================
// SHAKE
// =========================
function updateShake() {
  if (camera.shakePower > 0) {
    camera.shakeX = (Math.random() - 0.5) * camera.shakePower;
    camera.shakeY = (Math.random() - 0.5) * camera.shakePower;
    camera.shakePower *= 0.85;
  } else {
    camera.shakeX = 0;
    camera.shakeY = 0;
  }
}

// =========================
// EMOTION + CUT
// =========================
function cameraEmotion(type) {
  switch (type) {
    case "impact":
      camera.targetZoom = 1.9;
      camera.shakePower = 18;
      cameraCut();
      zoomRelease(18);
      break;

    case "panic":
      camera.targetZoom = 0.7;
      camera.shakePower = 10;
      cameraCut();
      zoomRelease(30);
      break;

    case "rage":
      camera.targetZoom = 1.5;
      camera.shakePower = 14;
      cameraCut();
      zoomRelease(22);
      break;

    case "focus":
      camera.targetZoom = 2.2;
      camera.shakePower = 0;
      cameraCut();
      zoomRelease(25);
      break;
  }
}

// =========================
// INPUT
// =========================
document.addEventListener("keydown", e => {
  if (e.code === "Space" && stickman.onGround) {
    stickman.vy = -16;
    stickman.onGround = false;
    cameraEmotion("impact");
  }

  if (e.code === "Digit1") cameraEmotion("impact");
  if (e.code === "Digit2") cameraEmotion("panic");
  if (e.code === "Digit3") cameraEmotion("rage");
  if (e.code === "Digit4") cameraEmotion("focus");
});

canvas.addEventListener("mousedown", () => {
  cameraEmotion("rage");
});

// =========================
// ZOOM RESET
// =========================
let zoomTimer = 0;

function zoomRelease(frames) {
  zoomTimer = frames;
}

function updateZoomRelease() {
  if (zoomTimer > 0) {
    zoomTimer--;
    if (zoomTimer === 0) {
      camera.targetZoom = 1;
    }
  }
}

// =========================
// PHYSICS
// =========================
function updateStickman() {
  stickman.x += stickman.vx;

  stickman.vy += 0.8;
  stickman.y += stickman.vy;

  if (stickman.y >= scene.groundY - 120) {
    stickman.y = scene.groundY - 120;
    stickman.vy = 0;
    stickman.onGround = true;
  }

  if (stickman.x < 300 || stickman.x > scene.width - 300) {
    stickman.vx *= -1;
    cameraEmotion("panic");
  }
}

// =========================
// DRAW
// =========================
function drawBackground() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawGround() {
  ctx.strokeStyle = "#999";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(camX(0), camY(scene.groundY));
  ctx.lineTo(camX(scene.width), camY(scene.groundY));
  ctx.stroke();
}

function drawStickman(p) {
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";

  const hx = p.x;
  const hy = p.y;

  // head
  ctx.beginPath();
  ctx.arc(camX(hx), camY(hy), p.head * camera.zoom, 0, Math.PI * 2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy + p.head));
  ctx.lineTo(camX(hx), camY(hy + p.head + p.body));
  ctx.stroke();

  const by = hy + p.head + p.body;

  // arms
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy + 25));
  ctx.lineTo(camX(hx - p.arm), camY(hy + 40));
  ctx.moveTo(camX(hx), camY(hy + 25));
  ctx.lineTo(camX(hx + p.arm), camY(hy + 40));
  ctx.stroke();

  // legs
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx - p.leg), camY(by + p.leg));
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx + p.leg), camY(by + p.leg));
  ctx.stroke();
}

// =========================
// LOOP
// =========================
function loop() {
  updateStickman();
  updateZoomRelease();
  updateCamera();

  drawBackground();
  drawGround();
  drawStickman(stickman);

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
