<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v11.0</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#050d12;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:560px;
  background:#0b1f26;
  padding:16px;
  border-radius:20px;
  box-shadow:0 0 40px #00ffff55;
}
h3{text-align:center}
input,button,select{
  width:100%;
  padding:9px;
  margin-top:6px;
  border-radius:8px;
  border:none;
}
button{background:cyan;font-weight:bold;cursor:pointer}
canvas{
  display:block;
  margin:12px auto;
  background:#fff;
  width:360px;
  height:560px;
  border-radius:14px;
}
.row{display:flex;gap:8px}
.row>*{flex:1}
.panel{
  background:#072028;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
}
.hidden{display:none}
small{text-align:center;opacity:.7;display:block}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v11.0</h3>

<div id="loginBox">
<input id="username" placeholder="Username">
<button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">
<b id="userLabel"></b>

<div class="panel">
<b>🎞 Scene AI</b>
<input id="aiText" value="girl run 2 | girl jump 1 | boy stand 3 | background sky">
<div class="row">
<button onclick="parseAI()">🧠 Generate</button>
<button onclick="togglePlay()">⏯ Pause</button>
</div>
</div>

<div class="panel">
<b>🧍 Character Test</b>
<div class="row">
<select onchange="girl.action=this.value">
<option value="stand">Stand</option>
<option value="run">Run</option>
<option value="jump">Jump</option>
</select>
<select onchange="boy.action=this.value">
<option value="stand">Stand</option>
<option value="run">Run</option>
<option value="jump">Jump</option>
</select>
</div>
</div>

<canvas id="c"></canvas>

<div class="row">
<button onclick="startRecord()">🎥 Record</button>
<button onclick="stopRecord()">💾 Save</button>
</div>

<small>v11.0 • Cute Rig • Jump • AI Scene • Export</small>
</div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
c.width=360; c.height=560;
ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=4;

const ground=460;
let playing=true, background="sky";

function login(){
  localStorage.setItem("u",username.value||"guest");
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");
  userLabel.innerText=localStorage.getItem("u");
}
if(localStorage.getItem("u")) login();

class Stickman{
  constructor(x){
    this.x=x; this.y=ground;
    this.vy=0;
    this.action="stand";
    this.timeline=[];
    this.ti=0; this.tf=0;
  }
}
const girl=new Stickman(140);
const boy=new Stickman(220);
const chars=[girl,boy];

function drawBG(){
  ctx.fillStyle=background==="night"?"#001018":"#ccefff";
  ctx.fillRect(0,0,360,560);
}

function limb(x,y,a,l){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*l,y+Math.cos(a)*l);
  ctx.stroke();
}

function leg(x,y,a){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*12,y+16);
  ctx.lineTo(x+Math.sin(a)*12,y+32);
  ctx.stroke();
}

function draw(ch){
  const swing=Math.sin(ch.tf*0.25)*12;
  ctx.strokeStyle="#000";

  ctx.beginPath();
  ctx.arc(ch.x,ch.y-52,13,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(ch.x,ch.y-38);
  ctx.lineTo(ch.x,ch.y-10);
  ctx.stroke();

  limb(ch.x,ch.y-34,swing*0.05,20);
  limb(ch.x,ch.y-34,-swing*0.05,20);

  leg(ch.x-6,ch.y-10,swing*0.04);
  leg(ch.x+6,ch.y-10,-swing*0.04);
}

function animate(){
  if(playing){
    chars.forEach(ch=>{
      ch.tf++;
      if(ch.action==="run") ch.x+=1;
      if(ch.action==="jump" && ch.y>=ground){
        ch.vy=-10;
      }
      ch.vy+=0.6;
      ch.y+=ch.vy;
      if(ch.y>ground){ch.y=ground;ch.vy=0;}
    });
  }
  drawBG();
  chars.forEach(draw);
  requestAnimationFrame(animate);
}
animate();

function parseAI(){
  chars.forEach(ch=>{
    ch.timeline=[];
    ch.ti=0; ch.tf=0;
    ch.x=ch===girl?140:220;
  });
  aiText.value.toLowerCase().split("|").forEach(b=>{
    const p=b.trim().split(" ");
    if(p[0]==="background") background=p[1];
    else{
      const ch=p[0]==="girl"?girl:boy;
      ch.action=p[1];
    }
  });
}

let rec,chunks=[];
function startRecord(){
  rec=new MediaRecorder(c.captureStream(60));
  chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));
    a.download="stickman.webm"; a.click();
  };
  rec.start();
}
function stopRecord(){rec&&rec.stop();}
function togglePlay(){playing=!playing;}
</script>
</body>
</html>
