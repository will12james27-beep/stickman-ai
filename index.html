<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman v21-A.11 — Dialogue System</title>
<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}
canvas{background:#181818;margin-top:10px;}
.ui{
  margin:8px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
button{
  padding:6px;
  background:#222;
  color:#fff;
  border:1px solid #444;
  cursor:pointer;
}
button:hover{background:#333}
</style>
</head>
<body>

<canvas id="c" width="360" height="540"></canvas>

<div class="ui">
  <button onclick="setAll('dead')">😐</button>
  <button onclick="setAll('softHappy')">🙂</button>
  <button onclick="setAll('ultraHappy')">😆</button>
  <button onclick="setAll('shock')">😱</button>
  <button onclick="setAll('rage')">🤬</button>
</div>

<script>
/* =========================
   CANVAS + INPUT
========================= */
const c=document.getElementById("c");
const ctx=c.getContext("2d");
let t=0;
const Keys={};
addEventListener("keydown",e=>Keys[e.key]=true);
addEventListener("keyup",e=>Keys[e.key]=false);

/* =========================
   CAMERA
========================= */
const Camera={
  x:0,y:0,zoom:1.1,target:null,
  update(){
    if(this.target){
      this.x+=((this.target.x-c.width/2)-this.x)*0.08;
      this.y+=((this.target.y-c.height/2)-this.y)*0.08;
    }
  },
  apply(){
    ctx.setTransform(this.zoom,0,0,this.zoom,-this.x*this.zoom,-this.y*this.zoom);
  }
};

/* =========================
   SCENE
========================= */
const Scene={
  width:1400,
  groundY:500,
  characters:[],
  draw(){
    ctx.save();
    Camera.apply();

    ctx.fillStyle="#e6f4ff";
    ctx.fillRect(0,0,this.width,800);

    ctx.strokeStyle="#aaa";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,this.groundY);
    ctx.lineTo(this.width,this.groundY);
    ctx.stroke();

    [...this.characters]
      .sort((a,b)=>a.y-b.y)
      .forEach(c=>{
        c.update();
        c.draw();
        c.dialog.draw();
      });

    ctx.restore();
  }
};

/* =========================
   MODEL + EMOTIONS
========================= */
const model={headR:14,body:36,leg:30,armU:20,armL:18};
const presets={
  dead:{eyeOpen:.25,eyeScale:1.1,mouthOpen:0,brow:-.1,armLift:-.2,headSquash:-.1},
  softHappy:{eyeOpen:.7,eyeScale:.9,mouthOpen:.4,brow:.2,armLift:.3,headSquash:.1},
  ultraHappy:{eyeOpen:.4,eyeScale:.7,mouthOpen:1.4,brow:.8,armLift:1.2,headSquash:.35},
  shock:{eyeOpen:1.8,eyeScale:1.5,mouthOpen:1.8,brow:1.2,armLift:1.6,headSquash:-.3},
  rage:{eyeOpen:.35,eyeScale:.8,mouthOpen:.5,brow:-1.6,armLift:-1,headSquash:.25}
};

/* =========================
   DIALOGUE SYSTEM (21 A.11)
========================= */
class Dialogue{
  constructor(owner){
    this.owner=owner;
    this.lines=[];
    this.index=0;
    this.timer=0;
    this.active=false;
  }
  start(lines){
    this.lines=lines;
    this.index=0;
    this.timer=0;
    this.active=true;
  }
  update(){
    if(!this.active) return;
    this.timer++;
    if(this.timer>90){
      this.timer=0;
      this.index++;
      if(this.index>=this.lines.length){
        this.active=false;
      }
    }
  }
  draw(){
    if(!this.active) return;
    const text=this.lines[this.index];
    const x=this.owner.x;
    const y=this.owner.y-model.body-model.headR-25;

    ctx.font="12px sans-serif";
    const w=ctx.measureText(text).width+12;

    ctx.fillStyle="rgba(255,255,255,0.9)";
    ctx.strokeStyle="#000";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.roundRect(x-w/2,y-18,w,18,6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle="#000";
    ctx.fillText(text,x-w/2+6,y-6);
  }
}

/* =========================
   CHARACTER
========================= */
class Character{
  constructor(name,color,shirt,x,isHero=false){
    this.name=name;
    this.color=color;
    this.shirt=shirt;
    this.x=x;
    this.y=Scene.groundY-model.body-model.leg;
    this.vx=0;
    this.dir=1;
    this.speed=1.6;
    this.walkPhase=0;
    this.isHero=isHero;
    this.interacting=false;
    this.dialog=new Dialogue(this);
    this.target={...presets.dead};
    this.state={...this.target};
  }
  setEmotion(e){Object.assign(this.target,presets[e]);}
  update(){
    this.interacting=false;

    if(this.isHero){
      if(Keys.ArrowLeft){this.vx=-this.speed;this.dir=-1;}
      else if(Keys.ArrowRight){this.vx=this.speed;this.dir=1;}
      else this.vx*=0.8;
    }else{
      this.vx=this.dir*this.speed*0.6;
      if(this.x<100||this.x>Scene.width-100) this.dir*=-1;
    }

    Scene.characters.forEach(o=>{
      if(o!==this){
        if(Math.abs(this.x-o.x)<28){
          this.vx=0;
          this.interacting=true;
          o.interacting=true;
          this.dir=o.x>this.x?1:-1;
          o.dir=this.x>o.x?1:-1;

          if(this.isHero && !this.dialog.active){
            this.dialog.start(["Hey!","Nima gap?"]);
            o.dialog.start(["Salom!","Yuribmiz 🙂"]);
          }
        }
      }
    });

    this.x+=this.vx;
    this.walkPhase+=Math.abs(this.vx)*0.15;

    for(let k in this.state){
      this.state[k]+=(this.target[k]-this.state[k])*0.18;
    }
    this.dialog.update();
  }
  draw(){drawStick(this);}
}

/* =========================
   CHARACTERS
========================= */
const hero=new Character("ALI","#ff4444",true,600,true);
const npc=new Character("BEX","#44ff88",false,520);
Scene.characters.push(hero,npc);
Camera.target=hero;

/* =========================
   UI
========================= */
function setAll(e){Scene.characters.forEach(c=>c.setEmotion(e));}

/* =========================
   DRAW HELPERS
========================= */
function jitter(v,a){return v+(Math.random()-0.5)*a}
function line(x1,y1,x2,y2){
  ctx.beginPath();
  ctx.moveTo(jitter(x1,.4),jitter(y1,.4));
  ctx.lineTo(jitter(x2,.4),jitter(y2,.4));
  ctx.stroke();
}
function circle(x,y,r){
  ctx.beginPath();
  ctx.arc(jitter(x,.3),jitter(y,.3),r,0,Math.PI*2);
  ctx.stroke();
}
function arm(x,y,dir,lift){
  const ex=x+dir*model.armU;
  const ey=y+lift;
  const hx=ex+dir*model.armL;
  const hy=ey+lift*.7;
  line(x,y,ex,ey);
  line(ex,ey,hx,hy);
}

/* =========================
   DRAW STICK
========================= */
function drawStick(ch){
  const s=ch.state;
  ctx.strokeStyle=ch.color;
  ctx.lineCap="round";
  ctx.lineWidth=2+jitter(.4,.6);

  const walk=Math.sin(ch.walkPhase)*10;
  const lift=-s.armLift*25;

  line(ch.x,ch.y,ch.x,ch.y+model.body);
  if(ch.shirt) line(ch.x-8,ch.y+10,ch.x+8,ch.y+10);

  line(ch.x,ch.y+model.body,ch.x-8*ch.dir,Scene.groundY-walk);
  line(ch.x,ch.y+model.body,ch.x+8*ch.dir,Scene.groundY+walk);

  arm(ch.x-2*ch.dir,ch.y+5,-ch.dir,lift-walk*.4);
  arm(ch.x+2*ch.dir,ch.y+5, ch.dir,lift+walk*.4);

  ctx.save();
  ctx.translate(ch.x,ch.y-model.headR);
  ctx.scale(ch.dir,1+s.headSquash);
  circle(0,0,model.headR);
  ctx.restore();
}

/* =========================
   LOOP
========================= */
function loop(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,c.width,c.height);
  Camera.update();
  Scene.draw();
  t++;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
