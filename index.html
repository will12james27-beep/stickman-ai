<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v10</title>
<style>
body{margin:0;background:#06161b;color:#fff;font-family:Arial;display:flex;justify-content:center;padding:10px}
.box{width:520px;background:#0b1f26;padding:14px;border-radius:18px;box-shadow:0 0 30px #00ffff55}
h3{text-align:center}
input,button{width:100%;padding:8px;margin-top:6px;border-radius:8px;border:none}
button{background:cyan;cursor:pointer}
canvas{background:#fff;width:360px;height:560px;border-radius:10px;margin-top:10px}
.row{display:flex;gap:6px}
.row>*{flex:1}
.hidden{display:none}
small{text-align:center;opacity:.7;display:block;margin-top:6px}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v10</h3>

<div id="loginBox">
<input id="username" placeholder="Username">
<button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">
<div>👤 <b id="userLabel"></b> <button onclick="logout()">Logout</button></div>

<input id="aiText" placeholder="girl happy run fast right 2 | boy sad stand 3 | camera follow | background sky">

<div class="row">
<button onclick="parseAI()">🧠 Generate</button>
<button onclick="togglePlay()">⏯ Pause</button>
</div>

<canvas id="c"></canvas>
<small>v10 • Direction • Speed • Emotion • Camera</small>
</div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const dpr=window.devicePixelRatio||1;
c.width=360*dpr; c.height=560*dpr;
ctx.scale(dpr,dpr);
ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=3;

const ground=430;
let camX=0, cameraMode="follow";
let playing=true, background="street";

// ===== LOGIN =====
function login(){
  localStorage.setItem("user",username.value);
  start();
}
function logout(){localStorage.clear();location.reload();}
function start(){
  let u=localStorage.getItem("user");
  if(!u) return;
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");
  userLabel.innerText=u;
}
start();

// ===== STICKMAN =====
class Stickman{
  constructor(x,type){
    this.baseX=x; this.x=x; this.y=ground;
    this.vy=0; this.type=type;
    this.timeline=[{action:"stand",frames:999999}];
    this.ti=0; this.tf=0;
    this.dir=1; this.speed=1;
    this.emotion="normal";
  }
}
const girl=new Stickman(120,"girl");
const boy=new Stickman(220,"boy");
const chars=[girl,boy];

// ===== DRAW =====
function drawBG(){
  ctx.fillStyle=background==="sky"?"#bde7ff":"#eaeaea";
  ctx.fillRect(0,0,360,560);
}

function draw(ch){
  const x=ch.x-camX;
  const lean=ch.emotion==="happy"?-6:ch.emotion==="sad"?6:0;
  const swing=Math.sin(Date.now()*0.015*ch.speed);

  // head
  ctx.beginPath();
  ctx.arc(x,ch.y-48,12,0,Math.PI*2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.moveTo(x,ch.y-36);
  ctx.lineTo(x+lean,ch.y-8);
  ctx.stroke();

  // arms
  limb(x+lean,ch.y-30,swing*ch.dir,18);
  limb(x+lean,ch.y-30,-swing*ch.dir,18);

  // legs
  leg(x,ch.y-8,swing*ch.dir,26);
  leg(x,ch.y-8,-swing*ch.dir,26);
}

function limb(x,y,a,l){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*l,y+Math.cos(a)*l);
  ctx.stroke();
}
function leg(x,y,a,l){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*14,y+l);
  ctx.stroke();
}

// ===== ENGINE =====
function animate(){
  if(playing){
    chars.forEach(ch=>{
      let cur=ch.timeline[ch.ti];
      ch.tf++;
      if(ch.tf>cur.frames){ch.tf=0;ch.ti=(ch.ti+1)%ch.timeline.length;}

      if(cur.action==="run") ch.x+=ch.speed*ch.dir;
    });
  }

  if(cameraMode==="follow")
    camX+=((girl.x+boy.x)/2-camX-180)*0.08;

  drawBG();
  chars.forEach(draw);
  requestAnimationFrame(animate);
}
animate();

// ===== AI PARSER =====
function parseAI(){
  chars.forEach(c=>{c.timeline=[];c.ti=0;c.tf=0;});
  cameraMode="follow";

  aiText.value.toLowerCase().split("|").forEach(b=>{
    let p=b.trim().split(" ");
    if(p[0]==="background") background=p[1];
    else if(p[0]==="camera") cameraMode=p[1];
    else{
      let ch=p[0]==="girl"?girl:boy;
      ch.emotion=p.includes("happy")?"happy":p.includes("sad")?"sad":"normal";
      ch.dir=p.includes("left")?-1:1;
      ch.speed=p.includes("fast")?2:p.includes("slow")?0.6:1;
      let act=p.find(x=>["run","stand"].includes(x))||"stand";
      let sec=parseFloat(p[p.length-1])||2;
      ch.timeline.push({action:act,frames:sec*60});
      ch.x=ch.baseX;
    }
  });
}

function togglePlay(){playing=!playing;}
</script>
</body>
</html>
