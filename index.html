<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v33.2</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  color:white;
}
#studio{display:flex;flex-direction:column;gap:10px;align-items:center}
canvas{background:#fff;border-radius:16px}
.panel{display:flex;gap:6px}
button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.small{font-size:12px;opacity:.7}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="state='run'">Run</button>
    <button onclick="jump()">Jump</button>
    <button onclick="state='idle'">Idle</button>
  </div>
  <div class="small">v33.2 — engine confirmed alive</div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const W=420,H=640,ground=520;
let time=0,state="run";

// ===== CAMERA =====
let camX=0;

// ===== JOINT =====
class Joint{constructor(x,y){this.x=x;this.y=y;}}

// ===== MAN =====
const man={
 hip:new Joint(210,ground-85),
 neck:new Joint(210,ground-155),
 head:new Joint(210,ground-195),

 kneeL:new Joint(190,ground-45),
 kneeR:new Joint(230,ground-45),
 footL:new Joint(190,ground),
 footR:new Joint(230,ground),

 elbowL:new Joint(170,ground-135),
 elbowR:new Joint(250,ground-135),
 handL:new Joint(155,ground-115),
 handR:new Joint(265,ground-115),

 phase:0, vy:0, onGround:true
};

// ===== IK =====
function stick(a,b,l){
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
 const diff=(d-l)/d*0.5;
 a.x+=dx*diff; a.y+=dy*diff;
 b.x-=dx*diff; b.y-=dy*diff;
}

// ===== STATES =====
function jump(){
 if(man.onGround){
  man.vy=-15;
  man.onGround=false;
  state="jump";
 }
}

function run(){
 man.phase+=0.12;
 const s=Math.sin(man.phase);
 const stride=30;

 man.footL.x=man.hip.x-stride;
 man.footR.x=man.hip.x+stride;
 man.footL.y=ground-Math.max(0,s)*30;
 man.footR.y=ground-Math.max(0,-s)*30;

 man.hip.y=ground-85-Math.abs(s)*8;

 man.neck.x=man.hip.x;
 man.neck.y=man.hip.y-70;
 man.head.x=man.neck.x;
 man.head.y=man.neck.y-40;

 man.handL.x=man.neck.x-50-s*25;
 man.handR.x=man.neck.x+50+s*25;
 man.handL.y=man.neck.y+20;
 man.handR.y=man.neck.y+20;

 camX+=(man.hip.x-W/2-camX)*0.1;
}

function jumpState(){
 man.vy+=0.9;
 man.hip.y+=man.vy;
 if(man.hip.y>=ground-85){
  man.hip.y=ground-85;
  man.vy=0;
  man.onGround=true;
  state="run";
 }
 man.neck.y=man.hip.y-70;
 man.head.y=man.neck.y-40;
}

function idle(){
 const b=Math.sin(time*0.05);
 man.hip.y=ground-85+b*4;
 man.neck.y=man.hip.y-70;
 man.head.y=man.neck.y-40;
}

// ===== SOLVE =====
function solve(){
 for(let i=0;i<6;i++){
  stick(man.neck,man.hip,70);
  stick(man.head,man.neck,40);

  stick(man.hip,man.kneeL,40);
  stick(man.kneeL,man.footL,40);

  stick(man.hip,man.kneeR,40);
  stick(man.kneeR,man.footR,40);

  stick(man.neck,man.elbowL,35);
  stick(man.elbowL,man.handL,35);

  stick(man.neck,man.elbowR,35);
  stick(man.elbowR,man.handR,35);
 }
}

// ===== DRAW =====
function line(a,b){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 ctx.save();
 ctx.translate(-camX,0);

 ctx.strokeStyle="#ccc";
 ctx.beginPath();
 ctx.moveTo(-2000,ground);
 ctx.lineTo(2000,ground);
 ctx.stroke();

 ctx.strokeStyle="#000";
 ctx.beginPath();
 ctx.arc(man.head.x,man.head.y,16,0,Math.PI*2);
 ctx.stroke();

 line(man.head,man.neck);
 line(man.neck,man.hip);
 line(man.hip,man.kneeL);
 line(man.kneeL,man.footL);
 line(man.hip,man.kneeR);
 line(man.kneeR,man.footR);
 line(man.neck,man.elbowL);
 line(man.elbowL,man.handL);
 line(man.neck,man.elbowR);
 line(man.elbowR,man.handR);

 ctx.restore();
}

// ===== LOOP =====
function loop(){
 time++;
 if(state==="run")run();
 if(state==="jump")jumpState();
 if(state==="idle")idle();
 solve();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
