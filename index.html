<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>21 C.25 Emotion + Camera Sync</title>
<style>
  body{margin:0;background:#111;}
  canvas{display:block;margin:auto;background:#fff;}
</style>
</head>
<body>

<canvas id="c" width="480" height="640"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* =========================
   EMOTION DATA
========================= */

const Emotion = {
  NEUTRAL:"neutral",
  CONFUSED:"confused",
  SHOCKED:"shocked",
  ANGRY:"angry"
};

const faceMap = {
  neutral:  { eye:1,   brow:0,   mouth:0 },
  confused: { eye:0.85,brow:14,  mouth:3 },
  shocked:  { eye:1.4, brow:0,   mouth:10 },
  angry:    { eye:0.6, brow:-20, mouth:-4 }
};

/* =========================
   CAMERA MAP (NEW)
========================= */

const cameraMap = {
  neutral:  { zoom:1,   shake:0 },
  confused: { zoom:1.05,shake:0.3 },
  shocked:  { zoom:1.25,shake:1.2 },
  angry:    { zoom:1.15,shake:0.8 }
};

/* =========================
   BLEND STATE
========================= */

let currentFace = { eye:1, brow:0, mouth:0 };
let targetFace  = { ...currentFace };

let camera = {
  zoom:1,
  targetZoom:1,
  shake:0,
  targetShake:0
};

/* =========================
   HELPERS
========================= */

function lerp(a,b,t){ return a+(b-a)*t; }

function setEmotion(e){
  targetFace = { ...faceMap[e] };
  camera.targetZoom  = cameraMap[e].zoom;
  camera.targetShake = cameraMap[e].shake;
}

/* =========================
   DRAW FACE
========================= */

function drawEye(x,y,open){
  ctx.beginPath();
  ctx.ellipse(x,y,3,5*open,0,0,Math.PI*2);
  ctx.stroke();
}

function drawBrow(x,y,tilt){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(tilt*Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(-6,0);
  ctx.lineTo(6,0);
  ctx.stroke();
  ctx.restore();
}

function drawMouth(x,y,open){
  ctx.beginPath();
  if(open<2){
    ctx.moveTo(x-6,y);
    ctx.lineTo(x+6,y+open);
  }else{
    ctx.arc(x,y,4+open/2,0,Math.PI*2);
  }
  ctx.stroke();
}

function drawFace(x,y){
  drawEye(x-10,y,currentFace.eye);
  drawEye(x+10,y,currentFace.eye);
  drawBrow(x-10,y-10,currentFace.brow);
  drawBrow(x+10,y-10,currentFace.brow);
  drawMouth(x,y+12,currentFace.mouth);
}

/* =========================
   CHARACTER
========================= */

function drawCharacter(){
  ctx.lineWidth=2;
  ctx.strokeStyle="#000";

  // head
  ctx.beginPath();
  ctx.arc(240,200,40,0,Math.PI*2);
  ctx.stroke();

  drawFace(240,200);

  // body
  ctx.beginPath();
  ctx.moveTo(240,240);
  ctx.lineTo(240,360);
  ctx.stroke();

  // arms
  ctx.beginPath();
  ctx.moveTo(240,280);
  ctx.lineTo(190,320);
  ctx.moveTo(240,280);
  ctx.lineTo(290,320);
  ctx.stroke();

  // legs
  ctx.beginPath();
  ctx.moveTo(240,360);
  ctx.lineTo(210,440);
  ctx.moveTo(240,360);
  ctx.lineTo(270,440);
  ctx.stroke();
}

/* =========================
   EMOTION SEQUENCE
========================= */

setTimeout(()=>setEmotion(Emotion.CONFUSED),1000);
setTimeout(()=>setEmotion(Emotion.SHOCKED),2600);
setTimeout(()=>setEmotion(Emotion.ANGRY),4300);
setTimeout(()=>setEmotion(Emotion.NEUTRAL),6500);

/* =========================
   LOOP
========================= */

function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // smooth face
  currentFace.eye   = lerp(currentFace.eye,   targetFace.eye,   0.08);
  currentFace.brow  = lerp(currentFace.brow,  targetFace.brow,  0.08);
  currentFace.mouth = lerp(currentFace.mouth, targetFace.mouth, 0.08);

  // smooth camera
  camera.zoom  = lerp(camera.zoom,  camera.targetZoom,  0.06);
  camera.shake = lerp(camera.shake, camera.targetShake, 0.1);

  // apply camera
  ctx.save();
  const sx = (Math.random()-0.5)*camera.shake*10;
  const sy = (Math.random()-0.5)*camera.shake*10;

  ctx.translate(
    canvas.width/2 + sx,
    canvas.height/2 + sy
  );
  ctx.scale(camera.zoom,camera.zoom);
  ctx.translate(-canvas.width/2,-canvas.height/2);

  drawCharacter();
  ctx.restore();

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
