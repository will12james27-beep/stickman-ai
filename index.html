<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>21 C.24 Emotion Transition & Blend</title>
<style>
  body{margin:0;background:#111;}
  canvas{display:block;margin:auto;background:#fff;}
</style>
</head>
<body>

<canvas id="c" width="480" height="640"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* =========================
   EMOTION DATA
========================= */

const Emotion = {
  NEUTRAL: "neutral",
  ANGRY: "angry",
  CONFUSED: "confused",
  SHOCKED: "shocked"
};

const faceMap = {
  neutral:  { eye:1,   brow:0,   mouth:0 },
  angry:    { eye:0.6, brow:-20, mouth:-4 },
  confused: { eye:0.85,brow:15,  mouth:3 },
  shocked:  { eye:1.4, brow:0,   mouth:10 }
};

/* =========================
   BLEND STATE
========================= */

let current = { eye:1, brow:0, mouth:0 };
let target  = { ...current };

/* =========================
   HELPERS
========================= */

function lerp(a,b,t){ return a+(b-a)*t; }

function setEmotion(e){
  target = { ...faceMap[e] };
}

/* =========================
   DRAW FACE
========================= */

function drawEye(x,y,open){
  ctx.beginPath();
  ctx.ellipse(x,y,3,5*open,0,0,Math.PI*2);
  ctx.stroke();
}

function drawBrow(x,y,tilt){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(tilt*Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(-6,0);
  ctx.lineTo(6,0);
  ctx.stroke();
  ctx.restore();
}

function drawMouth(x,y,open){
  ctx.beginPath();
  if(open<2){
    ctx.moveTo(x-6,y);
    ctx.lineTo(x+6,y+open);
  }else{
    ctx.arc(x,y,4+open/2,0,Math.PI*2);
  }
  ctx.stroke();
}

function drawFace(x,y){
  drawEye(x-10,y,current.eye);
  drawEye(x+10,y,current.eye);
  drawBrow(x-10,y-10,current.brow);
  drawBrow(x+10,y-10,current.brow);
  drawMouth(x,y+12,current.mouth);
}

/* =========================
   CHARACTER
========================= */

function drawCharacter(){
  ctx.lineWidth=2;
  ctx.strokeStyle="#000";

  // head
  ctx.beginPath();
  ctx.arc(240,200,40,0,Math.PI*2);
  ctx.stroke();

  drawFace(240,200);

  // body
  ctx.beginPath();
  ctx.moveTo(240,240);
  ctx.lineTo(240,360);
  ctx.stroke();

  // arms
  ctx.beginPath();
  ctx.moveTo(240,280);
  ctx.lineTo(190,320);
  ctx.moveTo(240,280);
  ctx.lineTo(290,320);
  ctx.stroke();

  // legs
  ctx.beginPath();
  ctx.moveTo(240,360);
  ctx.lineTo(210,440);
  ctx.moveTo(240,360);
  ctx.lineTo(270,440);
  ctx.stroke();
}

/* =========================
   EMOTION SEQUENCE
========================= */

setTimeout(()=>setEmotion(Emotion.CONFUSED),1000);
setTimeout(()=>setEmotion(Emotion.SHOCKED),2500);
setTimeout(()=>setEmotion(Emotion.ANGRY),4200);
setTimeout(()=>setEmotion(Emotion.NEUTRAL),6500);

/* =========================
   LOOP
========================= */

function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // smooth blend
  current.eye   = lerp(current.eye,   target.eye,   0.08);
  current.brow  = lerp(current.brow,  target.brow,  0.08);
  current.mouth = lerp(current.mouth, target.mouth, 0.08);

  drawCharacter();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
