<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman v18-A — Emotion Presets</title>
<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}
canvas{background:#181818;margin-top:10px;}
.ui{margin:10px;display:flex;gap:6px;flex-wrap:wrap}
button{
  padding:6px 10px;
  background:#222;
  color:#fff;
  border:1px solid #444;
  cursor:pointer;
}
button:hover{background:#333}
</style>
</head>
<body>

<canvas id="c" width="360" height="540"></canvas>

<div class="ui">
  <button onclick="setPreset('neutral')">😐 Neutral</button>
  <button onclick="setPreset('happy')">🙂 Happy</button>
  <button onclick="setPreset('surprised')">😮 Surprise</button>
  <button onclick="setPreset('angry')">😠 Angry</button>
  <button onclick="addKey()">ADD KEY</button>
  <button onclick="play()">▶ PLAY</button>
  <button onclick="stop()">■ STOP</button>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let frame=0;
let playing=false;
const timeline=[];

// ===== STICK =====
const stick={
  x:180,y:260,
  headR:16,
  body:40,
  leg:35,
  armU:22,
  armL:20
};

// ===== CURRENT STATE =====
let state={
  eyeOpen:1, eyeScale:1,
  mouthOpen:0, brow:0,
  armLift:0
};

// ===== EMOTION PRESETS =====
const emotionPresets={
  neutral:{eyeOpen:1,eyeScale:1,mouthOpen:0,brow:0,armLift:0},
  happy:{eyeOpen:0.7,eyeScale:0.9,mouthOpen:0.4,brow:0.2,armLift:0.3},
  surprised:{eyeOpen:1.3,eyeScale:1.2,mouthOpen:1,brow:0.8,armLift:0.9},
  angry:{eyeOpen:0.6,eyeScale:0.8,mouthOpen:0.2,brow:-0.8,armLift:-0.4}
};

function setPreset(name){
  Object.assign(state, emotionPresets[name]);
}

// ===== KEYFRAME =====
function addKey(){
  timeline.push({
    frame,
    preset: {...state}
  });
}

function play(){
  if(timeline.length<2) return;
  playing=true;
}
function stop(){playing=false;}

const lerp=(a,b,t)=>a+(b-a)*t;

function applyTimeline(){
  if(timeline.length<2) return;
  const a=timeline[0];
  const b=timeline[timeline.length-1];
  const t=(frame%60)/60;
  for(let k in state){
    state[k]=lerp(a.preset[k],b.preset[k],t);
  }
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  // ground
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,320);ctx.lineTo(360,320);ctx.stroke();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;

  // body
  ctx.beginPath();
  ctx.moveTo(stick.x,stick.y);
  ctx.lineTo(stick.x,stick.y+stick.body);
  ctx.stroke();

  // legs
  ctx.beginPath();
  ctx.moveTo(stick.x,stick.y+stick.body);
  ctx.lineTo(stick.x-15,stick.y+stick.body+stick.leg);
  ctx.moveTo(stick.x,stick.y+stick.body);
  ctx.lineTo(stick.x+15,stick.y+stick.body+stick.leg);
  ctx.stroke();

  // arms
  const shoulderY=stick.y+5;
  const lift=-state.armLift*25;
  drawArm(stick.x-2,shoulderY,-1,lift);
  drawArm(stick.x+2,shoulderY,1,lift);

  // head
  ctx.beginPath();
  ctx.arc(stick.x,stick.y-stick.headR,stick.headR,0,Math.PI*2);
  ctx.stroke();

  drawFace();
}

function drawArm(x,y,dir,lift){
  const ex=x+dir*stick.armU;
  const ey=y+lift;
  const hx=ex+dir*stick.armL;
  const hy=ey+lift*0.6;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(ex,ey);
  ctx.lineTo(hx,hy);
  ctx.stroke();
}

function drawFace(){
  const hx=stick.x;
  const hy=stick.y-stick.headR;

  // eyes
  ctx.beginPath();
  ctx.ellipse(hx-6,hy-3,3*state.eyeScale,3*state.eyeOpen,0,0,Math.PI*2);
  ctx.ellipse(hx+6,hy-3,3*state.eyeScale,3*state.eyeOpen,0,0,Math.PI*2);
  ctx.stroke();

  // brows
  ctx.beginPath();
  ctx.moveTo(hx-10,hy-8-state.brow*4);
  ctx.lineTo(hx-2,hy-6-state.brow*4);
  ctx.moveTo(hx+2,hy-6-state.brow*4);
  ctx.lineTo(hx+10,hy-8-state.brow*4);
  ctx.stroke();

  // mouth
  ctx.beginPath();
  ctx.arc(hx,hy+7,5,0,Math.PI*state.mouthOpen);
  ctx.stroke();
}

// ===== LOOP =====
function loop(){
  if(playing){
    frame++;
    applyTimeline();
  }
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
