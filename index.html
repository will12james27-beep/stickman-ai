<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.17</title>
<style>
html,body{
  margin:0;padding:0;
  width:100%;height:100%;
  overflow:hidden;background:#000;
}
canvas{display:block;}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// ================= CANVAS =================
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resize(); window.addEventListener("resize",resize);

// ================= SCENE =================
const scene={width:5000,groundY:900};

// ================= CHAR =================
function createChar(x,color){
  return{
    x,
    y:scene.groundY-120,
    color,
    head:18,body:50,arm:40,leg:45,
    bob:0,react:0,
    emoji:null
  };
}

const chars=[
  createChar(800,"#e91e63"),
  createChar(1300,"#000"),
  createChar(1800,"#2196f3"),
  createChar(2300,"#4caf50")
];

// ================= CAMERA =================
const camera={
  x:0,y:0,zoom:1,targetZoom:1,
  smooth:0.15,zoomSmooth:0.2,
  shake:0
};
let focusChar=chars[0];

function camX(x){return(x-camera.x)*camera.zoom;}

function updateCamera(){
  const tx=focusChar.x-canvas.width/(2*camera.zoom);
  camera.x+=(tx-camera.x)*camera.smooth;
  camera.zoom+=(camera.targetZoom-camera.zoom)*camera.zoomSmooth;
}

// ================= EMOJI =================
function spawnEmoji(c,s){
  c.emoji={s,life:40,scale:0.4,y:0};
}
function updateEmoji(c){
  if(!c.emoji)return;
  c.emoji.life--;
  c.emoji.scale+=0.03;
  c.emoji.y+=1;
  if(c.emoji.life<=0)c.emoji=null;
}

// ================= SUBTITLE =================
const subtitle={
  words:[],index:0,timer:0,active:false
};

function startSubtitle(text){
  subtitle.words=text.split(" ");
  subtitle.index=0;
  subtitle.timer=12;
  subtitle.active=true;
}

function updateSubtitle(){
  if(!subtitle.active)return;
  subtitle.timer--;
  if(subtitle.timer<=0){
    subtitle.index++;
    subtitle.timer=12;
    if(subtitle.index>=subtitle.words.length){
      subtitle.active=false;
    }
  }
}

function drawSubtitle(){
  if(!subtitle.active)return;
  ctx.fillStyle="#000";
  ctx.fillRect(0,canvas.height-140,canvas.width,140);

  ctx.textAlign="center";
  ctx.font="bold 34px Arial";
  let x=canvas.width/2,y=canvas.height-70,off=-140;

  subtitle.words.forEach((w,i)=>{
    let s=1,c="#aaa";
    if(i===subtitle.index){
      s=1.5;c="#ffeb3b";
    }
    ctx.save();
    ctx.translate(x+off,y);
    ctx.scale(s,s);
    ctx.fillStyle=c;
    ctx.fillText(w,0,0);
    ctx.restore();
    off+=ctx.measureText(w+" ").width;
  });
}

// ================= REACTION CHAIN =================
const chain=[
  {
    speaker:0,
    text:"THIS IS IMPOSSIBLE",
    reactions:[
      {c:1,e:"😳"},
      {c:2,e:"🤨"},
      {c:3,e:"😐"}
    ]
  },
  {
    speaker:2,
    text:"NO IT ACTUALLY WORKS",
    reactions:[
      {c:0,e:"😡"},
      {c:1,e:"😱"},
      {c:3,e:"😮"}
    ]
  },
  {
    speaker:1,
    text:"WAIT WHAT",
    reactions:[
      {c:0,e:"😎"},
      {c:2,e:"🔥"},
      {c:3,e:"😂"}
    ]
  }
];

let chainIndex=0;
let chainTimer=0;

function startChain(){
  const s=chain[chainIndex];
  focusChar=chars[s.speaker];
  camera.targetZoom=1.6;
  startSubtitle(s.text);
  spawnEmoji(focusChar,"💬");
  focusChar.react=1;

  s.reactions.forEach((r,i)=>{
    setTimeout(()=>{
      spawnEmoji(chars[r.c],r.e);
      chars[r.c].react=1;
      camera.shake=6;
    },200+i*140);
  });

  chainTimer=s.text.split(" ").length*15+50;
}

startChain();

function updateChain(){
  chars.forEach(c=>{
    c.react+=(0-c.react)*0.15;
    c.bob+=(0-c.bob)*0.2;
  });

  if(chainTimer>0)chainTimer--;
  else{
    chainIndex=(chainIndex+1)%chain.length;
    startChain();
  }
}

// ================= DRAW =================
function drawBG(){
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawGround(){
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(camX(0),scene.groundY);
  ctx.lineTo(camX(scene.width),scene.groundY);
  ctx.stroke();
}

function drawChar(c){
  ctx.strokeStyle=c.color;
  ctx.lineWidth=4;

  const hx=c.x;
  const hy=c.y+c.bob-c.react*8;

  ctx.beginPath();
  ctx.arc(camX(hx),hy,c.head*camera.zoom,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx),hy+c.head);
  ctx.lineTo(camX(hx),hy+c.head+c.body);
  ctx.stroke();

  const by=hy+c.head+c.body;
  ctx.beginPath();
  ctx.moveTo(camX(hx),by);
  ctx.lineTo(camX(hx-c.leg),by+c.leg);
  ctx.moveTo(camX(hx),by);
  ctx.lineTo(camX(hx+c.leg),by+c.leg);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx),hy+25);
  ctx.lineTo(camX(hx-c.arm),hy+40);
  ctx.moveTo(camX(hx),hy+25);
  ctx.lineTo(camX(hx+c.arm),hy+40);
  ctx.stroke();

  if(c.emoji){
    ctx.font=`${42*c.emoji.scale}px serif`;
    ctx.textAlign="center";
    ctx.fillText(c.emoji.s,camX(hx),hy-40-c.emoji.y);
    updateEmoji(c);
  }
}

// ================= LOOP =================
function loop(){
  updateCamera();
  updateChain();
  updateSubtitle();

  drawBG();
  drawGround();
  chars.forEach(drawChar);
  drawSubtitle();

  if(camera.shake>0){
    ctx.translate(
      (Math.random()-0.5)*camera.shake,
      (Math.random()-0.5)*camera.shake
    );
    camera.shake*=0.7;
  }

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
