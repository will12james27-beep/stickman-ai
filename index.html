<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.18</title>
<style>
html,body{
  margin:0;padding:0;
  width:100%;height:100%;
  overflow:hidden;background:#000;
}
canvas{display:block;}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// ================= CANVAS =================
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resize(); window.addEventListener("resize",resize);

// ================= SCENE =================
const scene={width:6000,groundY:900};

// ================= CHAR =================
function createChar(x,color){
  return{
    x,
    y:scene.groundY-120,
    color,
    head:18,body:50,arm:40,leg:45,
    bob:0,react:0,
    emoji:null,
    talk:0
  };
}

const chars=[
  createChar(900,"#e91e63"),
  createChar(1400,"#000"),
  createChar(1900,"#2196f3"),
  createChar(2400,"#4caf50")
];

// ================= CAMERA =================
const camera={
  x:0,y:0,zoom:1,targetZoom:1,
  smooth:0.12,zoomSmooth:0.15,
  shake:0
};
let focusChar=chars[0];

function camX(x){return(x-camera.x)*camera.zoom;}

function updateCamera(){
  const tx=focusChar.x-canvas.width/(2*camera.zoom);
  camera.x+=(tx-camera.x)*camera.smooth;
  camera.zoom+=(camera.targetZoom-camera.zoom)*camera.zoomSmooth;
}

// ================= EMOJI =================
function spawnEmoji(c,s){
  c.emoji={s,life:40,scale:0.4,y:0};
}
function updateEmoji(c){
  if(!c.emoji)return;
  c.emoji.life--;
  c.emoji.scale+=0.04;
  c.emoji.y+=1.2;
  if(c.emoji.life<=0)c.emoji=null;
}

// ================= SUBTITLE =================
const subtitle={
  text:"",
  life:0,
  shake:0,
  color:"#ffeb3b"
};

function showSubtitle(text,shake=4,color="#ffeb3b"){
  subtitle.text=text;
  subtitle.life=80;
  subtitle.shake=shake;
  subtitle.color=color;
}

function drawSubtitle(){
  if(subtitle.life<=0)return;
  subtitle.life--;

  ctx.fillStyle="#000";
  ctx.fillRect(0,canvas.height-150,canvas.width,150);

  ctx.font="bold 36px Arial";
  ctx.textAlign="center";

  const ox=(Math.random()-0.5)*subtitle.shake;
  const oy=(Math.random()-0.5)*subtitle.shake;

  ctx.fillStyle=subtitle.color;
  ctx.fillText(
    subtitle.text,
    canvas.width/2+ox,
    canvas.height-80+oy
  );
}

// ================= INTERRUPT CHAIN =================
const chain=[
  {
    speaker:0,
    text:"THIS MAKES NO SENSE",
    color:"#ff5252",
    interrupts:[
      {t:25,c:1,text:"WAIT WAIT",e:"✋"},
      {t:40,c:2,text:"BRO LISTEN",e:"😤"}
    ]
  },
  {
    speaker:2,
    text:"I ALREADY EXPLAINED IT",
    color:"#03a9f4",
    interrupts:[
      {t:30,c:3,text:"NO YOU DID NOT",e:"🤬"},
      {t:55,c:0,text:"STOP LYING",e:"🔥"}
    ]
  },
  {
    speaker:1,
    text:"EVERYONE CALM DOWN",
    color:"#4caf50",
    interrupts:[
      {t:20,c:2,text:"NO",e:"💥"}
    ]
  }
];

let chainIndex=0;
let timer=0;
let activeInterrupts=[];

function startChain(){
  const s=chain[chainIndex];
  focusChar=chars[s.speaker];
  camera.targetZoom=1.6;
  camera.shake=6;

  chars.forEach(c=>c.talk=0);
  focusChar.talk=1;

  showSubtitle(s.text,3,s.color);
  spawnEmoji(focusChar,"💬");

  activeInterrupts=s.interrupts.map(i=>({...i,done:false}));
  timer=0;
}

startChain();

function updateChain(){
  timer++;

  chars.forEach(c=>{
    c.react+=(0-c.react)*0.2;
    c.bob+=(0-c.bob)*0.2;
    c.talk+=(0-c.talk)*0.2;
  });

  const s=chain[chainIndex];

  activeInterrupts.forEach(i=>{
    if(!i.done && timer>i.t){
      i.done=true;
      focusChar=chars[i.c];
      camera.targetZoom=1.8;
      camera.shake=8;

      chars[i.c].talk=1;
      spawnEmoji(chars[i.c],i.e);
      showSubtitle(i.text,6,"#ffeb3b");
    }
  });

  if(timer>120){
    chainIndex=(chainIndex+1)%chain.length;
    startChain();
  }
}

// ================= DRAW =================
function drawBG(){
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawGround(){
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(camX(0),scene.groundY);
  ctx.lineTo(camX(scene.width),scene.groundY);
  ctx.stroke();
}

function drawChar(c){
  ctx.strokeStyle=c.color;
  ctx.lineWidth=4;

  const hx=c.x;
  const hy=c.y - c.talk*10;

  ctx.beginPath();
  ctx.arc(camX(hx),hy,c.head*camera.zoom,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx),hy+c.head);
  ctx.lineTo(camX(hx),hy+c.head+c.body);
  ctx.stroke();

  const by=hy+c.head+c.body;
  ctx.beginPath();
  ctx.moveTo(camX(hx),by);
  ctx.lineTo(camX(hx-c.leg),by+c.leg);
  ctx.moveTo(camX(hx),by);
  ctx.lineTo(camX(hx+c.leg),by+c.leg);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx),hy+25);
  ctx.lineTo(camX(hx-c.arm),hy+40);
  ctx.moveTo(camX(hx),hy+25);
  ctx.lineTo(camX(hx+c.arm),hy+40);
  ctx.stroke();

  if(c.emoji){
    ctx.font=`${44*c.emoji.scale}px serif`;
    ctx.textAlign="center";
    ctx.fillText(c.emoji.s,camX(hx),hy-45-c.emoji.y);
    updateEmoji(c);
  }
}

// ================= LOOP =================
function loop(){
  updateCamera();
  updateChain();

  drawBG();
  drawGround();
  chars.forEach(drawChar);
  drawSubtitle();

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
