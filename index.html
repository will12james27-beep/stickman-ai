<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.15</title>
<style>
html,body{
  margin:0;padding:0;
  width:100%;height:100%;
  overflow:hidden;background:#000;
}
canvas{display:block;}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// ================= CANVAS =================
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resize(); window.addEventListener("resize",resize);

// ================= SCENE =================
const scene={width:5000,groundY:900};

// ================= CHAR =================
function createChar(x,color){
  return{
    x,
    y:scene.groundY-120,
    color,
    head:18,body:50,arm:40,leg:45,
    emoji:null
  };
}

const chars=[
  createChar(800,"#e91e63"),
  createChar(1400,"#000"),
  createChar(2000,"#2196f3")
];

let focusChar=chars[0];

// ================= CAMERA =================
const camera={
  x:0,y:0,
  zoom:1,targetZoom:1,
  smooth:0.15,zoomSmooth:0.2,
  freeze:0,flash:0
};

function camX(x){return(x-camera.x)*camera.zoom;}
function camY(y){return(y-camera.y)*camera.zoom;}

function updateCamera(){
  if(camera.freeze>0){camera.freeze--;return;}
  const tx=focusChar.x-canvas.width/(2*camera.zoom);
  camera.x+=(tx-camera.x)*camera.smooth;
  camera.zoom+=(camera.targetZoom-camera.zoom)*camera.zoomSmooth;
}

// ================= EMOJI =================
function spawnEmoji(c,s){
  c.emoji={s,life:35,scale:0.3,y:0};
}
function updateEmoji(c){
  if(!c.emoji)return;
  c.emoji.life--;
  c.emoji.scale+=0.05;
  c.emoji.y+=1.2;
  if(c.emoji.life<=0)c.emoji=null;
}

// ================= SUBTITLE =================
const subtitle={
  words:[],index:0,timer:0,active:false,punch:false
};

function startSubtitle(text){
  subtitle.words=text.split(" ");
  subtitle.index=0;
  subtitle.timer=10;
  subtitle.active=true;
  subtitle.punch=false;
}

function updateSubtitle(){
  if(!subtitle.active)return;
  subtitle.timer--;
  if(subtitle.timer<=0){
    subtitle.index++;
    subtitle.timer=10;

    // punchline moment
    if(subtitle.index===subtitle.words.length-1){
      subtitle.punch=true;
      camera.targetZoom=2.2;
      camera.freeze=15;
      camera.flash=6;
    }

    if(subtitle.index>=subtitle.words.length){
      subtitle.active=false;
      camera.targetZoom=1;
    }
  }
}

function drawSubtitle(){
  if(!subtitle.active)return;

  ctx.fillStyle="#000";
  ctx.fillRect(0,canvas.height-150,canvas.width,150);

  let x=canvas.width/2;
  let y=canvas.height-70;
  ctx.textAlign="center";
  ctx.font="bold 36px Arial";

  let offset=-150;
  subtitle.words.forEach((w,i)=>{
    let scale=1,color="#aaa";
    if(i===subtitle.index){
      scale=subtitle.punch?1.8:1.4;
      color=subtitle.punch?"#ff1744":"#ffeb3b";
    }
    ctx.save();
    ctx.translate(x+offset,y);
    ctx.scale(scale,scale);
    ctx.fillStyle=color;
    ctx.fillText(w,0,0);
    ctx.restore();
    offset+=ctx.measureText(w+" ").width;
  });
}

// ================= SCENE CUT SYSTEM =================
let cutAlpha=0;
let cutting=false;

function startSceneCut(){
  cutting=true;
  cutAlpha=0;
}

function updateSceneCut(){
  if(!cutting)return;
  cutAlpha+=0.12;
  if(cutAlpha>=1){
    cutAlpha=1;
    cutting=false;
  }
}

function drawSceneCut(){
  if(cutAlpha<=0)return;
  ctx.globalAlpha=cutAlpha;
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.globalAlpha=1;
}

// ================= DIALOG / BEAT =================
const beats=[
  {c:0,t:"MY BRAIN IS MELTING",e:"🤯"},
  {c:1,t:"THIS MAKES NO SENSE",e:"😱"},
  {c:2,t:"WAIT I UNDERSTAND NOW",e:"😎"}
];

let beatIndex=0;
let beatTimer=0;

function startBeat(){
  const b=beats[beatIndex];
  focusChar=chars[b.c];
  spawnEmoji(focusChar,b.e);
  startSubtitle(b.t);
  camera.targetZoom=1.6;
  beatTimer=b.t.split(" ").length*12+30;
}

startBeat();

function updateBeats(){
  if(beatTimer>0)beatTimer--;
  else{
    startSceneCut(); // AUTO CUT
    beatIndex=(beatIndex+1)%beats.length;
    setTimeout(startBeat,150);
  }
}

// ================= DRAW =================
function drawBG(){
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawGround(){
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(camX(0),scene.groundY);
  ctx.lineTo(camX(scene.width),scene.groundY);
  ctx.stroke();
}

function drawChar(c){
  ctx.strokeStyle=c.color;
  ctx.lineWidth=4;
  const hx=c.x,hy=c.y;

  ctx.beginPath();
  ctx.arc(camX(hx),hy,c.head*camera.zoom,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx),hy+c.head);
  ctx.lineTo(camX(hx),hy+c.head+c.body);
  ctx.stroke();

  const by=hy+c.head+c.body;
  ctx.beginPath();
  ctx.moveTo(camX(hx),by);
  ctx.lineTo(camX(hx-c.leg),by+c.leg);
  ctx.moveTo(camX(hx),by);
  ctx.lineTo(camX(hx+c.leg),by+c.leg);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx),hy+25);
  ctx.lineTo(camX(hx-c.arm),hy+40);
  ctx.moveTo(camX(hx),hy+25);
  ctx.lineTo(camX(hx+c.arm),hy+40);
  ctx.stroke();

  if(c.emoji){
    ctx.font=`${40*c.emoji.scale}px serif`;
    ctx.textAlign="center";
    ctx.fillText(c.emoji.s,camX(hx),hy-40-c.emoji.y);
    updateEmoji(c);
  }
}

// ================= LOOP =================
function loop(){
  updateBeats();
  updateSubtitle();
  updateCamera();
  updateSceneCut();

  drawBG();
  drawGround();
  chars.forEach(drawChar);
  drawSubtitle();
  drawSceneCut();

  if(camera.flash>0){
    ctx.globalAlpha=camera.flash/6;
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha=1;
    camera.flash--;
  }

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
