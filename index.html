<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v22.0</title>
<style>
body{
  margin:0;
  background:#02080c;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
}
canvas{
  background:#fff;
  border-radius:12px;
}
.panel{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="panel">
  <button onclick="mode='walk'">AI Walk</button>
  <button onclick="mode='idle'">AI Idle</button>
  <button onclick="record()">● Rec</button>
  <button onclick="play()">▶ Play</button>
  <button onclick="exportJSON()">⤓ JSON</button>
  <button onclick="exportPNG()">🖼 PNG</button>
</div>

<canvas id="c" width="360" height="640"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const ground=520;
let time=0;
let mode="idle";

// ===== TIMELINE =====
let recording=false, playing=false;
let timeline=[], playIndex=0;

// ===== JOINT =====
class Joint{
  constructor(x,y){this.x=x;this.y=y;}
  clone(){return {x:this.x,y:this.y}}
}

// ===== STICKMAN FACTORY =====
function createMan(x){
  return {
    hip:new Joint(x,ground-70),
    neck:new Joint(x,ground-135),
    head:new Joint(x,ground-170),
    legL:new Joint(x-15,ground),
    legR:new Joint(x+15,ground),
    armL:new Joint(x-40,ground-135),
    armR:new Joint(x+40,ground-135)
  };
}

const men=[createMan(140),createMan(220)];

// ===== UTILS =====
function stick(a,b,l){
  const dx=b.x-a.x,dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||1;
  const diff=(d-l)/d*0.5;
  a.x+=dx*diff; a.y+=dy*diff;
  b.x-=dx*diff; b.y-=dy*diff;
}

// ===== AI ANIMATION =====
function aiWalk(man){
  const s=Math.sin(time*0.12);
  man.hip.x+=0.6;
  man.legL.x=man.hip.x-15+s*20;
  man.legR.x=man.hip.x+15-s*20;
  man.legL.y=ground-Math.max(0,s*14);
  man.legR.y=ground-Math.max(0,-s*14);
  man.armL.x=man.neck.x-35-s*15;
  man.armR.x=man.neck.x+35+s*15;
}

function aiIdle(man){
  man.neck.y+=Math.sin(time*0.05)*0.05;
}

// ===== RECORD =====
function record(){
  recording=!recording;
  if(recording) timeline=[];
}

function play(){
  if(timeline.length===0)return;
  playing=true; playIndex=0;
}

function capture(){
  timeline.push(JSON.parse(JSON.stringify(men)));
}

function applyFrame(f){
  f.forEach((fm,i)=>{
    for(let k in fm){
      men[i][k].x=fm[k].x;
      men[i][k].y=fm[k].y;
    }
  });
}

// ===== EXPORT =====
function exportJSON(){
  console.log(JSON.stringify(timeline,null,2));
  alert("Timeline JSON console’da (F12)");
}
function exportPNG(){
  const a=document.createElement("a");
  a.download="stickman.png";
  a.href=c.toDataURL();
  a.click();
}

// ===== MOUSE POSE =====
let drag=null;
c.addEventListener("mousedown",e=>{
  const r=c.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  men.forEach(m=>{
    for(let k in m){
      if(Math.hypot(m[k].x-mx,m[k].y-my)<12) drag=m[k];
    }
  });
});
c.addEventListener("mousemove",e=>{
  if(!drag)return;
  const r=c.getBoundingClientRect();
  drag.x=e.clientX-r.left;
  drag.y=e.clientY-r.top;
});
c.addEventListener("mouseup",()=>drag=null);

// ===== DRAW =====
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}
function drawMan(m){
  line(m.head,m.neck);
  line(m.neck,m.hip);
  line(m.hip,m.legL);
  line(m.hip,m.legR);
  line(m.neck,m.armL);
  line(m.neck,m.armR);
  ctx.beginPath();
  ctx.arc(m.head.x,m.head.y,14,0,Math.PI*2);
  ctx.stroke();
}

// ===== LOOP =====
function loop(){
  time++;

  if(playing){
    applyFrame(timeline[playIndex++]);
    if(playIndex>=timeline.length) playing=false;
  }else{
    men.forEach(m=>{
      if(mode==="walk") aiWalk(m);
      else aiIdle(m);
    });
  }

  men.forEach(m=>{
    for(let i=0;i<6;i++){
      stick(m.head,m.neck,35);
      stick(m.neck,m.hip,65);
      stick(m.hip,m.legL,65);
      stick(m.hip,m.legR,65);
      stick(m.neck,m.armL,45);
      stick(m.neck,m.armR,45);
    }
  });

  if(recording) capture();

  ctx.clearRect(0,0,360,640);
  ctx.strokeStyle="#ccc";
  line({x:0,y:ground},{x:360,y:ground});
  ctx.strokeStyle="#000";
  men.forEach(drawMan);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
