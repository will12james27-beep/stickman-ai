<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.16</title>
<style>
html,body{
  margin:0;padding:0;
  width:100%;height:100%;
  overflow:hidden;background:#000;
}
canvas{display:block;}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// ================= CANVAS =================
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resize(); window.addEventListener("resize",resize);

// ================= BPM CLOCK =================
const BPM = 120;
const beatInterval = 60 / BPM;
let lastBeat = performance.now();
let beatPulse = 0;

function updateBeat(){
  const now = performance.now();
  if((now - lastBeat)/1000 >= beatInterval){
    lastBeat = now;
    beatPulse = 1;
    onBeat();
  }
  beatPulse *= 0.85;
}

// ================= SCENE =================
const scene={width:5000,groundY:900};

// ================= CHAR =================
function createChar(x,color){
  return{
    x,
    y:scene.groundY-120,
    color,
    head:18,body:50,arm:40,leg:45,
    bob:0,
    emoji:null
  };
}

const chars=[
  createChar(800,"#e91e63"),
  createChar(1400,"#000"),
  createChar(2000,"#2196f3")
];

let focusChar=chars[0];

// ================= CAMERA =================
const camera={
  x:0,y:0,
  zoom:1,targetZoom:1,
  smooth:0.15,zoomSmooth:0.2,
  shake:0,freeze:0,flash:0
};

function camX(x){return(x-camera.x)*camera.zoom;}
function camY(y){return(y-camera.y)*camera.zoom;}

function updateCamera(){
  if(camera.freeze>0){camera.freeze--;return;}
  const tx=focusChar.x-canvas.width/(2*camera.zoom);
  camera.x+=(tx-camera.x)*camera.smooth;
  camera.zoom+=(camera.targetZoom-camera.zoom)*camera.zoomSmooth;
}

// ================= BEAT REACTION =================
function onBeat(){
  camera.shake=8;
  focusChar.bob=-8;
  if(subtitle.punch){
    camera.flash=4;
  }
}

// ================= EMOJI =================
function spawnEmoji(c,s){
  c.emoji={s,life:40,scale:0.3,y:0};
}
function updateEmoji(c){
  if(!c.emoji)return;
  c.emoji.life--;
  c.emoji.scale+=0.04;
  c.emoji.y+=1.1;
  if(c.emoji.life<=0)c.emoji=null;
}

// ================= SUBTITLE =================
const subtitle={
  words:[],index:0,timer:0,active:false,punch:false
};

function startSubtitle(text){
  subtitle.words=text.split(" ");
  subtitle.index=0;
  subtitle.timer=10;
  subtitle.active=true;
  subtitle.punch=false;
}

function updateSubtitle(){
  if(!subtitle.active)return;
  subtitle.timer--;
  if(subtitle.timer<=0){
    subtitle.index++;
    subtitle.timer=10;

    if(subtitle.index===subtitle.words.length-1){
      subtitle.punch=true;
      camera.targetZoom=2.2;
      camera.freeze=12;
    }

    if(subtitle.index>=subtitle.words.length){
      subtitle.active=false;
      subtitle.punch=false;
      camera.targetZoom=1;
    }
  }
}

function drawSubtitle(){
  if(!subtitle.active)return;
  ctx.fillStyle="#000";
  ctx.fillRect(0,canvas.height-150,canvas.width,150);

  ctx.textAlign="center";
  ctx.font="bold 36px Arial";
  let x=canvas.width/2,y=canvas.height-70,off=-140;

  subtitle.words.forEach((w,i)=>{
    let s=1,c="#aaa";
    if(i===subtitle.index){
      s=subtitle.punch?1.9:1.4;
      c=subtitle.punch?"#ff1744":"#ffeb3b";
    }
    ctx.save();
    ctx.translate(x+off,y);
    ctx.scale(s,s);
    ctx.fillStyle=c;
    ctx.fillText(w,0,0);
    ctx.restore();
    off+=ctx.measureText(w+" ").width;
  });
}

// ================= SCENE CUT =================
let cutAlpha=0,cutting=false;
function startSceneCut(){
  cutting=true;cutAlpha=0;
}
function updateSceneCut(){
  if(!cutting)return;
  cutAlpha+=0.15;
  if(cutAlpha>=1){
    cutAlpha=1;cutting=false;
  }
}
function drawSceneCut(){
  if(cutAlpha<=0)return;
  ctx.globalAlpha=cutAlpha;
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.globalAlpha=1;
}

// ================= DIALOG / BEATS =================
const beats=[
  {c:0,t:"MY BRAIN IS MELTING",e:"🤯"},
  {c:1,t:"THIS MAKES NO SENSE",e:"😱"},
  {c:2,t:"WAIT I GET IT NOW",e:"😎"}
];

let beatIndex=0;
let beatTimer=0;

function startBeatScene(){
  const b=beats[beatIndex];
  focusChar=chars[b.c];
  spawnEmoji(focusChar,b.e);
  startSubtitle(b.t);
  camera.targetZoom=1.5;
  beatTimer=b.t.split(" ").length*12+40;
}

startBeatScene();

function updateBeatScenes(){
  if(beatTimer>0)beatTimer--;
  else{
    startSceneCut();
    beatIndex=(beatIndex+1)%beats.length;
    setTimeout(startBeatScene,160);
  }
}

// ================= DRAW =================
function drawBG(){
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawGround(){
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(camX(0),scene.groundY);
  ctx.lineTo(camX(scene.width),scene.groundY);
  ctx.stroke();
}

function drawChar(c){
  c.bob+=(0-c.bob)*0.2;
  ctx.strokeStyle=c.color;
  ctx.lineWidth=4;

  const hx=c.x;
  const hy=c.y+c.bob;

  ctx.beginPath();
  ctx.arc(camX(hx),hy,c.head*camera.zoom,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx),hy+c.head);
  ctx.lineTo(camX(hx),hy+c.head+c.body);
  ctx.stroke();

  const by=hy+c.head+c.body;
  ctx.beginPath();
  ctx.moveTo(camX(hx),by);
  ctx.lineTo(camX(hx-c.leg),by+c.leg);
  ctx.moveTo(camX(hx),by);
  ctx.lineTo(camX(hx+c.leg),by+c.leg);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx),hy+25);
  ctx.lineTo(camX(hx-c.arm),hy+40);
  ctx.moveTo(camX(hx),hy+25);
  ctx.lineTo(camX(hx+c.arm),hy+40);
  ctx.stroke();

  if(c.emoji){
    ctx.font=`${40*c.emoji.scale}px serif`;
    ctx.textAlign="center";
    ctx.fillText(c.emoji.s,camX(hx),hy-40-c.emoji.y);
    updateEmoji(c);
  }
}

// ================= LOOP =================
function loop(){
  updateBeat();
  updateBeatScenes();
  updateSubtitle();
  updateCamera();
  updateSceneCut();

  drawBG();
  drawGround();
  chars.forEach(drawChar);
  drawSubtitle();
  drawSceneCut();

  if(camera.shake>0){
    ctx.translate(
      (Math.random()-0.5)*camera.shake,
      (Math.random()-0.5)*camera.shake
    );
    camera.shake*=0.7;
  }

  if(camera.flash>0){
    ctx.globalAlpha=camera.flash/5;
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha=1;
    camera.flash--;
  }

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
