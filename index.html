<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.9</title>
<style>
html, body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
canvas{display:block;}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// =========================
// CANVAS
// =========================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// =========================
// SCENE
// =========================
const scene = {
  width: 6000,
  height: 2000,
  groundY: 900
};

// =========================
// TIME
// =========================
let timeScale = 1;
let targetTimeScale = 1;

// =========================
// CHARACTERS
// =========================
function createStickman(x){
  return {
    x,
    y: scene.groundY - 120,
    vx: 1.5 + Math.random(),
    vy: 0,
    onGround: true,
    head: 18,
    body: 50,
    arm: 40,
    leg: 45,
    speaking: false,
    speakTimer: 0
  };
}

const characters = [
  createStickman(700),
  createStickman(1100),
  createStickman(1500)
];

let activeSpeaker = characters[0];

// =========================
// CAMERA
// =========================
const camera = {
  x: 0,
  y: 0,
  zoom: 1,
  targetZoom: 1,

  followSmooth: 0.1,
  zoomSmooth: 0.15,

  shakeX: 0,
  shakeY: 0,
  shakePower: 0
};

function camX(x){ return (x - camera.x) * camera.zoom + camera.shakeX; }
function camY(y){ return (y - camera.y) * camera.zoom + camera.shakeY; }

// =========================
// CAMERA UPDATE
// =========================
function updateCamera(){
  const tx = activeSpeaker.x - canvas.width/(2*camera.zoom);
  const ty = activeSpeaker.y - canvas.height/(2*camera.zoom);

  camera.x += (tx - camera.x) * camera.followSmooth;
  camera.y += (ty - camera.y) * camera.followSmooth;

  camera.zoom += (camera.targetZoom - camera.zoom) * camera.zoomSmooth;

  updateShake();
}

// =========================
// SHAKE
// =========================
function updateShake(){
  if(camera.shakePower>0){
    camera.shakeX = (Math.random()-0.5)*camera.shakePower;
    camera.shakeY = (Math.random()-0.5)*camera.shakePower;
    camera.shakePower *= 0.85;
  } else {
    camera.shakeX = 0;
    camera.shakeY = 0;
  }
}

// =========================
// SPEAKER SYSTEM
// =========================
function setSpeaker(c){
  activeSpeaker = c;
  camera.targetZoom = 1.8;
  camera.shakePower = 6;

  setTimeout(()=>{
    camera.targetZoom = 1;
  },250);
}

function updateSpeaking(c){
  if(c.speakTimer>0){
    c.speakTimer--;
    if(c.speakTimer===0){
      c.speaking=false;
    }
  }
}

// =========================
// INPUT (dialog simulation)
// =========================
document.addEventListener("keydown", e=>{
  if(e.code==="Digit1") triggerSpeak(0);
  if(e.code==="Digit2") triggerSpeak(1);
  if(e.code==="Digit3") triggerSpeak(2);
});

function triggerSpeak(index){
  characters.forEach(c=>c.speaking=false);
  const c = characters[index];
  c.speaking = true;
  c.speakTimer = 40;
  setSpeaker(c);
}

// =========================
// PHYSICS
// =========================
function updateCharacters(){
  characters.forEach(c=>{
    c.x += c.vx * timeScale;

    c.vy += 0.8 * timeScale;
    c.y += c.vy * timeScale;

    if(c.y >= scene.groundY - 120){
      c.y = scene.groundY - 120;
      c.vy = 0;
      c.onGround = true;
    }

    if(c.x < 300 || c.x > scene.width-300){
      c.vx *= -1;
    }

    updateSpeaking(c);
  });
}

// =========================
// DRAW
// =========================
function drawBackground(){
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawGround(){
  ctx.strokeStyle="#aaa";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(camX(0), camY(scene.groundY));
  ctx.lineTo(camX(scene.width), camY(scene.groundY));
  ctx.stroke();
}

function drawStickman(p){
  ctx.strokeStyle = p===activeSpeaker ? "#e91e63" : "#000";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";

  const hx=p.x, hy=p.y;

  ctx.beginPath();
  ctx.arc(camX(hx), camY(hy), p.head*camera.zoom, 0, Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy+p.head));
  ctx.lineTo(camX(hx), camY(hy+p.head+p.body));
  ctx.stroke();

  const by=hy+p.head+p.body;

  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy+25));
  ctx.lineTo(camX(hx-p.arm), camY(hy+40));
  ctx.moveTo(camX(hx), camY(hy+25));
  ctx.lineTo(camX(hx+p.arm), camY(hy+40));
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx-p.leg), camY(by+p.leg));
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx+p.leg), camY(by+p.leg));
  ctx.stroke();

  if(p.speaking){
    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.arc(camX(hx+22), camY(hy-20), 6, 0, Math.PI*2);
    ctx.fill();
  }
}

// =========================
// LOOP
// =========================
function loop(){
  updateCharacters();
  updateCamera();

  drawBackground();
  drawGround();
  characters.forEach(drawStickman);

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
