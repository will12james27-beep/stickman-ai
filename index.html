<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v31.2 (Weight & Balance)</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
}
#studio{display:flex;flex-direction:column;gap:10px;align-items:center}
canvas{background:#fff;border-radius:16px}
.panel{display:flex;gap:6px}
button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="studio">
  <div class="panel">
    <button onclick="mode='walk'">Walk</button>
    <button onclick="mode='idle'">Idle</button>
    <button onclick="mode='wave'">Wave</button>
  </div>
  <canvas id="c" width="420" height="640"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=4;

const W=420, H=640, ground=520;
let time=0, mode="walk", camX=0;

// ===== JOINT =====
class Joint{
  constructor(x,y){ this.x=x; this.y=y; }
}

// ===== STICKMAN =====
function createMan(x){
  return{
    hip:new Joint(x,ground-85),
    neck:new Joint(x,ground-155),
    head:new Joint(x,ground-195),

    kneeL:new Joint(x-18,ground-45),
    kneeR:new Joint(x+18,ground-45),
    footL:new Joint(x-18,ground),
    footR:new Joint(x+18,ground),

    elbowL:new Joint(x-40,ground-135),
    elbowR:new Joint(x+40,ground-135),
    handL:new Joint(x-55,ground-115),
    handR:new Joint(x+55,ground-115),

    phase:0,
    vel:0,
    targetVel:0,
    maxSpeed:1.6,
    accel:0.06,
    decel:0.08,

    // BALANCE
    sway:0,
    headLag:0
  };
}

const men=[createMan(200)];

// ===== IK =====
function stick(a,b,len){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||1;
  const diff=(d-len)/d*0.5;
  a.x+=dx*diff; a.y+=dy*diff;
  b.x-=dx*diff; b.y-=dy*diff;
}

// ===== SPEED =====
function updateSpeed(m){
  if(m.vel < m.targetVel){
    m.vel += m.accel;
    if(m.vel > m.targetVel) m.vel = m.targetVel;
  }else if(m.vel > m.targetVel){
    m.vel -= m.decel;
    if(m.vel < m.targetVel) m.vel = m.targetVel;
  }
}

// ===== WALK =====
function walk(m){
  m.targetVel = m.maxSpeed;
  updateSpeed(m);

  m.phase += m.vel * 0.04;
  const s = Math.sin(m.phase);
  const stride = 26;

  const leftLock = s > 0;

  // FOOT LOCK
  if(leftLock){
    m.footL.x = m.hip.x - stride;
    m.footL.y = ground;

    m.footR.x = m.hip.x + stride + s*22;
    m.footR.y = ground - Math.max(0,-s)*28;
  }else{
    m.footR.x = m.hip.x + stride;
    m.footR.y = ground;

    m.footL.x = m.hip.x - stride + s*22;
    m.footL.y = ground - Math.max(0,s)*28;
  }

  // HIP MOVE
  m.hip.x += m.vel;
  m.hip.y = ground-85 - Math.abs(s)*8;

  // BALANCE SWAY
  m.sway += ((-s*8) - m.sway) * 0.15;

  // NECK & HEAD (S-curve)
  m.neck.x = m.hip.x + m.sway;
  m.neck.y = m.hip.y - 70;

  m.headLag += ((-m.sway*0.6) - m.headLag) * 0.12;
  m.head.x = m.neck.x + m.headLag;
  m.head.y = m.neck.y - 40;

  // ARMS (counter balance)
  m.handL.x = m.neck.x - 45 - s*22;
  m.handR.x = m.neck.x + 45 + s*22;
  m.handL.y = m.neck.y + 20;
  m.handR.y = m.neck.y + 20;

  camX += ((m.hip.x - W/2) - camX) * 0.08;
}

// ===== IDLE =====
function idle(m){
  m.targetVel = 0;
  updateSpeed(m);

  const b = Math.sin(time*0.05);
  m.hip.y = ground-85 + b*4;

  m.sway *= 0.85;

  m.neck.x = m.hip.x + m.sway;
  m.neck.y = m.hip.y - 70;
  m.head.x = m.neck.x;
  m.head.y = m.neck.y - 40;
}

// ===== WAVE =====
function wave(m){
  idle(m);
  m.handR.y = m.neck.y - 50 - Math.sin(time*0.25)*25;
  m.handR.x = m.neck.x + 50;
}

// ===== SOLVE =====
function solve(){
  men.forEach(m=>{
    for(let i=0;i<6;i++){
      stick(m.neck,m.hip,70);
      stick(m.head,m.neck,40);

      stick(m.hip,m.kneeL,40);
      stick(m.kneeL,m.footL,40);

      stick(m.hip,m.kneeR,40);
      stick(m.kneeR,m.footR,40);

      stick(m.neck,m.elbowL,35);
      stick(m.elbowL,m.handL,35);

      stick(m.neck,m.elbowR,35);
      stick(m.elbowR,m.handR,35);
    }
  });
}

// ===== DRAW =====
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function drawMan(m){
  ctx.beginPath();
  ctx.arc(m.head.x,m.head.y,16,0,Math.PI*2);
  ctx.stroke();

  line(m.head,m.neck);
  line(m.neck,m.hip);

  line(m.hip,m.kneeL);
  line(m.kneeL,m.footL);

  line(m.hip,m.kneeR);
  line(m.kneeR,m.footR);

  line(m.neck,m.elbowL);
  line(m.elbowL,m.handL);

  line(m.neck,m.elbowR);
  line(m.elbowR,m.handR);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  ctx.strokeStyle="#ccc";
  ctx.beginPath();
  ctx.moveTo(-camX,ground);
  ctx.lineTo(W-camX,ground);
  ctx.stroke();

  ctx.strokeStyle="#000";
  ctx.save();
  ctx.translate(-camX,0);
  men.forEach(drawMan);
  ctx.restore();
}

// ===== LOOP =====
function loop(){
  time++;
  men.forEach(m=>{
    if(mode==="walk") walk(m);
    if(mode==="idle") idle(m);
    if(mode==="wave") wave(m);
  });
  solve();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
