<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v12.0</title>
<style>
body{
  margin:0;
  background:#050d12;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:600px;
  background:#0b1f26;
  padding:14px;
  border-radius:18px;
  box-shadow:0 0 40px #00ffff55;
}
h3{text-align:center}
.panel{
  background:#072028;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
}
.row{display:flex;gap:6px}
.row>*{flex:1}
input,select,button{
  padding:8px;
  border-radius:8px;
  border:none;
}
button{background:cyan;font-weight:bold;cursor:pointer}
canvas{
  display:block;
  margin:10px auto;
  background:#fff;
  width:360px;height:560px;
  border-radius:12px;
}
small{text-align:center;display:block;opacity:.6}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v12.0</h3>

<div class="panel">
<b>🎞 Scene / Timeline</b>
<div class="row">
<select id="chSel">
<option value="girl">Girl</option>
<option value="boy">Boy</option>
</select>
<select id="actSel">
<option>stand</option>
<option>run</option>
<option>jump</option>
</select>
<input id="dur" type="number" value="2" min="0.5" step="0.5">
<button onclick="addKey()">➕</button>
</div>
<div id="timeline"></div>
</div>

<div class="panel">
<b>🎥 Camera / BG</b>
<div class="row">
<select onchange="cameraMode=this.value">
<option value="static">Static</option>
<option value="girl">Follow Girl</option>
<option value="boy">Follow Boy</option>
</select>
<select onchange="background=this.value">
<option>sky</option>
<option>night</option>
<option>sunset</option>
</select>
</div>
</div>

<canvas id="c"></canvas>

<div class="row">
<button onclick="togglePlay()">⏯ Play</button>
<button onclick="recordGIF()">🎞 GIF</button>
</div>

<small>v12.0 • Timeline • Emoji • Auto Walk • GIF • Camera • Presets</small>
</div>

<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=360;c.height=560;
ctx.lineCap="round";ctx.lineWidth=4;

const ground=460;
let playing=true,camX=0;
let cameraMode="static",background="sky";

class Stickman{
  constructor(x){
    this.baseX=x;this.x=x;this.y=ground;
    this.vy=0;
    this.emoji="😐";
    this.timeline=[];this.i=0;this.f=0;
  }
}
const girl=new Stickman(140);
const boy=new Stickman(220);
const chars={girl,boy};

function bg(){
  const g={
    sky:"#ccefff",
    night:"#001018",
    sunset:"#ffddb3"
  };
  ctx.fillStyle=g[background];
  ctx.fillRect(0,0,360,560);
}

function draw(ch){
  const x=ch.x-camX;
  const swing=Math.sin(ch.f*0.25)*12;

  ctx.beginPath();
  ctx.arc(x,ch.y-52,14,0,Math.PI*2);
  ctx.stroke();
  ctx.font="16px serif";
  ctx.fillText(ch.emoji,x-8,ch.y-46);

  ctx.beginPath();
  ctx.moveTo(x,ch.y-38);
  ctx.lineTo(x,ch.y-10);
  ctx.stroke();

  limb(x,ch.y-34,swing*0.05,20);
  limb(x,ch.y-34,-swing*0.05,20);
  leg(x-6,ch.y-10,swing*0.04);
  leg(x+6,ch.y-10,-swing*0.04);
}
function limb(x,y,a,l){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*l,y+Math.cos(a)*l);
  ctx.stroke();
}
function leg(x,y,a){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*12,y+16);
  ctx.lineTo(x+Math.sin(a)*12,y+32);
  ctx.stroke();
}

function step(){
  if(playing){
    for(const ch of Object.values(chars)){
      const k=ch.timeline[ch.i];
      if(k){
        ch.f++;
        ch.emoji=k.action==="run"?"😄":k.action==="jump"?"😮":"😐";
        if(k.action==="run") ch.x+=1;
        if(k.action==="jump" && ch.y>=ground) ch.vy=-10;
        if(ch.f>k.frames){ch.f=0;ch.i++;}
      }
      ch.vy+=0.6; ch.y+=ch.vy;
      if(ch.y>ground){ch.y=ground;ch.vy=0;}
    }
  }

  if(cameraMode!=="static"){
    const t=chars[cameraMode];
    camX+=(t.x-180-camX)*0.1;
  }

  bg();
  Object.values(chars).forEach(draw);
  requestAnimationFrame(step);
}
step();

function addKey(){
  const ch=chars[chSel.value];
  ch.timeline.push({
    action:actSel.value,
    frames:dur.value*60
  });
  renderTimeline();
}
function renderTimeline(){
  timeline.innerHTML="";
  Object.entries(chars).forEach(([n,ch])=>{
    ch.timeline.forEach((k,i)=>{
      const d=document.createElement("div");
      d.textContent=`${n} : ${k.action} ${k.frames/60}s`;
      timeline.appendChild(d);
    });
  });
}

function togglePlay(){playing=!playing;}

function recordGIF(){
  alert("GIF export: frame grab (demo). Next step: gif encoder lib");
}
</script>
</body>
</html>
