<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v9.1 STABLE</title>
<style>
body{margin:0;background:#06161b;color:#fff;font-family:Arial;display:flex;justify-content:center;padding:10px}
.box{width:520px;background:#0b1f26;padding:14px;border-radius:18px;box-shadow:0 0 30px #00ffff55}
h3{text-align:center}
input,select,button{width:100%;padding:8px;margin-top:6px;border-radius:8px;border:none}
button{background:cyan;cursor:pointer}
canvas{background:#fff;width:360px;height:560px;border-radius:10px;margin-top:10px}
.row{display:flex;gap:6px}
.row>*{flex:1}
.panel{background:#072028;padding:8px;border-radius:10px;margin-top:8px}
.hidden{display:none}
small{text-align:center;opacity:.7;display:block;margin-top:6px}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v9.1</h3>

<div id="loginBox">
<input id="username" placeholder="Username">
<button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">

<div class="panel">👤 <b id="userLabel"></b> <button onclick="logout()">Logout</button></div>

<input id="aiText" placeholder="girl run 2 jump 1 | boy stand 3 | background sky">

<div class="row">
<button onclick="parseAI()">🧠 Generate</button>
<button onclick="togglePlay()">⏯ Pause</button>
</div>

<canvas id="c"></canvas>
<small>Stable • Visible • Ready for Video</small>

</div>
</div>

<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');

// ===== CANVAS FIX =====
const dpr=window.devicePixelRatio||1;
c.width=360*dpr;
c.height=560*dpr;
ctx.scale(dpr,dpr);

ctx.lineCap="round";
ctx.lineJoin="round";
ctx.lineWidth=3;

const ground=560-90;

let user=null,playing=true,background="street",camX=0;

// ===== LOGIN =====
function login(){
  user=username.value.trim();
  if(!user) return;
  localStorage.setItem("user",user);
  start();
}
function logout(){localStorage.removeItem("user");location.reload();}
function start(){
  user=localStorage.getItem("user");
  if(!user) return;
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");
  userLabel.innerText=user;
}
start();

// ===== CHARACTER =====
class Stickman{
  constructor(x,type){
    this.baseX=x;
    this.x=x;
    this.y=ground;
    this.vy=0;
    this.type=type;
    this.color="#111";
    this.timeline=[{action:"stand",frames:999999}];
    this.ti=0;
    this.tf=0;
    this.action="stand";
    this.speed=1;
    this.scale=1;
    this.hair="right";
  }
}

const girl=new Stickman(120,"girl");
const boy=new Stickman(220,"boy");
const chars=[girl,boy];

// ===== DRAW =====
function drawBG(){
  ctx.fillStyle=
    background==="sky"?"#bde7ff":
    background==="room"?"#fff4e6":"#eaeaea";
  ctx.fillRect(0,0,360,560);
}

function draw(ch){
  ctx.strokeStyle=ch.color;
  let p=Math.sin(Date.now()*0.01);
  let x=ch.x-camX;
  let s=ch.scale;

  // head
  ctx.beginPath();
  ctx.arc(x,ch.y-40*s,12*s,0,Math.PI*2);
  ctx.stroke();

  // hair
  if(ch.type==="girl"){
    let d=ch.hair==="right"?1:-1;
    ctx.beginPath();
    ctx.moveTo(x+6*d,ch.y-52*s);
    ctx.quadraticCurveTo(x+26*d,ch.y-44*s,x+18*d,ch.y-26*s);
    ctx.stroke();
  }

  // body
  ctx.beginPath();
  ctx.moveTo(x,ch.y-28*s);
  ctx.lineTo(x,ch.y+20*s);
  ctx.stroke();

  limb(x,ch.y-24*s,p,s);
  limb(x,ch.y-24*s,p+Math.PI,s);
  leg(x-6*s,ch.y+20*s,p,s);
  leg(x+6*s,ch.y+20*s,p+Math.PI,s);
}

function limb(x,y,p,s){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(p)*16*s,y+Math.cos(p)*16*s);
  ctx.stroke();
}
function leg(x,y,p,s){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(p)*14*s,y+28*s);
  ctx.stroke();
}

// ===== ENGINE =====
function animate(){
  if(playing){
    chars.forEach(ch=>{
      let cur=ch.timeline[ch.ti];
      ch.action=cur.action;
      ch.tf++;
      if(ch.tf>cur.frames){ch.tf=0;ch.ti=(ch.ti+1)%ch.timeline.length;}
      if(ch.action==="run") ch.x+=ch.speed;
      if(ch.action==="jump"&&ch.y===ground) ch.vy=-11;
      ch.vy+=0.6;
      ch.y+=ch.vy;
      if(ch.y>ground){ch.y=ground;ch.vy=0;}
    });
  }

  camX+=((girl.x+boy.x)/2-camX-180)*0.05;
  drawBG();
  chars.forEach(draw);
  requestAnimationFrame(animate);
}
animate();

// ===== AI =====
function parseAI(){
  chars.forEach(c=>{
    c.timeline=[];
    c.ti=0;c.tf=0;
  });
  aiText.value.toLowerCase().split("|").forEach(b=>{
    let p=b.trim().split(" ");
    if(p[0]==="background") background=p[1];
    else{
      let ch=p[0]==="girl"?girl:boy;
      for(let i=1;i<p.length;i+=2){
        ch.timeline.push({action:p[i],frames:(p[i+1]||1)*60});
      }
    }
  });
  chars.forEach(ch=>{
    if(!ch.timeline.length)
      ch.timeline=[{action:"stand",frames:999999}];
    ch.x=ch.baseX;
    ch.y=ground;
    ch.vy=0;
  });
}

function togglePlay(){playing=!playing;}
</script>
</body>
</html>
