<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v10.3</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#06161b;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:540px;
  max-width:95%;
  background:#0b1f26;
  padding:16px;
  border-radius:20px;
  box-shadow:0 0 40px #00ffff55;
}
h3{text-align:center}
input,button,select{
  width:100%;
  padding:9px;
  margin-top:6px;
  border-radius:8px;
  border:none;
}
button{background:cyan;cursor:pointer;font-weight:bold}
canvas{
  display:block;
  margin:12px auto;
  background:#fff;
  width:360px;
  height:560px;
  border-radius:12px;
}
.row{display:flex;gap:8px}
.row>*{flex:1}
.panel{
  background:#072028;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
}
.hidden{display:none}
small{text-align:center;opacity:.7;display:block}
</style>
</head>

<body>
<div class="box">

<h3>🎬 Stickman AI – STUDIO v10.3</h3>

<div id="loginBox">
<input id="username" placeholder="Username">
<button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">

<div style="display:flex;justify-content:space-between">
<b id="userLabel"></b>
<button onclick="logout()" style="width:auto">Logout</button>
</div>

<!-- SCENE EDITOR -->
<div class="panel">
<b>🎞 Scene Editor</b>
<input id="aiText" placeholder="girl run 2 | boy stand 2 | camera follow | background sky">
<div class="row">
<button onclick="addScene()">➕ Scene</button>
<button onclick="playStory()">▶ Story</button>
</div>
</div>

<!-- CHARACTER DESIGN -->
<div class="panel">
<b>🧍 Character</b>
<div class="row">
<select onchange="girl.style=this.value">
<option value="dress">Girl Dress</option>
<option value="sport">Girl Sport</option>
</select>
<select onchange="boy.style=this.value">
<option value="shirt">Boy Shirt</option>
<option value="hoodie">Boy Hoodie</option>
</select>
</div>
</div>

<div class="row">
<button onclick="parseAI()">🧠 Generate</button>
<button onclick="togglePlay()">⏯ Pause</button>
</div>

<canvas id="c"></canvas>

<div class="row">
<button onclick="startRecord()">🎥 Record</button>
<button onclick="stopRecord()">💾 Save GIF</button>
</div>

<small>v10.3 • Rig Fix • Scene • Character • Story • Export</small>
</div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const dpr=window.devicePixelRatio||1;
c.width=360*dpr; c.height=560*dpr;
ctx.scale(dpr,dpr);
ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=3;

const ground=440;
let camX=0, playing=true;
let cameraMode="follow", background="street";

// ===== LOGIN =====
function login(){
  localStorage.setItem("user",username.value||"guest");
  start();
}
function logout(){localStorage.clear();location.reload();}
function start(){
  const u=localStorage.getItem("user");
  if(!u) return;
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");
  userLabel.innerText=u;
}
start();

// ===== STICKMAN =====
class Stickman{
  constructor(x,type){
    this.baseX=x;
    this.x=x; this.y=ground;
    this.vy=0;
    this.type=type;
    this.style="default";
    this.timeline=[];
    this.ti=0; this.tf=0;
    this.action="stand";
    this.dir=1; this.speed=1;
  }
}
const girl=new Stickman(140,"girl");
const boy=new Stickman(220,"boy");
const chars=[girl,boy];

// ===== DRAW =====
function drawBG(){
  ctx.fillStyle=background==="sky"?"#bde7ff":"#eaeaea";
  ctx.fillRect(0,0,360,560);
}

function draw(ch){
  const x=ch.x-camX;
  const hipY=ch.y-10;
  let swing=0;
  if(ch.action==="run") swing=Math.sin(ch.tf*0.25)*14;
  if(ch.action==="stand") swing=Math.sin(ch.tf*0.05)*2;

  // head
  ctx.beginPath();
  ctx.arc(x,ch.y-52,12,0,Math.PI*2);
  ctx.stroke();

  // torso
  ctx.beginPath();
  ctx.moveTo(x,ch.y-40);
  ctx.lineTo(x,hipY);
  ctx.stroke();

  // arms
  limb(x,ch.y-34,swing*0.03,18);
  limb(x,ch.y-34,-swing*0.03,18);

  // legs (FIXED – 2 JOINTS)
  leg2(x-6,hipY,swing*0.04);
  leg2(x+6,hipY,-swing*0.04);
}

function limb(x,y,a,l){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*l,y+Math.cos(a)*l);
  ctx.stroke();
}

function leg2(x,y,a){
  const kneeY=y+14;
  const footY=y+32;
  const dx=Math.sin(a)*10;

  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+dx,kneeY);
  ctx.lineTo(x+dx,footY);
  ctx.stroke();
}

// ===== ENGINE =====
function animate(){
  if(playing){
    chars.forEach(ch=>{
      const cur=ch.timeline[ch.ti]||{action:"stand",frames:9999};
      ch.action=cur.action;
      ch.tf++;
      if(ch.tf>cur.frames){ch.tf=0;ch.ti++;}
      if(ch.action==="run") ch.x+=ch.speed*ch.dir;
    });
  }

  if(cameraMode==="follow"){
    const center=(girl.x+boy.x)/2-180;
    camX+=(center-camX)*0.1;
  }

  drawBG();
  chars.forEach(draw);
  requestAnimationFrame(animate);
}
animate();

// ===== SCENE / AI =====
let scenes=[];
function addScene(){scenes.push(aiText.value);}
function playStory(){
  let i=0;
  function next(){
    if(i>=scenes.length) return;
    aiText.value=scenes[i++];
    parseAI();
    setTimeout(next,2000);
  }
  next();
}

function parseAI(){
  chars.forEach(ch=>{
    ch.timeline=[];
    ch.ti=0; ch.tf=0;
    ch.x=ch.baseX;
  });

  aiText.value.toLowerCase().split("|").forEach(b=>{
    const p=b.trim().split(" ");
    if(p[0]==="background") background=p[1];
    else if(p[0]==="camera") cameraMode=p[1];
    else{
      const ch=p[0]==="girl"?girl:boy;
      for(let i=1;i<p.length;i+=2){
        ch.timeline.push({
          action:p[i],
          frames:(parseFloat(p[i+1])||1)*60
        });
      }
    }
  });
}

// ===== EXPORT =====
let recorder,chunks=[];
function startRecord(){
  recorder=new MediaRecorder(c.captureStream(60));
  chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));
    a.download="stickman_story.webm";
    a.click();
  };
  recorder.start();
}
function stopRecord(){recorder&&recorder.stop();}
function togglePlay(){playing=!playing;}
</script>
</body>
</html>
