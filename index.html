<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman v21-A.8 — Camera System</title>
<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}
canvas{background:#181818;margin-top:10px;}
.ui{
  margin:8px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
button{
  padding:6px;
  background:#222;
  color:#fff;
  border:1px solid #444;
  cursor:pointer;
}
button:hover{background:#333}
</style>
</head>
<body>

<canvas id="c" width="360" height="540"></canvas>

<div class="ui">
  <button onclick="setAll('dead')">😐</button>
  <button onclick="setAll('softHappy')">🙂</button>
  <button onclick="setAll('ultraHappy')">😆</button>
  <button onclick="setAll('shock')">😱</button>
  <button onclick="setAll('rage')">🤬</button>
</div>

<script>
/* =========================
   CANVAS
========================= */
const c=document.getElementById("c");
const ctx=c.getContext("2d");
let t=0;

/* =========================
   CAMERA SYSTEM (21 A.8)
========================= */
const Camera={
  x:0,
  y:0,
  zoom:1,
  target:null,
  update(){
    if(this.target){
      // smooth follow
      this.x += ((this.target.x - c.width/2) - this.x)*0.08;
      this.y += ((this.target.y - c.height/2) - this.y)*0.08;
    }
  },
  apply(){
    ctx.setTransform(
      this.zoom,0,0,this.zoom,
      -this.x*this.zoom,
      -this.y*this.zoom
    );
  }
};

/* =========================
   SCENE
========================= */
const Scene={
  width:1200,   // virtual world
  height:800,
  groundY:500,
  background:"#e6f4ff",
  objects:[],
  characters:[],
  draw(){
    ctx.save();
    Camera.apply();

    // background
    ctx.fillStyle=this.background;
    ctx.fillRect(0,0,this.width,this.height);

    // background objects
    this.objects.filter(o=>o.depth<0).forEach(o=>o.draw());

    // ground
    ctx.strokeStyle="#aaa";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,this.groundY);
    ctx.lineTo(this.width,this.groundY);
    ctx.stroke();

    // AUTO Z-SORT
    [...this.characters]
      .sort((a,b)=>a.y-b.y)
      .forEach(c=>{
        c.update();
        c.draw();
      });

    // foreground objects
    this.objects.filter(o=>o.depth>0).forEach(o=>o.draw());

    ctx.restore();
  }
};

/* =========================
   MODEL
========================= */
const model={ headR:14, body:36, leg:30, armU:20, armL:18 };

/* =========================
   EMOTIONS
========================= */
const presets={
  dead:{eyeOpen:0.25,eyeScale:1.1,mouthOpen:0,brow:-0.1,armLift:-0.2,headSquash:-0.1},
  softHappy:{eyeOpen:0.7,eyeScale:0.9,mouthOpen:0.4,brow:0.2,armLift:0.3,headSquash:0.1},
  ultraHappy:{eyeOpen:0.4,eyeScale:0.7,mouthOpen:1.4,brow:0.8,armLift:1.2,headSquash:0.35},
  shock:{eyeOpen:1.8,eyeScale:1.5,mouthOpen:1.8,brow:1.2,armLift:1.6,headSquash:-0.3},
  rage:{eyeOpen:0.35,eyeScale:0.8,mouthOpen:0.5,brow:-1.6,armLift:-1,headSquash:0.25}
};

/* =========================
   CHARACTER
========================= */
class Character{
  constructor(name,color,shirt,x){
    this.name=name;
    this.color=color;
    this.shirt=shirt;
    this.x=x;
    this.y=Scene.groundY-model.body-model.leg;
    this.target={...presets.dead};
    this.state={...this.target};
  }
  setEmotion(e){Object.assign(this.target,presets[e]);}
  update(){
    for(let k in this.state){
      this.state[k]+= (this.target[k]-this.state[k])*0.18;
    }
  }
  draw(){ drawStick(this); }
}

/* =========================
   SCENE OBJECTS
========================= */
class Tree{
  constructor(x,depth=-1){ this.x=x; this.depth=depth; }
  draw(){
    ctx.strokeStyle="#6b4a2b";
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(this.x,Scene.groundY);
    ctx.lineTo(this.x,Scene.groundY-60);
    ctx.stroke();
    ctx.strokeStyle="#2e8b57";
    ctx.beginPath();
    ctx.arc(this.x,Scene.groundY-75,25,0,Math.PI*2);
    ctx.stroke();
  }
}
class Fence{
  constructor(x,depth=1){ this.x=x; this.depth=depth; }
  draw(){
    ctx.strokeStyle="#777";
    ctx.lineWidth=3;
    for(let i=-20;i<=20;i+=10){
      ctx.beginPath();
      ctx.moveTo(this.x+i,Scene.groundY+5);
      ctx.lineTo(this.x+i,Scene.groundY-25);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(this.x-25,Scene.groundY-20);
    ctx.lineTo(this.x+25,Scene.groundY-20);
    ctx.stroke();
  }
}

/* =========================
   ADD OBJECTS
========================= */
Scene.objects.push(
  new Tree(200,-1),
  new Tree(500,-1),
  new Tree(800,-1),
  new Fence(600,1)
);

/* =========================
   CHARACTERS
========================= */
const hero = new Character("ALI","#ff4444",true,600);
Scene.characters.push(
  hero,
  new Character("BEX","#44ff88",false,500),
  new Character("MAX","#4488ff",true,700)
);

/* CAMERA FOLLOW HERO */
Camera.target = hero;
Camera.zoom = 1.1;

/* =========================
   UI
========================= */
function setAll(e){
  Scene.characters.forEach(c=>c.setEmotion(e));
}

/* =========================
   DRAW HELPERS
========================= */
function jitter(v,a){return v+(Math.random()-0.5)*a}
function line(x1,y1,x2,y2){
  ctx.beginPath();
  ctx.moveTo(jitter(x1,0.5),jitter(y1,0.5));
  ctx.lineTo(jitter(x2,0.5),jitter(y2,0.5));
  ctx.stroke();
}
function circle(x,y,r){
  ctx.beginPath();
  ctx.arc(jitter(x,0.4),jitter(y,0.4),r,0,Math.PI*2);
  ctx.stroke();
}
function arm(x,y,dir,lift){
  const ex=x+dir*model.armU;
  const ey=y+lift;
  const hx=ex+dir*model.armL;
  const hy=ey+lift*0.7;
  line(x,y,ex,ey);
  line(ex,ey,hx,hy);
}

/* =========================
   DRAW STICKMAN
========================= */
function drawStick(ch){
  const s=ch.state;
  ctx.strokeStyle=ch.color;
  ctx.lineCap="round";
  ctx.lineWidth=2+jitter(0.5,0.6);
  const wob=Math.sin(t*0.12)*1.2;

  line(ch.x,ch.y,ch.x,ch.y+model.body);
  if(ch.shirt) line(ch.x-8,ch.y+10,ch.x+8,ch.y+10);

  line(ch.x,ch.y+model.body,ch.x-12,Scene.groundY);
  line(ch.x,ch.y+model.body,ch.x+12,Scene.groundY);

  const lift=-s.armLift*25+wob;
  arm(ch.x-2,ch.y+5,-1,lift);
  arm(ch.x+2,ch.y+5,1,lift);

  ctx.save();
  ctx.translate(ch.x,ch.y-model.headR);
  ctx.scale(1,1+s.headSquash);
  circle(0,0,model.headR);
  ctx.restore();

  const hx=ch.x, hy=ch.y-model.headR;
  ctx.beginPath();
  ctx.ellipse(hx-5,hy-2,3*s.eyeScale,3*s.eyeOpen,0,0,Math.PI*2);
  ctx.ellipse(hx+5,hy-2,3*s.eyeScale,3*s.eyeOpen,0,0,Math.PI*2);
  ctx.stroke();

  line(hx-10,hy-7-s.brow*5,hx-2,hy-5-s.brow*5);
  line(hx+2,hy-5-s.brow*5,hx+10,hy-7-s.brow*5);

  ctx.beginPath();
  ctx.arc(hx,hy+6,5,0,Math.PI*Math.min(s.mouthOpen,1.8));
  ctx.stroke();
}

/* =========================
   LOOP
========================= */
function loop(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,c.width,c.height);

  Camera.update();
  Scene.draw();

  t++;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
