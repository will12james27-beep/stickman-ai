<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.4</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
canvas {
  display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// =========================
// CANVAS
// =========================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// =========================
// SCENE
// =========================
const scene = {
  width: 6000,
  height: 2000,
  groundY: 900
};

// =========================
// STICKMAN
// =========================
const stickman = {
  x: 800,
  y: scene.groundY - 120,
  vx: 2,
  vy: 0,
  onGround: true,
  head: 18,
  body: 50,
  arm: 40,
  leg: 45
};

// =========================
// CAMERA
// =========================
const camera = {
  x: 0,
  y: 0,
  zoom: 1,
  targetZoom: 1,
  followSmooth: 0.08,
  zoomSmooth: 0.1
};

// =========================
// CAMERA HELPERS
// =========================
function camX(x) {
  return (x - camera.x) * camera.zoom;
}
function camY(y) {
  return (y - camera.y) * camera.zoom;
}

// =========================
// CAMERA UPDATE
// =========================
function updateCamera() {
  const targetX = stickman.x - canvas.width / (2 * camera.zoom);
  const targetY = stickman.y - canvas.height / (2 * camera.zoom);

  camera.x += (targetX - camera.x) * camera.followSmooth;
  camera.y += (targetY - camera.y) * camera.followSmooth;
  camera.zoom += (camera.targetZoom - camera.zoom) * camera.zoomSmooth;
}

// =========================
// INPUT (EVENTS)
// =========================
document.addEventListener("keydown", e => {
  if (e.code === "Space" && stickman.onGround) {
    stickman.vy = -16;
    stickman.onGround = false;

    // EVENT: JUMP ZOOM
    camera.targetZoom = 1.5;
    zoomRelease(15);
  }

  if (e.code === "KeyZ") {
    camera.targetZoom = 1.8; // MANUAL PUNCH
    zoomRelease(20);
  }

  if (e.code === "KeyX") {
    camera.targetZoom = 0.8; // DRAMATIC ZOOM OUT
    zoomRelease(30);
  }
});

// mouse click = reaction zoom
canvas.addEventListener("mousedown", () => {
  camera.targetZoom = 1.6;
  zoomRelease(12);
});

// =========================
// ZOOM RELEASE SYSTEM
// =========================
let zoomBackTimer = 0;

function zoomRelease(frames) {
  zoomBackTimer = frames;
}

function updateZoomRelease() {
  if (zoomBackTimer > 0) {
    zoomBackTimer--;
    if (zoomBackTimer === 0) {
      camera.targetZoom = 1;
    }
  }
}

// =========================
// PHYSICS
// =========================
function updateStickman() {
  stickman.x += stickman.vx;

  stickman.vy += 0.8; // gravity
  stickman.y += stickman.vy;

  if (stickman.y >= scene.groundY - 120) {
    stickman.y = scene.groundY - 120;
    stickman.vy = 0;
    stickman.onGround = true;
  }

  if (stickman.x < 300 || stickman.x > scene.width - 300) {
    stickman.vx *= -1;
  }
}

// =========================
// DRAW
// =========================
function drawBackground() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawGround() {
  ctx.strokeStyle = "#999";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(camX(0), camY(scene.groundY));
  ctx.lineTo(camX(scene.width), camY(scene.groundY));
  ctx.stroke();
}

function drawStickman(p) {
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";

  const hx = p.x;
  const hy = p.y;

  // head
  ctx.beginPath();
  ctx.arc(camX(hx), camY(hy), p.head * camera.zoom, 0, Math.PI * 2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy + p.head));
  ctx.lineTo(camX(hx), camY(hy + p.head + p.body));
  ctx.stroke();

  const by = hy + p.head + p.body;

  // arms
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy + 25));
  ctx.lineTo(camX(hx - p.arm), camY(hy + 40));
  ctx.moveTo(camX(hx), camY(hy + 25));
  ctx.lineTo(camX(hx + p.arm), camY(hy + 40));
  ctx.stroke();

  // legs
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx - p.leg), camY(by + p.leg));
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx + p.leg), camY(by + p.leg));
  ctx.stroke();
}

// =========================
// MAIN LOOP
// =========================
function loop() {
  updateStickman();
  updateZoomRelease();
  updateCamera();

  drawBackground();
  drawGround();
  drawStickman(stickman);

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
