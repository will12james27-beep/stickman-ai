<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman AI v10.6.0 — Turning</title>
<style>
  body { margin:0; background:#0e0e0e; color:#aaa; font-family:monospace; }
  #ui {
    position:fixed; bottom:0; left:0; right:0;
    background:#111; padding:6px;
    display:flex; align-items:center; gap:10px;
  }
  canvas { display:block; margin:auto; background:#1a1a1a; }
  input[type=range] { flex:1; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <span>← / → Turn</span>
  <span id="dir">Dir: 1</span>
</div>

<script>
// ================= SETUP =================
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
canvas.width=700; canvas.height=450;

const GROUND_Y=330;
let time=0;
let direction=1;      // -1 = left, 1 = right
let targetDir=1;

// INPUT
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")  targetDir=-1;
  if(e.key==="ArrowRight") targetDir= 1;
});

// UTILS
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));

// ================= SKELETON =================
const sk={
  hip:{x:350,y:240},
  spine:{x:350,y:190},
  head:{x:350,y:155,scaleY:1},
  arms:{L:{a:0},R:{a:0}},
  legs:{
    L:{foot:{x:330,y:GROUND_Y,lock:true}},
    R:{foot:{x:370,y:GROUND_Y,lock:false}}
  }
};

const LEG_A=45, LEG_B=45, ARM_LEN=40;

// ================= IK =====================
function solveIK(hx,hy,fx,fy){
  let dx=fx-hx, dy=fy-hy;
  let d=Math.hypot(dx,dy);
  d=clamp(d,1,LEG_A+LEG_B-0.001);
  let a=Math.acos((LEG_A**2+d**2-LEG_B**2)/(2*LEG_A*d));
  let b=Math.atan2(dy,dx);
  return {x:hx+Math.cos(b+a)*LEG_A,y:hy+Math.sin(b+a)*LEG_A};
}

// ================= WALK + TURN =================
function update(){
  time+=0.045;

  // smooth turning
  direction=lerp(direction,targetDir,0.08);
  document.getElementById("dir").textContent="Dir: "+direction.toFixed(2);

  const phase=Math.sin(time);
  const lift=Math.max(0,Math.sin(time+Math.PI/2))*22;
  const stepLen=32;

  const L=sk.legs.L, R=sk.legs.R;

  if(phase>0){L.foot.lock=true;R.foot.lock=false;}
  else{L.foot.lock=false;R.foot.lock=true;}

  if(!L.foot.lock){
    L.foot.x=sk.hip.x-22*direction+phase*stepLen*direction;
    L.foot.y=GROUND_Y-lift;
  }
  if(!R.foot.lock){
    R.foot.x=sk.hip.x+22*direction-phase*stepLen*direction;
    R.foot.y=GROUND_Y-lift;
  }

  const targetHipY=(L.foot.y+R.foot.y)/2-65;
  sk.hip.y=lerp(sk.hip.y,targetHipY,0.15);
  sk.hip.x+=0.35*direction;

  sk.spine.x=lerp(sk.spine.x,sk.hip.x,0.25);
  sk.spine.y=lerp(sk.spine.y,sk.hip.y-50,0.25);

  // head secondary
  const bounce=Math.abs(phase)*0.15;
  sk.head.scaleY=lerp(sk.head.scaleY,1-bounce,0.2);
  sk.head.x=sk.spine.x;
  sk.head.y=lerp(sk.head.y,sk.spine.y-35+phase*4,0.25);

  // arms counter-swing (respect direction)
  sk.arms.L.a=-phase*0.8*direction;
  sk.arms.R.a= phase*0.8*direction;
}

// ================= DRAW =================
function drawLeg(side,dir){
  const hx=sk.hip.x+dir*10*direction;
  const hy=sk.hip.y;
  const f=sk.legs[side].foot;
  const k=solveIK(hx,hy,f.x,f.y);
  ctx.beginPath();
  ctx.moveTo(hx,hy);
  ctx.lineTo(k.x,k.y);
  ctx.lineTo(f.x,f.y);
  ctx.stroke();
}

function drawArm(side,dir){
  const sx=sk.spine.x+dir*15*direction;
  const sy=sk.spine.y+10;
  const a=sk.arms[side].a;
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(
    sx+Math.cos(a+Math.PI/2)*ARM_LEN,
    sy+Math.sin(a+Math.PI/2)*ARM_LEN
  );
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="#444";
  ctx.beginPath();
  ctx.moveTo(0,GROUND_Y);
  ctx.lineTo(canvas.width,GROUND_Y);
  ctx.stroke();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(sk.hip.x,sk.hip.y);
  ctx.lineTo(sk.spine.x,sk.spine.y);
  ctx.stroke();

  ctx.save();
  ctx.translate(sk.head.x,sk.head.y);
  ctx.scale(1,sk.head.scaleY);
  ctx.beginPath();
  ctx.arc(0,0,12,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();

  drawArm("L",-1); drawArm("R",1);
  drawLeg("L",-1); drawLeg("R",1);
}

// ================= LOOP =================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
