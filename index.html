<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI — Scene System 21 C.1 (STABLE)</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
canvas {
  display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// =========================
// CANVAS SETUP
// =========================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// =========================
// SCENE
// =========================
const scene = {
  width: 3000,
  height: 1500,
  groundY: 900
};

// =========================
// CAMERA (MUHIM FIX)
// =========================
const camera = {
  x: 0,
  y: 0,
  zoom: 1
};

// Kamera markazini ekranga moslash
function updateCamera() {
  camera.x = stickman.x - canvas.width / 2;
  camera.y = stickman.y - canvas.height / 2;
}

function camX(x) {
  return (x - camera.x) * camera.zoom;
}
function camY(y) {
  return (y - camera.y) * camera.zoom;
}

// =========================
// STICKMAN
// =========================
const stickman = {
  x: 500,
  y: scene.groundY - 120,
  head: 18,
  body: 50,
  arm: 40,
  leg: 45
};

// =========================
// DRAW FUNCTIONS
// =========================
function drawBackground() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawGround() {
  ctx.strokeStyle = "#999";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(camX(0), camY(scene.groundY));
  ctx.lineTo(camX(scene.width), camY(scene.groundY));
  ctx.stroke();
}

function drawStickman(p) {
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";

  const hx = p.x;
  const hy = p.y;

  // Head
  ctx.beginPath();
  ctx.arc(camX(hx), camY(hy), p.head, 0, Math.PI * 2);
  ctx.stroke();

  // Body
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy + p.head));
  ctx.lineTo(camX(hx), camY(hy + p.head + p.body));
  ctx.stroke();

  const by = hy + p.head + p.body;

  // Arms
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(hy + 25));
  ctx.lineTo(camX(hx - p.arm), camY(hy + 40));
  ctx.moveTo(camX(hx), camY(hy + 25));
  ctx.lineTo(camX(hx + p.arm), camY(hy + 40));
  ctx.stroke();

  // Legs
  ctx.beginPath();
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx - p.leg), camY(by + p.leg));
  ctx.moveTo(camX(hx), camY(by));
  ctx.lineTo(camX(hx + p.leg), camY(by + p.leg));
  ctx.stroke();
}

// =========================
// MAIN LOOP
// =========================
function loop() {
  updateCamera();
  drawBackground();
  drawGround();
  drawStickman(stickman);
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
