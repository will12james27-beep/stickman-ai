<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stickman AI – STUDIO v17.2</title>
<style>
body{
  margin:0;
  background:#02080c;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:780px;
  background:#0b1f26;
  padding:14px;
  border-radius:18px;
  box-shadow:0 0 50px #00ffff55;
}
h3{text-align:center}
.panel{
  background:#072028;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
}
.row{display:flex;gap:6px}
.row>*{flex:1}
button{
  padding:8px;
  border:none;
  border-radius:8px;
  background:cyan;
  font-weight:bold;
  cursor:pointer;
}
canvas{
  display:block;
  margin:10px auto;
  background:#fff;
  width:360px;height:640px;
  border-radius:12px;
}
small{text-align:center;display:block;opacity:.6}
</style>
</head>

<body>
<div class="box">
<h3>🎬 Stickman AI – STUDIO v17.2</h3>

<div class="panel">
<b>🎮 Controls</b>
<div class="row">
<button onclick="togglePhysics()">💥 Ragdoll</button>
<button onclick="toggleDebug()">🦴 Debug</button>
</div>
</div>

<canvas id="c"></canvas>
<small>v17.2 • Stable Ragdoll Core • Ground Safe • No Sink Bug</small>
</div>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = 360;
c.height = 640;
ctx.lineCap = "round";
ctx.lineWidth = 4;

const ground = 520;
const GRAVITY = 0.6;

let usePhysics = true;
let debug = false;

// ===== JOINT =====
class Joint{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=0; this.vy=0;
  }
}

// ===== RAGDOLL =====
class Ragdoll{
  constructor(x,y){
    this.hip  = new Joint(x, y-40);
    this.neck = new Joint(x, y-90);
    this.head = new Joint(x, y-115);

    this.armL = new Joint(x-35, y-85);
    this.armR = new Joint(x+35, y-85);

    this.legL = new Joint(x-15, y);
    this.legR = new Joint(x+15, y);

    this.rootX = x;
  }
}

const man = new Ragdoll(180, ground);

// ===== CONSTRAINT =====
function stick(a,b,len){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||0.0001;
  const diff=(d-len)/d;
  const ox=dx*0.5*diff, oy=dy*0.5*diff;
  a.x+=ox; a.y+=oy;
  b.x-=ox; b.y-=oy;
}

// ===== PHYSICS =====
function physics(j){
  j.vy += GRAVITY;
  j.x  += j.vx;
  j.y  += j.vy;
}

function footCollision(j){
  if(j.y > ground){
    j.y = ground;
    j.vy = 0;
    j.vx *= 0.6;
  }
}

// 🔒 HIP GROUND LOCK (KEY FIX)
function hipCollision(){
  const minHipY = ground - 48;
  if(man.hip.y > minHipY){
    man.hip.y = minHipY;
    man.hip.vy = 0;
  }
}

// ===== DRAW =====
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  // ground
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(360,ground);
  ctx.stroke();

  ctx.strokeStyle="#000";
  line(man.head,man.neck);
  line(man.neck,man.hip);
  line(man.neck,man.armL);
  line(man.neck,man.armR);
  line(man.hip,man.legL);
  line(man.hip,man.legR);

  ctx.beginPath();
  ctx.arc(man.head.x,man.head.y,14,0,6.28);
  ctx.stroke();

  if(debug){
    ctx.fillStyle="red";
    [man.head,man.neck,man.hip,man.armL,man.armR,man.legL,man.legR]
      .forEach(j=>{
        ctx.beginPath();
        ctx.arc(j.x,j.y,2,0,6.28);
        ctx.fill();
      });
  }
}

// ===== LOOP =====
function loop(){
  if(usePhysics){

    // 1️⃣ gravity
    Object.values(man).forEach(j=>{
      if(j instanceof Joint) physics(j);
    });

    // 2️⃣ constraints
    for(let i=0;i<12;i++){
      stick(man.head,man.neck,22);
      stick(man.neck,man.hip,48);
      stick(man.neck,man.armL,34);
      stick(man.neck,man.armR,34);
      stick(man.hip,man.legL,48);
      stick(man.hip,man.legR,48);

      man.hip.x += (man.rootX - man.hip.x)*0.05;
    }

    // 3️⃣ ground safety
    footCollision(man.legL);
    footCollision(man.legR);
    hipCollision();
  }

  draw();
  requestAnimationFrame(loop);
}
loop();

// ===== UTILS =====
function togglePhysics(){usePhysics=!usePhysics;}
function toggleDebug(){debug=!debug;}
</script>
</body>
</html>
