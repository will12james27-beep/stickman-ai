<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – Level 4 ENGINE</title>
<style>
body{
  margin:0;
  background:radial-gradient(#0f2b33,#07161b);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  font-family:Arial;
  color:#fff;
  padding:10px;
}
.box{
  width:440px;
  max-height:95vh;
  overflow:auto;
  padding:14px;
  border-radius:18px;
  background:#0b1f26;
  box-shadow:0 0 30px #00ffff55;
}
h3{text-align:center;margin:6px 0}
input,button{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:none;
  font-size:14px;
}
button{background:cyan;cursor:pointer}
canvas{
  display:block;
  background:#fff;
  margin-top:10px;
  border-radius:10px;
  width:100%;
  height:auto;
}
.timeline{
  margin-top:10px;
  background:#07161b;
  padding:8px;
  border-radius:10px;
  font-size:13px;
}
.timeline span{
  display:inline-block;
  background:#00ffff33;
  padding:4px 8px;
  border-radius:6px;
  margin:2px;
}
.controls{
  display:flex;
  gap:6px;
  margin-top:6px;
}
.controls button{flex:1}
small{opacity:.7;display:block;text-align:center;margin-top:6px}
</style>
</head>

<body>
<div class="box">
  <h3>🎬 Stickman AI – LEVEL 4</h3>

  <input id="text" placeholder="run 2 jump 1 stand 2">

  <button onclick="generate()">🧠 Generate Timeline</button>

  <div class="controls">
    <button onclick="togglePlay()">⏯ Pause</button>
    <button onclick="resetScene()">🔄 Reset</button>
  </div>

  <div class="controls">
    <button onclick="startRecord()">🎥 Start</button>
    <button onclick="stopRecord()">💾 Save</button>
  </div>

  <div class="timeline" id="timelineUI"></div>

  <canvas id="c" width="360" height="600"></canvas>

  <small>Text → Timeline → Scene → Camera → Video</small>
</div>

<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
ctx.lineCap="round";ctx.lineJoin="round";

const ground=c.height-100;
let playing=true;

// ===== CAMERA =====
let camX=0;

// ===== STICKMAN CLASS =====
class Stickman{
  constructor(x,type){
    this.baseX=x;
    this.x=x;
    this.y=ground;
    this.vy=0;
    this.action='stand';
    this.type=type;
  }
}

const characters=[
  new Stickman(120,'girl'),
  new Stickman(220,'boy')
];

let frame=0;
let timeline=[];
let timeIndex=0;
let actionFrame=0;

// ===== VIDEO =====
let recorder,chunks=[];
function startRecord(){
  recorder=new MediaRecorder(c.captureStream(60));
  chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    a.download='stickman_level4.webm';
    a.click();
  };
  recorder.start();
}
function stopRecord(){recorder&&recorder.stop();}

// ===== DRAW =====
function drawStickman(ch){
  let walk=Math.sin(frame*0.12);
  let lean=ch.action==='run'?walk*10:0;

  let px=ch.x-camX;

  // HEAD
  ctx.beginPath();
  ctx.arc(px+lean*.3,ch.y-45,12,0,Math.PI*2);
  ctx.stroke();

  // FACE
  ctx.beginPath();
  ctx.arc(px+lean*.3,ch.y-42,4,0,Math.PI);
  ctx.stroke();

  // HAIR
  if(ch.type==='girl'){
    ctx.beginPath();
    ctx.moveTo(px+6,ch.y-58);
    ctx.quadraticCurveTo(px+30,ch.y-48,px+20,ch.y-28);
    ctx.stroke();
  }

  // BODY
  ctx.beginPath();
  ctx.moveTo(px,ch.y-30);
  ctx.lineTo(px,ch.y+20);
  ctx.stroke();

  limb(px,ch.y-25,walk);
  limb(px,ch.y-25,walk+Math.PI);

  leg(px-6,ch.y+20,walk);
  leg(px+6,ch.y+20,walk+Math.PI);
}

function limb(x,y,p){
  let a=Math.sin(p)*.6;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*16,y+Math.cos(a)*16);
  ctx.stroke();
}
function leg(x,y,p){
  let s=Math.sin(p)*.6;
  let lift=Math.max(0,Math.sin(p))*6;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(s)*14,y+16-lift);
  ctx.lineTo(x+Math.sin(s)*14,y+30);
  ctx.stroke();
}

// ===== ENGINE =====
function animate(){
  if(playing) frame++;

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.strokeStyle="#000";
  ctx.lineWidth=3;

  if(timeline.length){
    let cur=timeline[timeIndex];
    characters.forEach(ch=>ch.action=cur.action);
    if(playing){
      actionFrame++;
      if(actionFrame>cur.frames){
        actionFrame=0;
        timeIndex=(timeIndex+1)%timeline.length;
      }
    }
  }

  characters.forEach(ch=>{
    if(playing){
      if(ch.action==='run') ch.x+=1;
      if(ch.action==='jump'&&ch.y===ground) ch.vy=-11;
      ch.vy+=0.6;
      ch.y+=ch.vy;
      if(ch.y>ground){ch.y=ground;ch.vy=0;}
    }
  });

  // CAMERA FOLLOW (average)
  camX += ((characters[0].x+characters[1].x)/2 - camX - c.width/2)*0.05;

  characters.forEach(drawStickman);
  requestAnimationFrame(animate);
}

// ===== CONTROLS =====
function togglePlay(){playing=!playing;}
function resetScene(){
  frame=0; timeIndex=0; actionFrame=0;
  characters.forEach(ch=>{
    ch.x=ch.baseX;
    ch.y=ground;
    ch.vy=0;
    ch.action='stand';
  });
}

// ===== TEXT → TIMELINE =====
function generate(){
  timeline=[];
  timeIndex=0;
  actionFrame=0;
  document.getElementById('timelineUI').innerHTML='';

  let parts=document.getElementById('text').value.toLowerCase().split(' ');
  for(let i=0;i<parts.length;i+=2){
    let act=parts[i];
    let sec=parseFloat(parts[i+1])||1;
    timeline.push({action:act,frames:sec*60});
    let s=document.createElement('span');
    s.textContent=`${act} ${sec}s`;
    document.getElementById('timelineUI').appendChild(s);
  }
}

animate();
</script>
</body>
</html>
