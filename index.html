<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stickman AI – Level 2 FIXED</title>
<style>
body{
  margin:0;
  background:radial-gradient(#0f2b33,#07161b);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  font-family:Arial;
  color:#fff;
  padding:10px;
}
.box{
  width:380px;
  max-height:95vh;
  overflow:auto;
  padding:14px;
  border-radius:18px;
  background:#0b1f26;
  box-shadow:0 0 30px #00ffff55;
  text-align:center;
}
input,button{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:none;
  font-size:14px;
}
button{background:cyan;cursor:pointer}
canvas{
  display:block;
  background:#fff;
  margin-top:10px;
  border-radius:10px;
  width:100%;
  height:auto;
}
small{opacity:.7}
</style>
</head>

<body>
<div class="box">
  <h3>🎬 Stickman AI – Level 2</h3>
  <input id="text" placeholder="run 3 jump 1 stand 2">
  <button onclick="generate()">Generate Timeline</button>
  <button onclick="startRecord()">🎥 Start</button>
  <button onclick="stopRecord()">⏹ Save</button>
  <small>Text → Timeline → Animation</small>
  <canvas id="c" width="360" height="640"></canvas>
</div>

<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
ctx.lineCap="round";
ctx.lineJoin="round";

const ground=c.height-120;

// ===== CHAR CLASS =====
class Stickman{
  constructor(x,type){
    this.x=x;
    this.y=ground;
    this.vy=0;
    this.facing=1;
    this.action='stand';
    this.type=type;
  }
}

// ===== CHARACTERS =====
const characters=[
  new Stickman(c.width*0.35,'girl'),
  new Stickman(c.width*0.65,'boy')
];

let frame=0;

// ===== TIMELINE =====
let timeline=[];
let timeIndex=0;
let actionFrame=0;

// ===== VIDEO =====
let recorder,chunks=[];
function startRecord(){
  recorder=new MediaRecorder(c.captureStream(60));
  chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    a.download='stickman_fixed.webm';
    a.click();
  };
  recorder.start();
}
function stopRecord(){recorder&&recorder.stop();}

// ===== DRAW =====
function drawStickman(ch){
  let walk=Math.sin(frame*0.1);
  let lean=ch.action==='run'?walk*10:0;

  // HEAD
  ctx.beginPath();
  ctx.arc(ch.x+lean*.3,ch.y-50,14,0,Math.PI*2);
  ctx.stroke();

  // FACE
  ctx.beginPath();
  ctx.arc(ch.x+lean*.3,ch.y-46,5,0,Math.PI);
  ctx.stroke();

  // HAIR
  if(ch.type==='girl'){
    ctx.beginPath();
    ctx.moveTo(ch.x+6,ch.y-64);
    ctx.quadraticCurveTo(
      ch.x+36,
      ch.y-52,
      ch.x+24,
      ch.y-30
    );
    ctx.stroke();
  }

  // BODY
  ctx.beginPath();
  ctx.moveTo(ch.x,ch.y-35);
  ctx.lineTo(ch.x,ch.y+25);
  ctx.stroke();

  // ARMS
  drawLimb(ch.x,ch.y-30,walk);
  drawLimb(ch.x,ch.y-30,walk+Math.PI);

  // LEGS
  drawLeg(ch.x-6,ch.y+25,walk);
  drawLeg(ch.x+6,ch.y+25,walk+Math.PI);
}

function drawLimb(x,y,p){
  let a=Math.sin(p)*.6;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(a)*18,y+Math.cos(a)*18);
  ctx.stroke();
}

function drawLeg(x,y,p){
  let s=Math.sin(p)*.6;
  let lift=Math.max(0,Math.sin(p))*6;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(s)*16,y+18-lift);
  ctx.lineTo(x+Math.sin(s)*16,y+36);
  ctx.stroke();
}

// ===== ENGINE =====
function animate(){
  frame++;

  // ✅ REAL WHITE BACKGROUND (VIDEO FIX)
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.strokeStyle="#000";
  ctx.lineWidth=4;

  // TIMELINE
  if(timeline.length){
    let cur=timeline[timeIndex];
    characters.forEach(ch=>ch.action=cur.action);
    actionFrame++;
    if(actionFrame>cur.frames){
      actionFrame=0;
      timeIndex=(timeIndex+1)%timeline.length;
    }
  }

  characters.forEach(ch=>{
    if(ch.action==='run') ch.x+=1.2;
    if(ch.action==='jump'&&ch.y===ground) ch.vy=-12;
    ch.vy+=0.6;
    ch.y+=ch.vy;
    if(ch.y>ground){ch.y=ground;ch.vy=0;}
    drawStickman(ch);
  });

  requestAnimationFrame(animate);
}

// ===== TEXT → TIMELINE =====
function generate(){
  timeline=[];
  timeIndex=0;
  actionFrame=0;

  let parts=document.getElementById('text').value.toLowerCase().split(' ');
  for(let i=0;i<parts.length;i+=2){
    timeline.push({
      action:parts[i],
      frames:(parseFloat(parts[i+1])||1)*60
    });
  }
}

animate();
</script>
</body>
</html>
